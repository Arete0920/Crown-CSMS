title = "Repo gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''(^|/)\.venv($|/)''',
  '''(^|/)venv($|/)''',
  '''(^|/)node_modules($|/)''',
  '''(^|/)dist($|/)''',
  '''(^|/)build($|/)''',
  '''(^|/)coverage($|/)''',
  '''(^|/)AUDIT_PACK_[^/]+($|/)''',
  '''(^|/)audit-artifacts($|/)''',
  '''(^|/)\.pytest_cache($|/)''',
  '''(^|/)htmlcov($|/)''',
  '''(^|/)docs/audit/scans($|/)''',
  '''(^|/)docs/crown-master-binder/inventory($|/)'''
]
