title = "Repo gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''(^|/)\.venv($|/)''',
  '''(^|/)venv($|/)''',
  '''(^|/)node_modules($|/)''',
  '''(^|/)dist($|/)''',
  '''(^|/)build($|/)''',
  '''(^|/)coverage($|/)''',
  '''(^|/)AUDIT_PACK_[^/]+($|/)''',
  '''(^|/)audit-artifacts($|/)''',
  '''(^|/)\.pytest_cache($|/)''',
  '''(^|/)htmlcov($|/)''',
  '''(^|/)docs/audit/scans($|/)''',
  '''(^|/)docs/crown-master-binder/inventory($|/)''',
  # Governance cryptographic attestation - Ed25519 keys are audit proofs, not secrets
  '''(^|/)solomon_governance_c1/governance/c1/runtime/audit_pack/.*/CRYPTOGRAPHIC_ATTESTATION\.json$''',
  '''(^|/)solomon_governance_c1/governance/c1/runtime/audit_pack/SUPERSESSION_INDEX\.json$'''
]
