title = "Repo gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''(^|/)\.venv($|/)''',
  '''(^|/)venv($|/)''',
  '''(^|/)node_modules($|/)''',
  '''(^|/)dist($|/)''',
  '''(^|/)build($|/)''',
  '''(^|/)coverage($|/)''',
  '''(^|/)AUDIT_PACK_[^/]+($|/)''',
  '''(^|/)audit-artifacts($|/)''',
  '''(^|/)\.pytest_cache($|/)''',
  '''(^|/)htmlcov($|/)''',
  '''(^|/)docs/audit/scans($|/)''',
  '''(^|/)docs/crown-master-binder/inventory($|/)''',
  '''(^|/)docs/CURRENT_RELEASE_STATUS\.md$''',
  '''(^|/)audit-artifacts/module-completion/current/05_completion_scorecard\.md$''',
  # Public attestation metadata may be retained, but the surrounding runtime
  # audit-pack directory is deliberately not allowlisted. Private-key material
  # in that tree must be detected.
  '''(^|/)solomon_governance_c1/governance/c1/runtime/audit_pack/.*/CRYPTOGRAPHIC_ATTESTATION\.json$''',
  '''(^|/)solomon_governance_c1/governance/c1/runtime/audit_pack/SUPERSESSION_INDEX\.json$'''
]
