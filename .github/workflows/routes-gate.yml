name: routes-gate
permissions:
  contents: read

# No-op change to trigger required check context on backend-only PRs.

on:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/dashboards/src/routes/router.jsx"
      - "frontend/dashboards/src/pages/**"
      - "tools/verify_routes_gate.ps1"
      - ".github/workflows/routes-gate.yml"

concurrency:
  group: routes-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  routes-gate:
    name: routes-gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Routes Gate (PowerShell)
        shell: pwsh
        run: |
          pwsh -File tools/verify_routes_gate.ps1

