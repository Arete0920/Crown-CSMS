name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - spine/**

jobs:
  pytest:
    runs-on: [self-hosted, linux, x64, crown-runner]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
      - name: Verify requirements single source of truth
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          WANT='-r backend/requirements.txt'
          GOT="$(tr -d '\r' < requirements.txt | sed '/^\s*$/d')"
          if [ "$GOT" != "$WANT" ]; then
            echo "requirements.txt MUST be exactly:"
            echo "  $WANT"
            echo "Got:"
            echo "  $GOT"
            exit 1
          fi
      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          BUILD_SHA: ${{ github.sha }}
        run: |
          python -m pytest -q
