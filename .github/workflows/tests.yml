name: Tests
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - spine/**
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # Cancel only superseded PR-head coverage runs; the newest head must still pass
  # the entire backend suite, governed 75% coverage, and artifact upload.
  # Preserve in-flight protected-main, spine, and manual-dispatch evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tenant-fixtures:
    name: tenant-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify isolated shared authentication counters with Redis
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server
          python scripts/ops/verify_auth_rate_limit_redis.py
      - name: Verify reviewed DEV migration contracts (offline)
        working-directory: .
        run: |
          python -m unittest discover -s scripts/ops -p test_reviewed_legacy_refresh_migrations.py -v
          python -m unittest discover -s scripts/ops -p test_run_dev_inquiry_migration.py -v
          python -m unittest discover -s scripts/ops -p test_dev_deploy_exact_main.py -v
          python -m unittest discover -s scripts/ops -p test_dev_frontend_deploy_only.py -v

      - name: Run tenant fixture regression tests
        shell: bash
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          DJANGO_SECRET_KEY: ci-test-secret-key
          BUILD_SHA: ${{ github.sha }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python -m pytest -q \
            advancement/tests/test_advancement_stage3_4.py \
            core/tests/test_nav_endpoint.py \
            financial_aid/tests/test_financial_aid_authz.py \
            applications/tests/test_admissions_tenant_scoping.py \
            households/tests/test_tenant_isolation.py \
            sandbox_demo/test_finance_transaction.py

  backend-coverage:
    name: backend-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Runner env probe
        shell: bash
        working-directory: .
        run: |
          echo "HOST=$(hostname)"
          echo "WHO=$(whoami)"
          python3 --version || python --version || true
          node --version || true
          npm --version || true
          docker --version || true
          df -h || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: python -m pip install --upgrade pip

      - name: Verify requirements single source of truth
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          WANT='-r backend/requirements.txt'
          GOT="$(tr -d '\r' < requirements.txt | sed '/^\s*$/d')"
          if [ "$GOT" != "$WANT" ]; then
            echo "requirements.txt MUST be exactly:"
            echo "  $WANT"
            echo "Got:"
            echo "  $GOT"
            exit 1
          fi

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run governed backend coverage
        shell: pwsh
        working-directory: .
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          CROWN_SIMPLEJWT_BLACKLIST_ENABLED: 'true'
          DJANGO_SECRET_KEY: ci-test-secret-key
          BUILD_SHA: ${{ github.sha }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          ./scripts/release/run_backend_coverage.ps1 -CoverageVersion 7.16.2

      - name: Upload complete backend coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-backend-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: audit-artifacts/backend-coverage/
          if-no-files-found: error
          retention-days: 14

  pytest-internal:
    name: pytest-internal
    needs: [tenant-fixtures, backend-coverage, finance-postgresql, diadem-scope, diadem-postgresql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tenant regression and governed backend suite
        env:
          TENANT_RESULT: ${{ needs['tenant-fixtures'].result }}
          COVERAGE_RESULT: ${{ needs['backend-coverage'].result }}
          FINANCE_RESULT: ${{ needs['finance-postgresql'].result }}
          DIADEM_RESULT: ${{ needs['diadem-postgresql'].result }}
          DIADEM_SCOPE_RESULT: ${{ needs['diadem-scope'].result }}
          DIADEM_REQUIRED: ${{ needs['diadem-scope'].outputs.required }}
        shell: bash
        run: |
          if [ "$TENANT_RESULT" != "success" ] || [ "$COVERAGE_RESULT" != "success" ] || [ "$FINANCE_RESULT" != "success" ]; then
            echo "::error::Tenant regression, full backend coverage and PostgreSQL finance proof must succeed."
            echo "tenant-fixtures=$TENANT_RESULT backend-coverage=$COVERAGE_RESULT finance-postgresql=$FINANCE_RESULT"
            exit 1
          fi
          if [ "$DIADEM_SCOPE_RESULT" != "success" ] || { [ "$DIADEM_REQUIRED" != "true" ] && [ "$DIADEM_REQUIRED" != "false" ]; }; then
            echo "::error::Diadem scope classification must succeed, with an explicit true/false result."
            exit 1
          fi
          if [ "$DIADEM_REQUIRED" = "true" ] && [ "$DIADEM_RESULT" != "success" ]; then
            echo "::error::Applicable PostgreSQL custody, locking and staff-safety proof must succeed."
            exit 1
          fi
          if [ "$DIADEM_REQUIRED" = "false" ] && [ "$DIADEM_RESULT" != "skipped" ]; then
            echo "::error::Non-applicable Diadem job must be explicitly skipped."
            exit 1
          fi

  survey-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Classify respondent PostgreSQL contract changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PYTHON'
          import os
          import re
          import subprocess
          base = os.environ.get('BASE_SHA', '')
          required = True
          if os.environ['EVENT_NAME'] != 'workflow_dispatch' and re.fullmatch(r'[0-9a-f]{40}', base) and set(base) != {'0'}:
              result = subprocess.run(['git', 'diff', '--name-only', '-z', base, 'HEAD'], capture_output=True)
              if result.returncode == 0:
                  paths = result.stdout.decode('utf-8', errors='replace').split('\0')
                  exact = {'backend/requirements.txt', 'backend/conftest.py', 'backend/tests/conftest.py', 'pytest.ini', '.github/workflows/tests.yml'}
                  prefixes = ('backend/support/', 'backend/survey_sentiment/', 'backend/core/', 'backend/crown_api/', 'backend/tests/test_survey_intelligence_', 'backend/tests/test_survey_collection_')
                  required = any(path in exact or path.startswith(prefixes) for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('required=' + str(required).lower() + '\n')
          print('Respondent PostgreSQL contract required:', required)
          PYTHON

  survey-postgresql:
    needs: survey-scope
    if: needs.survey-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: survey_ci
          POSTGRES_USER: survey_ci
          POSTGRES_PASSWORD: survey-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://survey_ci:survey-ci-only@localhost:5432/survey_ci
      DJANGO_SECRET_KEY: survey-ci-only-secret
      DJANGO_DEBUG: '1'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Require real PostgreSQL and verify migration consistency
        run: |
          DJANGO_SETTINGS_MODULE=crown_api.test_settings python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == 'postgresql', 'PostgreSQL proof cannot use a fallback database'
          with connection.cursor() as cursor:
              cursor.execute('SELECT version()')
              print(cursor.fetchone()[0])
          PY
          python backend/manage.py makemigrations --check --dry-run
      - name: Verify survey, support and legacy refresh contracts on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: crown_api.test_settings
        run: >-
          python -m pytest -q backend/tests/test_survey_intelligence_*.py
          backend/tests/test_survey_collection_postgresql.py
          backend/crown_api/tests/test_refresh_blacklist_rotation.py
          backend/crown_api/tests/test_auth_jwt.py
          backend/crown_api/tests/test_auth_rate_limit.py
          backend/crown_api/tests/test_legacy_refresh_cleanup.py
          backend/crown_api/tests/test_dev_reviewed_migration_pair.py
          backend/crown_api/tests/test_dev_reviewed_support_stage.py
          backend/support/test_ticket_workflow.py
          --migrations --create-db
          --junitxml=survey-postgresql-junit.xml
      - name: Preserve PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: survey-postgresql-${{ github.sha }}
          path: survey-postgresql-junit.xml
          if-no-files-found: error
          retention-days: 14


  finance-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: finance-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://finance_ci:finance-ci-only@localhost:5432/finance_ci
      DJANGO_SETTINGS_MODULE: crown_api.test_settings
      DJANGO_SECRET_KEY: finance-ci-only-secret
      DJANGO_DEBUG: '1'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Require PostgreSQL (no fallback)
        run: |
          python - <<'PYTHON'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == 'postgresql', 'Financial concurrency proof requires PostgreSQL'
          with connection.cursor() as cursor:
              cursor.execute('SELECT version()')
              print(cursor.fetchone()[0])
          PYTHON
      - name: Verify financial posting, settlement/refund authority and concurrent retry contracts
        run: >-
          python -m pytest -v
          backend/aid/tests/test_option_a_aid_student_accounts_bridge.py
          backend/crown_api/tests/test_director_actions_auth_required.py
          backend/crown_api/tests/test_director_aid_posting_integrity.py
          backend/finance/tests/test_finance_settlement_authorization.py
          backend/finance/tests/test_finance_payer_authorization.py
          backend/applications/tests/test_admissions_postgresql_concurrency.py
          backend/tests/test_51x51_evidence_026_aftercare.py::TestMonthlyBillingPostgresConcurrency
          --migrations --create-db --junitxml=finance-postgresql-junit.xml
      - name: Preserve PostgreSQL financial posting evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: finance-postgresql-${{ github.sha }}
          path: finance-postgresql-junit.xml
          if-no-files-found: error
          retention-days: 14

  diadem-scope:
    name: Diadem PostgreSQL safety scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Determine if custody safety PostgreSQL proof is required
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PYTHON'
          import os
          import re
          import subprocess
          base = os.environ.get('BASE_SHA', '')
          required = True  # Fail closed on an unknown diff, including manual dispatch.
          if os.environ['EVENT_NAME'] != 'workflow_dispatch' and re.fullmatch(r'[0-9a-f]{40}', base) and set(base) != {'0'}:
              proc = subprocess.run(['git', 'diff', '--name-only', '-z', base, 'HEAD'], capture_output=True)
              if proc.returncode == 0:
                  changed = proc.stdout.decode('utf-8', errors='replace').split('\0')
                  roots = ('backend/aftercare/', 'backend/core/', 'backend/tenants/', 'backend/subscriptions/', 'backend/households/', 'backend/audit/', 'backend/crown_api/')
                  exact = {'backend/requirements.txt', 'backend/conftest.py', 'backend/tests/conftest.py', 'pytest.ini', '.github/workflows/tests.yml'}
                  required = any(path in exact or path.startswith(roots) for path in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('required=' + str(required).lower() + '\n')
          print('Diadem PostgreSQL proof required:', required)
          PYTHON

  diadem-postgresql:
    needs: diadem-scope
    if: needs.diadem-scope.outputs.required == 'true'
    name: Diadem Django PostgreSQL safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: diadem_cert
          POSTGRES_USER: diadem_cert
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diadem_cert -d diadem_cert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://diadem_cert:ephemeral-ci-only@localhost:5432/diadem_cert
      DJANGO_SETTINGS_MODULE: crown_api.test_settings
      DJANGO_SECRET_KEY: ephemeral-ci-only-diadem-certification-secret-key
      CROWN_ENV: dev
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pin and display exact source
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python --version
      - name: Install canonical backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Django system checks
        run: python manage.py check --no-color
      - name: Reject untracked model changes
        run: python manage.py makemigrations --check --dry-run --no-input --no-color
      - name: Require PostgreSQL (never silently fall back to SQLite)
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql", "Diadem concurrency proof requires PostgreSQL"
          print("Verified PostgreSQL backend")
          PY
      - name: Certify daycare, Extended Care regression and real locking
        run: |
          python -m pytest -q -ra --migrations --create-db --maxfail=25 \
            backend/aftercare/tests/test_daycare_models.py \
            backend/aftercare/tests/test_daycare_policy.py \
            backend/aftercare/tests/test_daycare_checkin.py \
            backend/aftercare/tests/test_daycare_release_policy.py \
            backend/aftercare/tests/test_daycare_release.py \
            backend/aftercare/tests/test_daycare_visit_foundation.py \
            backend/aftercare/tests/test_am_pm_migration.py \
            backend/aftercare/tests/test_am_pm_sessions.py \
            backend/aftercare/tests/test_daycare_api.py \
            --junitxml=diadem-postgresql-junit.xml
      - name: Enforce executed (not skipped) PostgreSQL concurrency tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("diadem-postgresql-junit.xml")
          cases = {x.attrib["name"]: x for x in tree.iter("testcase")}
          names = [
              "test_postgresql_concurrent_arrivals_cannot_exceed_single_place",
              "test_postgresql_concurrent_staff_assignments_cannot_overlap",
              "test_postgresql_simultaneous_custody_release_has_one_winner",
              "test_postgresql_preexisting_custody_survives_visit_migration",
          ]
          for name in names:
              case = cases.get(name)
              assert case is not None, f"Missing race proof: {name}"
              assert not any(case.find(x) is not None for x in ("skipped", "failure", "error")), (
                  f"Race proof did not pass: {name}"
              )
              print("PASS PostgreSQL race proof:", name)
          PY
      - name: Preserve exact-source PostgreSQL safety JUnit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diadem-postgresql-${{ github.sha }}-${{ github.run_attempt }}
          path: diadem-postgresql-junit.xml
          if-no-files-found: error
          retention-days: 14
