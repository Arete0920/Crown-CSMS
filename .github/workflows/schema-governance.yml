name: Schema Governance

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: schema-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-governance:
    name: schema-governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install drf-spectacular==0.27.2 drf-spectacular-sidecar==2025.3.1 reportlab==4.2.0 pytest-django==4.7.0

      - name: W002 inventory
        run: python scripts/release/schema_w002_inventory.py

      - name: Schema export
        run: |
          mkdir -p docs/openapi
          if [ -f backend/manage.py ]; then
            python backend/manage.py spectacular --file docs/openapi/crown-openapi.yaml
          elif [ -f manage.py ]; then
            python manage.py spectacular --file docs/openapi/crown-openapi.yaml
          else
            echo "Schema export failed: no manage.py found in backend/ or repository root." >&2
            exit 1
          fi

      - name: Route catalog
        run: python scripts/release/route_catalog_release.py

      - name: Update schema progress
        run: python scripts/release/update_schema_progress_doc.py

      - name: Schema gate
        run: python scripts/release/schema_gate.py

      - name: Schema governance tests
        run: pytest -q tests/test_schema_governance_assets.py

      - name: Upload schema artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema-governance-artifacts
          if-no-files-found: error
          path: |
            audit-artifacts/release-verify/**
            audit-artifacts/release-manifest/**
            docs/release/SCHEMA_W002_PROGRESS.md
            docs/openapi/crown-openapi.yaml
