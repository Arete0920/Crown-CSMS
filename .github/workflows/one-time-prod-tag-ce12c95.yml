name: One-Time Production Tag ce12c95

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-prod-tag-ce12c95.yml"

permissions:
  contents: write

concurrency:
  group: one-time-prod-tag-ce12c95
  cancel-in-progress: false

jobs:
  create-production-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Create immutable production deployment tag
        shell: bash
        env:
          TARGET_SHA: ce12c9536ec85346b2446018fa8bfe27edb3ffa0
          DEPLOY_TAG: prod-deploy-20260808-ce12c95
        run: |
          set -euo pipefail
          git fetch origin --tags --force

          resolved="$(git rev-parse "${TARGET_SHA}^{commit}")"
          if [[ "$resolved" != "$TARGET_SHA" ]]; then
            echo "ERROR: target did not resolve to the required immutable SHA. expected=$TARGET_SHA actual=$resolved" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$DEPLOY_TAG"; then
            existing="$(git rev-parse "refs/tags/$DEPLOY_TAG^{}")"
            if [[ "$existing" == "$TARGET_SHA" ]]; then
              echo "Tag already exists at the correct immutable SHA: $DEPLOY_TAG -> $TARGET_SHA"
              exit 0
            fi
            echo "ERROR: refusing to overwrite existing tag $DEPLOY_TAG at $existing" >&2
            exit 1
          fi

          git tag "$DEPLOY_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$DEPLOY_TAG"
          echo "Created immutable production tag: $DEPLOY_TAG -> $TARGET_SHA"
