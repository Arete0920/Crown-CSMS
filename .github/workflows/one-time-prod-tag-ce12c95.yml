name: One-Time Production Dispatch ce12c95

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-prod-tag-ce12c95.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: one-time-prod-dispatch-ce12c95
  cancel-in-progress: false

jobs:
  dispatch-production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify immutable production deployment tag
        shell: bash
        env:
          TARGET_SHA: ce12c9536ec85346b2446018fa8bfe27edb3ffa0
          DEPLOY_TAG: prod-deploy-20260808-ce12c95
        run: |
          set -euo pipefail
          if ! git fetch origin "refs/tags/$DEPLOY_TAG:refs/tags/$DEPLOY_TAG"; then
            echo "ERROR: unable to fetch required immutable production tag: $DEPLOY_TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$DEPLOY_TAG"; then
            echo "ERROR: required immutable production tag does not exist: $DEPLOY_TAG" >&2
            exit 1
          fi

          existing="$(git rev-parse "refs/tags/$DEPLOY_TAG^{commit}")"
          if [[ "$existing" != "$TARGET_SHA" ]]; then
            echo "ERROR: immutable production tag target mismatch. expected=$TARGET_SHA actual=$existing" >&2
            exit 1
          fi

          echo "Verified immutable production tag: $DEPLOY_TAG -> $TARGET_SHA"

      - name: Dispatch guarded Production Deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: prod-deploy-20260808-ce12c95
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" --arg deploy_tag "$DEPLOY_TAG"             '{ref: $ref, inputs: {deploy_tag: $deploy_tag}}')"

          curl --fail-with-body --silent --show-error             --connect-timeout 15             --max-time 60             --request POST             --header "Accept: application/vnd.github+json"             --header "Content-Type: application/json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-prod.yml/dispatches"             --data "$payload"

          echo "Dispatched deploy-prod.yml for immutable tag: $DEPLOY_TAG"
