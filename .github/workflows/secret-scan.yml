name: secret-scan
permissions:
  contents: read
  pull-requests: read


on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (full history)
        run: |
          # Keep this gate blocking, but scope it to newly introduced commits
          # so historical incidents do not permanently block unrelated PRs.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE=""
          fi

          if [[ -n "$RANGE" ]]; then
            echo "Scanning commit range: $RANGE"
            gitleaks detect \
              --source . \
              --log-opts="$RANGE" \
              --redact \
              --report-format sarif \
              --report-path gitleaks-report.sarif \
              --config .gitleaks.toml \
              --gitleaks-ignore-path .gitleaksignore
          else
            echo "Range unavailable; scanning full history as fallback"
            gitleaks detect \
              --source . \
              --log-opts="--all" \
              --redact \
              --report-format sarif \
              --report-path gitleaks-report.sarif \
              --config .gitleaks.toml \
              --gitleaks-ignore-path .gitleaksignore
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.sarif
          if-no-files-found: ignore

