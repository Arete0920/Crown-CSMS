name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Run gitleaks against git history
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect \
            --source /repo \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif



