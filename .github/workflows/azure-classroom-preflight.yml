name: Azure Classroom Release Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/azure_classroom_preflight.py'
      - 'scripts/ops/test_azure_classroom_preflight.py'
      - 'scripts/ops/crown_azure_cost_audit.py'
      - 'scripts/ops/test_crown_azure_cost_audit.py'
      - 'scripts/ops/azure_runtime_inventory.py'
      - 'scripts/ops/test_azure_runtime_inventory.py'
      - 'scripts/ops/jireh_azure_site_preflight.py'
      - 'scripts/ops/test_jireh_azure_site_preflight.py'
      - 'scripts/ops/verify_dev_owner_runtime.py'
      - 'scripts/ops/test_verify_dev_owner_runtime.py'
      - 'scripts/ops/verify_dev_ops_credential_retirement.py'
      - 'scripts/ops/test_verify_dev_ops_credential_retirement.py'
      - 'scripts/ops/verify_dev_redis_controlplane.py'
      - 'scripts/ops/test_verify_dev_redis_controlplane.py'
      - 'docs/operations/CROWN_AZURE_FREE_FIRST_COST_CONTROL.md'
      - '.github/workflows/azure-classroom-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/azure_classroom_preflight.py'
      - 'scripts/ops/test_azure_classroom_preflight.py'
      - 'scripts/ops/crown_azure_cost_audit.py'
      - 'scripts/ops/test_crown_azure_cost_audit.py'
      - 'scripts/ops/azure_runtime_inventory.py'
      - 'scripts/ops/test_azure_runtime_inventory.py'
      - 'scripts/ops/jireh_azure_site_preflight.py'
      - 'scripts/ops/test_jireh_azure_site_preflight.py'
      - 'scripts/ops/verify_dev_owner_runtime.py'
      - 'scripts/ops/test_verify_dev_owner_runtime.py'
      - 'scripts/ops/verify_dev_ops_credential_retirement.py'
      - 'scripts/ops/test_verify_dev_ops_credential_retirement.py'
      - 'scripts/ops/verify_dev_redis_controlplane.py'
      - 'scripts/ops/test_verify_dev_redis_controlplane.py'
      - 'docs/operations/CROWN_AZURE_FREE_FIRST_COST_CONTROL.md'
      - '.github/workflows/azure-classroom-preflight.yml'
      - 'sites/jireh/README.md'
  workflow_dispatch:
    inputs:
      dev_owner_runtime_precheck:
        description: "Read-only public DEV owner runtime precheck; skip privileged Azure inventory"
        type: boolean
        required: false
        default: false
      dev_redis_controlplane_precheck:
        description: "Read-only existing DEV Redis topology inventory via Azure OIDC; never deploy or change settings"
        type: boolean
        required: false
        default: false
      expected_dev_sha:
        description: "Full 40-character accepted main SHA deployed to DEV API and preview"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: azure-classroom-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up preflight Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify read-only and withheld-release contracts
        run: python -m unittest discover -s scripts/ops -p test_azure_classroom_preflight.py -v
      - name: Verify Azure cost inventory remains private and read-only
        run: python -m unittest discover -s scripts/ops -p test_crown_azure_cost_audit.py -v

      - name: Verify hosted evidence privacy and failure contracts
        run: python -m unittest discover -s scripts/ops -p test_azure_runtime_inventory.py -v

      - name: Verify Jireh website Azure inventory failure contracts
        run: python -m unittest discover -s scripts/ops -p test_jireh_azure_site_preflight.py -v

      - name: Verify DEV owner public precheck contracts offline
        run: python -m unittest discover -s scripts/ops -p test_verify_dev_owner_runtime.py -v

      - name: Verify DEV schoolless credential probe contracts offline
        run: python -m unittest discover -s scripts/ops -p test_verify_dev_ops_credential_retirement.py -v

      - name: Verify DEV Redis read-only inventory contracts offline
        run: python -m unittest discover -s scripts/ops -p test_verify_dev_redis_controlplane.py -v

  jireh-free-staging-once:
    # Explicit commit marker makes this a one-shot staging action, never a recurring deploy.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[jireh-staging-free-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify source and required owned media before Azure mutation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ops -p test_jireh_azure_site_preflight.py -v
          node --test sites/jireh/tests/site.test.mjs
          node sites/jireh/build.mjs
          for f in index.html resources/jireh-sgo-overview.pdf images/jireh-sgo/logo.png images/crown/family-billing.webp; do
            test -s "sites/jireh/dist/$f"
          done
      - name: Azure login via existing federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify free-only quota, then provision only isolated Jireh host
        id: azure_site
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          az account show --query state --output tsv --only-show-errors | grep -qx Enabled
          az staticwebapp list --output json --only-show-errors > /tmp/jireh-swa-list.json
          verdict="$(python3 scripts/ops/jireh_azure_site_preflight.py --inventory /tmp/jireh-swa-list.json)"
          rm -f /tmp/jireh-swa-list.json
          if [[ "$verdict" == "CREATE_FREE" ]]; then
            az staticwebapp create --name jireh-site --resource-group crown-rg --location eastus2 --sku Free --output none --only-show-errors
          elif [[ "$verdict" != "REUSE_VERIFIED_FREE" ]]; then
            echo 'Jireh Static Web App Free validation failed' >&2
            exit 1
          fi
          az staticwebapp show --name jireh-site --resource-group crown-rg --output json --only-show-errors > /tmp/jireh-swa-result.json
          python3 scripts/ops/jireh_azure_site_preflight.py --verify-resource /tmp/jireh-swa-result.json
          rm -f /tmp/jireh-swa-result.json
          host="$(az staticwebapp show --name jireh-site --resource-group crown-rg --query defaultHostname --output tsv --only-show-errors)"
          if [[ ! "$host" =~ ^[A-Za-z0-9.-]+[.]azurestaticapps[.]net$ ]]; then
            echo 'Unexpected Jireh staging host' >&2
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Jireh separate free-tier staging hostname: https://$host" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node deployment runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Publish static artifacts without exposing deployment token
        shell: bash
        run: |
          set -euo pipefail
          token="$(az staticwebapp secrets list --name jireh-site --resource-group crown-rg --query properties.apiKey --output tsv --only-show-errors)"
          if [[ ${#token} -lt 40 ]]; then
            echo 'Jireh deployment token missing; refusing deployment' >&2
            exit 1
          fi
          echo "::add-mask::$token"
          SWA_CLI_DEPLOYMENT_TOKEN="$token" npx --yes @azure/static-web-apps-cli@2.0.2 deploy sites/jireh/dist --env production
          unset token
      - name: Verify deployed HTML, TLS, robots and binary asset integrity
        shell: bash
        env:
          HOST: ${{ steps.azure_site.outputs.host }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 30 "https://$HOST/" -o /tmp/jireh-staging.html; then break; fi
            sleep 5
          done
          grep -q 'Provision with Purpose' /tmp/jireh-staging.html
          grep -q 'noindex,nofollow' /tmp/jireh-staging.html
          grep -q 'Jireh SGO' /tmp/jireh-staging.html
          for f in resources/jireh-sgo-overview.pdf images/jireh-sgo/logo.png images/crown/family-billing.webp; do
            curl -fsSL --max-time 30 "https://$HOST/$f" -o /tmp/jireh-downloaded-asset
            cmp -s /tmp/jireh-downloaded-asset "sites/jireh/dist/$f"
          done
          echo "Jireh staging validated for $GITHUB_SHA at https://$HOST" >> "$GITHUB_STEP_SUMMARY"
          echo 'No domain DNS, MX/SPF/DKIM/DMARC, payment processing or existing CROWN dashboard was changed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Logout Azure federation
        if: always()
        run: az logout

  dev-owner-runtime-precheck:
    # Explicit owner-mode dispatch only. No Azure login, secrets, tenancy
    # changes, schema mutations, payments, or provisioned resources.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dev_owner_runtime_precheck == true
    needs: collector-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify requested full SHA is current protected main
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_dev_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'BLOCKED: full lowercase SHA required'; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'BLOCKED: checkout differs from requested SHA'; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || { echo 'BLOCKED: main advanced; re-review before probing'; exit 1; }
      - name: Public DEV runtime precheck without credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_dev_sha }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev-owner-runtime-precheck.json"
          set +e
          python3 scripts/ops/verify_dev_owner_runtime.py --expected-sha "$EXPECTED_SHA" > "$report"
          result=$?
          set -e
          python3 - "$report" <<'PY'
          import json, os, sys
          from pathlib import Path
          packet = json.loads(Path(sys.argv[1]).read_text())
          lines = [
              "## DEV owner public precheck (not runtime certification)",
              "Expected source: " + packet["expected_main_sha"],
              "Precheck: **" + packet["precheck"] + "**",
          ]
          lines.extend(f"- {key}: {value}" for key, value in sorted(packet["checks"].items()))
          lines.append("Operator authentication, provisioning, backup/restore and release authority remain NOT VERIFIED.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          print("DEV owner precheck: " + packet["precheck"] + " (unprivileged read only)")
          PY
          exit "$result"
      - name: Retain sanitized result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-owner-runtime-precheck-${{ github.run_id }}
          path: ${{ runner.temp }}/dev-owner-runtime-precheck.json
          retention-days: 7
          if-no-files-found: warn

  azure-inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dev_owner_runtime_precheck != true && inputs.dev_redis_controlplane_precheck != true
    needs: collector-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout reviewed main preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Validate existing Azure authentication configuration
        id: auth
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          raw = os.environ.get('AZURE_CREDENTIALS', '')
          guid = re.compile(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}')
          if raw:
              try:
                  data = json.loads(raw)
              except ValueError:
                  raise SystemExit('BLOCKED: Azure credentials JSON is invalid.') from None
              if not isinstance(data, dict) or not data.get('clientSecret'):
                  raise SystemExit('BLOCKED: Azure credentials are incomplete.')
              values = [data.get(k, '') for k in ('clientId', 'tenantId', 'subscriptionId')]
              mode = 'sp'
          else:
              values = [os.environ.get(k, '') for k in
                        ('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')]
              mode = 'oidc'
          if not all(isinstance(v, str) and guid.fullmatch(v) for v in values):
              raise SystemExit('BLOCKED: Azure authentication IDs are missing or invalid.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mode={mode}\n')
          PY
      - name: Azure preflight service principal login
        if: steps.auth.outputs.mode == 'sp'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Azure preflight federated login
        if: steps.auth.outputs.mode == 'oidc'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Query private Azure cost and tier inventory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ops/crown_azure_cost_audit.py --resource-group crown-rg --output private-azure-cost.json
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ops")
          from crown_azure_cost_audit import redacted_diagnostics
          d = json.loads(Path("private-azure-cost.json").read_text())
          if d.get("status") == "BLOCKED":
              raise SystemExit("Azure subscription inventory blocked.")
          inventory = d.get("inventory") or {}
          lines = ["## Azure cost audit (redacted)", "Account identifiers and monetary amounts withheld."]
          for key in ("app_service_plans", "container_registries", "static_web_apps", "postgresql_flexible_servers"):
              items = inventory.get(key)
              if items is None:
                  lines.append(f"- {key}: unavailable")
              else:
                  lines.append(f"- {key}: {len(items)} resources")
          for label, cost in (d.get("actual_cost") or {}).items():
              lines.append(f"- {label} cost query: {cost.get('status', 'UNAVAILABLE')}")
          lines.append("- Budget query: " + ("unavailable" if d.get("existing_budgets") is None else "received"))
          diagnostics = redacted_diagnostics(d)
          Path("azure-cost-diagnostics.json").write_text(json.dumps(diagnostics, indent=2) + "\n")
          for failure in diagnostics["failures"]:
              lines.append(f"- {failure['section']} diagnostic: {failure['category']}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")
          PY
          rm -f private-azure-cost.json
      - name: Collect scoped Azure inventory without mutation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          subscription="$(az account show --query id --output tsv --only-show-errors)"
          test -n "$subscription"
          python3 scripts/ops/azure_classroom_preflight.py \
            --subscription "$subscription" \
            --resource-group crown-rg \
            --api-app crown-api-prod \
            --expected-sha "$EXPECTED_SHA" > azure-classroom-preflight.json
      - name: Collect read-only hosted configuration and recovery metadata
        shell: bash
        run: python3 scripts/ops/azure_runtime_inventory.py > azure-runtime-inventory.json
      - name: Collect Jireh-specific static hosting and budget visibility
        shell: bash
        run: python3 scripts/ops/jireh_azure_site_preflight.py --output jireh-azure-site-preflight.json
      - name: Retain Jireh Azure readiness evidence
        if: always() && github.event_name == 'workflow_dispatch' && hashFiles('jireh-azure-site-preflight.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jireh-azure-site-preflight-${{ github.sha }}
          path: jireh-azure-site-preflight.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain redacted cost diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && hashFiles('azure-cost-diagnostics.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: azure-cost-diagnostics-${{ github.sha }}
          path: azure-cost-diagnostics.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain hosted configuration and recovery metadata
        if: always() && github.event_name == 'workflow_dispatch' && hashFiles('azure-runtime-inventory.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: azure-runtime-inventory-${{ github.sha }}
          path: azure-runtime-inventory.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain Azure inventory or blocked evidence
        if: github.event_name == 'workflow_dispatch' && hashFiles('azure-classroom-preflight.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: azure-classroom-preflight-${{ github.sha }}
          path: azure-classroom-preflight.json
          retention-days: 7
          if-no-files-found: error
      - name: Discard temporary Azure resource details
        if: always()
        shell: bash
        run: rm -f azure-classroom-preflight.json private-azure-cost.json azure-runtime-inventory.json azure-cost-diagnostics.json jireh-azure-site-preflight.json
      - name: Record preflight release boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Azure classroom preflight'
            echo '- This job collects inventory only.'
            echo '- Production deployment and classroom runtime remain NOT VERIFIED.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clear Azure preflight session
        if: always()
        run: az logout

  dev-redis-controlplane-precheck:
    # Operator-dispatched READ-ONLY Azure metadata verification for existing
    # DEV Redis. Never run the unrelated cost/prod inventory or Jireh deploy.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.dev_redis_controlplane_precheck == true &&
      inputs.dev_owner_runtime_precheck != true
    needs: collector-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout reviewed protected main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse stale source checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$expected_sha" || {
            echo 'BLOCKED: main moved since workflow dispatch'; exit 1;
          }
      - name: Azure login through existing environment federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect existing DEV Redis metadata without Azure mutation
        shell: bash
        env:
          CROWN_EXPECTED_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          umask 077
          report="$RUNNER_TEMP/dev-redis-controlplane-readonly.json"
          set +e
          python3 scripts/ops/verify_dev_redis_controlplane.py > "$report"
          result=$?
          set -e
          python3 - "$report" <<'PY'
          import json, os, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          lines = ["## Existing DEV Redis control-plane metadata (not release certification)",
                   "Preflight: **" + data.get("preflight", "BLOCKED") + "**"]
          for name, state in sorted(data.get("checks", {}).items()):
              lines.append(f"- {name}: {state}")
          lines.append("Hosted Redis TLS/connectivity, process secrets and 429/503 acceptance remain NOT VERIFIED.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
          exit "$result"
      - name: Retain sanitized DEV Redis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-redis-controlplane-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/dev-redis-controlplane-readonly.json
          retention-days: 7
          if-no-files-found: warn
      - name: Terminate Azure federation session
        if: always()
        run: az logout
