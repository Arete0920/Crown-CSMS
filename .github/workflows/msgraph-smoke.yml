name: MS Graph Smoke Test (OIDC)

on:
  workflow_dispatch:
  push:
    branches: [ "stabilization-20260116-spine" ]
  pull_request:
    branches: [ "stabilization-20260116-spine" ]

permissions:
  id-token: write
  contents: read

jobs:
  graph-smoke:
    runs-on: ubuntu-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Login to Azure using GitHub OIDC (no secret)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Acquire an app-only token for Microsoft Graph
      - name: Get Graph Token
        id: graph_token
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # Call a few Graph endpoints to prove wiring + consent
      - name: Graph Smoke Calls
        run: |
          set -euo pipefail
          TOKEN="${{ steps.graph_token.outputs.token }}"

          echo "== Graph: /v1.0/organization =="
          curl -sS -H "Authorization: Bearer $TOKEN" https://graph.microsoft.com/v1.0/organization | jq '.value[0] | {displayName, id}'

          echo "== Graph: /v1.0/users?$top=1 (requires User.Read.All app permission) =="
          curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/users?\$top=1&\$select=id,displayName,userPrincipalName" | jq '.value[0]'

          echo "== Graph: /v1.0/groups?$top=1 (requires Group.Read.All app permission) =="
          curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/groups?\$top=1&\$select=id,displayName" | jq '.value[0]'

          echo "✅ Graph smoke test PASS"
