name: Azure Drift Watchdog

on:
  schedule:
    # Every 6 hours — 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      verbose:
        description: "Print full appsettings name list (no values)"
        required: false
        default: "false"

concurrency:
  group: azure-drift-watchdog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  assert-invariants:
    name: Assert Azure Infrastructure Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RESOURCE_GROUP: crown-rg
      PROD_APP: crown-api-prod
      DEV_APP: crown-api-dev
      ACR_NAME: crownregistry
      PROD_URL: https://crown-api-prod.azurewebsites.net/api/health/

    steps:
      - name: Resolve Azure auth mode
        id: auth_guard
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_TENANT_ID}" ] && [ -n "${AZURE_SUBSCRIPTION_ID}" ]; then
            echo "login_mode=oidc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${AZURE_CREDENTIALS}" ]; then
            echo "login_mode=sp" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ERROR: no Azure auth configured. Set OIDC secrets or AZURE_CREDENTIALS."
          exit 1

      - name: Azure Login (OIDC)
        if: steps.auth_guard.outputs.login_mode == 'oidc'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Service Principal JSON)
        if: steps.auth_guard.outputs.login_mode == 'sp'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Assert: ACR admin is disabled"
        run: |
          ADMIN=$(az acr show -n $ACR_NAME --query "adminUserEnabled" -o tsv)
          if [ "$ADMIN" != "false" ]; then
            echo "DRIFT: ACR admin is enabled (adminUserEnabled=$ADMIN)"
            echo "Expected: false"
            exit 1
          fi
          echo "ACR admin disabled: $ADMIN"

      - name: "Assert: No DOCKER_REGISTRY_SERVER_PASSWORD in prod"
        run: |
          SETTING=$(az webapp config appsettings list \
            -g $RESOURCE_GROUP -n $PROD_APP \
            --query "[?name=='DOCKER_REGISTRY_SERVER_PASSWORD'].name | [0]" \
            -o tsv 2>/dev/null || true)
          if [ -n "$SETTING" ]; then
            echo "DRIFT: registry password setting is present in $PROD_APP"
            exit 1
          fi
          echo "No registry password setting in $PROD_APP"

      - name: "Assert: No DOCKER_REGISTRY_SERVER_PASSWORD in dev"
        run: |
          SETTING=$(az webapp config appsettings list \
            -g $RESOURCE_GROUP -n $DEV_APP \
            --query "[?name=='DOCKER_REGISTRY_SERVER_PASSWORD'].name | [0]" \
            -o tsv 2>/dev/null || true)
          if [ -n "$SETTING" ]; then
            echo "DRIFT: registry password setting is present in $DEV_APP"
            exit 1
          fi
          echo "No registry password setting in $DEV_APP"

      - name: "Assert: Prod alwaysOn = true"
        run: |
          ALWAYS_ON=$(az webapp config show \
            -g $RESOURCE_GROUP -n $PROD_APP \
            --query "alwaysOn" -o tsv)
          if [ "$ALWAYS_ON" != "true" ]; then
            echo "DRIFT: Prod alwaysOn=$ALWAYS_ON (expected true)"
            exit 1
          fi
          echo "Prod alwaysOn: $ALWAYS_ON"

      - name: "Assert: Prod managed identity assigned"
        run: |
          IDENTITY=$(az webapp identity show \
            -g $RESOURCE_GROUP -n $PROD_APP \
            --query "type" -o tsv 2>/dev/null || echo "none")
          if [[ "$IDENTITY" != *"SystemAssigned"* ]]; then
            echo "DRIFT: Prod app has no SystemAssigned managed identity"
            exit 1
          fi
          echo "Prod managed identity assigned"

      - name: "Assert: Dev managed identity assigned"
        run: |
          IDENTITY=$(az webapp identity show \
            -g $RESOURCE_GROUP -n $DEV_APP \
            --query "type" -o tsv 2>/dev/null || echo "none")
          if [[ "$IDENTITY" != *"SystemAssigned"* ]]; then
            echo "DRIFT: Dev app has no SystemAssigned managed identity"
            exit 1
          fi
          echo "Dev managed identity assigned"

      - name: "Assert: Prod SECRET_KEY is a KV reference"
        run: |
          VAL=$(az webapp config appsettings list \
            -g $RESOURCE_GROUP -n $PROD_APP \
            --query "[?name=='SECRET_KEY'].value | [0]" -o tsv)
          if [[ "$VAL" != "@Microsoft.KeyVault"* ]]; then
            echo "DRIFT: Prod SECRET_KEY is not a Key Vault reference; value suppressed"
            exit 1
          fi
          echo "Prod SECRET_KEY is a Key Vault reference"

      - name: "Assert: Prod DB_PASSWORD is a KV reference"
        run: |
          VAL=$(az webapp config appsettings list \
            -g $RESOURCE_GROUP -n $PROD_APP \
            --query "[?name=='DB_PASSWORD'].value | [0]" -o tsv)
          if [[ "$VAL" != "@Microsoft.KeyVault"* ]]; then
            echo "DRIFT: Prod DB_PASSWORD is not a Key Vault reference; value suppressed"
            exit 1
          fi
          echo "Prod DB_PASSWORD is a Key Vault reference"

      - name: "Assert: Dev ACR uses managed identity (not admin creds)"
        run: |
          ACR_MI=$(az webapp config show \
            -g $RESOURCE_GROUP -n $DEV_APP \
            --query "acrUseManagedIdentityCreds" -o tsv)
          if [ "$ACR_MI" != "true" ]; then
            echo "DRIFT: Dev app does not use managed identity for ACR"
            exit 1
          fi
          echo "Dev ACR uses managed identity"

      - name: "Assert: Dev DATABASE_URL is a KV reference"
        run: |
          VAL=$(az webapp config appsettings list \
            -g $RESOURCE_GROUP -n $DEV_APP \
            --query "[?name=='DATABASE_URL'].value | [0]" -o tsv 2>/dev/null || true)
          if [[ "$VAL" != "@Microsoft.KeyVault"* ]]; then
            echo "DRIFT: Dev DATABASE_URL is not a Key Vault reference; value suppressed"
            exit 1
          fi
          echo "Dev DATABASE_URL is a Key Vault reference"

      - name: "Assert: Prod /api/health/ ok:true and build_sha present"
        run: |
          for i in $(seq 1 6); do
            BODY="$(curl -fsS --max-time 15 "$PROD_URL" 2>/dev/null || true)"
            if [ -n "$BODY" ]; then
              OK="$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok',''))" 2>/dev/null || true)"
              SHA="$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('build_sha',''))" 2>/dev/null || true)"
              DB="$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db',''))" 2>/dev/null || true)"
              if [ "$OK" = "True" ] && [ -n "$SHA" ] && [ "$SHA" != "local-dev" ]; then
                echo "Prod health verified: ok=$OK db=$DB build_sha=${SHA:0:8}"
                exit 0
              fi
              echo "Attempt $i did not meet health requirements; waiting 10s"
            else
              echo "Attempt $i returned no response; waiting 10s"
            fi
            sleep 10
          done
          echo "DRIFT: Prod health did not return ok:true with a valid build_sha"
          exit 1

      - name: "Summary: all invariants passed"
        if: success()
        run: |
          echo "All Azure infrastructure invariants satisfied"
          echo "ACR admin: disabled"
          echo "Registry password settings: absent from prod and dev"
          echo "alwaysOn: true"
          echo "Identities: SystemAssigned for prod and dev"
          echo "Key Vault references: verified"
          echo "Dev ACR: managed identity"
          echo "Health: ok:true with build_sha"
          echo "Run at: $(date -u '+%Y-%m-%d %H:%M UTC')"
