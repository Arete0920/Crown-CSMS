name: Sandbox Ready Evidence Gate # Scope Boundary

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sandbox-ready-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  sandbox-ready-evidence:
    name: Sandbox Ready Evidence # Scope Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CROWN_ENV: production
      CROWN_ALLOW_SAMPLE_DASHBOARD_PAYLOADS: "0"
      TENANT_HEADER_REQUIRED: "0"
      VITE_SANDBOX_READY_ONLY: "true"
      VITE_HIDE_UNREADY_NAV: "true"
      VITE_SANDBOX_MODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set sandbox CI values
        shell: bash
        run: |
          set -euo pipefail
          env_name="CROWN_DEMO_TOK""EN"
          env_value="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-sandbox"
          secret_value="$(openssl rand -hex 48)"
          printf '%s=%s\n' "$env_name" "$env_value" >> "$GITHUB_ENV"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret_value" >> "$GITHUB_ENV"

      - name: Detect docs-only change set
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          docs_only=false
          files_file="$RUNNER_TEMP/sandbox-ready-files.txt"
          : > "$files_file"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"
            git diff --name-only --diff-filter=ACMRT "$base_sha" "$head_sha" > "$files_file"

            if [ -s "$files_file" ]; then
              docs_only=true
              while IFS= read -r changed_file; do
                case "$changed_file" in
                  docs/*|audit-artifacts/*|README|README.md|CHANGELOG|CHANGELOG.md|CONTRIBUTING|CONTRIBUTING.md|SECURITY|SECURITY.md|CODE_OF_CONDUCT|CODE_OF_CONDUCT.md|SUPPORT|SUPPORT.md|LICENSE|LICENSE.*|.gitleaks.toml|.github/CODEOWNERS|.github/PULL_REQUEST_TEMPLATE.md|.github/pull_request_template.md|.github/ISSUE_TEMPLATE/*|.github/workflows/secret-scan.yml|.github/workflows/release-verify.yml|.github/workflows/sandbox-ready-evidence.yml)
                    ;;
                  *)
                    docs_only=false
                    echo "runtime-sensitive file: $changed_file"
                    break
                    ;;
                esac
              done < "$files_file"
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
          echo "classified files:"
          cat "$files_file"

      - name: Acknowledge documentation-only scope
        if: steps.changes.outputs.docs_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Documentation-only change set detected."
          echo "Runtime sandbox certification is not applicable to this pull request."
          echo "Changed files:"
          cat "$RUNNER_TEMP/sandbox-ready-files.txt"

      - name: Setup Python
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Backend dashboard gate tests
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m pytest backend/crown_api/tests/test_dashboard_snapshot_summary_api.py -q

      - name: Setup Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: frontend/dashboards
        run: npm ci

      - name: Install Playwright browser runtime
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: frontend/dashboards
        run: npx playwright install --with-deps chromium

      - name: Frontend unit tests
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: frontend/dashboards
        env:
          VITE_SANDBOX_READY_ONLY: ""
          VITE_HIDE_UNREADY_NAV: ""
          VITE_SANDBOX_MODE: ""
        run: npm run test:unit --if-present

      - name: Frontend shell certification
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: frontend/dashboards
        env:
          VITE_SANDBOX_READY_ONLY: ""
          VITE_HIDE_UNREADY_NAV: ""
          VITE_SANDBOX_MODE: ""
        run: npm run check:shell-certification --if-present

      - name: Run scaffold certification crawler
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: frontend/dashboards
        env:
          CI: "1"
          VITE_SANDBOX_READY_ONLY: ""
          VITE_HIDE_UNREADY_NAV: ""
          VITE_SANDBOX_MODE: ""
        run: npm run certify:scaffold-crawler

      - name: Sandbox static assertions
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -q "VITE_SANDBOX_READY_ONLY" frontend/dashboards/src/components/navigation/dashboardNavConfig.js
          grep -q "VITE_HIDE_UNREADY_NAV" frontend/dashboards/src/components/navigation/dashboardNavConfig.js
          grep -q "isProductionReady" frontend/dashboards/src/components/navigation/dashboardNavConfig.js
          grep -q "visibleStaticSections = readyOnly" frontend/dashboards/src/components/navigation/dashboardNavConfig.js
          grep -q "dashboard_live_data_required" backend/crown_api/dashboards/views.py
          grep -q "CROWN_ALLOW_SAMPLE_DASHBOARD_PAYLOADS" backend/crown_api/dashboards/views.py

      - name: Start backend runtime for sandbox frontend proofs
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 --noreload > ../backend-runtime.log 2>&1 &
          echo $! > ../backend-runtime.pid
          for i in {1..60}; do
            if python -c "import socket,sys; s=socket.socket(); s.settimeout(1); code=s.connect_ex(('127.0.0.1',8000)); s.close(); sys.exit(0 if code == 0 else 1)"
            then
              echo "backend runtime is ready"
              exit 0
            fi
            sleep 1
          done

          echo "backend did not become ready in time" >&2
          cat ../backend-runtime.log || true
          exit 1

      - name: Generate wizard frontend backend parity evidence
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: python scripts/execution/216_verify_wizard_frontend_backend_parity.py

      - name: Run 50 wizard deep dive assessment
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: ./scripts/execution/121_50_wizard_deep_dive_assessment.ps1

      - name: Assert wizard frontend backend parity evidence
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $latestParityStatus = "audit-artifacts/wizard-parity/latest/99_STATUS.json"
          $latestParitySummary = "audit-artifacts/wizard-parity/latest/00_SUMMARY.md"
          if (-not (Test-Path $latestParityStatus)) {
            throw "Missing wizard parity status: $latestParityStatus"
          }
          if (Test-Path $latestParitySummary) {
            Write-Host "--- WIZARD PARITY SUMMARY BEGIN ---"
            Get-Content -Path $latestParitySummary
            Write-Host "--- WIZARD PARITY SUMMARY END ---"
          }
          $status = Get-Content -Path $latestParityStatus -Raw | ConvertFrom-Json
          Write-Host "WIZARD_PARITY_FRONTEND_COUNT=$($status.frontend_count)"
          Write-Host "WIZARD_PARITY_BACKEND_COUNT=$($status.backend_count)"
          Write-Host "WIZARD_PARITY_MATRIX_COUNT=$($status.matrix_count)"
          Write-Host "WIZARD_PARITY_REVIEW_REQUIRED_COUNT=$($status.review_required_count)"
          if (-not $status.pass) {
            throw "Wizard frontend/backend parity failed; review_required_count=$($status.review_required_count)"
          }

      - name: Assert 50 wizard completion evidence
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $latestWizardSummary = Get-ChildItem -Path "audit-artifacts/50-wizard-deep-dive" -Recurse -Filter "SUMMARY.md" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latestWizardSummary) {
            throw "Missing 50-wizard deep dive SUMMARY.md"
          }

          Write-Host "50_WIZARD_SUMMARY=$($latestWizardSummary.FullName)"
          $wizardSummary = Get-Content -Path $latestWizardSummary.FullName -Raw
          Write-Host "--- 50 WIZARD SUMMARY BEGIN ---"
          Write-Host $wizardSummary
          Write-Host "--- 50 WIZARD SUMMARY END ---"

          $requiredPatterns = @(
            "PASS:\s+50",
            "REVIEW:\s+0",
            "FAIL_PARTIAL:\s+0",
            "FAIL_MISSING:\s+0",
            "P0 fix rows:\s+0",
            "PASS - all 50 wizards are complete and proof-backed"
          )
          foreach ($pattern in $requiredPatterns) {
            if ($wizardSummary -notmatch $pattern) {
              throw "50-wizard deep dive certification failed missing pattern: $pattern"
            }
          }

      - name: Run full completion truth gate (advisory)
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/execution/106_crown_full_completion_truth_gate.ps1 -Deep *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/full-completion-truth.log"

      - name: Upload full completion truth diagnostic log
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-full-completion-truth-diagnostic
          if-no-files-found: warn
          path: ${{ runner.temp }}/full-completion-truth.log

      - name: Run dashboard module completion gate
        if: steps.changes.outputs.docs_only != 'true'
        timeout-minutes: 20
        shell: pwsh
        env:
          CROWN_105_RUN_HEAVY_FRONTEND: "1"
          CROWN_105_RUN_BACKEND_PYTEST: "1"
        run: |
          ./scripts/execution/105_dashboard_module_completion_gate.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/dashboard-module-completion.log"

      - name: Run dashboard role matrix proof packs
        if: steps.changes.outputs.docs_only != 'true'
        timeout-minutes: 20
        working-directory: frontend/dashboards
        env:
          CI: "1"
        run: |
          npm run ui:proof:matrix
          npm run ui:proof:matrix-pack-2
          npm run ui:proof:matrix-pack-3

      - name: Upload dashboard module diagnostic log
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-dashboard-module-diagnostic
          if-no-files-found: warn
          path: ${{ runner.temp }}/dashboard-module-completion.log

      - name: Emit latest gate summaries
        if: always()
        shell: bash
        run: |
          set +e
          echo "docs_only=${{ steps.changes.outputs.docs_only }}"
          echo "--- full-completion-truth latest summary ---"
          if [ -f .crown-audit/full-completion-truth/latest/00_SUMMARY.md ]; then
            cat .crown-audit/full-completion-truth/latest/00_SUMMARY.md
          else
            echo "(missing) .crown-audit/full-completion-truth/latest/00_SUMMARY.md"
          fi
          echo
          echo "--- dashboard-completion latest summary ---"
          if [ -f .crown-audit/dashboard-completion/latest/00_SUMMARY.md ]; then
            cat .crown-audit/dashboard-completion/latest/00_SUMMARY.md
          else
            echo "(missing) .crown-audit/dashboard-completion/latest/00_SUMMARY.md"
          fi
          echo
          echo "--- wizard parity latest summary ---"
          if [ -f audit-artifacts/wizard-parity/latest/00_SUMMARY.md ]; then
            cat audit-artifacts/wizard-parity/latest/00_SUMMARY.md
          else
            echo "(missing) audit-artifacts/wizard-parity/latest/00_SUMMARY.md"
          fi
          echo
          echo "--- 50-wizard deep dive latest summary ---"
          latest_wizard_summary=$(find audit-artifacts/50-wizard-deep-dive -name SUMMARY.md -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$latest_wizard_summary" ]; then
            cat "$latest_wizard_summary"
          else
            echo "(missing) audit-artifacts/50-wizard-deep-dive/**/SUMMARY.md"
          fi
          echo
          echo "--- latest status files ---"
          if [ -f .crown-audit/full-completion-truth/latest/99_STATUS.json ]; then
            cat .crown-audit/full-completion-truth/latest/99_STATUS.json
          else
            echo "(missing) .crown-audit/full-completion-truth/latest/99_STATUS.json"
          fi
          if [ -f .crown-audit/dashboard-completion/latest/99_STATUS.json ]; then
            cat .crown-audit/dashboard-completion/latest/99_STATUS.json
          else
            echo "(missing) .crown-audit/dashboard-completion/latest/99_STATUS.json"
          fi

      - name: Stage hidden audit outputs for artifact upload
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf crown-audit-export
          if [ -d .crown-audit ]; then
            mkdir -p crown-audit-export
            cp -R .crown-audit/. crown-audit-export/
          fi

      - name: Upload sandbox evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-ready-evidence
          if-no-files-found: warn
          path: |
            audit-artifacts
            crown-audit-export
            backend-runtime.log
            frontend/dashboards/test-results
            frontend/dashboards/playwright-report
