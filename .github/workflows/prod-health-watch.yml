name: Production Health Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: production-health-watch
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: Production Health Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check production health endpoint
        id: health
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "status=misconfigured" >> "$GITHUB_OUTPUT"
            echo "http_code=000" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE="000"
          if curl -sS --max-time 10 \
            -o /tmp/health_response.json \
            -w "%{http_code}" \
            "${PRODUCTION_URL}/api/health/" > /tmp/health_http_code.txt; then
            RESPONSE=$(cat /tmp/health_http_code.txt)
          fi

          if [ "$RESPONSE" != "200" ]; then
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(
            python3 -c "import json; d=json.load(open('/tmp/health_response.json','r',encoding='utf-8')); print('healthy' if (d.get('status') == 'healthy' or d.get('ok') is True) else d.get('status','unhealthy'))" 2>/dev/null || echo "unhealthy"
          )
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Report unhealthy status
        if: always() && steps.health.outputs.status != 'healthy'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const status = '${{ steps.health.outputs.status }}' || 'unknown';
            const httpCode = '${{ steps.health.outputs.http_code }}' || '000';
            const now = new Date().toISOString();
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titlePrefix = '[ALERT] Production health check failed';

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert',
              per_page: 100,
            });

            const existing = openIssues.find((candidate) => candidate.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  'Production health alert repeated.',
                  `Detected: ${now}`,
                  `HTTP Status: ${httpCode}`,
                  `Health status: ${status}`,
                  `Workflow run: ${runUrl}`,
                ].join('\n'),
              });
              return;
            }

            const issueBody = [
              '## Production Health Alert',
              '',
              '**Detected:** ' + now,
              '**HTTP Status:** ' + httpCode,
              '**Health status:** ' + status,
              '**Workflow run:** ' + runUrl,
              '',
              '### Required actions',
              '1. Check Sentry for recent errors.',
              '2. Verify Azure app service is running.',
              '3. Confirm database connectivity via `/api/health/` response body.',
              '4. Escalate to TC if not resolved within 15 minutes.',
              '',
              '_This issue was opened automatically by the production health monitor._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[ALERT] Production health check failed - ' + now,
              body: issueBody,
              labels: ['production-alert', 'priority-high'],
            });

      - name: Log healthy status
        if: steps.health.outputs.status == 'healthy'
        run: echo "Production health OK - HTTP ${{ steps.health.outputs.http_code }}"

      - name: Close recovered alert
        if: steps.health.outputs.status == 'healthy'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const titlePrefix = '[ALERT] Production health check failed';

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert',
              per_page: 100,
            });

            for (const issue of openIssues.filter((candidate) => candidate.title.startsWith(titlePrefix))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Production health recovered. Closing alert automatically.',
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail closed when health proof is not healthy
        if: always() && steps.health.outputs.status != 'healthy'
        run: |
          echo "Production health proof failed: status=${{ steps.health.outputs.status }} http=${{ steps.health.outputs.http_code }}"
          exit 1
