name: Production Health Watch

# This control is intentionally manual until a successor production target and
# monitoring owner are established. Do not spend hosted Actions minutes polling
# an unconfigured or historical production endpoint.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: Production Health Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health endpoint
        id: health
        shell: bash
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "status=misconfigured" >> "$GITHUB_OUTPUT"
            echo "http_code=000" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE="000"
          if curl -sS --max-time 10 -o /tmp/health_response.json -w "%{http_code}" "${PRODUCTION_URL}/api/health/" > /tmp/health_http_code.txt; then
            RESPONSE=$(cat /tmp/health_http_code.txt)
          fi

          if [ "$RESPONSE" != "200" ]; then
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(python3 tools/ci/prod_health_status.py /tmp/health_response.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"

      - name: Report any failed production health status
        if: always() && steps.health.outputs.status != 'healthy'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_HTTP_CODE: ${{ steps.health.outputs.http_code }}
        with:
          script: |
            const status = process.env.HEALTH_STATUS || 'unknown';
            const httpCode = process.env.HEALTH_HTTP_CODE || '000';
            const now = new Date().toISOString();
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titlePrefix = '[ALERT] Production health check failed';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find((candidate) => candidate.title.startsWith(titlePrefix));
            const body = [
              '## Production Health Alert',
              '',
              `Detected: ${now}`,
              `HTTP status: ${httpCode}`,
              `Health status: ${status}`,
              `Workflow run: ${runUrl}`,
              '',
              'Required actions:',
              '1. Verify the selected production target and runtime identity.',
              '2. Inspect current configured error and platform monitoring.',
              '3. Confirm database connectivity through the approved health contract.',
              '4. Escalate through the current operational-transfer contact path.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
              return;
            }
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: `${titlePrefix} - ${now}`, body});

      - name: Close recovered alert
        if: steps.health.outputs.status == 'healthy'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const titlePrefix = '[ALERT] Production health check failed';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of openIssues.filter((candidate) => candidate.title.startsWith(titlePrefix))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Production health recovered. Closing alert automatically.'
              });
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed'});
            }

      - name: Fail closed when health proof is not healthy
        if: always() && steps.health.outputs.status != 'healthy'
        env:
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_HTTP_CODE: ${{ steps.health.outputs.http_code }}
        run: |
          echo "Production health proof failed: status=${HEALTH_STATUS:-unknown} http=${HEALTH_HTTP_CODE:-000}"
          exit 1
