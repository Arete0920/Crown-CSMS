name: Production Health Watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - '.github/prod-dispatch-e57867b.trigger'
  workflow_run:
    workflows: ['Production Deploy (Dispatch v2)']
    types: [requested, completed]

concurrency:
  group: production-health-watch-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  merged-pr-production-dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/fire-prod-dispatch-e57867b-v3' &&
      github.event.pull_request.base.ref == 'main'
    name: Dispatch And Discover Production Run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch protected workflow and record downstream run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = 'prod-deploy-20260726-e57867b';
            const expectedSha = 'e57867b198bbfd1676122d30213d3617559f869e';
            const dispatchedAfter = Date.now() - 5000;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-prod-dispatch.yml',
              ref: 'main',
              inputs: {
                deploy_tag: tag,
                force_deploy: 'true'
              }
            });

            let downstream = null;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 2000));
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-prod-dispatch.yml',
                event: 'workflow_dispatch',
                per_page: 20
              });
              downstream = data.workflow_runs.find((run) => new Date(run.created_at).getTime() >= dispatchedAfter) || null;
              if (downstream) break;
              core.info(`Downstream run not visible yet (attempt ${attempt}/30).`);
            }
            if (!downstream) {
              core.setFailed('Dispatch was accepted but downstream production run was not discoverable within 60 seconds.');
              return;
            }

            const commandRun = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              body: [
                'Production deployment dispatched and discovered.',
                '',
                `- command run: ${commandRun}`,
                `- downstream run id: \`${downstream.id}\``,
                `- downstream run URL: ${downstream.html_url}`,
                `- downstream status: \`${downstream.status}\``,
                `- downstream conclusion: \`${downstream.conclusion || 'pending'}\``,
                `- tag: \`${tag}\``,
                `- expected SHA: \`${expectedSha}\``,
                '- override: `force_deploy=true`',
                '- production remains **NO-GO / HOLD** pending exact-SHA runtime and P0 evidence.'
              ].join('\n')
            });

  scheduled-production-dispatch:
    if: github.event_name == 'schedule'
    name: One-Time Approved Production Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exactly once for approved release nonce
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const nonce = 'prod-dispatch-e57867b-scheduled-v1';
            const marker = `scheduled-dispatch-nonce: ${nonce}`;
            const tag = 'prod-deploy-20260726-e57867b';
            const expectedSha = 'e57867b198bbfd1676122d30213d3617559f869e';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              per_page: 100
            });
            if (comments.some((comment) => String(comment.body || '').includes(marker))) {
              core.info(`Dispatch nonce ${nonce} already recorded; skipping.`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-prod-dispatch.yml',
              ref: 'main',
              inputs: {
                deploy_tag: tag,
                force_deploy: 'true'
              }
            });
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              body: [
                'Production dispatch accepted through the idempotent scheduled lane.',
                '',
                `- ${marker}`,
                `- scheduler run: ${runUrl}`,
                '- downstream workflow: `.github/workflows/deploy-prod-dispatch.yml`',
                '- tag: `' + tag + '`',
                '- expected SHA: `' + expectedSha + '`',
                '- override: `force_deploy=true`',
                '- production remains **NO-GO / HOLD** pending exact-SHA runtime and P0 evidence.'
              ].join('\n')
            });

  observe-production-deployment:
    if: github.event_name == 'workflow_run'
    name: Observe Production Deployment Run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record deployment run identity and conclusion
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || 'pending';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              body: [
                'Production deployment workflow observed.',
                '',
                `- run id: \`${run.id}\``,
                `- run URL: ${run.html_url}`,
                `- event: \`${run.event}\``,
                `- status: \`${run.status}\``,
                `- conclusion: \`${conclusion}\``,
                `- head SHA: \`${run.head_sha}\``,
                '- production remains **NO-GO / HOLD** pending exact-SHA runtime and P0 evidence.'
              ].join('\n')
            });

  health-check:
    if: github.event_name != 'workflow_run' && github.event_name != 'pull_request'
    name: Production Health Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health endpoint
        id: health
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "status=misconfigured" >> "$GITHUB_OUTPUT"
            echo "http_code=000" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESPONSE="000"
          if curl -sS --max-time 10 -o /tmp/health_response.json -w "%{http_code}" "${PRODUCTION_URL}/api/health/" > /tmp/health_http_code.txt; then
            RESPONSE=$(cat /tmp/health_http_code.txt)
          fi
          if [ "$RESPONSE" != "200" ]; then
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(python3 -c "import json; d=json.load(open('/tmp/health_response.json','r',encoding='utf-8')); print('healthy' if (d.get('status') == 'healthy' or d.get('ok') is True) else d.get('status','unhealthy'))" 2>/dev/null || echo "unhealthy")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Report unhealthy status
        if: always() && steps.health.outputs.status != 'healthy'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const status = '${{ steps.health.outputs.status }}' || 'unknown';
            const httpCode = '${{ steps.health.outputs.http_code }}' || '000';
            const now = new Date().toISOString();
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titlePrefix = '[ALERT] Production health check failed';
            const { data: openIssues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'production-alert', per_page: 100});
            const existing = openIssues.find((candidate) => candidate.title.startsWith(titlePrefix));
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: ['Production health alert repeated.', `Detected: ${now}`, `HTTP Status: ${httpCode}`, `Health status: ${status}`, `Workflow run: ${runUrl}`].join('\n')});
              return;
            }
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: '[ALERT] Production health check failed - ' + now, body: ['## Production Health Alert', '', '**Detected:** ' + now, '**HTTP Status:** ' + httpCode, '**Health status:** ' + status, '**Workflow run:** ' + runUrl, '', '### Required actions', '1. Check Sentry for recent errors.', '2. Verify Azure app service is running.', '3. Confirm database connectivity via `/api/health/` response body.', '4. Escalate to TC if not resolved within 15 minutes.', '', '_This issue was opened automatically by the production health monitor._'].join('\n'), labels: ['production-alert', 'priority-high']});

      - name: Log healthy status
        if: steps.health.outputs.status == 'healthy'
        run: echo "Production health OK - HTTP ${{ steps.health.outputs.http_code }}"

      - name: Close recovered alert
        if: steps.health.outputs.status == 'healthy'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const titlePrefix = '[ALERT] Production health check failed';
            const { data: openIssues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'production-alert', per_page: 100});
            for (const issue of openIssues.filter((candidate) => candidate.title.startsWith(titlePrefix))) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: 'Production health recovered. Closing alert automatically.'});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed'});
            }

      - name: Fail closed when health proof is not healthy
        if: always() && steps.health.outputs.status != 'healthy'
        run: |
          echo "Production health proof failed: status=${{ steps.health.outputs.status }} http=${{ steps.health.outputs.http_code }}"
          exit 1