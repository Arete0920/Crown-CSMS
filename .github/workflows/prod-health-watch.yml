name: Production Health Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: production-health-watch
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: Production Health Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check production health endpoint
        id: health
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "status=misconfigured" >> "$GITHUB_OUTPUT"
            echo "http_code=000" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -sS --max-time 10 \
            -o /tmp/health_response.json \
            -w "%{http_code}" \
            "${PRODUCTION_URL}/api/health/" || echo "000")

          if [ "$RESPONSE" != "200" ]; then
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(
            python3 - <<'PY'
            import json
            try:
              with open('/tmp/health_response.json','r',encoding='utf-8') as f:
                d=json.load(f)
            except Exception:
              print('unhealthy')
              raise SystemExit(0)
            if d.get('status') == 'healthy' or d.get('ok') is True:
              print('healthy')
            else:
              print(d.get('status','unhealthy'))
            PY
          )
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "http_code=$RESPONSE" >> "$GITHUB_OUTPUT"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Report unhealthy status
        if: steps.health.outputs.status != 'healthy' && steps.health.outputs.status != 'misconfigured'
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ steps.health.outputs.status }}';
            const httpCode = '${{ steps.health.outputs.http_code }}';
            const now = new Date().toISOString();

            const issueBody = [
              '## Production Health Alert',
              '',
              '**Detected:** ' + now,
              '**HTTP Status:** ' + httpCode,
              '**Health status:** ' + status,
              '',
              '### Required actions',
              '1. Check Sentry for recent errors.',
              '2. Verify Azure app service is running.',
              '3. Confirm database connectivity via `/api/health/` response body.',
              '4. Escalate to TC if not resolved within 15 minutes.',
              '',
              '_This issue was opened automatically by the production health monitor._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[ALERT] Production health check failed - ' + now,
              body: issueBody,
              labels: ['production-alert', 'priority-high'],
            });

      - name: Log healthy status
        if: steps.health.outputs.status == 'healthy'
        run: echo "Production health OK - HTTP ${{ steps.health.outputs.http_code }}"

      - name: Close recovered alert
        if: steps.health.outputs.status == 'healthy'
        uses: actions/github-script@v8
        with:
          script: |
            const titlePrefix = '[ALERT] Production health check failed';

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert',
              per_page: 100,
            });

            for (const issue of openIssues.filter((candidate) => candidate.title.startsWith(titlePrefix))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Production health recovered. Closing alert automatically.',
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
