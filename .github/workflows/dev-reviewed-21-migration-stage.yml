# CROWN #427 — explicit, source-pinned DEV schema-only cutover.
# Never triggered automatically for Azure writes; no production path.
name: DEV Reviewed 21 Migration Stage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dev-reviewed-21-migration-stage.yml'
      - 'scripts/ops/stage_dev_heritage_graph.py'
      - 'scripts/ops/test_stage_dev_heritage_graph.py'
      - 'scripts/ops/test_dev_reviewed21_workflow.py'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact current protected-main commit SHA (40 hex)"
        required: true
        type: string
      confirm_dev_reviewed21:
        description: "Type migrate-dev-reviewed-21"
        required: true
        type: string
      synthetic_dev_confirmed:
        description: "Owner attests DEV contains synthetic test data only"
        required: true
        type: boolean
        default: false
      backup_recovery_verified:
        description: "Owner separately verified a durable recoverable pre-change backup"
        required: true
        type: boolean
        default: false
      maintenance_window_confirmed:
        description: "Owner confirms authorized DEV schema maintenance window"
        required: true
        type: boolean
        default: false
      rehearsal_run_id:
        description: "Prior completed isolated-postgres-restore-drill Actions run ID"
        required: true
        type: string
      rehearsal_artifact_id:
        description: "Exact dev-operational-restore artifact ID from that run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crown-dev-reviewed21-stage
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    name: DEV stage source-only contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser for workflow checks
        run: python -m pip install pyyaml==6.0.3
      - name: Verify fail-closed stage and workflow controls (no Azure)
        run: |
          python -m unittest discover -s scripts/ops -p test_stage_dev_heritage_graph.py -v
          python -m unittest discover -s scripts/ops -p test_dev_reviewed21_workflow.py -v

  migrate-reviewed-21:
    name: Explicit DEV-only 21-migration stage (no deployment)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require explicit owner authority before credentials or database access
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm_dev_reviewed21 }}
          SYNTHETIC: ${{ inputs.synthetic_dev_confirmed }}
          RECOVERABLE: ${{ inputs.backup_recovery_verified }}
          WINDOW: ${{ inputs.maintenance_window_confirmed }}
          PRIOR_RUN: ${{ inputs.rehearsal_run_id }}
          PRIOR_ARTIFACT: ${{ inputs.rehearsal_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = migrate-dev-reviewed-21
          test "$SYNTHETIC" = true
          test "$RECOVERABLE" = true
          test "$WINDOW" = true
          [[ "$PRIOR_RUN" =~ ^[1-9][0-9]{5,19}$ ]]
          [[ "$PRIOR_ARTIFACT" =~ ^[1-9][0-9]{5,19}$ ]]
          test "$PRIOR_RUN" -lt "$GITHUB_RUN_ID"
          test "$GITHUB_REPOSITORY" = Arete0920/Crown-CSMS
          test "$GITHUB_REPOSITORY_ID" = 1339719218

      - name: Checkout exact accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source matches live protected main
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify source-level stage contracts before Azure login
        run: |
          python -m unittest discover -s scripts/ops -p test_stage_dev_heritage_graph.py -v
      - name: Install existing accepted backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Authenticate existing DEV identity via OIDC
        id: azure_login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply exact reviewed 21-migration plan with authenticated receipt and DB lock
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm_dev_reviewed21 }}
          SYNTHETIC: ${{ inputs.synthetic_dev_confirmed }}
          RECOVERABLE: ${{ inputs.backup_recovery_verified }}
          WINDOW: ${{ inputs.maintenance_window_confirmed }}
          PRIOR_RUN: ${{ inputs.rehearsal_run_id }}
          PRIOR_ARTIFACT: ${{ inputs.rehearsal_artifact_id }}
          CROWN_STAGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/ops/stage_dev_heritage_graph.py \
            --expected-sha "$EXPECTED_SHA" \
            --confirmation "$CONFIRM" \
            --synthetic-dev-confirmed "$SYNTHETIC" \
            --backup-recovery-verified "$RECOVERABLE" \
            --maintenance-window-confirmed "$WINDOW" \
            --rehearsal-run-id "$PRIOR_RUN" \
            --rehearsal-artifact-id "$PRIOR_ARTIFACT" \
            --evidence-path "$RUNNER_TEMP/reviewed-dev-schema-stage.json"
      - name: Preserve sanitized reviewed DEV stage result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-dev-schema-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-dev-schema-stage.json
          retention-days: 7
          if-no-files-found: warn
      - name: Logout Azure
        if: always() && steps.azure_login.outcome == 'success'
        run: az logout
