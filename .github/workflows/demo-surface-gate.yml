name: demo-surface-gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  demo-surface-static-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static Demo Surface Gate (Reachability + Wiring)
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File tools/verify_demo_surface.ps1 -Mode static
