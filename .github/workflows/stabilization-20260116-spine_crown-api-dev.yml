name: Build and deploy Python app to Azure Web App - crown-api-dev

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: crown-api-dev-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate build_info.py from GITHUB_SHA (artifact-baked)
        run: |
          echo "BUILD_SHA = \"${GITHUB_SHA}\"" > backend/crown_api/build_info.py
          python -c "import sys; sys.path.insert(0, 'backend'); from crown_api.build_info import BUILD_SHA; print('BUILD_SHA=', BUILD_SHA[:7])"

      - name: Run tests (fail fast)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
        run: |
          python manage.py test \
            crown_api.tests.test_households_api \
            crown_api.tests.test_students_api \
            crown_api.tests.test_director_router \
            crown_api.tests.test_admissions_links_api \
            crown_api.tests.test_academics_api \
            crown_api.tests.test_billing_summary_api \
            crown_api.tests.test_comms_api \
            crown_api.tests.test_scheduling_api \
            -v 0

      - name: Create deployment package
        working-directory: backend
        run: |
          zip -r ../deploy.zip . -x "*.git*" -x "*__pycache__*" -x "*.pytest_cache*" -x "*.venv*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: crown-api-dev
          slot-name: Production
          package: deploy.zip

      - name: Verify deployment (poll health until SHA matches)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -e
          URL="https://crown-api-dev.azurewebsites.net/api/health/"
          EXPECTED_SHORT="${EXPECTED_SHA:0:7}"

          echo "Expecting build_sha=${EXPECTED}"
          for i in $(seq 1 32); do
            echo "Attempt $i/32..."
            body="$(curl -fsS "$URL" || true)"
            echo "$body"
            got_full="$(echo "$body" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("build_sha") or "")')"
            got_short="${got_full:0:7}"

            if [ "$got_short" = "$EXPECTED_SHORT" ]; then
              echo "OK: deployed build_sha matches ${EXPECTED_SHORT}"
              exit 0
            fi

            sleep 15
          done

          echo "ERROR: Health never reported expected build_sha=${EXPECTED}"
          exit 1

