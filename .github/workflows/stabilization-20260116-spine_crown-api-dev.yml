name: Build and deploy Python app to Azure Web App - crown-api-dev

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: crown-api-dev-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (fail fast)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
        run: |
          python manage.py test \
            crown_api.tests.test_households_api \
            crown_api.tests.test_students_api \
            crown_api.tests.test_director_router \
            crown_api.tests.test_admissions_links_api \
            crown_api.tests.test_academics_api \
            crown_api.tests.test_billing_summary_api \
            crown_api.tests.test_comms_api \
            crown_api.tests.test_scheduling_api \
            -v 0

      - name: Create deployment package
        working-directory: backend
        run: |
          zip -r ../deploy.zip . -x "*.git*" -x "*__pycache__*" -x "*.pytest_cache*" -x "*.venv*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: crown-api-dev
          slot-name: Production
          package: deploy.zip

      - name: Set BUILD_SHA on Azure App Service
        run: |
          az webapp config appsettings set \
            --name crown-api-dev \
            --resource-group crown-rg \
            --settings BUILD_SHA=${{ github.sha }} \
            --output none

      - name: Restart to apply BUILD_SHA
        run: |
          az webapp restart \
            --name crown-api-dev \
            --resource-group crown-rg \
            --output none

      - name: Verify deployment (poll health until SHA matches)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -e
          URL="https://crown-api-dev.azurewebsites.net/health/"

          echo "Expecting build_sha=${EXPECTED_SHA}"
          for i in $(seq 1 32); do
            echo "Attempt $i/32..."
            body="$(curl -fsS "$URL" || true)"
            echo "$body"
            got="$(echo "$body" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("build_sha") or "")')"

            if [ "$got" = "$EXPECTED_SHA" ]; then
              echo "OK: deployed build_sha matches ${EXPECTED_SHA}"
              exit 0
            fi

            sleep 15
          done

          echo "ERROR: Health never reported expected build_sha=${EXPECTED_SHA}"
          exit 1



