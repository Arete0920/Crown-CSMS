name: Production Deploy

on:
  push:
    tags:
      - "prod-deploy-*"

concurrency:
  group: crown-api-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

env:
  REGISTRY: crownregistry.azurecr.io
  IMAGE_NAME: crown2026
  RESOURCE_GROUP: crown-rg
  WEBAPP_NAME: crown-api-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy_sha: ${{ steps.vars.outputs.deploy_sha }}
      deploy_sha_short: ${{ steps.vars.outputs.deploy_sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: "Guard: tag name must match prod-deploy-*"
        shell: bash
        run: |
          echo "DEPLOY_TAG=${{ github.ref_name }}"
          if [[ "${{ github.ref_name }}" != prod-deploy-* ]]; then
            echo "ERROR: refusing prod deploy; tag must start with prod-deploy-"
            exit 1
          fi

      - name: "Guard: tag required and resolvable"
        shell: pwsh
        run: |
          ./tools/require_tag_input.ps1 -Tag "${{ github.ref_name }}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine deploy SHA
        id: vars
        run: |
          echo "deploy_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "deploy_sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "DEPLOY_SHA_SHORT=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: "Guard: deploy contract ΓÇö SHA and tag must be present and valid"
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          SHA="${{ steps.vars.outputs.deploy_sha }}"
          if [[ -z "$SHA" || ${#SHA} -lt 40 ]]; then
            echo "ERROR: DEPLOY_SHA is not a full commit SHA (got: '$SHA')"
            exit 1
          fi
          if [[ -z "$TAG" ]]; then
            echo "ERROR: DEPLOY_TAG is empty ΓÇö a prod-deploy-* tag is required"
            exit 1
          fi
          echo "Γ£ô Deploy contract satisfied: TAG=$TAG SHA=${SHA:0:7}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name crownregistry --only-show-errors

      - name: Verify AcrPull Identity (Guardrail)
        run: |
          echo "Verifying Managed Identity has AcrPull on registry..."
          PRINCIPAL_ID=$(az webapp identity show -g ${{ env.RESOURCE_GROUP }} -n ${{ env.WEBAPP_NAME }} --query principalId -o tsv)
          ACR_ID=$(az acr show -n crownregistry --query id -o tsv)
          if [ -z "$PRINCIPAL_ID" ]; then
            echo "ERROR: App Service has no managed identity assigned"
            exit 1
          fi
          if ! az role assignment list --assignee $PRINCIPAL_ID --scope $ACR_ID | grep -q AcrPull; then
            echo "ERROR: Managed Identity does not have AcrPull role on ACR"
            echo "Principal: $PRINCIPAL_ID"
            echo "ACR: $ACR_ID"
            exit 1
          fi
          echo "Γ£ô AcrPull verified for ${{ env.WEBAPP_NAME }} ($PRINCIPAL_ID)"

      - name: Bake BUILD_SHA into artifact
        run: |
          echo "BUILD_SHA = \"${{ steps.vars.outputs.deploy_sha_short }}\"" > backend/crown_api/build_info.py
          echo "Γ£ô Generated build_info.py with SHA: ${{ steps.vars.outputs.deploy_sha_short }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.deploy_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull image for Trivy local scan
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.deploy_sha }}

      - name: Run security scan (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.deploy_sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results (SARIF) if present
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "trivy-results.sarif" ]; then
            echo "Found trivy-results.sarif, will upload."
          else
            echo "No trivy-results.sarif found, skipping upload."
          fi

      - name: Upload Trivy scan results (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-django

      - name: Preflight gate (Django deploy checks)
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          cd backend
          python manage.py check --deploy

      - name: Run tests
        run: |
          python manage.py test \
            crown_api.tests.test_households_api \
            crown_api.tests.test_students_api \
            crown_api.tests.test_director_router \
            crown_api.tests.test_director_actions_auth_required \
            crown_api.tests.test_admissions_links_api \
            crown_api.tests.test_academics_api \
            crown_api.tests.test_billing_summary_api \
            crown_api.tests.test_comms_api \
            crown_api.tests.test_scheduling_api \
            -v 2
          export DJANGO_SETTINGS_MODULE=crown_api.settings
          pytest --cov=. --cov-report=xml --ignore-glob='test_*.py'

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.deploy_sha }}

      - name: Build allowed appsettings JSON
        shell: pwsh
        run: |
          $settings = @{
            "BUILD_SHA"       = "${{ steps.vars.outputs.deploy_sha }}"
            "PROD_DEPLOY_TAG" = "${{ github.ref_name }}"
            "RUN_MIGRATIONS"  = "true"
            "DEPLOY_RUN_ID"   = "${{ github.run_id }}"
            "DEPLOY_WORKFLOW" = "${{ github.workflow }}"
          }
          $settings | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 appsettings.prod.json
          Get-Content appsettings.prod.json

      - name: Appsettings allowlist gate
        shell: pwsh
        run: |
          $allowed = @(
            "BUILD_SHA",
            "PROD_DEPLOY_TAG",
            "RUN_MIGRATIONS",
            "DEPLOY_RUN_ID",
            "DEPLOY_WORKFLOW"
          )
          ./tools/appsettings_allowlist_gate.ps1 -AppSettingsJsonPath "appsettings.prod.json" -AllowedKeys $allowed

      - name: Apply appsettings (allowlisted only)
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group ${{ env.RESOURCE_GROUP }} `
            --name ${{ env.WEBAPP_NAME }} `
            --settings '@appsettings.prod.json' `
            --output none `
            --only-show-errors
          az webapp restart `
            --resource-group ${{ env.RESOURCE_GROUP }} `
            --name ${{ env.WEBAPP_NAME }} `
            --only-show-errors

      - name: "Guard: verify BUILD_SHA app setting matches deployed SHA"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ steps.vars.outputs.deploy_sha }}"
          Write-Host "Verifying Azure App Settings BUILD_SHA matches deployed SHA..."
          .\tools\verify_prod_build_sha.ps1 `
            -ExpectedSha $expected `
            -AppName "${{ env.WEBAPP_NAME }}" `
            -ResourceGroup "${{ env.RESOURCE_GROUP }}"

      - name: Health check
        run: |
          sleep 30
          for i in {1..30}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.WEBAPP_NAME }}.azurewebsites.net/api/health/)
            if [ "$response" == "200" ]; then
              echo "Γ£à Health check passed"
              exit 0
            fi
            echo "Health check attempt $i - response code: $response"
            sleep 10
          done
          echo "Γ¥î Health check failed"
          exit 1

      - name: Verify deployed build_sha via /api/health/
        shell: bash
        env:
          WANT_SHA: ${{ steps.vars.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          URL="https://crown-api-prod.azurewebsites.net/api/health/"
          echo "Polling $URL for build_sha match (up to 5 min)..."
          for attempt in $(seq 1 20); do
            BODY="$(curl -fsS --max-time 10 "$URL" 2>/dev/null || true)"
            if [ -n "$BODY" ]; then
              GOT="$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('build_sha',''))" 2>/dev/null || true)"
              if [ -n "$GOT" ]; then
                if [ "$GOT" = "$WANT_SHA" ] || [ "${GOT:0:8}" = "${WANT_SHA:0:8}" ] || [ "${WANT_SHA:0:7}" = "${GOT:0:7}" ]; then
                  echo "Γ£à build_sha verified: got=$GOT want=$WANT_SHA"
                  exit 0
                else
                  echo "Attempt $attempt: MISMATCH got=$GOT want=$WANT_SHA"
                fi
              else
                echo "Attempt $attempt: build_sha missing in response"
              fi
            else
              echo "Attempt $attempt: health probe returned empty (app still starting)"
            fi
            sleep 15
          done
          echo "Γ¥î build_sha did not match after 20 attempts (300s)"
          exit 1

      - name: Verify live production build
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          HEALTH_URL="https://crown-api-prod.azurewebsites.net/api/health/"

          echo "Checking production health endpoint..."

          RESPONSE=""
          for i in {1..30}; do
            if RESPONSE=$(curl -fsSL "$HEALTH_URL"); then
              break
            fi
            echo "Waiting for container restart..."
            sleep 10
          done

          if [ -z "$RESPONSE" ]; then
            echo "No response received from health endpoint."
            exit 1
          fi

          echo "$RESPONSE"

          export RESPONSE_JSON="$RESPONSE"
          python - <<'PY'
          import json, os

          data = json.loads(os.environ["RESPONSE_JSON"])
          expected = os.environ["EXPECTED_SHA"]

          if data.get("ok") is not True:
              raise SystemExit("Health check failed: ok != true")

          if data.get("env") != "prod":
              raise SystemExit(f"Health check failed: env != prod (got {data.get('env')})")

          live_sha = data.get("build_sha")
          if live_sha != expected:
              raise SystemExit(f"Deploy mismatch: running={live_sha} expected={expected}")

          print("Production deploy verified successfully.")
          PY

      - name: Verify release identity end-to-end
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          HEALTH_URL="https://crown-api-prod.azurewebsites.net/api/health/"
          APP_NAME="crown-api-prod"
          RESOURCE_GROUP="crown-rg"

          echo "Expected SHA: $EXPECTED_SHA"

          AZURE_IMAGE=$(az webapp config container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv)

          if [ -z "$AZURE_IMAGE" ]; then
            AZURE_IMAGE=$(az webapp config container show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --query linuxFxVersion -o tsv)
          fi

          echo "Azure configured image: $AZURE_IMAGE"

          AZURE_SHA=$(echo "$AZURE_IMAGE" | sed -E 's/^DOCKER\|.*:([0-9a-f]{40})$/\1/')
          if [ -z "$AZURE_SHA" ]; then
            echo "Could not extract Azure SHA from configured image."
            exit 1
          fi

          RESPONSE=""
          for i in {1..30}; do
            if RESPONSE=$(curl -fsS "$HEALTH_URL"); then
              break
            fi
            echo "Waiting for production health..."
            sleep 10
          done

          if [ -z "$RESPONSE" ]; then
            echo "No response from /api/health/."
            exit 1
          fi

          echo "$RESPONSE"

          export RESPONSE_JSON="$RESPONSE"
          export AZURE_SHA

          python - <<'PY'
          import json, os

          data = json.loads(os.environ["RESPONSE_JSON"])
          expected = os.environ["EXPECTED_SHA"]
          azure_sha = os.environ["AZURE_SHA"]

          if data.get("ok") is not True:
              raise SystemExit("Health check failed: ok != true")

          if data.get("env") != "prod":
              raise SystemExit(f"Health check failed: env != prod (got {data.get('env')})")

          live_sha = data.get("build_sha")
          if not live_sha:
              raise SystemExit("Health check missing build_sha")

          if expected != azure_sha or azure_sha != live_sha:
              raise SystemExit(
                  f"Release identity mismatch: expected={expected} azure={azure_sha} live={live_sha}"
              )

          print("Release identity verified: workflow SHA, Azure SHA, and live SHA all match.")
          PY

      - name: Notify deployment
        if: success()
        run: |
          echo "Γ£à Deployment successful"
          echo "App URL: https://${{ env.WEBAPP_NAME }}.azurewebsites.net"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Γ¥î Deployment failed - rolling back"
          # Azure will handle automatic rollback based on health check
          exit 1

  notification:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()

    env:
      SLACK_WEBHOOK_URL: ${{ secrets['SLACK_WEBHOOK_URL'] }}

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        with:
          payload: |
            {
              "text": "Crown Academy Production Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Status:* ${{ job.status }}\n*Branch:* main\n*Commit:* ${{ needs.build-and-deploy.outputs.deploy_sha_short }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

