name: Production Rollback on Deploy Failure

on:
  workflow_run:
    workflows:
      - "Production Deploy"
      - "Production Deploy (Dispatch v2)"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: prod-rollback-on-failure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOURCE_GROUP: crown-rg
      WEBAPP_NAME: crown-api-prod
      REGISTRY: crownregistry.azurecr.io
      REGISTRY_NAME: crownregistry
      IMAGE_NAME: crown2026
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard trusted upstream context
        shell: bash
        run: |
          set -euo pipefail
          SRC_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
          THIS_REPO="${{ github.repository }}"
          if [[ "$SRC_REPO" != "$THIS_REPO" ]]; then
            echo "ERROR: upstream workflow_run repository mismatch ($SRC_REPO != $THIS_REPO)"
            exit 1
          fi
          if [[ ! "$FAILED_RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: missing or invalid workflow_run head_sha: '$FAILED_RUN_SHA'"
            exit 1
          fi
          echo "Trusted failed deploy context verified: run=$FAILED_RUN_ID sha=$FAILED_RUN_SHA"

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Recheck live health before rollback
        id: health_recheck
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/api/health/"
          HTTP_CODE=$(curl --max-time 15 -sS -o /tmp/pre_rollback_health.json -w "%{http_code}" "$HEALTH_URL" || true)
          DB_STATUS=$(jq -r '.db // ""' /tmp/pre_rollback_health.json 2>/dev/null || true)
          LIVE_SHA=$(jq -r '.build_sha // ""' /tmp/pre_rollback_health.json 2>/dev/null || true)

          echo "pre_rollback_http=$HTTP_CODE"
          echo "pre_rollback_db=$DB_STATUS"
          echo "pre_rollback_build_sha=$LIVE_SHA"

          if [[ "$HTTP_CODE" == "200" && "$DB_STATUS" == "ok" ]]; then
            echo "rollback_needed=false" >> "$GITHUB_OUTPUT"
            echo "health_status=healthy" >> "$GITHUB_OUTPUT"
            echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
            echo "Runtime remains healthy; rollback is not required."
          else
            echo "rollback_needed=true" >> "$GITHUB_OUTPUT"
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
            echo "Runtime is unhealthy or unavailable; immutable rollback is required."
          fi

      - name: Resolve last-known-good immutable deploy SHA
        id: rollback_target
        if: ${{ steps.health_recheck.outputs.rollback_needed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=success&per_page=100"
          curl --max-time 30 -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RUNS_URL" > /tmp/successful_runs.json

          ROLLBACK_ROW=$(jq -r \
            --arg failed_sha "$FAILED_RUN_SHA" \
            --arg failed_created "$FAILED_RUN_CREATED_AT" \
            '[.workflow_runs[]
              | select(.name == "Production Deploy" or .name == "Production Deploy (Dispatch v2)")
              | select(.conclusion == "success")
              | select(.head_sha != $failed_sha)
              | select(.created_at < $failed_created)
              | select(.head_sha | test("^[0-9a-f]{40}$"))]
             | sort_by(.created_at)
             | reverse
             | .[0]
             | if . == null then empty else [.head_sha, (.id|tostring), .html_url, .created_at] | @tsv end' \
            /tmp/successful_runs.json)

          if [[ -z "$ROLLBACK_ROW" ]]; then
            echo "ERROR: no previous successful immutable production deployment was found."
            exit 1
          fi

          IFS=$'\t' read -r ROLLBACK_SHA SOURCE_RUN_ID SOURCE_RUN_URL SOURCE_CREATED_AT <<< "$ROLLBACK_ROW"
          if [[ ! "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: resolved rollback SHA is invalid: '$ROLLBACK_SHA'"
            exit 1
          fi

          TAG_EXISTS=$(az acr repository show-tags \
            --name "$REGISTRY_NAME" \
            --repository "$IMAGE_NAME" \
            --query "[?@=='$ROLLBACK_SHA'] | [0]" \
            -o tsv \
            --only-show-errors)
          if [[ "$TAG_EXISTS" != "$ROLLBACK_SHA" ]]; then
            echo "ERROR: immutable rollback image is unavailable: $REGISTRY/$IMAGE_NAME:$ROLLBACK_SHA"
            exit 1
          fi

          echo "rollback_sha=$ROLLBACK_SHA" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_run_url=$SOURCE_RUN_URL" >> "$GITHUB_OUTPUT"
          echo "source_created_at=$SOURCE_CREATED_AT" >> "$GITHUB_OUTPUT"
          echo "Resolved immutable rollback target: sha=$ROLLBACK_SHA source_run=$SOURCE_RUN_ID"

      - name: Restore immutable last-known-good image
        id: restore
        if: ${{ steps.health_recheck.outputs.rollback_needed == 'true' }}
        shell: bash
        env:
          ROLLBACK_SHA: ${{ steps.rollback_target.outputs.rollback_sha }}
        run: |
          set -euo pipefail
          IMAGE_REF="$REGISTRY/$IMAGE_NAME:$ROLLBACK_SHA"
          echo "Restoring immutable image $IMAGE_REF"

          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-registry-server-url "https://$REGISTRY" \
            --docker-custom-image-name "$IMAGE_REF" \
            --output none \
            --only-show-errors

          az webapp config appsettings set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings BUILD_SHA="$ROLLBACK_SHA" \
            --output none \
            --only-show-errors

          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Verify restored runtime identity and health
        id: verify
        if: ${{ steps.health_recheck.outputs.rollback_needed == 'true' }}
        shell: bash
        env:
          ROLLBACK_SHA: ${{ steps.rollback_target.outputs.rollback_sha }}
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/api/health/"

          for attempt in $(seq 1 30); do
            HTTP_CODE=$(curl --max-time 20 -sS -o /tmp/rollback_health.json -w "%{http_code}" "$HEALTH_URL" || true)
            DB_STATUS=$(jq -r '.db // ""' /tmp/rollback_health.json 2>/dev/null || true)
            LIVE_SHA=$(jq -r '.build_sha // ""' /tmp/rollback_health.json 2>/dev/null || true)

            if [[ "$HTTP_CODE" == "200" && "$DB_STATUS" == "ok" && "$LIVE_SHA" == "$ROLLBACK_SHA" ]]; then
              echo "Rollback verification passed: http=200 db=ok build_sha=$LIVE_SHA"
              echo "verified_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt/30: http=$HTTP_CODE db=$DB_STATUS build_sha=$LIVE_SHA expected=$ROLLBACK_SHA"
            sleep 10
          done

          echo "ERROR: immutable rollback did not restore the expected healthy runtime identity."
          cat /tmp/rollback_health.json 2>/dev/null || true
          exit 1

      - name: Open incident or advisory issue
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          HEALTH_STATUS: ${{ steps.health_recheck.outputs.health_status }}
          ROLLBACK_NEEDED: ${{ steps.health_recheck.outputs.rollback_needed }}
          PRE_ROLLBACK_SHA: ${{ steps.health_recheck.outputs.live_sha }}
          ROLLBACK_SHA: ${{ steps.rollback_target.outputs.rollback_sha }}
          SOURCE_RUN_ID: ${{ steps.rollback_target.outputs.source_run_id }}
          SOURCE_RUN_URL: ${{ steps.rollback_target.outputs.source_run_url }}
          RESTORED_IMAGE: ${{ steps.restore.outputs.image_ref }}
          VERIFIED_SHA: ${{ steps.verify.outputs.verified_sha }}
        with:
          script: |
            const timestamp = new Date().toISOString();
            const rollbackNeeded = process.env.ROLLBACK_NEEDED === 'true';
            const rollbackVerified = Boolean(process.env.VERIFIED_SHA);
            const upstreamUrl = context.payload.workflow_run?.html_url;

            let title;
            let labels;
            let summary;

            if (!rollbackNeeded && process.env.HEALTH_STATUS === 'healthy') {
              title = `[ADVISORY] Prod deploy failed but runtime remained healthy (${timestamp})`;
              labels = ['production-advisory'];
              summary = [
                'The production deployment workflow failed, but the live runtime remained healthy.',
                '**Rollback was skipped because production was not demonstrably unhealthy.**'
              ];
            } else if (rollbackVerified) {
              title = `[INCIDENT] Prod deploy failed — immutable rollback verified (${timestamp})`;
              labels = ['production-alert', 'incident', 'rollback-executed'];
              summary = [
                'The failed deployment left the runtime unhealthy or unavailable.',
                'CROWN restored a previously successful immutable image and verified exact runtime identity.'
              ];
            } else {
              title = `[INCIDENT] Prod deploy failed — rollback not verified (${timestamp})`;
              labels = ['production-alert', 'incident', 'rollback-failed'];
              summary = [
                'The failed deployment left the runtime unhealthy or unavailable.',
                '**Automated immutable rollback did not complete with verified health and build identity.**',
                'Manual incident control is required immediately.'
              ];
            }

            const body = [
              `Upstream workflow: ${context.payload.workflow_run?.name}`,
              `Upstream run: ${upstreamUrl}`,
              `Failed candidate SHA: ${context.payload.workflow_run?.head_sha}`,
              `Pre-rollback live SHA: ${process.env.PRE_ROLLBACK_SHA || '(unavailable)'}`,
              '',
              '## Summary',
              ...summary,
              '',
              '## Recovery Evidence',
              `- Rollback required: ${rollbackNeeded}`,
              `- Last-known-good source run: ${process.env.SOURCE_RUN_URL || '(not applicable or unresolved)'}`,
              `- Last-known-good source run ID: ${process.env.SOURCE_RUN_ID || '(not applicable or unresolved)'}`,
              `- Immutable rollback SHA: ${process.env.ROLLBACK_SHA || '(not applicable or unresolved)'}`,
              `- Restored image: ${process.env.RESTORED_IMAGE || '(not applicable or unresolved)'}`,
              `- Verified live SHA: ${process.env.VERIFIED_SHA || '(not verified)'}`,
              '',
              '## Required Follow-up',
              '- Review the original deployment failure before another production attempt.',
              '- Reconcile this incident with issue #1270 and the release authority evidence.',
              '- Do not report production recovery as proven unless the verified live SHA is present above.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels
            });
