name: Production Rollback on Deploy Failure

on:
  workflow_run:
    workflows:
      - "Production Deploy"
      - "Production Deploy (Dispatch v2)"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: crown-api-prod-deploy
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      RESOURCE_GROUP: crown-rg
      WEBAPP_NAME: crown-api-prod
      REGISTRY: crownregistry.azurecr.io
      REGISTRY_NAME: crownregistry
      IMAGE_NAME: crown2026
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FAILED_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard trusted upstream context
        shell: bash
        run: |
          set -euo pipefail
          SRC_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
          THIS_REPO="${{ github.repository }}"
          if [[ "$SRC_REPO" != "$THIS_REPO" ]]; then
            echo "ERROR: upstream workflow_run repository mismatch ($SRC_REPO != $THIS_REPO)"
            exit 1
          fi
          if [[ ! "$FAILED_RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: missing or invalid workflow_run head_sha: '$FAILED_RUN_SHA'"
            exit 1
          fi
          echo "Trusted failed deploy context verified: run=$FAILED_RUN_ID sha=$FAILED_RUN_SHA"

      - name: Classify upstream production mutation
        id: upstream_evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { productionMutation } = require('./scripts/ops/deployment_incident.cjs');
            const run = context.payload.workflow_run;
            core.setOutput('production_mutation', 'unknown');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            core.setOutput('production_mutation', productionMutation(jobs));

      - name: Recheck live health before rollback
        id: health_recheck
        env:
          PRODUCTION_MUTATION: ${{ steps.upstream_evidence.outputs.production_mutation }}
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/api/health/"
          rm -f /tmp/pre_rollback_health.json
          HTTP_CODE=$(curl --max-time 15 -sS -o /tmp/pre_rollback_health.json -w "%{http_code}" "$HEALTH_URL" || true)
          DB_STATUS=$(jq -r '.db // ""' /tmp/pre_rollback_health.json 2>/dev/null || true)
          LIVE_SHA=$(jq -r '.build_sha // ""' /tmp/pre_rollback_health.json 2>/dev/null || true)

          echo "pre_rollback_http=$HTTP_CODE"
          echo "pre_rollback_db=$DB_STATUS"
          echo "pre_rollback_build_sha=$LIVE_SHA"

          if [[ "$HTTP_CODE" == "200" && "$DB_STATUS" == "ok" ]]; then
            echo "rollback_needed=false" >> "$GITHUB_OUTPUT"
            echo "health_status=healthy" >> "$GITHUB_OUTPUT"
            echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
            echo "Runtime observed healthy; this probe does not establish recovery."
          else
            if [[ "$HTTP_CODE" =~ ^[1-5][0-9]{2}$ ]]; then
              echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            else
              echo "health_status=unknown" >> "$GITHUB_OUTPUT"
            fi
            echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
            if [[ "$PRODUCTION_MUTATION" == "possible" ]]; then
              echo "rollback_needed=true" >> "$GITHUB_OUTPUT"
              echo "Possible production mutation and failed health probe require immutable recovery."
            else
              echo "rollback_needed=unknown" >> "$GITHUB_OUTPUT"
              echo "No candidate rollback authorized without evidence of possible production mutation."
            fi
          fi
          if [[ "$PRODUCTION_MUTATION" == "no" ]]; then
            echo "rollback_needed=false" >> "$GITHUB_OUTPUT"
            echo "Both mutation jobs skipped: candidate rollback is not applicable."
          fi

      - name: Azure Login
        if: ${{ steps.health_recheck.outputs.rollback_needed == 'true' }}
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve last-known-good immutable deploy SHA
        id: rollback_target
        if: ${{ steps.health_recheck.outputs.rollback_needed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ops/production_release_evidence.py resolve

      - name: Restore immutable last-known-good image
        id: restore
        if: ${{ steps.health_recheck.outputs.rollback_needed == 'true' }}
        shell: bash
        env:
          ROLLBACK_SHA: ${{ steps.rollback_target.outputs.rollback_sha }}
          IMAGE_REF: ${{ steps.rollback_target.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.rollback_target.outputs.image_digest }}
          RELEASE_TAG: ${{ steps.rollback_target.outputs.release_tag }}
          APP_VERSION: ${{ steps.rollback_target.outputs.app_version }}
          SOURCE_RUN_ID: ${{ steps.rollback_target.outputs.source_run_id }}
          DEPLOY_WORKFLOW: ${{ steps.rollback_target.outputs.deploy_workflow }}
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing verified rollback SHA"; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing verified rollback digest"; exit 1; }
          [[ "$IMAGE_REF" == "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST" ]] || { echo "Rollback target mismatch"; exit 1; }
          AVAILABLE_DIGEST=$(az acr repository show --name "$REGISTRY_NAME" \
            --image "$IMAGE_NAME@$IMAGE_DIGEST" --query digest -o tsv --only-show-errors)
          [[ "$AVAILABLE_DIGEST" == "$IMAGE_DIGEST" ]] || { echo "Verified digest is unavailable"; exit 1; }
          echo "Restoring immutable image $IMAGE_REF"

          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-registry-server-url "https://$REGISTRY" \
            --docker-custom-image-name "$IMAGE_REF" \
            --output none \
            --only-show-errors

          az webapp config appsettings set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings BUILD_SHA="$ROLLBACK_SHA" PROD_DEPLOY_TAG="$RELEASE_TAG" \
              APP_VERSION="$APP_VERSION" DEPLOY_RUN_ID="$SOURCE_RUN_ID" DEPLOY_WORKFLOW="$DEPLOY_WORKFLOW" \
            --output none \
            --only-show-errors

          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Verify restored runtime identity and health
        id: verify
        if: ${{ steps.health_recheck.outputs.rollback_needed == 'true' }}
        shell: bash
        env:
          ROLLBACK_SHA: ${{ steps.rollback_target.outputs.rollback_sha }}
          EXPECTED_IMAGE: ${{ steps.rollback_target.outputs.image_ref }}
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/api/health/"
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing verified rollback SHA"; exit 1; }
          [[ "$EXPECTED_IMAGE" == "$REGISTRY/$IMAGE_NAME@sha256:"* ]] || { echo "Missing verified rollback image"; exit 1; }
          CONFIGURED_IMAGE=$(az webapp config container show --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv)
          if [[ -z "$CONFIGURED_IMAGE" ]]; then
            CONFIGURED_IMAGE=$(az webapp config container show --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" --query linuxFxVersion -o tsv)
          fi
          [[ "${CONFIGURED_IMAGE#DOCKER|}" == "$EXPECTED_IMAGE" ]] || { echo "Restored configured digest mismatch"; exit 1; }

          for attempt in $(seq 1 30); do
            rm -f /tmp/rollback_health.json
            HTTP_CODE=$(curl --max-time 20 -sS -o /tmp/rollback_health.json -w "%{http_code}" "$HEALTH_URL" || true)
            DB_STATUS=$(jq -r '.db // ""' /tmp/rollback_health.json 2>/dev/null || true)
            LIVE_SHA=$(jq -r '.build_sha // ""' /tmp/rollback_health.json 2>/dev/null || true)
            ARTIFACT_SHA=$(jq -r '.artifact_build_sha // ""' /tmp/rollback_health.json 2>/dev/null || true)

            if [[ "$HTTP_CODE" == "200" && "$DB_STATUS" == "ok" && "$LIVE_SHA" == "$ROLLBACK_SHA" && "$ARTIFACT_SHA" == "$ROLLBACK_SHA" ]]; then
              echo "Rollback verification passed: http=200 db=ok build_sha=$LIVE_SHA"
              echo "verified_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
              echo "verified_image=$EXPECTED_IMAGE" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt/30: http=$HTTP_CODE db=$DB_STATUS build_sha=$LIVE_SHA expected=$ROLLBACK_SHA"
            sleep 10
          done

          echo "ERROR: immutable rollback did not restore the expected healthy runtime identity."
          cat /tmp/rollback_health.json 2>/dev/null || true
          exit 1

      - name: Open incident or advisory issue
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PRODUCTION_MUTATION: ${{ steps.upstream_evidence.outputs.production_mutation }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          HEALTH_STATUS: ${{ steps.health_recheck.outputs.health_status }}
          ROLLBACK_NEEDED: ${{ steps.health_recheck.outputs.rollback_needed }}
          PRE_ROLLBACK_SHA: ${{ steps.health_recheck.outputs.live_sha }}
          ROLLBACK_SHA: ${{ steps.rollback_target.outputs.rollback_sha }}
          SOURCE_RUN_ID: ${{ steps.rollback_target.outputs.source_run_id }}
          SOURCE_RUN_URL: ${{ steps.rollback_target.outputs.source_run_url }}
          RESTORED_IMAGE: ${{ steps.restore.outputs.image_ref }}
          VERIFIED_SHA: ${{ steps.verify.outputs.verified_sha }}
        with:
          script: |
            const { incidentReport } = require('./scripts/ops/deployment_incident.cjs');
            const report = incidentReport(process.env, context.payload.workflow_run, new Date().toISOString());
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, ...report
            });
