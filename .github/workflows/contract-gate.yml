name: contract-gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/dashboards/src/**"
      - "frontend/dashboards/scripts/**"
      - "tools/verify_contract_gate.py"
      - "tools/strip_bom.py"
      - ".github/workflows/contract-gate.yml"
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "frontend/dashboards/src/**"
      - "frontend/dashboards/scripts/**"
      - "tools/verify_contract_gate.py"
      - "tools/strip_bom.py"
      - ".github/workflows/contract-gate.yml"

jobs:
  contract-gate:
    name: contract-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Contract Gate
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///./ci.sqlite3
        run: |
          python tools/verify_contract_gate.py

  source-contracts:
    name: source-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install frontend deps
        working-directory: frontend/dashboards
        run: npm ci

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Contract - no UTF-8 BOM
        run: node frontend/dashboards/scripts/contract_no_bom.js

      - name: Contract - no browser storage auth reads
        working-directory: frontend/dashboards
        run: node scripts/contract_no_storage.js

      - name: Contract - no hardcoded DEMO_MODE
        run: python backend/scripts/contract_demo_mode.py

      - name: Verify no BOM via git grep
        run: |
          if git grep -Pl $'\\xef\\xbb\\xbf' -- 'frontend/dashboards/src' 'backend' 2>/dev/null | grep -q .; then
            echo "FAIL: git grep found BOM bytes"; exit 1
          fi
          echo "OK: git grep BOM check clean"
