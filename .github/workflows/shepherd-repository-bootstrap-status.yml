name: Shepherd Repository Bootstrap Status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shepherd-repository-bootstrap-status.yml
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
      CROWN_GITHUB_TOKEN: ${{ secrets.CROWN_GITHUB_TOKEN }}
    steps:
      - name: Select existing repository-administration token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          selected_name=""
          for name in GH_ADMIN_TOKEN GH_PAT GITHUB_PAT REPO_ADMIN_TOKEN CROWN_GITHUB_TOKEN; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              selected="$value"
              selected_name="$name"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "name=none" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$selected"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "name=$selected_name" >> "$GITHUB_OUTPUT"
            echo "token=$selected" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or verify private repository
        id: create
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        env:
          ADMIN_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $ADMIN_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          status="$(curl -sS -o /tmp/repo.json -w '%{http_code}' "${headers[@]}" https://api.github.com/repos/tcmegahan/shepherd-crm)"
          if [ "$status" = "200" ]; then
            visibility="$(python -c 'import json; print(json.load(open("/tmp/repo.json")).get("visibility", ""))')"
            if [ "$visibility" != "private" ]; then
              echo "result=existing_not_private" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "result=already_exists_private" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" != "404" ]; then
            echo "result=lookup_http_$status" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          payload='{"name":"shepherd-crm","description":"Shepherd CRM and CROWN CONNECT customer relationship, sales, support, implementation, and customer-success platform.","private":true,"has_issues":true,"has_projects":true,"has_wiki":false,"auto_init":true}'
          create_status="$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${headers[@]}" https://api.github.com/user/repos -d "$payload")"
          if [ "$create_status" = "201" ]; then
            echo "result=created_private" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="$(python -c 'import json; d=json.load(open("/tmp/create.json")); print(d.get("message", "unknown error"))' 2>/dev/null || echo unknown_error)"
          safe_message="${message//$'\n'/ }"
          echo "result=create_http_${create_status}_${safe_message}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report bootstrap result to governing issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_AVAILABLE: ${{ steps.token.outputs.available }}
          TOKEN_NAME: ${{ steps.token.outputs.name }}
          CREATE_RESULT: ${{ steps.create.outputs.result }}
          CREATE_OUTCOME: ${{ steps.create.outcome }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_AVAILABLE" != "true" ]; then
            body="Shepherd repository bootstrap result: **BLOCKED**. No existing repository-administration credential was configured under the checked secret names (GH_ADMIN_TOKEN, GH_PAT, GITHUB_PAT, REPO_ADMIN_TOKEN, CROWN_GITHUB_TOKEN). No secret values were read or exposed."
          else
            result="${CREATE_RESULT:-no_result}"
            body="Shepherd repository bootstrap result: **${CREATE_OUTCOME^^}**. Credential name: \`$TOKEN_NAME\` (value masked). API result: \`$result\`."
          fi
          gh issue comment 1610 --repo tcmegahan/Crown2026 --body "$body"
