name: Phase4 Gradebook Demo Proof
permissions:
  contents: read


on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/crown_api/management/commands/seed_demo_parent_gradebook.py"
      - "backend/crown_api/management/commands/proof_phase4_gradebook_demo.py"
      - "backend/**/gradebook/**"
      - ".github/workflows/phase4-gradebook-demo-proof.yml"

jobs:
  phase4-gradebook-demo-proof:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crown
          POSTGRES_PASSWORD: crown_test_pw
          POSTGRES_DB: crown_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crown -d crown_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql://crown:crown_test_pw@localhost:5432/crown_test
      CROWN_DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Migrate
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Seed demo school + parent gradebook
        run: |
          cd backend
          python manage.py seed_demo_school
          python manage.py seed_demo_parent_gradebook --verbose

      - name: Run server (background)
        run: |
          cd backend
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
          echo $! > /tmp/django.pid
          sleep 3

      - name: Health check
        run: |
          for i in $(seq 1 6); do
            curl -sf http://127.0.0.1:8000/health/ && break || sleep 2
          done

      - name: Phase4 gradebook demo proof (API)
        run: |
          cd backend
          python manage.py proof_phase4_gradebook_demo --verbose

      - name: Server log (on failure)
        if: failure()
        run: |
          echo "---- django.log (last 200 lines) ----"
          tail -200 /tmp/django.log || true

