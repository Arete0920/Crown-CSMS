name: License Audit

on:
  pull_request:
    paths:
      - backend/**
      - frontend/dashboards/**
      - services/wallet/apple-pass-service/**
      - tools/verify_license_policy.py
      - docs/security/license-policy.json
      - .github/workflows/license-audit.yml
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/dashboards/**
      - services/wallet/apple-pass-service/**
      - tools/verify_license_policy.py
      - docs/security/license-policy.json
      - .github/workflows/license-audit.yml

permissions:
  contents: read

concurrency:
  group: license-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deps and pip-licenses
        run: |
          python -m pip --version
          pip install -r requirements.txt pip-licenses==5.5.5

      - name: Export Python license report
        run: pip-licenses --format=json --output-file python-licenses.json

      - name: Enforce Python license policy
        working-directory: ${{ github.workspace }}
        run: python tools/verify_license_policy.py backend/python-licenses.json

      - name: Upload Python license artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-license-report-${{ github.run_id }}
          path: backend/python-licenses.json
          retention-days: 14
          if-no-files-found: error

  node-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Node license report
        run: npx --yes license-checker@25.0.1 --json --out node-licenses.json

      - name: Enforce Node license policy
        working-directory: ${{ github.workspace }}
        run: python tools/verify_license_policy.py frontend/dashboards/node-licenses.json

      - name: Upload Node license artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-license-report-${{ github.run_id }}
          path: frontend/dashboards/node-licenses.json
          retention-days: 14
          if-no-files-found: error

  wallet-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/wallet/apple-pass-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: services/wallet/apple-pass-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Wallet license report
        run: npx --yes license-checker@25.0.1 --json --out wallet-licenses.json

      - name: Enforce Wallet license policy
        working-directory: ${{ github.workspace }}
        run: python tools/verify_license_policy.py services/wallet/apple-pass-service/wallet-licenses.json

      - name: Upload Wallet license artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-license-report-${{ github.run_id }}
          path: services/wallet/apple-pass-service/wallet-licenses.json
          retention-days: 14
          if-no-files-found: error
