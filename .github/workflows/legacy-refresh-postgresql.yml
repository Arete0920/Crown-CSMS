name: Legacy refresh PostgreSQL replay proof
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "backend/crown_api/auth_models.py"
      - "backend/crown_api/models.py"
      - "backend/crown_api/auth_views.py"
      - "backend/crown_api/jwt_utils.py"
      - "backend/crown_api/migrations/0014_legacy_refresh_consumption.py"
      - "backend/crown_api/tests/test_auth_jwt.py"
      - "backend/crown_api/tests/test_legacy_refresh_cleanup.py"
      - ".github/workflows/legacy-refresh-postgresql.yml"

jobs:
  refresh-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crown_auth_ci
          POSTGRES_USER: crown_auth_ci
          POSTGRES_PASSWORD: fictional-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://crown_auth_ci:fictional-ci-only@localhost:5432/crown_auth_ci
      DJANGO_SECRET_KEY: fictional-ci-only-secret
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: "3.12"
      - name: Install application requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Require actual PostgreSQL and clean migrations
        run: |
          python backend/manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=crown_api.test_settings python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql"
          PY
      - name: Prove legacy refresh and real concurrency
        run: >-
          python -m pytest -q backend/crown_api/tests/test_auth_jwt.py
          backend/crown_api/tests/test_auth_rate_limit.py
          backend/crown_api/tests/test_legacy_refresh_cleanup.py
