name: Diagnose Production Deploy e57867b

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prod-deploy-failure-diagnostic-e57867b.yml"

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: e57867b198bbfd1676122d30213d3617559f869e
      DEPLOY_TAG: prod-deploy-20260726-e57867b
      ISSUE_NUMBER: "1650"
    steps:
      - name: Locate exact failed deployment
        id: run
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs?branch=${DEPLOY_TAG}&per_page=20")"
          run_id="$(jq -r --arg sha "$TARGET_SHA" --arg branch "$DEPLOY_TAG" '.workflow_runs | map(select(.head_sha == $sha and .head_branch == $branch)) | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$payload")"
          if [[ -z "$run_id" ]]; then
            echo "ERROR: exact deployment run not found" >&2
            exit 1
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r '.html_url' <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r '.conclusion // "unknown"' <<<"$run")" >> "$GITHUB_OUTPUT"

      - name: Extract first failed job and step
        id: failure
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.run.outputs.run_id }}/jobs?per_page=100")"
          failed_job_id="$(jq -r '.jobs | map(select(.conclusion == "failure")) | .[0].id // empty' <<<"$jobs")"
          failed_job_name="$(jq -r '.jobs | map(select(.conclusion == "failure")) | .[0].name // "none"' <<<"$jobs")"
          failed_step="$(jq -r '.jobs | map(select(.conclusion == "failure")) | .[0].steps | map(select(.conclusion == "failure")) | .[0].name // "none"' <<<"$jobs")"
          all_jobs="$(jq -r '.jobs[] | "- " + .name + ": **" + ((.conclusion // .status // "unknown") | ascii_upcase) + "**"' <<<"$jobs")"

          log_excerpt="No failed job log available."
          if [[ -n "$failed_job_id" ]]; then
            set +e
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${failed_job_id}/logs" > /tmp/job.log 2>/tmp/log.err
            log_rc=$?
            set -e
            if [[ $log_rc -eq 0 ]]; then
              log_excerpt="$(grep -Ei -B 8 -A 20 'error|failed|failure|exception|denied|forbidden|unauthorized|mismatch|timed out|timeout' /tmp/job.log | tail -n 120 || tail -n 120 /tmp/job.log)"
            fi
          fi

          delim_jobs="JOBS_$(date +%s%N)"
          delim_log="LOG_$(date +%s%N)"
          {
            echo "job_id=$failed_job_id"
            echo "job_name=$failed_job_name"
            echo "step_name=$failed_step"
            echo "all_jobs<<$delim_jobs"
            echo "$all_jobs"
            echo "$delim_jobs"
            echo "log_excerpt<<$delim_log"
            echo "$log_excerpt"
            echo "$delim_log"
          } >> "$GITHUB_OUTPUT"

      - name: Update diagnostic issue
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/body.md <<EOF
          Exact production deployment diagnosis for tag \`$DEPLOY_TAG\` and SHA \`$TARGET_SHA\`.

          ## Deployment run
          - run: ${{ steps.run.outputs.run_url }}
          - conclusion: **${{ steps.run.outputs.conclusion }}**
          - first failed job: **${{ steps.failure.outputs.job_name }}**
          - first failed step: **${{ steps.failure.outputs.step_name }}**

          ## All job conclusions
          ${{ steps.failure.outputs.all_jobs }}

          ## Bounded failure log excerpt
          \`\`\`text
          ${{ steps.failure.outputs.log_excerpt }}
          \`\`\`

          Parent: #1630. P0 ledger: #1640.
          EOF
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md

      - name: Enforce diagnostic completeness
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.run.outputs.conclusion }}" == "failure" ]]
          [[ "${{ steps.failure.outputs.job_name }}" != "none" ]]
          [[ "${{ steps.failure.outputs.step_name }}" != "none" ]]
