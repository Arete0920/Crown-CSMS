name: rc-gate

on:
  push:
    branches:
      - "rc/**"
  pull_request:
    branches:
      - "rc/**"

jobs:
  backend-gates:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: crown_api.settings
      SECRET_KEY: ci-not-secret
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///./ci.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Backend Gate (compile + check + migration drift)
        run: python tools/verify_backend_gate.py

      - name: Pytest Gate (RBAC + tenant + ledger invariants)
        run: python tools/verify_pytest_gate.py

      - name: "Contract Gate (55 endpoints: existence + methods)"
        run: python tools/verify_contract_gate.py

      - name: Migration Lock Gate (apply + check + showmigrations scan)
        env:
          DATABASE_URL: sqlite:///./ci_migration_lock.sqlite3
        run: python tools/verify_migration_lock_gate.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: "http://localhost:8000"
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_DEPLOY_TAG: ${{ github.ref_name }}
        run: npm run build

  ui-static-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: UI Shell Gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/verify_ui_shell_gate.ps1

      - name: GradebookRO UI Gate
        shell: pwsh
        run: |
          pwsh -File tools/verify_gradebookro_ui_gate.ps1

      - name: Routes Gate
        shell: pwsh
        run: |
          pwsh -File tools/verify_routes_gate.ps1
