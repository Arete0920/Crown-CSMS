name: Crown Full Surface Verification

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/**"
      - "backend/**"
  workflow_dispatch:
  schedule:
    # Daily at 05:00 UTC
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  full-surface-verification:
    name: Full Surface Verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend/dashboards

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Start Django backend
        working-directory: backend
        run: nohup python manage.py runserver 127.0.0.1:8000 > /tmp/django-full-surface.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --max-time 30 -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null 2>&1 || curl --max-time 30 -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1 || curl --max-time 30 -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/django-full-surface.log || true
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run full surface verification
        run: npm run verify:full

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-verification-${{ github.run_number }}-${{ github.sha }}
          path: frontend/dashboards/artifacts/verification/
          retention-days: 30
