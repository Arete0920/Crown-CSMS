name: Crown Full Surface Verification

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/**"
      - "backend/**"
  workflow_dispatch:
  schedule:
    # Daily at 05:00 UTC
    - cron: "0 5 * * *"

jobs:
  full-surface-verification:
    name: Full Surface Verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend/dashboards

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run full surface verification
        run: npm run verify:full

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-verification-${{ github.run_number }}-${{ github.sha }}
          path: frontend/dashboards/artifacts/verification/
          retention-days: 30
