name: DEV baseline components (read-only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current protected main SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact protected main
        shell: bash
        env:
          SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Compare exact rehearsal baseline, never write DEV
        env:
          SHA: ${{ inputs.expected_sha }}
        run: |
          python scripts/ops/inspect_dev_baseline_components.py \
            --expected-sha "$SHA" \
            --columns 5b3c533fdf3de6c4b015545a2049e21335ece6aed49c430a940d3565c16fcb06 \
            --rows e80c1574f64ef9445b4bd2b1f2ce3428c14e2bd1216b95cd17bfade48342fb49 \
            --combined 6e287a66d9c47d57433e0ac68769c5a318a5a4e7f283487d8cf6191dd081c996
      - name: Azure logout
        if: always()
        run: az logout || true
