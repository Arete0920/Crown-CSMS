name: SBOM Generation

on:
  pull_request:
    paths:
      - backend/**
      - frontend/dashboards/**
      - services/wallet/apple-pass-service/**
      - .github/workflows/sbom-generation.yml
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/dashboards/**
      - services/wallet/apple-pass-service/**
      - .github/workflows/sbom-generation.yml

permissions:
  contents: read

concurrency:
  group: sbom-generation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CycloneDX tool
        run: python -m pip install cyclonedx-bom==7.5.0

      - name: Generate backend SBOM
        run: cyclonedx-py requirements requirements.txt --output-file backend-sbom.cdx.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-${{ github.run_id }}
          path: backend/backend-sbom.cdx.json
          retention-days: 14
          if-no-files-found: error

  frontend-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate frontend SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file frontend-sbom.cdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sbom-${{ github.run_id }}
          path: frontend/dashboards/frontend-sbom.cdx.json
          retention-days: 14
          if-no-files-found: error

  wallet-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/wallet/apple-pass-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: services/wallet/apple-pass-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Wallet SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file wallet-sbom.cdx.json

      - name: Upload Wallet SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-sbom-${{ github.run_id }}
          path: services/wallet/apple-pass-service/wallet-sbom.cdx.json
          retention-days: 14
          if-no-files-found: error
