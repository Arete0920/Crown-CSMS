name: CROWN Release Authority Gates

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  release-authority-gates:
    name: Release authority gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare audit output marker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .crown-audit\workflow | Out-Null
          "workflow_start=$(Get-Date -Format o)" | Set-Content -Path .crown-audit\workflow\WORKFLOW_MARKER.txt -Encoding UTF8
          "head_sha=${{ github.sha }}" | Add-Content -Path .crown-audit\workflow\WORKFLOW_MARKER.txt -Encoding UTF8

      - name: Run CROWN release authority stack
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\execution\118_run_crown_release_authority_stack.ps1

      - name: List CROWN audit artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .crown-audit) {
            Get-ChildItem .crown-audit -Recurse -File | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize
          } else {
            Write-Host ".crown-audit missing"
          }

      - name: Upload CROWN audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-release-authority-audit
          path: .crown-audit/**
          if-no-files-found: error
