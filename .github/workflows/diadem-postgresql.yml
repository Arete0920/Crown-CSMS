name: Diadem Daycare PostgreSQL Safety

# Non-deploying, exact-source child custody and tenant-safety certification.
# No Azure, childcare customer records, external gateway or payment credentials.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/aftercare/**"
      - "backend/core/**"
      - "backend/tenants/**"
      - "backend/subscriptions/**"
      - ".github/workflows/diadem-postgresql.yml"
  push:
    branches: [main]
    paths:
      - "backend/aftercare/**"
      - "backend/core/**"
      - "backend/tenants/**"
      - "backend/subscriptions/**"
      - ".github/workflows/diadem-postgresql.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diadem-postgresql-safety-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diadem-postgresql:
    name: Diadem Django PostgreSQL safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: diadem_cert
          POSTGRES_USER: diadem_cert
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diadem_cert -d diadem_cert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://diadem_cert:ephemeral-ci-only@localhost:5432/diadem_cert
      DJANGO_SETTINGS_MODULE: crown_api.test_settings
      DJANGO_SECRET_KEY: ephemeral-ci-only-diadem-certification-secret-key
      CROWN_ENV: dev
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pin and display exact source
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python --version
      - name: Install canonical backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Django system checks
        run: python manage.py check --no-color
      - name: Reject untracked model changes
        run: python manage.py makemigrations --check --dry-run --no-input --no-color
      - name: Require PostgreSQL (never silently fall back to SQLite)
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql", "Diadem concurrency proof requires PostgreSQL"
          print("Verified PostgreSQL backend")
          PY
      - name: Certify daycare, Extended Care regression and real locking
        run: |
          python -m pytest -q -ra --migrations --create-db --maxfail=25 \
            backend/aftercare/tests/test_daycare_models.py \
            backend/aftercare/tests/test_daycare_policy.py \
            backend/aftercare/tests/test_daycare_checkin.py \
            backend/aftercare/tests/test_daycare_release_policy.py \
            backend/aftercare/tests/test_daycare_release.py \
            backend/aftercare/tests/test_am_pm_migration.py \
            backend/aftercare/tests/test_am_pm_sessions.py \
            backend/aftercare/tests/test_daycare_api.py \
            --junitxml=diadem-postgresql-junit.xml
      - name: Enforce executed (not skipped) PostgreSQL concurrency tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("diadem-postgresql-junit.xml")
          cases = {x.attrib["name"]: x for x in tree.iter("testcase")}
          names = [
              "test_postgresql_concurrent_arrivals_cannot_exceed_single_place",
              "test_postgresql_concurrent_staff_assignments_cannot_overlap",
              "test_postgresql_simultaneous_custody_release_has_one_winner",
          ]
          for name in names:
              case = cases.get(name)
              assert case is not None, f"Missing race proof: {name}"
              assert not any(case.find(x) is not None for x in ("skipped", "failure", "error")), (
                  f"Race proof did not pass: {name}"
              )
              print("PASS PostgreSQL race proof:", name)
          PY
