name: Deploy Dashboard (SWA)
permissions:
  contents: read

# Frontend Azure Static Web Apps deploy leg.
#
# This workflow deploys the pre-built dashboard bundle to Azure Static Web Apps.
# It supports:
#   - prod-deploy-* tags for normal release deployment
#   - manual workflow_dispatch runs when an operator needs to redeploy current main
#
# What this workflow proves:
#   - frontend/dashboards/public/build.json is written with the exact commit SHA
#     and deploy label at build time, then shipped inside dist/ to Azure SWA
#   - staticwebapp.config.json is copied from public/ to dist/ so Azure serves
#     React SPA deep links such as /login and /sandbox through index.html
#   - the certified backend identity is resolved from the version-controlled
#     docs/CURRENT_RELEASE_STATUS.md authority and verified against the live API
#     before frontend deployment
#   - the deployed Azure runtime passes the production Playwright certification
#     crawler before the workflow can finish successfully
#
# Secrets required:
#   AZURE_SWA_TOKEN  deployment token from the Azure Static Web Apps resource
#                     (Portal  SWA resource  Settings  Deployment token)
#   PROD_DASH_BASE   set this after confirming the SWA URL. Current verified
#                    CROWN SWA default host is:
#                    https://yellow-forest-0eecc8b0f.7.azurestaticapps.net
#
# Backend identity authority:
#   docs/CURRENT_RELEASE_STATUS.md must contain a full 40-character
#   "Certified release source" SHA. That version-controlled authority is used
#   for both pre-deploy live-backend validation and exact-SHA runtime certification.
#
# Tenant identity:
#   CROWN_LIVE_SCHOOL_ID or CROWN_DEMO_SCHOOL_ID must identify an active school
#   accepted by TenantHeaderRequiredMiddleware. There is intentionally no
#   hard-coded tenant fallback in this production deployment gate.
#
# 2026-06-23 endpoint correction:
#   https://crown-sandbox.azurestaticapps.net is not a Static Web App in the
#   CROWN Christian School Management Azure subscription. Do not use it.

on:
  workflow_dispatch:
    inputs:
      deploy_label:
        description: "Optional deploy label for build.json"
        required: false
        default: "manual-swa-redeploy"
      backend_deploy_tag:
        description: "Existing immutable prod-deploy-* backend tag to certify"
        required: true
        type: string
  push:
    tags:
      - "prod-deploy-*"
    paths:
      - "frontend/dashboards/**"
      - ".github/workflows/deploy-dashboard.yml"

concurrency:
  group: crown-dashboard-swa-deploy-${{ github.ref_type }}
  cancel-in-progress: true

jobs:
  resolve-certified-backend:
    name: "Resolve certified backend identity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected_api_sha: ${{ steps.release-authority.outputs.expected_api_sha }}

    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve certified backend SHA from canonical release status
        id: release-authority
        shell: bash
        env:
          MANUAL_BACKEND_DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_deploy_tag || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          manual_tag = os.environ.get("MANUAL_BACKEND_DEPLOY_TAG", "").strip()
          if manual_tag:
              if not re.fullmatch(r"prod-deploy-[A-Za-z0-9._-]+", manual_tag):
                  raise SystemExit(
                      "ERROR: backend_deploy_tag must match prod-deploy-*."
                  )
              try:
                  sha = subprocess.check_output(
                      ["git", "rev-parse", f"refs/tags/{manual_tag}^{{commit}}"],
                      text=True,
                  ).strip().lower()
              except subprocess.CalledProcessError as exc:
                  raise SystemExit(
                      f"ERROR: backend deployment tag is not resolvable: {manual_tag}"
                  ) from exc
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(
                      "ERROR: backend deployment tag did not resolve to a full commit SHA."
                  )
              print(f"Manual backend authority resolved: {manual_tag} -> {sha[:7]}")
          else:
              status_path = Path("docs/CURRENT_RELEASE_STATUS.md")
              text = status_path.read_text(encoding="utf-8")
              match = re.search(
                  r"\*\*Certified release source:\*\* `([0-9a-fA-F]{40})`",
                  text,
              )
              if not match:
                  raise SystemExit(
                      "ERROR: docs/CURRENT_RELEASE_STATUS.md does not contain a full "
                      "40-character Certified release source SHA."
                  )
              sha = match.group(1).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"expected_api_sha={sha}\n")
          print(f"Certified backend authority resolved: {sha[:7]}")
          PY

  build-and-deploy:
    name: "Build + deploy dashboard  ${{ github.ref_name }}"
    needs: resolve-certified-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve deploy SHA and label
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${GITHUB_REF_TYPE:-}"
          INPUT_LABEL="${{ github.event.inputs.deploy_label || '' }}"

          if [[ -z "$SHA" || ${#SHA} -lt 40 ]]; then
            echo "ERROR: could not resolve full commit SHA (got: '$SHA')"
            exit 1
          fi

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != prod-deploy-* ]]; then
              echo "ERROR: tag must start with prod-deploy- (got: '$REF_NAME')"
              exit 1
            fi
            DEPLOY_LABEL="$REF_NAME"
          elif [[ -n "$INPUT_LABEL" ]]; then
            DEPLOY_LABEL="$INPUT_LABEL"
          else
            DEPLOY_LABEL="main-swa-${SHA:0:12}"
          fi

          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=$DEPLOY_LABEL" >> "$GITHUB_ENV"
          echo "Deploy contract: REF_TYPE=$REF_TYPE REF=$REF_NAME LABEL=$DEPLOY_LABEL SHA=${SHA:0:7}"

      - name: Validate exact backend identity before deploy
        shell: bash
        env:
          EXPECTED_API_SHA: ${{ needs.resolve-certified-backend.outputs.expected_api_sha }}
          API_URL: ${{ vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
          TENANT_HEADER_SCHOOL_ID: ${{ vars.CROWN_LIVE_SCHOOL_ID || vars.CROWN_DEMO_SCHOOL_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_API_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: canonical release status must resolve a full 40-character approved backend SHA."
            echo "Refusing to deploy a new frontend without an independently controlled backend identity for exact-SHA certification."
            exit 1
          fi
          if [[ -z "${TENANT_HEADER_SCHOOL_ID:-}" ]]; then
            echo "ERROR: CROWN_LIVE_SCHOOL_ID or CROWN_DEMO_SCHOOL_ID must be configured for the tenant-aware backend identity check."
            echo "Refusing to deploy because /api/v1/version/ is tenant-header protected and no verified tenant identity was supplied."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_url = os.environ["API_URL"].rstrip("/")
          expected = os.environ["EXPECTED_API_SHA"].strip().lower()
          school_id = os.environ["TENANT_HEADER_SCHOOL_ID"].strip()
          headers = {
              "Accept": "application/json",
              "X-School-Id": school_id,
          }

          version_url = f"{api_url}/api/v1/version/"
          request = urllib.request.Request(version_url, headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  body = response.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              if exc.code in (400, 404):
                  raise SystemExit(
                      "ERROR: tenant-aware backend identity check rejected the configured school ID "
                      f"with HTTP {exc.code}; verify CROWN_LIVE_SCHOOL_ID/CROWN_DEMO_SCHOOL_ID. "
                      f"Response: {body[:300]}"
                  ) from exc
              raise SystemExit(
                  f"ERROR: deployed backend identity check returned HTTP {exc.code}: {body[:300]}"
              ) from exc
          except OSError as exc:
              raise SystemExit(f"ERROR: deployed backend identity check failed: {exc}") from exc

          if status != 200:
              raise SystemExit(f"ERROR: deployed backend identity check returned HTTP {status}")
          payload = json.loads(body)
          actual = str(payload.get("build_sha") or "").strip().lower()
          if len(actual) != 40:
              raise SystemExit(
                  f"ERROR: deployed backend did not report a full build SHA; actual={actual!r}"
              )
          if actual != expected:
              raise SystemExit(
                  f"ERROR: deployed backend SHA mismatch before frontend deploy: expected={expected} actual={actual}"
              )
          print(f"Deployed backend identity verified before frontend deploy: {actual[:7]}")
          PY

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        working-directory: frontend/dashboards
        run: npm ci

      - name: Write build.json
        # Writes the proof artifact into public/ so Vite copies it to dist/ as-is.
        shell: bash
        run: |
          set -euo pipefail
          printf '{"build_sha":"%s","deploy_tag":"%s"}\n' \
            "$DEPLOY_SHA" "$DEPLOY_TAG" \
            > frontend/dashboards/public/build.json
          echo "build.json written:"
          cat frontend/dashboards/public/build.json

      - name: Build
        working-directory: frontend/dashboards
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_DEPLOY_TAG: ${{ github.ref_name }}
          VITE_LAUNCH_UI_TAKEOVER: '1'
          VITE_API_BASE_URL: ${{ vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            export VITE_SANDBOX_MODE='1'
            export VITE_DEMO_MODE='sandbox'
            echo "Sandbox build env enabled for non-tag deploys"
          else
            echo "Production tag deploy: sandbox build env disabled"
          fi
          echo "Dashboard API origin configured for deployment build"
          npm run build

      - name: Verify SWA config and build.json in dist
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="frontend/dashboards/dist/build.json"
          SWA_CONFIG="frontend/dashboards/dist/staticwebapp.config.json"

          if [[ ! -f "$BUILD_FILE" ]]; then
            echo "ERROR: dist/build.json not found  Vite did not copy public/build.json"
            exit 1
          fi
          if [[ ! -f "$SWA_CONFIG" ]]; then
            echo "ERROR: dist/staticwebapp.config.json not found  Vite did not copy SWA routing config"
            exit 1
          fi

          echo "dist/build.json contents:"
          cat "$BUILD_FILE"
          echo "dist/staticwebapp.config.json navigation fallback:"
          grep -n "navigationFallback\|/login\|/sandbox" "$SWA_CONFIG"

          python3 - <<'PY'
          import json, sys
          d = json.load(open("frontend/dashboards/dist/build.json"))
          if not d.get("build_sha"):
              sys.exit("FAIL: build_sha missing or empty in dist/build.json")
          if not d.get("deploy_tag"):
              sys.exit("FAIL: deploy_tag missing or empty in dist/build.json")
          cfg = json.load(open("frontend/dashboards/dist/staticwebapp.config.json"))
          routes = cfg.get("routes") or []
          route_names = {r.get("route") for r in routes}
          required = {"/login", "/sandbox", "/sandbox/*"}
          missing = sorted(required - route_names)
          if missing:
              sys.exit(f"FAIL: staticwebapp.config.json missing SPA rewrite routes: {missing}")
          if cfg.get("navigationFallback", {}).get("rewrite") != "/index.html":
              sys.exit("FAIL: navigationFallback.rewrite must be /index.html")
          print(f"OK build_sha={d['build_sha'][:7]} deploy_tag={d['deploy_tag']}")
          PY

      - name: Validate SWA deployment token secret
        shell: bash
        env:
          SWA_TOKEN: ${{ secrets.AZURE_SWA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SWA_TOKEN:-}" ]]; then
            echo "ERROR: required secret AZURE_SWA_TOKEN is missing or empty"
            echo "Fix: GitHub repo Settings > Secrets and variables > Actions > set AZURE_SWA_TOKEN"
            exit 1
          fi
          echo "SWA token secret is present"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dashboards/dist"
          output_location: ""
          skip_app_build: true

  certify-live-azure:
    name: "Certify live Azure runtime"
    needs:
      - resolve-certified-backend
      - build-and-deploy
    uses: ./.github/workflows/production-certification-evidence.yml
    with:
      live_frontend_url: ${{ vars.CROWN_LIVE_FRONTEND_URL || 'https://yellow-forest-0eecc8b0f.7.azurestaticapps.net' }}
      live_api_base_url: ${{ vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
      expected_frontend_sha: ${{ github.sha }}
      expected_api_sha: ${{ needs.resolve-certified-backend.outputs.expected_api_sha }}
    secrets: inherit
