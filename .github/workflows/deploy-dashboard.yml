name: Deploy Dashboard (SWA)
permissions:
  contents: read

# Frontend Azure Static Web Apps deploy leg.
#
# This workflow deploys the pre-built dashboard bundle to Azure Static Web Apps.
# It supports:
#   - prod-deploy-* tags for normal release deployment
#   - manual workflow_dispatch runs when an operator needs to redeploy current main
#
# What this workflow proves:
#   - frontend/dashboards/public/build.json is written with the exact commit SHA
#     and deploy label at build time, then shipped inside dist/ to Azure SWA
#   - staticwebapp.config.json is copied from public/ to dist/ so Azure serves
#     React SPA deep links such as /login and /sandbox through index.html
#   - the certified backend identity is resolved from the version-controlled
#     docs/CURRENT_RELEASE_STATUS.md authority and verified against the live API
#     before frontend deployment
#   - the deployed Azure runtime passes the production Playwright certification
#     crawler before the workflow can finish successfully
#
# Secrets required:
#   AZURE_SWA_TOKEN  deployment token from the Azure Static Web Apps resource
#                     (Portal  SWA resource  Settings  Deployment token)
#   PROD_DASH_BASE   set this after confirming the SWA URL. Current verified
#                    CROWN SWA default host is:
#                    https://yellow-forest-0eecc8b0f.7.azurestaticapps.net
#
# Backend identity authority:
#   docs/CURRENT_RELEASE_STATUS.md must contain a full 40-character
#   "Certified release source" SHA. That version-controlled authority is used
#   for both pre-deploy live-backend validation and exact-SHA runtime certification.
#
# Tenant identity:
#   CROWN_LIVE_SCHOOL_ID or CROWN_DEMO_SCHOOL_ID must identify an active school
#   accepted by TenantHeaderRequiredMiddleware. There is intentionally no
#   hard-coded tenant fallback in this production deployment gate.
#
# 2026-06-23 endpoint correction:
#   https://crown-sandbox.azurestaticapps.net is not a Static Web App in the
#   CROWN Christian School Management Azure subscription. Do not use it.

on:
  workflow_dispatch:
    inputs:
      dev_certification_preview:
        description: "Deploy an isolated preview on the EXISTING SWA against DEV; never production"
        type: boolean
        default: false
      dev_deploy_only:
        description: "DEV preview deployment and read-only checks only; no CORS changes, browser writes or fixture creation"
        type: boolean
        default: true
      dev_source_sha:
        description: "Full accepted source SHA already deployed to DEV (preview only)"
        type: string
        required: false
      deploy_label:
        description: "Optional deploy label for build.json"
        required: false
        default: "manual-swa-redeploy"
      backend_deploy_tag:
        description: "Existing immutable prod-deploy-* backend tag to certify"
        required: false
        type: string
  push:
    tags:
      - "prod-deploy-*"
    paths:
      - "frontend/dashboards/**"
      - ".github/workflows/deploy-dashboard.yml"

concurrency:
  group: crown-dashboard-swa-deploy-${{ inputs.dev_certification_preview == true && 'dev-certification' || github.ref_type }}
  cancel-in-progress: true

jobs:
  resolve-certified-backend:
    if: inputs.dev_certification_preview != true
    name: "Resolve certified backend identity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected_api_sha: ${{ steps.release-authority.outputs.expected_api_sha }}

    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve certified backend SHA from canonical release status
        id: release-authority
        shell: bash
        env:
          REQUIRE_MANUAL_TAG: ${{ github.event_name == 'workflow_dispatch' }}
          MANUAL_BACKEND_DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_deploy_tag || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          manual_tag = os.environ.get("MANUAL_BACKEND_DEPLOY_TAG", "").strip()
          if os.environ.get("REQUIRE_MANUAL_TAG") == "true" and not manual_tag:
              raise SystemExit("ERROR: production manual deployment requires backend_deploy_tag.")
          if manual_tag:
              if not re.fullmatch(r"prod-deploy-[A-Za-z0-9._-]+", manual_tag):
                  raise SystemExit(
                      "ERROR: backend_deploy_tag must match prod-deploy-*."
                  )
              try:
                  sha = subprocess.check_output(
                      ["git", "rev-parse", f"refs/tags/{manual_tag}^{{commit}}"],
                      text=True,
                  ).strip().lower()
              except subprocess.CalledProcessError as exc:
                  raise SystemExit(
                      f"ERROR: backend deployment tag is not resolvable: {manual_tag}"
                  ) from exc
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(
                      "ERROR: backend deployment tag did not resolve to a full commit SHA."
                  )
              print(f"Manual backend authority resolved: {manual_tag} -> {sha[:7]}")
          else:
              status_path = Path("docs/CURRENT_RELEASE_STATUS.md")
              text = status_path.read_text(encoding="utf-8")
              match = re.search(
                  r"\*\*Certified release source:\*\* `([0-9a-fA-F]{40})`",
                  text,
              )
              if not match:
                  raise SystemExit(
                      "ERROR: docs/CURRENT_RELEASE_STATUS.md does not contain a full "
                      "40-character Certified release source SHA."
                  )
              sha = match.group(1).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"expected_api_sha={sha}\n")
          print(f"Certified backend authority resolved: {sha[:7]}")
          PY

  build-and-deploy:
    name: "Build + deploy dashboard  ${{ github.ref_name }}"
    needs: resolve-certified-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve deploy SHA and label
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${GITHUB_REF_TYPE:-}"
          INPUT_LABEL="${{ github.event.inputs.deploy_label || '' }}"

          if [[ -z "$SHA" || ${#SHA} -lt 40 ]]; then
            echo "ERROR: could not resolve full commit SHA (got: '$SHA')"
            exit 1
          fi

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != prod-deploy-* ]]; then
              echo "ERROR: tag must start with prod-deploy- (got: '$REF_NAME')"
              exit 1
            fi
            DEPLOY_LABEL="$REF_NAME"
          elif [[ -n "$INPUT_LABEL" ]]; then
            DEPLOY_LABEL="$INPUT_LABEL"
          else
            DEPLOY_LABEL="main-swa-${SHA:0:12}"
          fi

          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=$DEPLOY_LABEL" >> "$GITHUB_ENV"
          echo "Deploy contract: REF_TYPE=$REF_TYPE REF=$REF_NAME LABEL=$DEPLOY_LABEL SHA=${SHA:0:7}"

      - name: Validate exact backend identity before deploy
        shell: bash
        env:
          EXPECTED_API_SHA: ${{ needs.resolve-certified-backend.outputs.expected_api_sha }}
          API_URL: ${{ vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
          TENANT_HEADER_SCHOOL_ID: ${{ vars.CROWN_LIVE_SCHOOL_ID || vars.CROWN_DEMO_SCHOOL_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_API_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: canonical release status must resolve a full 40-character approved backend SHA."
            echo "Refusing to deploy a new frontend without an independently controlled backend identity for exact-SHA certification."
            exit 1
          fi
          if [[ -z "${TENANT_HEADER_SCHOOL_ID:-}" ]]; then
            echo "ERROR: CROWN_LIVE_SCHOOL_ID or CROWN_DEMO_SCHOOL_ID must be configured for the tenant-aware backend identity check."
            echo "Refusing to deploy because /api/v1/version/ is tenant-header protected and no verified tenant identity was supplied."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_url = os.environ["API_URL"].rstrip("/")
          expected = os.environ["EXPECTED_API_SHA"].strip().lower()
          school_id = os.environ["TENANT_HEADER_SCHOOL_ID"].strip()
          headers = {
              "Accept": "application/json",
              "X-School-Id": school_id,
          }

          version_url = f"{api_url}/api/v1/version/"
          request = urllib.request.Request(version_url, headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  body = response.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              if exc.code in (400, 404):
                  raise SystemExit(
                      "ERROR: tenant-aware backend identity check rejected the configured school ID "
                      f"with HTTP {exc.code}; verify CROWN_LIVE_SCHOOL_ID/CROWN_DEMO_SCHOOL_ID. "
                      f"Response: {body[:300]}"
                  ) from exc
              raise SystemExit(
                  f"ERROR: deployed backend identity check returned HTTP {exc.code}: {body[:300]}"
              ) from exc
          except OSError as exc:
              raise SystemExit(f"ERROR: deployed backend identity check failed: {exc}") from exc

          if status != 200:
              raise SystemExit(f"ERROR: deployed backend identity check returned HTTP {status}")
          payload = json.loads(body)
          actual = str(payload.get("build_sha") or "").strip().lower()
          if len(actual) != 40:
              raise SystemExit(
                  f"ERROR: deployed backend did not report a full build SHA; actual={actual!r}"
              )
          if actual != expected:
              raise SystemExit(
                  f"ERROR: deployed backend SHA mismatch before frontend deploy: expected={expected} actual={actual}"
              )
          print(f"Deployed backend identity verified before frontend deploy: {actual[:7]}")
          PY

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        working-directory: frontend/dashboards
        run: npm ci

      - name: Write build.json
        # Writes the proof artifact into public/ so Vite copies it to dist/ as-is.
        shell: bash
        run: |
          set -euo pipefail
          printf '{"build_sha":"%s","deploy_tag":"%s"}\n' \
            "$DEPLOY_SHA" "$DEPLOY_TAG" \
            > frontend/dashboards/public/build.json
          echo "build.json written:"
          cat frontend/dashboards/public/build.json

      - name: Build
        working-directory: frontend/dashboards
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_DEPLOY_TAG: ${{ github.ref_name }}
          VITE_LAUNCH_UI_TAKEOVER: '1'
          VITE_API_BASE_URL: ${{ vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            export VITE_SANDBOX_MODE='1'
            export VITE_DEMO_MODE='sandbox'
            echo "Sandbox build env enabled for non-tag deploys"
          else
            echo "Production tag deploy: sandbox build env disabled"
          fi
          echo "Dashboard API origin configured for deployment build"
          npm run build

      - name: Verify SWA config and build.json in dist
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="frontend/dashboards/dist/build.json"
          SWA_CONFIG="frontend/dashboards/dist/staticwebapp.config.json"

          if [[ ! -f "$BUILD_FILE" ]]; then
            echo "ERROR: dist/build.json not found  Vite did not copy public/build.json"
            exit 1
          fi
          if [[ ! -f "$SWA_CONFIG" ]]; then
            echo "ERROR: dist/staticwebapp.config.json not found  Vite did not copy SWA routing config"
            exit 1
          fi

          echo "dist/build.json contents:"
          cat "$BUILD_FILE"
          echo "dist/staticwebapp.config.json navigation fallback:"
          grep -n "navigationFallback\|/login\|/sandbox" "$SWA_CONFIG"

          python3 - <<'PY'
          import json, sys
          d = json.load(open("frontend/dashboards/dist/build.json"))
          if not d.get("build_sha"):
              sys.exit("FAIL: build_sha missing or empty in dist/build.json")
          if not d.get("deploy_tag"):
              sys.exit("FAIL: deploy_tag missing or empty in dist/build.json")
          cfg = json.load(open("frontend/dashboards/dist/staticwebapp.config.json"))
          routes = cfg.get("routes") or []
          route_names = {r.get("route") for r in routes}
          required = {"/login", "/sandbox", "/sandbox/*"}
          missing = sorted(required - route_names)
          if missing:
              sys.exit(f"FAIL: staticwebapp.config.json missing SPA rewrite routes: {missing}")
          if cfg.get("navigationFallback", {}).get("rewrite") != "/index.html":
              sys.exit("FAIL: navigationFallback.rewrite must be /index.html")
          print(f"OK build_sha={d['build_sha'][:7]} deploy_tag={d['deploy_tag']}")
          PY

      - name: Validate SWA deployment token secret
        shell: bash
        env:
          SWA_TOKEN: ${{ secrets.AZURE_SWA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SWA_TOKEN:-}" ]]; then
            echo "ERROR: required secret AZURE_SWA_TOKEN is missing or empty"
            echo "Fix: GitHub repo Settings > Secrets and variables > Actions > set AZURE_SWA_TOKEN"
            exit 1
          fi
          echo "SWA token secret is present"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dashboards/dist"
          output_location: ""
          skip_app_build: true

  certify-live-azure:
    name: "Certify live Azure runtime"
    needs:
      - resolve-certified-backend
      - build-and-deploy
    uses: ./.github/workflows/production-certification-evidence.yml
    with:
      live_frontend_url: ${{ vars.CROWN_LIVE_FRONTEND_URL || 'https://yellow-forest-0eecc8b0f.7.azurestaticapps.net' }}
      live_api_base_url: ${{ vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
      expected_frontend_sha: ${{ github.sha }}
      expected_api_sha: ${{ needs.resolve-certified-backend.outputs.expected_api_sha }}
    secrets: inherit

  dev-certification-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.dev_certification_preview == true
    name: Existing SWA DEV certification preview
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    steps:
      - name: Validate pinned DEV source
        env:
          SOURCE_SHA: ${{ inputs.dev_source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full DEV source SHA required'; exit 1; }
          python3 - <<'PYCODE'
          import json, os, urllib.request
          with urllib.request.urlopen('https://crown-api-dev.azurewebsites.net/api/health/', timeout=30) as response:
              payload = json.load(response)
              assert response.status == 200
          expected = os.environ['SOURCE_SHA']
          assert payload.get('build_sha') == expected, 'DEV build SHA mismatch'
          assert payload.get('artifact_build_sha') == expected, 'DEV artifact SHA mismatch'
          assert payload.get('db') == 'ok', 'DEV database unhealthy'
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.dev_source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact current protected main
        env:
          SOURCE_SHA: ${{ inputs.dev_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$SOURCE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo 'BLOCKED: DEV preview must use exact current protected main, not a stale ancestor' >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/dashboards/package-lock.json
      - name: Build pinned frontend for DEV
        working-directory: frontend/dashboards
        env:
          VITE_API_BASE_URL: https://crown-api-dev.azurewebsites.net
          SOURCE_SHA: ${{ inputs.dev_source_sha }}
          VITE_BUILD_SHA: ${{ inputs.dev_source_sha }}
          CROWN_DEPLOY_TAG: dev-certification-preview
          VITE_DEPLOY_TAG: dev-certification-preview
          VITE_SANDBOX_MODE: '1'
          VITE_DEMO_MODE: sandbox
          VITE_LAUNCH_UI_TAKEOVER: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" npm run build
          python3 - <<'PYCODE'
          import json, os
          with open('dist/build.json') as source:
              assert json.load(source)['build_sha'] == os.environ['SOURCE_SHA'], 'Frontend build identity mismatch'
          PYCODE
      - name: Authenticate existing Azure DEV deployment identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve existing SWA credential without persisting it
        id: swa
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          def az(*args):
              return subprocess.check_output(['az', *args, '--only-show-errors', '--output', 'json'], text=True)
          apps = json.loads(az('staticwebapp', 'list', '--resource-group', 'crown-rg'))
          matches = [app for app in apps if app.get('defaultHostname') == 'yellow-forest-0eecc8b0f.7.azurestaticapps.net']
          assert len(matches) == 1, 'Exactly one existing CROWN SWA must match; refusing to create resources'
          result = json.loads(az('staticwebapp', 'secrets', 'list', '--resource-group', 'crown-rg', '--name', matches[0]['name']))
          token = result.get('properties', {}).get('apiKey', '')
          assert token and '\n' not in token and '\r' not in token, 'Existing SWA deployment token unavailable'
          print('::add-mask::' + token)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('token=' + token + '\n')
          PYCODE
      - name: Recheck exact main before preview upload
        env:
          SOURCE_SHA: ${{ inputs.dev_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$SOURCE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo 'BLOCKED: DEV preview must use exact current protected main, not a stale ancestor' >&2
            exit 1
          fi
      - name: Deploy preview on existing SWA only
        id: preview
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dashboards/dist
          output_location: ''
          skip_app_build: true
          deployment_environment: dev-certification
      - name: Configure exact owned DEV preview origin
        if: toJSON(inputs.dev_deploy_only) == 'false'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.static_web_app_url }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from urllib.parse import urlsplit
          origin = os.environ['PREVIEW_URL'].rstrip('/')
          expected = 'https://yellow-forest-0eecc8b0f-devcertification.eastus2.7.azurestaticapps.net'
          assert origin == expected, 'Unexpected preview origin; refusing DEV CORS mutation'
          command = ['az', 'webapp', 'config', 'appsettings']
          target = ['--resource-group', 'crown-rg', '--name', 'crown-api-dev', '--only-show-errors']
          settings = json.loads(subprocess.check_output(command + ['list', *target, '--output', 'json'], text=True))
          current = {row['name']: row['value'] for row in settings}
          safe_names = ('ENVIRONMENT', 'CROWN_ENV', 'DJANGO_ENV', 'CROWN_SANDBOX_ALLOW_OPEN_SESSION')
          print('DEV runtime markers: ' + json.dumps({name: current.get(name, '<unset>') for name in safe_names}, sort_keys=True))
          cors = [value.strip() for value in current.get('CORS_ALLOWED_ORIGINS', '').split(',') if value.strip()]
          raw = current.get('CSRF_TRUSTED_ORIGINS', '')
          csrf = json.loads(raw) if raw.startswith('[') else ([raw] if raw else [])
          changed = origin not in cors or origin not in csrf
          for values in (cors, csrf):
              if origin not in values: values.append(origin)
          if changed:
              payload = {'CORS_ALLOWED_ORIGINS': ','.join(cors), 'CSRF_TRUSTED_ORIGINS': json.dumps(csrf)}
              with open('appsettings.dev-preview.json', 'w') as out: json.dump(payload, out)
          print('Exact owned preview origin requires update' if changed else 'Exact owned preview origin already configured')
          PYCODE
          if [ -f appsettings.dev-preview.json ]; then
            git show "$WORKFLOW_SHA:tools/appsettings_allowlist.keys.json" > appsettings.preview.allowlist.json
            git show "$WORKFLOW_SHA:tools/appsettings_allowlist.keys.json.sha256" > appsettings.preview.allowlist.json.sha256
            pwsh -NoProfile -File tools/appsettings_allowlist_gate.ps1 -AppSettingsJsonPath appsettings.dev-preview.json -AllowedKeysFile appsettings.preview.allowlist.json -AllowedKeySet dev
            az webapp config appsettings set --resource-group crown-rg --name crown-api-dev --settings @appsettings.dev-preview.json --output none --only-show-errors
          fi
      - name: Verify pinned DEV API and existing CORS
        env:
          SOURCE_SHA: ${{ inputs.dev_source_sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.static_web_app_url }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          for attempt in range(36):
              try:
                  with urllib.request.urlopen('https://crown-api-dev.azurewebsites.net/api/health/', timeout=15) as response:
                      payload = json.load(response)
                  preflight = urllib.request.Request('https://crown-api-dev.azurewebsites.net/api/v1/nav/', method='OPTIONS', headers={'Origin': os.environ['PREVIEW_URL'].rstrip('/'), 'Access-Control-Request-Method': 'GET', 'Access-Control-Request-Headers': 'authorization,x-school-id'})
                  with urllib.request.urlopen(preflight, timeout=15) as response:
                      cors_ready = response.headers.get('Access-Control-Allow-Origin') == os.environ['PREVIEW_URL'].rstrip('/') and response.headers.get('Access-Control-Allow-Credentials') == 'true'
                  if cors_ready and payload.get('build_sha') == os.environ['SOURCE_SHA'] and payload.get('artifact_build_sha') == os.environ['SOURCE_SHA'] and payload.get('db') == 'ok':
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('DEV did not recover matching healthy runtime after origin configuration')
          PYCODE
      - name: Verify deployed DEV frontend identity without writes
        env:
          SOURCE_SHA: ${{ inputs.dev_source_sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.static_web_app_url }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          expected_origin = 'https://yellow-forest-0eecc8b0f-devcertification.eastus2.7.azurestaticapps.net'
          origin = os.environ['PREVIEW_URL'].rstrip('/')
          if origin != expected_origin:
              raise SystemExit('Unexpected DEV preview origin')
          expected_url = origin + '/build.json'
          with urllib.request.urlopen(expected_url, timeout=30) as response:
              if response.geturl() != expected_url:
                  raise SystemExit('DEV preview build identity redirected')
              payload = json.load(response)
              if response.status != 200 or payload.get('build_sha') != os.environ['SOURCE_SHA']:
                  raise SystemExit('Deployed DEV frontend identity mismatch')
          print('DEV frontend identity verified; runtime journeys require separate certification')
          PYCODE
      - name: Load pinned DEV evidence exporter
        id: dev-evidence-exporter
        if: toJSON(inputs.dev_deploy_only) == 'false'
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          source = os.environ['WORKFLOW_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('Invalid evidence exporter source')
          paths = (
              'frontend/dashboards/scripts/browser-evidence-schema.mjs',
              'frontend/dashboards/scripts/dev-browser-evidence-reporter.mjs',
              'frontend/dashboards/scripts/run-dev-browser-evidence.mjs',
              'frontend/dashboards/playwright.dev-evidence.config.ts',
          )
          # Resolve every pinned file before replacing any checkout file.
          resolved = [(Path(path), subprocess.check_output(['git', 'show', source + ':' + path])) for path in paths]
          for path, content in resolved:
              path.write_bytes(content)
          PYCODE
      - name: Install existing Playwright browser
        if: toJSON(inputs.dev_deploy_only) == 'false'
        working-directory: frontend/dashboards
        run: npx playwright install chromium --with-deps
      - name: Execute existing live certification against DEV preview
        id: dev-certification-evidence
        if: toJSON(inputs.dev_deploy_only) == 'false' && steps.dev-evidence-exporter.outcome == 'success'
        working-directory: frontend/dashboards
        env:
          CI: '1'
          CROWN_CERTIFICATION_LIVE_RUNTIME: '1'
          CROWN_EXPECTED_FRONTEND_SHA: ${{ inputs.dev_source_sha }}
          CROWN_EXPECTED_API_SHA: ${{ inputs.dev_source_sha }}
          CROWN_LIVE_FRONTEND_URL: ${{ steps.preview.outputs.static_web_app_url }}
          CROWN_LIVE_API_BASE_URL: https://crown-api-dev.azurewebsites.net
          CROWN_CERTIFICATION_TENANT_MODE: sandbox
          CROWN_LIVE_USE_SANDBOX_CREDENTIALS: '1'
          CROWN_EVIDENCE_RUNTIME_SHA: ${{ inputs.dev_source_sha }}
          CROWN_EVIDENCE_TEST_SHA: ${{ inputs.dev_source_sha }}
          CROWN_EVIDENCE_EXPORTER_SHA: ${{ github.sha }}
        run: |
          test -n "$CROWN_LIVE_FRONTEND_URL"
          node scripts/run-dev-browser-evidence.mjs --suite certification
      - name: Upload DEV execution evidence
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.dev-certification-evidence.outputs.evidence_valid == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-certification-${{ inputs.dev_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.dev-certification-evidence.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Execute existing buyer persistence journeys on DEV
        id: dev-buyer-evidence
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.preview.outcome == 'success' && steps.dev-evidence-exporter.outcome == 'success'
        working-directory: frontend/dashboards
        env:
          CI: '1'
          CROWN_LIVE_FRONTEND_URL: ${{ steps.preview.outputs.static_web_app_url }}
          CROWN_LIVE_API_BASE_URL: https://crown-api-dev.azurewebsites.net
          CROWN_BROWSER_AUTHORITY_OUTPUT: test-results/buyer-sandbox-browser-authority.json
          CROWN_REHEARSAL_TEST_SHA: ${{ github.sha }}
          CROWN_EVIDENCE_RUNTIME_SHA: ${{ inputs.dev_source_sha }}
          CROWN_EVIDENCE_TEST_SHA: ${{ github.sha }}
          CROWN_EVIDENCE_EXPORTER_SHA: ${{ github.sha }}
        run: |
          git show "$CROWN_REHEARSAL_TEST_SHA:frontend/dashboards/tests/certification/buyer-sandbox-browser-authority.spec.ts" > tests/certification/buyer-sandbox-browser-authority.spec.ts
          node scripts/run-dev-browser-evidence.mjs --suite buyer
      - name: Upload DEV buyer persistence evidence
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.preview.outcome == 'success' && steps.dev-buyer-evidence.outputs.evidence_valid == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-buyer-persistence-${{ inputs.dev_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.dev-buyer-evidence.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Set up existing backend fixture runtime
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.preview.outcome == 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install accepted backend dependencies for synthetic fixtures
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.preview.outcome == 'success'
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare two synthetic DEV tenants using existing models
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.preview.outcome == 'success'
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.dev_source_sha }}
          CROWN_DEV_TENANT_FIXTURE: ${{ runner.temp }}/crown-dev-tenant-fixtures.json
        run: |
          git show "$WORKFLOW_SHA:scripts/release/prepare_dev_certification_tenants.py" > /tmp/prepare-dev-tenants.py
          git show "$WORKFLOW_SHA:scripts/release/test_prepare_dev_certification_tenants.py" > /tmp/test_prepare_dev_certification_tenants.py
          cp /tmp/prepare-dev-tenants.py /tmp/prepare_dev_certification_tenants.py
          python -m unittest discover -s /tmp -p test_prepare_dev_certification_tenants.py -v
          git show "$WORKFLOW_SHA:frontend/dashboards/tests/certification/production-tenant-isolation.spec.ts" > frontend/dashboards/tests/certification/production-tenant-isolation.spec.ts
          python - <<'PYCODE'
          import contextlib, io, json, os, runpy, subprocess, sys, urllib.request
          from urllib.parse import urlsplit
          def az(*args):
              result = subprocess.run(['az', *args, '--only-show-errors', '--output', 'json'], capture_output=True, text=True, timeout=90)
              if result.returncode: raise RuntimeError('Authorized DEV Azure read failed')
              return json.loads(result.stdout)
          def resolve(value):
              if value.startswith('@Microsoft.KeyVault(') and value.endswith(')'):
                  fields = dict(part.strip().split('=', 1) for part in value[20:-1].split(';') if '=' in part)
                  if fields.get('SecretUri'):
                      uri = urlsplit(fields['SecretUri'])
                      assert uri.scheme == 'https' and uri.hostname.endswith('.vault.azure.net') and uri.path.startswith('/secrets/')
                      return az('keyvault', 'secret', 'show', '--id', fields['SecretUri'])['value']
                  return az('keyvault', 'secret', 'show', '--vault-name', fields['VaultName'], '--name', fields['SecretName'])['value']
              return value
          try:
              with urllib.request.urlopen('https://crown-api-dev.azurewebsites.net/api/health/', timeout=20) as response:
                  health = json.load(response)
              assert health['build_sha'] == health['artifact_build_sha'] == os.environ['SOURCE_SHA'] and health['db'] == 'ok'
              rows = az('webapp', 'config', 'appsettings', 'list', '--resource-group', 'crown-rg', '--name', 'crown-api-dev')
              settings = {row['name']: row.get('value', '') for row in rows}
              database = resolve(settings['DATABASE_URL'])
              secret = resolve(settings.get('DJANGO_SECRET_KEY') or settings['SECRET_KEY'])
              assert urlsplit(database).hostname == 'crown-pg-dev.postgres.database.azure.com'
              for value in (database, secret): print('::add-mask::' + value)
              os.environ.update(DATABASE_URL=database, DJANGO_SECRET_KEY=secret, DJANGO_SETTINGS_MODULE='crown_api.settings', CROWN_ENV='dev', DJANGO_ENV='development', DJANGO_DEBUG='false', BUILD_SHA=os.environ['SOURCE_SHA'])
              sys.path.insert(0, os.path.abspath('backend'))
              import django
              with contextlib.redirect_stderr(io.StringIO()): django.setup()
              module = runpy.run_path('/tmp/prepare-dev-tenants.py')
              with contextlib.redirect_stderr(io.StringIO()): module['prepare'](os.environ['CROWN_DEV_TENANT_FIXTURE'])
          except Exception as exc:
              print('DEV_FIXTURE_PREPARATION=FAIL; exception_type=' + type(exc).__name__)
              raise SystemExit(1)
          PYCODE
      - name: Execute existing Playwright framework for two-tenant HTTP isolation
        id: dev-tenant-evidence
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.preview.outcome == 'success' && steps.dev-evidence-exporter.outcome == 'success'
        working-directory: frontend/dashboards
        env:
          CI: '1'
          CROWN_CERTIFICATION_LIVE_RUNTIME: '1'
          CROWN_LIVE_FRONTEND_URL: ${{ steps.preview.outputs.static_web_app_url }}
          CROWN_LIVE_API_BASE_URL: https://crown-api-dev.azurewebsites.net
          CROWN_DEV_TENANT_FIXTURE: ${{ runner.temp }}/crown-dev-tenant-fixtures.json
          CROWN_EVIDENCE_RUNTIME_SHA: ${{ inputs.dev_source_sha }}
          CROWN_EVIDENCE_TEST_SHA: ${{ github.sha }}
          CROWN_EVIDENCE_EXPORTER_SHA: ${{ github.sha }}
        run: node scripts/run-dev-browser-evidence.mjs --suite tenant-isolation
      - name: Upload two-tenant execution results
        if: always() && toJSON(inputs.dev_deploy_only) == 'false' && steps.preview.outcome == 'success' && steps.dev-tenant-evidence.outputs.evidence_valid == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-two-tenant-isolation-${{ inputs.dev_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.dev-tenant-evidence.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral synthetic actor tokens
        if: always()
        env:
          FIXTURE_PATH: ${{ runner.temp }}/crown-dev-tenant-fixtures.json
        run: rm -f -- "$FIXTURE_PATH"
      - name: Record DEV deployment scope
        if: always()
        env:
          DEPLOY_ONLY: ${{ inputs.dev_deploy_only }}
        run: |
          if [[ "$DEPLOY_ONLY" != "false" ]]; then
            echo 'DEV deployment-only: CORS mutation, browser journeys and synthetic fixtures skipped. This run does not certify tenant isolation or owner workflows.' >> "$GITHUB_STEP_SUMMARY"
          fi
