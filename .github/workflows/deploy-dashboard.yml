name: Deploy Dashboard (Production)

# Phase 8 — Frontend proof leg.
#
# Triggers on the same prod-deploy-* tags as the backend deploy so both
# services are stamped from the same SHA and tag on every production push.
#
# What this workflow proves:
#   - frontend/dashboards/public/build.json is written with the exact commit SHA
#     and tag name at build time, then shipped inside dist/ to Azure SWA
#   - After this workflow succeeds, proof-ceremony-after-prod.yml will fetch
#     $PROD_DASH_BASE/build.json and assert build_sha and deploy_tag match the
#     backend health response — completing the "both proved" chain
#
# Secrets required:
#   AZURE_SWA_TOKEN — deployment token from the Azure Static Web Apps resource
#                     (Portal → SWA resource → Settings → Deployment token)
#   PROD_DASH_BASE  — set this after confirming the SWA URL, e.g.
#                     https://crown-dash.azurestaticapps.net

on:
  push:
    tags:
      - "prod-deploy-*"

concurrency:
  group: crown-dashboard-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: "Build + deploy dashboard — ${{ github.ref_name }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TAG="${{ github.ref_name }}"

          if [[ -z "$SHA" || ${#SHA} -lt 40 ]]; then
            echo "ERROR: could not resolve full commit SHA (got: '$SHA')"
            exit 1
          fi
          if [[ "$TAG" != prod-deploy-* ]]; then
            echo "ERROR: tag must start with prod-deploy- (got: '$TAG')"
            exit 1
          fi

          echo "DEPLOY_SHA=$SHA"  >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=$TAG"  >> "$GITHUB_ENV"
          echo "✓ Deploy contract: TAG=$TAG SHA=${SHA:0:7}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        working-directory: frontend/dashboards
        run: npm ci

      - name: Write build.json
        # Writes the proof artifact into public/ so Vite copies it to dist/ as-is.
        # The file is gitignored; on the runner it is generated fresh every deploy.
        shell: bash
        run: |
          set -euo pipefail
          printf '{"build_sha":"%s","deploy_tag":"%s"}\n' \
            "$DEPLOY_SHA" "$DEPLOY_TAG" \
            > frontend/dashboards/public/build.json
          echo "build.json written:"
          cat frontend/dashboards/public/build.json

      - name: Build
        working-directory: frontend/dashboards
        env:
          VITE_BUILD_SHA: ${{ env.DEPLOY_SHA }}
          VITE_DEPLOY_TAG: ${{ env.DEPLOY_TAG }}
        run: npm run build

      - name: Verify build.json in dist
        shell: bash
        run: |
          set -euo pipefail
          FILE="frontend/dashboards/dist/build.json"
          if [[ ! -f "$FILE" ]]; then
            echo "ERROR: dist/build.json not found — Vite did not copy public/build.json"
            exit 1
          fi
          echo "dist/build.json contents:"
          cat "$FILE"
          # Assert fields are present and non-empty
          SHA_IN="$(python3 -c "import json,sys; d=json.load(open('$FILE')); sys.exit(0 if d.get('build_sha') else 1)")"  || true
          TAG_IN="$(python3 -c "import json,sys; d=json.load(open('$FILE')); sys.exit(0 if d.get('deploy_tag') else 1)")"  || true
          python3 - <<'PY'
          import json, sys
          d = json.load(open("frontend/dashboards/dist/build.json"))
          if not d.get("build_sha"):
              sys.exit("FAIL: build_sha missing or empty in dist/build.json")
          if not d.get("deploy_tag"):
              sys.exit("FAIL: deploy_tag missing or empty in dist/build.json")
          print(f"OK build_sha={d['build_sha'][:7]}  deploy_tag={d['deploy_tag']}")
          PY

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dashboards"
          output_location: "dist"
          skip_app_build: true
