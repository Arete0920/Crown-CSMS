name: UI Proof Gate
permissions:
  contents: read


on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    name: Proof Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/dashboards

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Validate Jireh website staging source and deterministic build
        run: node --test sites/jireh/tests/site.test.mjs
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Verify crawler inventory and dashboard authorization contracts
        run: npx vitest run tests/certification/crawler-coverage-contract.test.ts tests/certification/anonymous-specialist-routes.test.ts --reporter=verbose

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Browser-verify Jireh marketing-site desktop and mobile presentation
        run: npx playwright test --config playwright.jireh.config.ts --reporter=line

      - name: Upload Jireh visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jireh-visual-proof-${{ github.run_id }}
          path: |
            frontend/dashboards/jireh-proof/
            frontend/dashboards/jireh-playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Run proof smoke suite
        run: npm run test:e2e:smoke
        env:
          CI: "1"
          VITE_DEV_BASE_URL: "http://localhost:4173"
          CROWN_DEMO_SCHOOL_ID: "19801b59-8c05-4c84-9312-5d792e4e839d"
          CROWN_DEMO_TOKEN: "playwright-demo-token"
          VITE_SANDBOX_MODE: "1"
          VITE_DEMO_MODE: "sandbox"

      - name: Browser-check navigation and anonymous school-route denial
        run: npx playwright test tests/ui/nav-permissions.spec.ts tests/ui/anonymous-specialist-route-access.spec.ts --grep "anonymous public home|missing authority|anonymous CROWN school route denial" --reporter=line
        env:
          CI: "1"
          VITE_DEV_BASE_URL: "http://localhost:4173"
          VITE_SANDBOX_MODE: "1"
          VITE_DEMO_MODE: "sandbox"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/dashboards/playwright-report/
          retention-days: 7
          if-no-files-found: error
