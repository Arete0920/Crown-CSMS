name: UI Proof Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ui-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    name: Proof Smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboards

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run proof smoke suite
        run: npm run test:e2e:smoke
        env:
          CI: "1"
          VITE_DEV_BASE_URL: "http://localhost:3000"
          CROWN_DEMO_SCHOOL_ID: "19801b59-8c05-4c84-9312-5d792e4e839d"
          CROWN_DEMO_TOKEN: "playwright-demo-token"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/dashboards/playwright-report/
          retention-days: 7
