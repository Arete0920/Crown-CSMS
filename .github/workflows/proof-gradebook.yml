name: Proof — Gradebook (UI + API)

on:
  workflow_dispatch:

concurrency:
  group: proof-gradebook
  cancel-in-progress: true

jobs:
  gradebook-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Backend + UI both run locally; frontend points to localhost:8000
      VITE_API_BASE_URL: "http://localhost:8000"
      CROWN_UI_URL: "http://localhost:3000"
      DJANGO_SETTINGS_MODULE: "crown_api.settings"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Django (migrate)
        working-directory: backend
        run: |
          python manage.py migrate --noinput

      - name: Start Django dev server
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 > django.log 2>&1 &
          echo "Started Django. Waiting for http://localhost:8000 ..."

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/api/v1/health/ >/dev/null 2>&1 || curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "API is up."
              exit 0
            fi
            sleep 2
          done
          echo "API did not come up in time."
          echo "---- django.log ----"
          cat backend/django.log || true
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dashboards deps
        working-directory: frontend/dashboards
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend/dashboards
        run: npx playwright install --with-deps

      # Start the Vite dev server in the background
      - name: Start dashboards dev server
        working-directory: frontend/dashboards
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 3000 > vite.log 2>&1 &
          echo "Started Vite. Waiting for http://localhost:3000 ..."

      - name: Wait for UI
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              echo "UI is up."
              exit 0
            fi
            sleep 2
          done
          echo "UI did not come up in time."
          echo "---- vite.log ----"
          cat frontend/dashboards/vite.log || true
          exit 1

      # Run API proof (uses UI login to acquire token deterministically from sessionStorage)
      - name: Run API proof
        working-directory: frontend/dashboards
        run: npm run api:proof:gradebook

      # Run UI proof (Flow A) + screenshots
      - name: Run UI proof
        working-directory: frontend/dashboards
        run: npm run ui:proof:gradebook

      - name: Upload UI proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-ui-proof-screenshots
          path: |
            frontend/dashboards/gb-ui-section-roster.png
            frontend/dashboards/gb-ui-gradebook-grid.png
            frontend/dashboards/gb-ui-assignments.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            frontend/dashboards/test-results
            frontend/dashboards/playwright-report
            frontend/dashboards/vite.log
            backend/django.log
          if-no-files-found: warn
          retention-days: 14
