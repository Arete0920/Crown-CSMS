name: Proof — Gradebook (UI + API)

on:
  workflow_dispatch:

  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/proof-gradebook.yml"
      - "frontend/dashboards/tests/**"
      - "frontend/dashboards/src/**"
      - "backend/gradebook/**"
      - "backend/academics/**"
      - "backend/core/management/commands/**"
      - "backend/crown_api/**"

concurrency:
  group: proof-gradebook
  cancel-in-progress: true

jobs:
  gradebook-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Backend + UI both run locally; frontend points to localhost:8000
      VITE_API_BASE_URL: "http://localhost:8000"
      CROWN_UI_URL: "http://localhost:3000"
      DJANGO_SETTINGS_MODULE: "crown_api.settings"
      # Demo mode configuration (for single-button dev token login)
      CROWN_DEMO_MODE: "true"
      CROWN_DEMO_KEY: "CrownDemoKey!2026"
      VITE_DEMO_KEY: "CrownDemoKey!2026"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guardrail — print versions
        run: |
          set -euo pipefail
          echo "Node: $(node -v || true)"
          echo "Python: $(python --version || true)"
          echo "Pip: $(pip --version || true)"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Django (migrate)
        working-directory: backend
        run: |
          python manage.py migrate --noinput

      - name: Guardrail — required env
        env:
          CROWN_DEMO_PASSWORD: "CI-Demo-Password-2026"
        run: |
          set -euo pipefail
          test -n "${CROWN_DEMO_PASSWORD}" || (echo "Missing CROWN_DEMO_PASSWORD secret" && exit 1)

      - name: Seed Django (golden path + demo users + academics)
        working-directory: backend
        env:
          CROWN_DEMO_PASSWORD: "CI-Demo-Password-2026"
        run: |
          python manage.py golden_path_bootstrap --force --school-id b45b8c5a-6708-4597-aad9-a226627b2962
          python manage.py seed_demo_school --force --students 25
          python manage.py seed_academics_demo --school-id b45b8c5a-6708-4597-aad9-a226627b2962
          python manage.py seed_gradebook_demo --school-id b45b8c5a-6708-4597-aad9-a226627b2962
          python manage.py seed_demo_parent_gradebook

      - name: Start Django dev server
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 > django.log 2>&1 &
          echo "Started Django. Waiting for http://localhost:8000 ..."

      - name: Wait for API
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/api/v1/health/ >/dev/null 2>&1 || curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "API is up."
              exit 0
            fi
            sleep 1
          done
          echo "API never became healthy" && exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dashboards deps
        working-directory: frontend/dashboards
        run: npm ci

      - name: Proof receipts
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
          echo "API_BASE_URL=${API_BASE_URL:-<not set>}"
          echo "CROWN_UI_URL=$CROWN_UI_URL"

      - name: Install Playwright browsers
        working-directory: frontend/dashboards
        run: npx playwright install --with-deps

      # Start the Vite dev server in the background
      - name: Start dashboards dev server
        working-directory: frontend/dashboards
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 3000 > vite.log 2>&1 &
          echo "Started Vite. Waiting for http://localhost:3000 ..."

      - name: Wait for UI
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "UI is up."
              exit 0
            fi
            sleep 1
          done
          echo "UI never became reachable" && exit 1

      - name: Gradebook API readiness
        shell: bash
        env:
          CROWN_DEMO_KEY: ${{ env.CROWN_DEMO_KEY }}
        run: |
          set -euo pipefail
          echo "Acquiring demo JWT for readiness probe..."
          TOKEN_JSON=$(curl -fsS -X POST "http://127.0.0.1:8000/api/dev/token/" \
            -H "Content-Type: application/json" \
            -H "X-Demo-Key: ${CROWN_DEMO_KEY}" \
            -d '{}')

          ACCESS=$(python3 - <<'PY'
          import json, sys
          raw = sys.stdin.read().strip()
          if not raw:
              print("ERROR: empty response from token endpoint", file=sys.stderr)
              sys.exit(1)
          try:
              d = json.loads(raw)
          except json.JSONDecodeError:
              start = raw.find("{")
              end = raw.rfind("}")
              if start != -1 and end != -1 and end >= start:
                  d = json.loads(raw[start:end + 1])
              else:
                  print(f"ERROR: cannot parse JSON. Raw: {raw!r}", file=sys.stderr)
                  sys.exit(1)
          nested = d.get("data") if isinstance(d.get("data"), dict) else {}
          token = (
            d.get("access")
            or d.get("access_token")
            or d.get("token")
            or nested.get("access")
            or nested.get("access_token")
            or nested.get("token")
            or ""
          )
          print(token)
          PY
          <<<"$TOKEN_JSON")

          if [[ -z "$ACCESS" ]]; then
            echo "ERROR: Could not acquire demo access token. Response:"
            echo "$TOKEN_JSON"
            exit 1
          fi
          echo "Token acquired. Probing gradebook sections endpoint..."

          for i in {1..40}; do
            HTTP=$(curl -s -o /tmp/gb_ready.json -w "%{http_code}" \
              "http://127.0.0.1:8000/api/v1/gradebook/sections/" \
              -H "Authorization: Bearer ${ACCESS}" \
              -H "X-School-Id: b45b8c5a-6708-4597-aad9-a226627b2962")
            if [[ "$HTTP" == "200" || "$HTTP" == "400" || "$HTTP" == "403" ]]; then
              echo "Gradebook API ready (HTTP ${HTTP})."
              exit 0
            fi
            echo "Attempt ${i}: HTTP ${HTTP} — waiting 2s..."
            cat /tmp/gb_ready.json || true
            sleep 2
          done
          echo "Gradebook API never became ready (kept returning 500 or similar)."
          cat /tmp/gb_ready.json || true
          exit 1

      # Run API proof (uses UI login to acquire token deterministically from sessionStorage)
      - name: Run API proof
        working-directory: frontend/dashboards
        env:
          CROWN_UI_URL: "http://localhost:3000"
          API_BASE_URL: "http://localhost:8000"
        run: npm run api:proof:gradebook

      # Run UI proof (Flow A) + screenshots
      - name: Run UI proof
        working-directory: frontend/dashboards
        run: npm run ui:proof:gradebook

      - name: Upload UI proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-ui-proof-screenshots
          path: |
            frontend/dashboards/gb-ui-section-roster.png
            frontend/dashboards/gb-ui-gradebook-grid.png
            frontend/dashboards/gb-ui-assignments.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            frontend/dashboards/test-results
            frontend/dashboards/playwright-report
            frontend/dashboards/vite.log
            backend/django.log
          if-no-files-found: warn
          retention-days: 14
