name: RC Build-SHA Health Proof
permissions:
  contents: read


on:
  push:
    branches:
      - "rc/**"
  workflow_dispatch:

concurrency:
  group: rc-build-sha-health-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-sha-proof:
    name: build-sha-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          BUILD_SHA: ${{ github.sha }}
        run: python manage.py migrate --run-syncdb

      - name: Start server with BUILD_SHA injected
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          BUILD_SHA: ${{ github.sha }}
        run: |
          python manage.py runserver 127.0.0.1:8001 --noreload &
          # Wait for server to be ready (max 15s)
          for i in $(seq 1 15); do
            curl --max-time 30 -f -sf http://127.0.0.1:8001/api/health/ > /dev/null 2>&1 && break
            sleep 1
          done
          echo "Server ready"

      - name: Assert build_sha matches GITHUB_SHA
        env:
          RC_BASE_URL: "http://127.0.0.1:8001"
          RC_EXPECT_BUILD_SHA: ${{ github.sha }}
          RC_TIMEOUT: "20"
        run: python tools/verify_build_sha.py

      # Deployed check: only runs if RC_BASE_URL and RC_EXPECT_BUILD_SHA are set.
      # Skips gracefully (warns, does not fail) when secrets are absent.
      - name: "Check secrets for deployed SHA check"
        id: secrets-check
        env:
          RC_BASE_URL: ${{ secrets.RC_BASE_URL }}
          RC_EXPECT_BUILD_SHA: ${{ secrets.RC_EXPECT_BUILD_SHA }}
        run: |
          if [ -z "$RC_BASE_URL" ] || [ -z "$RC_EXPECT_BUILD_SHA" ]; then
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            echo "::warning::RC_BASE_URL or RC_EXPECT_BUILD_SHA not set -- skipping deployed SHA check"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert deployed service runs expected commit
        if: steps.secrets-check.outputs.SKIP == 'false'
        env:
          RC_BASE_URL: ${{ secrets.RC_BASE_URL }}
          RC_EXPECT_BUILD_SHA: ${{ secrets.RC_EXPECT_BUILD_SHA }}
          RC_TIMEOUT: "30"
        run: python tools/verify_build_sha.py

