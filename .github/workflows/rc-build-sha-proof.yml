name: RC Build-SHA Health Proof

on:
  push:
    branches:
      - "rc/**"
  workflow_dispatch:

jobs:
  build-sha-proof:
    name: build-sha-proof
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          BUILD_SHA: ${{ github.sha }}
        run: python manage.py migrate --run-syncdb

      - name: Start server with BUILD_SHA injected
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          BUILD_SHA: ${{ github.sha }}
        run: |
          python manage.py runserver 127.0.0.1:8001 --noreload &
          # Wait for server to be ready (max 15s)
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8001/api/health/ > /dev/null 2>&1 && break
            sleep 1
          done
          echo "Server ready"

      - name: Assert build_sha matches GITHUB_SHA
        env:
          BUILD_SHA_PROOF_URL: "http://127.0.0.1:8001"
          BUILD_SHA_PROOF_EXPECTED: ${{ github.sha }}
          BUILD_SHA_PROOF_TIMEOUT: "20"
        run: python tools/verify_build_sha.py

      # Deployed check: only runs if RC_BASE_URL and RC_EXPECTED_SHA are set.
      # Skips gracefully (warns, does not fail) when secrets are absent.
      - name: "Check secrets for deployed SHA check"
        id: secrets-check
        env:
          RC_BASE_URL: ${{ secrets.RC_BASE_URL }}
          RC_EXPECTED_SHA: ${{ secrets.RC_EXPECTED_SHA }}
        run: |
          if [ -z "$RC_BASE_URL" ] || [ -z "$RC_EXPECTED_SHA" ]; then
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            echo "::warning::RC_BASE_URL or RC_EXPECTED_SHA not set — skipping deployed SHA check"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert deployed service runs expected commit
        if: steps.secrets-check.outputs.SKIP == 'false'
        env:
          BUILD_SHA_PROOF_URL: ${{ secrets.RC_BASE_URL }}
          BUILD_SHA_PROOF_EXPECTED: ${{ secrets.RC_EXPECTED_SHA }}
          BUILD_SHA_PROOF_TIMEOUT: "30"
        run: python tools/verify_build_sha.py
