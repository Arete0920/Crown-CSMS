name: Demo Reset

on:
  workflow_dispatch:
    inputs:
      school_id:
        description: "School UUID to reseed"
        required: true
        type: string

permissions:
  contents: read

# Serialize DEV mutations across both manual reset workflows.
concurrency:
  group: ops-reset-dev
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call demo reset API
        env:
          API_BASE: https://crown-api-dev.azurewebsites.net
          OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
          SCHOOL_ID: ${{ inputs.school_id }}
        run: |
          set -euo pipefail
          # The endpoint may include migration and seed command-output tails.
          # Withhold the unredacted JSON body from public Actions logs.
          response="$(curl --max-time 30 -f -sS -X POST "$API_BASE/api/v1/system/demo-reset/?verbosity=2" \
            -H "X-Admin-Ops-Secret: $OPS_SECRET" \
            -H "X-School-Id: $SCHOOL_ID" \
            -H "Content-Type: application/json" \
            -d '{}')"
          if ! printf '%s' "$response" | python3 -c 'import json, sys; data = json.load(sys.stdin); sys.exit(0 if isinstance(data, dict) and data.get("ok") is True else 1)'; then
            echo "DEV demo reset did not return a successful acknowledgement." >&2
            exit 1
          fi
          echo "PASS: DEV demo reset acknowledged; response details withheld."

      - name: Verify admissions diversity
        env:
          API_BASE: https://crown-api-dev.azurewebsites.net
          DEMO_USERNAME: head@crown-demo.local
          DEMO_PASSWORD: ${{ secrets.DEV_DEMO_PASSWORD }}
          SCHOOL_ID: ${{ inputs.school_id }}
        run: |
          set -euo pipefail

          TOKEN="$(curl --max-time 30 -f -sS -X POST "$API_BASE/api/v1/auth/token/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$DEMO_USERNAME\",\"password\":\"$DEMO_PASSWORD\"}" | python3 -c "import sys,json; print(json.load(sys.stdin)['access'])")"

          OUT="$(curl --max-time 30 -f -sS "$API_BASE/api/v1/admissions/summary/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-School-Id: $SCHOOL_ID")"

          # -c reads the piped JSON; a Python heredoc would consume stdin as code.
          if ! printf '%s' "$OUT" | python3 -c 'import json, sys; data=json.load(sys.stdin); pipeline=data.get("pipeline", {}) if isinstance(data, dict) else {}; stages=pipeline.get("by_stage", {}) if isinstance(pipeline, dict) else {}; valid=isinstance(stages, dict) and sum(isinstance(v, int) and not isinstance(v, bool) and v>0 for v in stages.values())>=3; sys.exit(0 if valid else 1)'; then
            echo "FAIL: admissions diversity verification did not pass." >&2
            exit 1
          fi
          echo "PASS: admissions diversified."
