name: Demo Reset

on:
  workflow_dispatch:
    inputs:
      school_id:
        description: "School UUID to reseed"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: demo-reset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call demo reset API
        env:
          API_BASE: https://crown-api-dev.azurewebsites.net
          OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
          SCHOOL_ID: ${{ inputs.school_id }}
        run: |
          set -euo pipefail
          curl --max-time 30 -f -sS -X POST "$API_BASE/api/v1/system/demo-reset/?verbosity=2" \
            -H "X-Admin-Ops-Secret: $OPS_SECRET" \
            -H "X-School-Id: $SCHOOL_ID" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/reset.json

          python - << 'PY'
          import json
          d = json.load(open("/tmp/reset.json", "r"))
          assert d.get("ok") is True, d
          print("PASS: demo reset completed")
          PY

      - name: Verify admissions diversity
        env:
          API_BASE: https://crown-api-dev.azurewebsites.net
          DEMO_USERNAME: head@crown-demo.local
          DEMO_PASSWORD: ${{ secrets.DEV_DEMO_PASSWORD }}
          SCHOOL_ID: ${{ inputs.school_id }}
        run: |
          set -euo pipefail

          TOKEN=$(curl --max-time 30 -f -s -X POST "$API_BASE/api/v1/auth/token/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$DEMO_USERNAME\",\"password\":\"$DEMO_PASSWORD\"}" | python -c "import sys,json; print(json.load(sys.stdin)['access'])")

          OUT=$(curl --max-time 30 -f -s "$API_BASE/api/v1/admissions/summary/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-School-Id: $SCHOOL_ID")

          echo "$OUT" | python - << 'PY'
          import sys, json
          d = json.load(sys.stdin)
          by = d["pipeline"]["by_stage"]
          nonzero = [k for k, v in by.items() if isinstance(v, int) and v > 0]
          print(f"Non-zero stages: {len(nonzero)}")
          assert len(nonzero) >= 3, f"Only {len(nonzero)} stages populated, need >=3"
          print("PASS: admissions diversified")
          PY
