name: Recovery Trigger Canary Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-trigger-canary-source.yml'
      - '.github/workflows/recovery-trigger-canary-observer.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  complete-successfully:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit bounded canary evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovery trigger canary source completed successfully."
          echo "repository=${GITHUB_REPOSITORY}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "sha=${GITHUB_SHA}"
          echo "production_mutation_performed=false"

      - name: Record source evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              body: [
                '## Recovery trigger canary source — PASS',
                `- Source run ID: ${context.runId}`,
                `- Source workflow SHA: ${context.sha}`,
                `- Repository: ${context.repo.owner}/${context.repo.repo}`,
                '- Production mutation performed: false',
                '- Awaiting automatic `workflow_run` observer evidence.'
              ].join('\n')
            });
