name: Temporary Production Key Vault RBAC Repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  grant:
    if: >-
      github.event.issue.number == 1630 &&
      github.event.comment.user.login == 'tcmegahan' &&
      github.event.comment.body == '/grant-prod-kv-secrets-user'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Select Azure authentication mode
        id: auth
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "mode=sp" >> "$GITHUB_OUTPUT"
          else
            test -n "$AZURE_CLIENT_ID"
            test -n "$AZURE_TENANT_ID"
            test -n "$AZURE_SUBSCRIPTION_ID"
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login (Service Principal JSON)
        if: steps.auth.outputs.mode == 'sp'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Login (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Grant least-privilege Key Vault secret read
        id: grant
        shell: bash
        run: |
          set -uo pipefail
          principal_object_id="cc57b92f-f96a-4ab3-b55c-806ff6fc8ec5"
          vault_id="$(az keyvault show \
            --resource-group crown-rg \
            --name crown-kv-prod \
            --query id \
            --output tsv \
            --only-show-errors 2>/tmp/vault_show_error.txt)"
          if [ -z "$vault_id" ]; then
            echo "result=vault-lookup-failed" >> "$GITHUB_OUTPUT"
            echo "detail=$(tr '\n' ' ' < /tmp/vault_show_error.txt | cut -c1-500)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing="$(az role assignment list \
            --assignee-object-id "$principal_object_id" \
            --scope "$vault_id" \
            --role "Key Vault Secrets User" \
            --query '[0].id' \
            --output tsv \
            --only-show-errors 2>/tmp/role_list_error.txt || true)"
          if [ -n "$existing" ]; then
            echo "result=already-present" >> "$GITHUB_OUTPUT"
            echo "detail=assignment already exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          az role assignment create \
            --assignee-object-id "$principal_object_id" \
            --assignee-principal-type ServicePrincipal \
            --role "Key Vault Secrets User" \
            --scope "$vault_id" \
            --only-show-errors \
            --output none 2>/tmp/role_create_error.txt
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "result=created" >> "$GITHUB_OUTPUT"
            echo "detail=least-privilege vault-scoped assignment created" >> "$GITHUB_OUTPUT"
          else
            detail="$(tr '\n' ' ' < /tmp/role_create_error.txt | cut -c1-700)"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
          fi

      - name: Record RBAC repair evidence
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RESULT: ${{ steps.grant.outputs.result }}
          DETAIL: ${{ steps.grant.outputs.detail }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              'Production Key Vault RBAC repair result.',
              '',
              '- vault: `crown-kv-prod`',
              '- scope: vault only',
              '- role: `Key Vault Secrets User`',
              '- principal object id: `cc57b92f-f96a-4ab3-b55c-806ff6fc8ec5`',
              `- result: \`${process.env.RESULT || 'not-run'}\``,
              `- detail: ${process.env.DETAIL || 'none'}`,
              '- no secret values were read or written by this repair step.',
              '- production remains **NO-GO / HOLD** pending rerun evidence.'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1648,
              title: 'Production Key Vault RBAC repair evidence',
              body,
              state: 'closed'
            });

      - name: Fail closed when assignment was not established
        if: >-
          always() &&
          steps.grant.outputs.result != 'created' &&
          steps.grant.outputs.result != 'already-present'
        shell: bash
        run: |
          echo "Key Vault RBAC repair did not establish the required assignment."
          exit 1

      - name: Azure logout
        if: always()
        run: az logout || true
