name: Apply Sandbox Standalone Landing Fix

on:
  push:
    branches:
      - fix/sandbox-standalone-landing-20260806

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply bounded standalone sandbox repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("frontend/dashboards/src/pages/SandboxLandingPage.jsx")
          text = path.read_text(encoding="utf-8")

          import_line = 'import CrownLayout from "../components/crown/CrownLayout";\n'
          if text.count(import_line) != 1:
              raise SystemExit("Expected exactly one CrownLayout import")
          text = text.replace(import_line, "", 1)

          opening_pattern = re.compile(r'      <CrownLayout\n        title="Guided Proof Sandbox"\n        subtitle="Explore CROWN with safe fictional data and launch role-specific proof paths\."\n        mainClassName="sandbox-root"\n      >\n        <section className="sandbox-hero">')
          text, opening_count = opening_pattern.subn('      <main className="sandbox-root">\n        <section className="sandbox-hero">', text, count=1)
          if opening_count != 1:
              raise SystemExit(f"Expected one CrownLayout opening block; found {opening_count}")

          closing = '        </section>\n      </CrownLayout>'
          if text.count(closing) != 1:
              raise SystemExit("Expected exactly one CrownLayout closing block")
          text = text.replace(closing, '        </section>\n      </main>', 1)

          replacements = {
              '.track-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }': '.track-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }',
              '.school-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }': '.school-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 16px; }',
              '.primary-link { display: inline-flex; justify-content: center; align-items: center; border-radius: 10px; background: linear-gradient(120deg, var(--crown-compat-color-f4ce79ce58) 0%, var(--crown-compat-color-550e1aa105) 100%); color: white; text-decoration: none; padding: 10px 12px; font-weight: 800; font-size: 14px; border: 0; cursor: pointer; }': '.primary-link { display: inline-flex; justify-content: center; align-items: center; border-radius: 10px; background: linear-gradient(120deg, var(--crown-compat-color-f4ce79ce58) 0%, var(--crown-compat-color-550e1aa105) 100%) !important; color: white !important; -webkit-text-fill-color: white !important; text-decoration: none; padding: 10px 12px; font-weight: 800; font-size: 14px; border: 0; cursor: pointer; }',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one bounded style target: {old[:80]}")
              text = text.replace(old, new, 1)

          if "CrownLayout" in text:
              raise SystemExit("CrownLayout reference remains")
          if '<main className="sandbox-root">' not in text:
              raise SystemExit("Standalone sandbox wrapper missing")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Verify repaired frontend
        working-directory: frontend/dashboards
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run build

      - name: Commit bounded repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CROWN Sandbox Repair"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/dashboards/src/pages/SandboxLandingPage.jsx
          git rm .github/workflows/apply-sandbox-standalone-fix.yml
          git commit -m "fix(sandbox): render evaluator landing without authenticated shell"
          git push origin HEAD:fix/sandbox-standalone-landing-20260806
