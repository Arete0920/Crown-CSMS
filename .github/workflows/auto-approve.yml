name: Auto-approve solo-developer PRs

# Workaround for solo developer who cannot approve their own PR reviews.
# Uses the GitHub Actions bot token (different from the user token) to
# approve PRs created by the repository owner. This is safe because the
# repo owner already has full write access to the repository.
#
# Only approves PRs that originate from within this repository (not forks)
# and are created by the trusted actor list below.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.actor == github.repository_owner ||
        github.actor == 'copilot-swe-agent[bot]' ||
        github.actor == 'github-copilot[bot]'
      )
    steps:
      - name: Auto-approve PR
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
