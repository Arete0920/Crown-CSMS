name: Dependency Audit

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-pip-audit:
    name: backend-pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependency security tooling
        run: python -m pip install pip-audit==2.10.1 pip-licenses==5.5.5
      - name: Enforce backend dependency license policy
        run: |
          pip install -r backend/requirements.txt
          pip-licenses --format=json --output-file backend/python-licenses.json
          python tools/verify_license_policy.py backend/python-licenses.json

      - name: Audit backend dependencies
        run: |
          REQUIREMENTS_FOUND=0
          for REQ in backend/requirements.txt backend/requirements-loadtest.txt requirements.txt; do
            if [ -f "$REQ" ]; then
              REQUIREMENTS_FOUND=1
              echo "=== pip-audit: $REQ ==="
              pip-audit -r "$REQ" --strict
            fi
          done
          if [ $REQUIREMENTS_FOUND -eq 0 ]; then
            echo "No requirements file found" >&2
            exit 1
          fi

  frontend-npm-audit:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend-npm-audit
            directory: frontend/dashboards
            artifact: frontend-npm-audit-results
          - name: wallet-npm-audit
            directory: services/wallet/apple-pass-service
            artifact: wallet-npm-audit-results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify Wallet signing
        if: matrix.name == 'wallet-npm-audit'
        run: npm test
      - name: Enforce dependency license policy
        run: |
          npx --yes license-checker@25.0.1 --json --out license-policy-report.json
          python "${{ github.workspace }}/tools/verify_license_policy.py" license-policy-report.json

      - name: Capture frontend dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-results.json
          status=$?
          printf '%s\n' "$status" > npm-audit-exit-code.txt
          exit 0
      - name: Upload frontend dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            ${{ matrix.directory }}/npm-audit-results.json
            ${{ matrix.directory }}/npm-audit-exit-code.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report and enforce frontend dependency audit
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-results.json', 'utf8'));
          const auditExitCode = Number(fs.readFileSync('npm-audit-exit-code.txt', 'utf8').trim());
          const vulnerabilities = report.vulnerabilities || {};
          for (const [name, value] of Object.entries(vulnerabilities)) {
            if (!['high', 'critical'].includes(value.severity)) continue;
            const via = (value.via || []).map((entry) => typeof entry === 'string' ? entry : `${entry.source}:${entry.title}`).join(' | ');
            const fix = value.fixAvailable === true ? 'available' : value.fixAvailable === false ? 'none' : JSON.stringify(value.fixAvailable);
            console.log(`NPM_AUDIT_BLOCKER package=${name} severity=${value.severity} direct=${Boolean(value.isDirect)} range=${value.range} fix=${fix} via=${via}`);
          }
          console.log(`NPM_AUDIT_COUNTS high=${report.metadata?.vulnerabilities?.high || 0} critical=${report.metadata?.vulnerabilities?.critical || 0} total=${report.metadata?.vulnerabilities?.total || 0}`);
          process.exit(Number.isInteger(auditExitCode) ? auditExitCode : 1);
          NODE
