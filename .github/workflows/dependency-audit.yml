name: Dependency Audit

permissions:
  contents: read

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  backend-pip-audit:
    name: Backend Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend dependencies
        run: |
          pip-audit -r backend/requirements.txt --strict

  frontend-npm-audit:
    name: Frontend Node Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/dashboards/package-lock.json
      - run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
