name: Dependency Audit

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-pip-audit:
    name: backend-pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend dependencies
        run: |
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt --strict
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --strict
          else
            echo "No requirements file found" >&2
            exit 1
          fi

  frontend-npm-audit:
    name: frontend-npm-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
