name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-pip-audit:
    name: Backend Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r backend/requirements.txt --strict

  frontend-npm-audit:
    name: Frontend Node Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
