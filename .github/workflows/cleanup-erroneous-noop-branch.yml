name: Cleanup erroneous noop branch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-erroneous-noop-branch.yml"

permissions:
  contents: write

jobs:
  delete-erroneous-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete noop-temp-do-not-create if present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/noop-temp-do-not-create"
          code="$(curl --silent --output /tmp/ref.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          if [ "$code" = "404" ]; then
            echo "Erroneous branch already absent."
            exit 0
          fi
          test "$code" = "200"
          curl --fail --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api"
          echo "Deleted noop-temp-do-not-create."
