name: Dashboard Module Integrity

on:
  pull_request:
    paths:
      - "scripts/audit/verify_dashboard_module_integrity.py"
      - "scripts/audit/verify_module_control_matrices.py"
      - "docs/product/CROWN_MODULE_COMPLETION_MATRIX.md"
      - "docs/product/CROWN_MODULE_DATA_OWNERSHIP_MATRIX.md"
      - "docs/product/CROWN_MODULE_PERMISSION_MATRIX.md"
      - "docs/product/CROWN_DASHBOARD_FIT_MATRIX.md"
      - "docs/product/CROWN_MODULE_REVIEW_RACI.md"
      - "contracts/shell_backend_contract.json"
      - "backend/crown_api/dashboards/**"
      - "frontend/dashboards/src/config/dashboardRegistry.js"
      - "frontend/dashboards/src/config/dashboardDataRegistry.js"
      - "frontend/dashboards/src/config/dashboardCertificationRegistry.js"
      - "frontend/dashboards/src/contracts/shellBackendContract.js"
      - "frontend/dashboards/src/components/crown/CrownLayout.jsx"
      - "frontend/dashboards/src/routes/**"
      - "frontend/dashboards/scripts/verify-dashboard-completeness.mjs"
      - "frontend/dashboards/scripts/check-shell-backend-contract-parity.mjs"
      - ".github/workflows/dashboard-module-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/audit/verify_dashboard_module_integrity.py"
      - "scripts/audit/verify_module_control_matrices.py"
      - "docs/product/CROWN_MODULE_COMPLETION_MATRIX.md"
      - "docs/product/CROWN_MODULE_DATA_OWNERSHIP_MATRIX.md"
      - "docs/product/CROWN_MODULE_PERMISSION_MATRIX.md"
      - "docs/product/CROWN_DASHBOARD_FIT_MATRIX.md"
      - "docs/product/CROWN_MODULE_REVIEW_RACI.md"
      - "contracts/shell_backend_contract.json"
      - "backend/crown_api/dashboards/**"
      - "frontend/dashboards/src/config/dashboardRegistry.js"
      - "frontend/dashboards/src/config/dashboardDataRegistry.js"
      - "frontend/dashboards/src/config/dashboardCertificationRegistry.js"
      - "frontend/dashboards/src/contracts/shellBackendContract.js"
      - "frontend/dashboards/src/components/crown/CrownLayout.jsx"
      - "frontend/dashboards/src/routes/**"
      - "frontend/dashboards/scripts/verify-dashboard-completeness.mjs"
      - "frontend/dashboards/scripts/check-shell-backend-contract-parity.mjs"
      - ".github/workflows/dashboard-module-integrity.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-module-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-module-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"

      - name: Verify cross-layer dashboard module integrity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/verify_dashboard_module_integrity.py | tee dashboard-module-integrity.txt

      - name: Verify required module control matrices
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/verify_module_control_matrices.py | tee module-control-matrices.txt

      - name: Upload integrity reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-module-integrity-report
          path: |
            dashboard-module-integrity.txt
            module-control-matrices.txt
          if-no-files-found: warn
