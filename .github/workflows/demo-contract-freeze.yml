name: demo-contract-freeze
permissions:
  contents: read


on:
  push:
    branches:
      - "rc/**"
  pull_request:
    branches:
      - "rc/**"
    paths:
      - "tools/rc_endpoint_probes.json"
      - "tools/demo_contract_t1.lock"
      - "tools/verify_demo_contract_freeze.py"
      - ".github/workflows/demo-contract-freeze.yml"

concurrency:
  group: demo-contract-freeze-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: "Demo Contract Freeze (Tier-1 hash lock)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Tier-1 demo contract frozen
        run: python3 tools/verify_demo_contract_freeze.py

