name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Dependency review unavailable on this repository
        run: |
          echo "Dependency review is not supported on this repository because"
          echo "GitHub dependency review/advanced security is not enabled."
          echo "Skipping this check without blocking the PR."
