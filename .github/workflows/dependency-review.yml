name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Dependency Review
        # Advisory mode: this repository currently lacks full support for the
        # dependency-review backend feature, which otherwise hard-fails PR CI.
        # Keep signal visible without blocking merge on platform capability.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
