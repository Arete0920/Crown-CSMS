name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Dependency Review
        # Some forks/private setups do not have GHAS dependency review enabled.
        # Keep signal when available, but do not hard-block release PRs when unsupported.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
