name: PostgreSQL Migration Lock Contention

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "backend/core/management/commands/migrate_with_lock.py"
      - "backend/crown_api/settings.py"
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - "tools/verify_postgresql_migration_lock_contention.py"
      - ".github/workflows/postgresql-migration-lock-contention.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/core/management/commands/migrate_with_lock.py"
      - "backend/crown_api/settings.py"
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - "tools/verify_postgresql_migration_lock_contention.py"
      - ".github/workflows/postgresql-migration-lock-contention.yml"

concurrency:
  group: postgresql-migration-lock-contention-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contention-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crown
          POSTGRES_PASSWORD: crown
          POSTGRES_DB: crown_lock_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crown -d crown_lock_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.11
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Apply migrations through the controlled lock command
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://crown:crown@127.0.0.1:5432/crown_lock_proof
        run: |
          python manage.py migrate_with_lock --lock-timeout-seconds 10 --verbosity 1

      - name: Prove competing runner timeout and successor acquisition
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://crown:crown@127.0.0.1:5432/crown_lock_proof
        run: |
          python tools/verify_postgresql_migration_lock_contention.py
