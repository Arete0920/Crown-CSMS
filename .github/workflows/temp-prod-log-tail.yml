name: Temporary Production Log Tail Reader

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  capture-tail:
    if: >-
      github.event.issue.number == 1630 &&
      github.event.comment.user.login == 'tcmegahan' &&
      github.event.comment.body == '/tail-prod-log 89990379530'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture final failed-job lines
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const response = await github.request(
              'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: 89990379530
              }
            );
            let text;
            if (typeof response.data === 'string') {
              text = response.data;
            } else if (Buffer.isBuffer(response.data)) {
              text = response.data.toString('utf8');
            } else if (response.data instanceof ArrayBuffer) {
              text = Buffer.from(response.data).toString('utf8');
            } else {
              text = JSON.stringify(response.data);
            }
            const lines = text.split(/\r?\n/);
            const tail = lines.slice(-80).join('\n').slice(0, 10000);
            const body = [
              'Production deploy 30269891411 terminal log evidence.',
              '',
              '- failed job id: `89990379530`',
              '- failed step: `Resolve masked migration settings from Azure App Service`',
              '',
              'Final 80 log lines:',
              '```text',
              tail,
              '```',
              '',
              '- production remains **NO-GO / HOLD**.'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1648,
              title: 'Production deploy 30269891411 terminal failure evidence',
              body,
              state: 'closed'
            });
