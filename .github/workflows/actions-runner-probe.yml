name: Actions Runner Probe

on:
  pull_request:
    paths:
      - ".github/workflows/actions-runner-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner materialized
        run: |
          echo "runner materialized"
          uname -a
