name: One-Time Owner Handoff Release 348ac750

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-owner-handoff-release-348ac750.yml"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: one-time-owner-handoff-release-348ac750
  cancel-in-progress: false

jobs:
  release-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET_SHA: 348ac750a9571b3d55da9de37cc3207ffff1cab3
      PROD_TAG: prod-deploy-20260809-348ac75
      CONTROLLING_ISSUE: "1619"
      DEFECT_ISSUE: "1956"
      PROD_WORKFLOW: deploy-prod-dispatch.yml
      AUTO_PROD_WORKFLOW: deploy-prod.yml
      DASHBOARD_WORKFLOW: deploy-dashboard.yml
      TEMP_BRANCH: owner-handoff-cert-348ac750a957
      API_URL: ${{ vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
      TENANT_HEADER_SCHOOL_ID: ${{ vars.CROWN_LIVE_SCHOOL_ID || vars.CROWN_DEMO_SCHOOL_ID || '19801b59-8c05-4c84-9312-5d792e4e839d' }}
    steps:
      - name: Create immutable tag, deploy backend, deploy dashboard, and certify
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          controller_sha = os.environ["CONTROLLER_SHA"]
          controller_run_url = os.environ["CONTROLLER_RUN_URL"]
          target_sha = os.environ["TARGET_SHA"]
          prod_tag = os.environ["PROD_TAG"]
          prod_workflow = os.environ["PROD_WORKFLOW"]
          auto_prod_workflow = os.environ["AUTO_PROD_WORKFLOW"]
          dashboard_workflow = os.environ["DASHBOARD_WORKFLOW"]
          temp_branch = os.environ["TEMP_BRANCH"]
          api_url = os.environ["API_URL"].rstrip("/")
          school_id = os.environ["TENANT_HEADER_SCHOOL_ID"].strip()
          issues = [os.environ["DEFECT_ISSUE"], os.environ["CONTROLLING_ISSUE"]]
          api_root = f"https://api.github.com/repos/{repository}"
          temp_branch_created = False

          def request(method, path_or_url, payload=None):
              url = path_or_url if path_or_url.startswith("https://") else f"{api_root}/{path_or_url.lstrip('/')}"
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read()
              return json.loads(body.decode("utf-8")) if body else {}

          def post_issue_comment(body):
              for issue in issues:
                  request("POST", f"issues/{issue}/comments", {"body": body})

          def workflow_runs(workflow, event=None):
              params = {"per_page": 100}
              if event:
                  params["event"] = event
              query = urllib.parse.urlencode(params)
              return request("GET", f"actions/workflows/{workflow}/runs?{query}").get("workflow_runs", [])

          def wait_for_run(workflow, predicate, timeout_seconds=900):
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  matches = [run for run in workflow_runs(workflow) if predicate(run)]
                  if len(matches) == 1:
                      return matches[0]
                  if len(matches) > 1:
                      matches.sort(key=lambda run: run.get("created_at", ""), reverse=True)
                      return matches[0]
                  time.sleep(10)
              raise RuntimeError(f"Timed out locating workflow run for {workflow}")

          def wait_for_completion(run, timeout_seconds=7200):
              deadline = time.time() + timeout_seconds
              run_id = run["id"]
              while time.time() < deadline:
                  current = request("GET", f"actions/runs/{run_id}")
                  if current.get("status") == "completed":
                      return current
                  time.sleep(30)
              raise RuntimeError(f"Timed out waiting for workflow run {run_id}")

          def cancel_tag_race(workflow):
              deadline = time.time() + 120
              while time.time() < deadline:
                  matches = [
                      run for run in workflow_runs(workflow, "push")
                      if run.get("head_sha") == target_sha
                  ]
                  if matches:
                      for run in matches:
                          if run.get("status") != "completed":
                              try:
                                  request("POST", f"actions/runs/{run['id']}/cancel")
                                  print(f"Cancelled automatic tag-triggered run {run['id']} for {workflow}")
                              except urllib.error.HTTPError as exc:
                                  if exc.code not in (409, 422):
                                      raise
                      return
                  time.sleep(5)

          def verify_runtime_sha():
              version_url = f"{api_url}/api/v1/version/"
              headers = {"Accept": "application/json", "X-School-Id": school_id}
              last = None
              for attempt in range(1, 31):
                  req = urllib.request.Request(version_url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          payload = json.loads(response.read().decode("utf-8", "replace"))
                      actual = str(payload.get("build_sha") or "").strip().lower()
                      if actual == target_sha:
                          print(f"Production backend identity verified: {actual}")
                          return
                      last = f"expected={target_sha} actual={actual}"
                  except Exception as exc:
                      last = str(exc)
                  print(f"Backend identity not ready on attempt {attempt}: {last}")
                  time.sleep(10)
              raise RuntimeError("Production backend identity mismatch after deployment: " + str(last))

          def ensure_tag():
              try:
                  existing = request("GET", f"git/ref/tags/{prod_tag}")
                  actual = existing.get("object", {}).get("sha")
                  if actual != target_sha:
                      raise RuntimeError(f"Existing production tag points to wrong SHA: {actual}")
                  print(f"Reusing immutable production tag {prod_tag} -> {actual}")
                  return
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              request("POST", "git/refs", {"ref": f"refs/tags/{prod_tag}", "sha": target_sha})
              print(f"Created immutable production tag {prod_tag} -> {target_sha}")

          def create_temp_branch():
              nonlocal_state = None
              try:
                  request("POST", "git/refs", {"ref": f"refs/heads/{temp_branch}", "sha": target_sha})
                  return True
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise
                  existing = request("GET", f"git/ref/heads/{temp_branch}")
                  if existing.get("object", {}).get("sha") != target_sha:
                      raise RuntimeError("Existing temporary branch points to wrong SHA") from exc
                  return False

          def delete_temp_branch():
              try:
                  request("DELETE", f"git/refs/heads/{temp_branch}")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

          started_at = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          try:
              compare = request("GET", f"compare/{target_sha}...{controller_sha}")
              if compare.get("status") not in {"ahead", "identical"}:
                  raise RuntimeError(f"Controller does not descend from target SHA: {compare.get('status')}")
              target = request("GET", f"commits/{target_sha}")
              if target.get("sha") != target_sha:
                  raise RuntimeError("Target merge commit could not be verified")

              ensure_tag()
              cancel_tag_race(auto_prod_workflow)
              cancel_tag_race(dashboard_workflow)

              prod_dispatch_time = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
              request(
                  "POST",
                  f"actions/workflows/{prod_workflow}/dispatches",
                  {"ref": "main", "inputs": {"deploy_tag": prod_tag, "force_deploy": "true"}},
              )
              prod_run = wait_for_run(
                  prod_workflow,
                  lambda run: run.get("event") == "workflow_dispatch"
                  and run.get("created_at", "") >= prod_dispatch_time,
              )
              prod_run = wait_for_completion(prod_run)
              if prod_run.get("conclusion") != "success":
                  raise RuntimeError(f"Production deployment failed: {prod_run.get('html_url')} conclusion={prod_run.get('conclusion')}")

              verify_runtime_sha()

              temp_branch_created = create_temp_branch()
              dash_dispatch_time = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
              request(
                  "POST",
                  f"actions/workflows/{dashboard_workflow}/dispatches",
                  {
                      "ref": temp_branch,
                      "inputs": {
                          "deploy_label": f"owner-handoff-{target_sha[:7]}",
                          "backend_deploy_tag": prod_tag,
                      },
                  },
              )
              dashboard_run = wait_for_run(
                  dashboard_workflow,
                  lambda run: run.get("event") == "workflow_dispatch"
                  and run.get("head_sha") == target_sha
                  and run.get("created_at", "") >= dash_dispatch_time,
              )
              dashboard_run = wait_for_completion(dashboard_run)
              if dashboard_run.get("conclusion") != "success":
                  raise RuntimeError(f"Dashboard deployment/certification failed: {dashboard_run.get('html_url')} conclusion={dashboard_run.get('conclusion')}")

              post_issue_comment(
                  "OWNER-HANDOFF RELEASE CONTROLLER PASS\n\n"
                  f"Target merge: `{target_sha}`\n"
                  f"Immutable production tag: `{prod_tag}`\n"
                  f"Production deployment: {prod_run.get('html_url')}\n"
                  f"Dashboard deployment/certification: {dashboard_run.get('html_url')}\n"
                  f"Controller: {controller_run_url}\n\n"
                  "The backend runtime identity was verified at the exact target SHA before the dashboard deployment was dispatched. "
                  "Issue closure remains contingent on independent inspection of the production certification artifact and identity reconciliation. "
                  "External payment processing remains disabled and fail closed."
              )
          except Exception as exc:
              post_issue_comment(
                  "OWNER-HANDOFF RELEASE CONTROLLER FAIL\n\n"
                  f"Target merge: `{target_sha}`\n"
                  f"Immutable production tag: `{prod_tag}`\n"
                  f"Controller: {controller_run_url}\n"
                  f"Failure: `{type(exc).__name__}: {exc}`\n\n"
                  "No issue is closed by this controller. External payment processing remains disabled and fail closed."
              )
              raise
          finally:
              delete_temp_branch()
