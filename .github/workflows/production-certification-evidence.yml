name: Production Certification Evidence
run-name: Production Certification Evidence (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      live_frontend_url:
        description: "Deployed frontend URL to certify"
        required: false
        type: string
      live_api_base_url:
        description: "Deployed backend/API base URL expected during certification"
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - frontend/dashboards/package.json
      - frontend/dashboards/package-lock.json
      - frontend/dashboards/playwright.config.ts
      - frontend/dashboards/tests/certification/**
      - .github/workflows/production-certification-evidence.yml
  push:
    branches:
      - main
    paths:
      - frontend/dashboards/package.json
      - frontend/dashboards/package-lock.json
      - frontend/dashboards/playwright.config.ts
      - frontend/dashboards/tests/certification/**
      - .github/workflows/production-certification-evidence.yml

permissions:
  contents: read

concurrency:
  group: production-certification-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-certification-evidence:
    name: Production Certification Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/dashboards

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Mint live certification token
        shell: bash
        env:
          CERT_API_BASE_URL: ${{ inputs.live_api_base_url || vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
          CI_SMOKE_USERNAME: ${{ secrets.CI_SMOKE_USERNAME }}
          CI_SMOKE_PASSWORD: ${{ secrets.CI_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${CERT_API_BASE_URL:-}" ] || [ -z "${CI_SMOKE_USERNAME:-}" ] || [ -z "${CI_SMOKE_PASSWORD:-}" ]; then
            echo "Missing production certification auth settings: CROWN_LIVE_API_BASE_URL, CI_SMOKE_USERNAME, or CI_SMOKE_PASSWORD" >&2
            exit 1
          fi

          TOKEN=$(python -c "import os,sys; exec(\"import json,sys,urllib.error,urllib.request\\nbase = os.environ['CERT_API_BASE_URL'].rstrip('/')\\nusername = os.environ['CI_SMOKE_USERNAME']\\npassword = os.environ['CI_SMOKE_PASSWORD']\\npayload = json.dumps({'username': username, 'password': password}).encode()\\nrequest = urllib.request.Request(f'{base}/api/v1/auth/token/', data=payload, headers={'Content-Type': 'application/json'}, method='POST')\\ntry:\\n    with urllib.request.urlopen(request, timeout=20) as response:\\n        data = json.loads(response.read())\\nexcept urllib.error.HTTPError as error:\\n    body = error.read().decode()\\n    print(f'Token mint failed: {error.code} {body}', file=sys.stderr)\\n    raise SystemExit(1)\\naccess = data.get('access') or data.get('token')\\nif not access:\\n    print(f'No access token in response: {data}', file=sys.stderr)\\n    raise SystemExit(1)\\nprint(access, end='')\")"

          echo "CROWN_DEMO_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run production certification crawler against deployed runtime
        run: npm run certify:production
        env:
          CI: "1"
          CROWN_CERTIFICATION_LIVE_RUNTIME: "1"
          CROWN_EXPECTED_DEPLOYED_SHA: ${{ github.sha }}
          CROWN_LIVE_FRONTEND_URL: ${{ inputs.live_frontend_url || vars.CROWN_LIVE_FRONTEND_URL || 'https://yellow-forest-0eecc8b0f.7.azurestaticapps.net' }}
          CROWN_LIVE_API_BASE_URL: ${{ inputs.live_api_base_url || vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
          CROWN_CERTIFICATION_TENANT_MODE: "sandbox"
          CROWN_DEMO_SCHOOL_ID: ${{ vars.CROWN_DEMO_SCHOOL_ID || '19801b59-8c05-4c84-9312-5d792e4e839d' }}
          CROWN_LIVE_SCHOOL_ID: ${{ vars.CROWN_LIVE_SCHOOL_ID || '' }}
          CROWN_LIVE_SCHOOL_LABEL: ${{ vars.CROWN_LIVE_SCHOOL_LABEL || 'Heritage Christian Academy' }}
          CROWN_LIVE_USE_SANDBOX_CREDENTIALS: "1"
          CROWN_LIVE_SANDBOX_INVITE_ID: ${{ vars.CROWN_LIVE_SANDBOX_INVITE_ID || secrets.CROWN_LIVE_SANDBOX_INVITE_ID || '' }}
          CROWN_DEMO_TOKEN: ${{ env.CROWN_DEMO_TOKEN }}

      - name: Confirm evidence summary exists
        if: always()
        run: |
          test -f ../../audit-artifacts/production-certification/current/certification-summary.md
          test -f ../../audit-artifacts/production-certification/current/certification-matrix.json
          test -f ../../audit-artifacts/production-certification/current/route-results.csv

      - name: Upload production certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-certification-evidence-${{ github.run_number }}-${{ github.sha }}
          path: audit-artifacts/production-certification/current/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-certification-playwright-report-${{ github.run_number }}-${{ github.sha }}
          path: frontend/dashboards/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
