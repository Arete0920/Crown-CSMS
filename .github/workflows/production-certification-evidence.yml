name: Production Certification Evidence
run-name: Production Certification Evidence (${{ github.ref_name }})

on:
  workflow_call:
    inputs:
      live_frontend_url:
        description: "Deployed frontend URL to certify"
        required: true
        type: string
      live_api_base_url:
        description: "Deployed backend/API base URL expected during certification"
        required: true
        type: string
      expected_frontend_sha:
        description: "Exact frontend commit SHA expected in deployed build.json"
        required: true
        type: string
      expected_api_sha:
        description: "Optional backend commit SHA expected from /api/v1/version/"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      live_frontend_url:
        description: "Deployed frontend URL to certify"
        required: false
        default: "https://yellow-forest-0eecc8b0f.7.azurestaticapps.net"
        type: string
      live_api_base_url:
        description: "Deployed backend/API base URL expected during certification"
        required: false
        default: "https://crown-api-prod.azurewebsites.net"
        type: string
      expected_frontend_sha:
        description: "Exact frontend commit SHA expected in deployed build.json"
        required: true
        type: string
      expected_api_sha:
        description: "Optional backend commit SHA expected from /api/v1/version/"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-certification-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-certification-evidence:
    name: Production Certification Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/dashboards

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for exact frontend deployment and backend health
        shell: bash
        env:
          FRONTEND_URL: ${{ inputs.live_frontend_url || vars.CROWN_LIVE_FRONTEND_URL || 'https://yellow-forest-0eecc8b0f.7.azurestaticapps.net' }}
          API_URL: ${{ inputs.live_api_base_url || vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
          EXPECTED_FRONTEND_SHA: ${{ inputs.expected_frontend_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          frontend = os.environ["FRONTEND_URL"].rstrip("/") + "/build.json"
          health = os.environ["API_URL"].rstrip("/") + "/api/health/"
          expected = os.environ["EXPECTED_FRONTEND_SHA"].strip()
          if not expected:
              raise SystemExit("EXPECTED_FRONTEND_SHA is required")

          def fetch(url):
              req = urllib.request.Request(url, headers={"Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", "replace")

          last = []
          for attempt in range(1, 31):
              last = []
              try:
                  status, body = fetch(frontend)
                  payload = json.loads(body)
                  actual = str(payload.get("build_sha") or payload.get("commit") or "").strip()
                  if status != 200:
                      last.append(f"frontend status={status} body={body[:300]}")
                  elif not actual:
                      last.append("frontend build SHA missing")
                  elif not (actual.startswith(expected) or expected.startswith(actual)):
                      last.append(f"frontend SHA expected={expected} actual={actual}")
              except Exception as exc:
                  last.append(f"frontend error={exc}")

              try:
                  status, body = fetch(health)
                  if status != 200:
                      last.append(f"api health status={status} body={body[:300]}")
              except Exception as exc:
                  last.append(f"api health error={exc}")

              if not last:
                  print(f"Azure deployment ready on attempt {attempt}")
                  break

              print(f"Attempt {attempt}/30 not ready: {'; '.join(last)}")
              time.sleep(10)
          else:
              raise SystemExit("Azure deployment did not become ready: " + "; ".join(last))
          PY

      - name: Run production certification crawler against deployed runtime
        run: npm run certify:production
        env:
          CI: "1"
          CROWN_CERTIFICATION_LIVE_RUNTIME: "1"
          CROWN_EXPECTED_FRONTEND_SHA: ${{ inputs.expected_frontend_sha }}
          CROWN_EXPECTED_API_SHA: ${{ inputs.expected_api_sha || '' }}
          CROWN_LIVE_FRONTEND_URL: ${{ inputs.live_frontend_url || vars.CROWN_LIVE_FRONTEND_URL || 'https://yellow-forest-0eecc8b0f.7.azurestaticapps.net' }}
          CROWN_LIVE_API_BASE_URL: ${{ inputs.live_api_base_url || vars.CROWN_LIVE_API_BASE_URL || 'https://crown-api-prod.azurewebsites.net' }}
          CROWN_CERTIFICATION_TENANT_MODE: "sandbox"
          CROWN_DEMO_SCHOOL_ID: ${{ vars.CROWN_DEMO_SCHOOL_ID || '19801b59-8c05-4c84-9312-5d792e4e839d' }}
          CROWN_LIVE_SCHOOL_ID: ${{ vars.CROWN_LIVE_SCHOOL_ID || '' }}
          CROWN_LIVE_SCHOOL_LABEL: ${{ vars.CROWN_LIVE_SCHOOL_LABEL || 'Heritage Christian Academy' }}
          CROWN_LIVE_USE_SANDBOX_CREDENTIALS: "1"
          CROWN_LIVE_SANDBOX_INVITE_ID: ${{ vars.CROWN_LIVE_SANDBOX_INVITE_ID || secrets.CROWN_LIVE_SANDBOX_INVITE_ID || '' }}

      - name: Confirm evidence summary exists
        if: always()
        run: |
          test -f ../../audit-artifacts/production-certification/current/certification-summary.md
          test -f ../../audit-artifacts/production-certification/current/certification-matrix.json
          test -f ../../audit-artifacts/production-certification/current/route-results.csv

      - name: Upload production certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-certification-evidence-${{ github.run_number }}-${{ github.sha }}
          path: audit-artifacts/production-certification/current/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-certification-playwright-report-${{ github.run_number }}-${{ github.sha }}
          path: frontend/dashboards/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
