name: Owner Production Dispatch Command

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/prod-dispatch-e57867b.trigger'

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

concurrency:
  group: owner-prod-dispatch-e57867b
  cancel-in-progress: false

env:
  AUTHORIZED_ACTOR: tcmegahan
  AUTHORIZED_ISSUE: "1630"
  AUTHORIZED_COMMAND: "/deploy-prod prod-deploy-20260726-e57867b force=true"
  INSPECT_COMMAND: "/inspect-prod prod-deploy-20260726-e57867b"
  DEPLOY_TAG: prod-deploy-20260726-e57867b
  EXPECTED_SHA: e57867b198bbfd1676122d30213d3617559f869e

jobs:
  dispatch-production:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 1630 &&
       github.event.comment.user.login == 'tcmegahan' &&
       github.event.comment.body == '/deploy-prod prod-deploy-20260726-e57867b force=true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate authorized trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            test "$COMMENT_ACTOR" = "$AUTHORIZED_ACTOR"
            test "$ISSUE_NUMBER" = "$AUTHORIZED_ISSUE"
            test "$COMMAND_BODY" = "$AUTHORIZED_COMMAND"
          elif [ "$EVENT_NAME" = "push" ]; then
            test "${GITHUB_REF}" = "refs/heads/main"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

      - name: Dispatch existing protected production workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-prod-dispatch.yml',
              ref: 'main',
              inputs: {
                deploy_tag: process.env.DEPLOY_TAG,
                force_deploy: 'true'
              }
            });
            core.info(
              `Dispatched deploy-prod-dispatch.yml for ` +
              `${process.env.DEPLOY_TAG} -> ${process.env.EXPECTED_SHA}`
            );

      - name: Record command acknowledgement
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const commandRun =
              `https://github.com/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              body: [
                'Production dispatch accepted.',
                '',
                `- command run: ${commandRun}`,
                `- trigger event: ${context.eventName}`,
                '- workflow: `.github/workflows/deploy-prod-dispatch.yml`',
                '- tag: `' + process.env.DEPLOY_TAG + '`',
                '- expected SHA: `' + process.env.EXPECTED_SHA + '`',
                '- override: `force_deploy=true`',
                '- production remains **NO-GO / HOLD** pending exact-SHA runtime and P0 evidence.'
              ].join('\n')
            });

  inspect-production:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1630 &&
      github.event.comment.user.login == 'tcmegahan' &&
      github.event.comment.body == '/inspect-prod prod-deploy-20260726-e57867b'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect latest protected production workflow run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-prod-dispatch.yml',
              event: 'workflow_dispatch',
              per_page: 10
            });
            const run = data.workflow_runs[0];
            if (!run) {
              core.setFailed('No production workflow-dispatch run exists.');
              return;
            }
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const jobs = jobsResponse.data.jobs;
            const failedJob = jobs.find(
              (job) => job.conclusion === 'failure'
            );
            const failedStep = failedJob
              ? failedJob.steps.find((step) => step.conclusion === 'failure')
              : null;
            let logExcerpt = 'No failed-job log excerpt required.';
            if (failedJob) {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: failedJob.id
                }
              );
              let text;
              if (typeof response.data === 'string') {
                text = response.data;
              } else if (Buffer.isBuffer(response.data)) {
                text = response.data.toString('utf8');
              } else if (response.data instanceof ArrayBuffer) {
                text = Buffer.from(response.data).toString('utf8');
              } else {
                text = JSON.stringify(response.data);
              }
              const lines = text.split(/\r?\n/);
              let index = -1;
              for (let i = lines.length - 1; i >= 0; i -= 1) {
                if (/##\[error\]/i.test(lines[i])) {
                  index = i;
                  break;
                }
              }
              if (index < 0) {
                const pattern = /ERROR:|AuthorizationFailed|Forbidden|ResourceNotFound|ReadOnlyDisabledSubscription|appsettings list/i;
                for (let i = lines.length - 1; i >= 0; i -= 1) {
                  if (pattern.test(lines[i])) {
                    index = i;
                    break;
                  }
                }
              }
              const anchor = index >= 0 ? index : Math.max(0, lines.length - 20);
              const start = Math.max(0, anchor - 10);
              logExcerpt = lines
                .slice(start, start + 35)
                .join('\n')
                .slice(0, 5000);
            }
            const jobLines = jobs.map(
              (job) => `- ${job.name}: \`${job.status}/${job.conclusion || 'pending'}\``
            );
            const inspectRun =
              `https://github.com/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Latest production deployment inspected read-only.',
              '',
              `- inspection run: ${inspectRun}`,
              `- deployment run id: \`${run.id}\``,
              `- deployment run URL: ${run.html_url}`,
              `- status: \`${run.status}\``,
              `- conclusion: \`${run.conclusion || 'pending'}\``,
              `- head SHA: \`${run.head_sha}\``,
              `- first failed job: \`${failedJob ? failedJob.name : 'none'}\``,
              `- first failed step: \`${failedStep ? failedStep.name : 'none'}\``,
              '',
              'Jobs:',
              ...jobLines,
              '',
              'Bounded failed-job log evidence:',
              '```text',
              logExcerpt,
              '```',
              '',
              '- production remains **NO-GO / HOLD** until exact-SHA runtime and P0 evidence pass.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1648,
              title: `Production deploy ${run.id} inspection evidence`,
              body,
              state: 'closed'
            });

  grant-key-vault-access:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1630 &&
      github.event.comment.user.login == 'tcmegahan' &&
      github.event.comment.body == '/grant-prod-kv-secrets-user'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Azure Login (Service Principal JSON)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Establish least-privilege vault assignment
        id: grant
        shell: bash
        run: |
          set -uo pipefail
          principal_object_id="cc57b92f-f96a-4ab3-b55c-806ff6fc8ec5"
          vault_id="$(az keyvault show \
            --resource-group crown-rg \
            --name crown-kv-prod \
            --query id \
            --output tsv \
            --only-show-errors 2>/tmp/vault_error.txt)"
          if [ -z "$vault_id" ]; then
            echo "result=vault-lookup-failed" >> "$GITHUB_OUTPUT"
            echo "detail=$(tr '\n' ' ' < /tmp/vault_error.txt | cut -c1-600)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing="$(az role assignment list \
            --assignee "$principal_object_id" \
            --scope "$vault_id" \
            --role "Key Vault Secrets User" \
            --query '[0].id' \
            --output tsv \
            --only-show-errors 2>/tmp/list_error.txt || true)"
          if [ -n "$existing" ]; then
            echo "result=already-present" >> "$GITHUB_OUTPUT"
            echo "detail=assignment already exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          az role assignment create \
            --assignee-object-id "$principal_object_id" \
            --assignee-principal-type ServicePrincipal \
            --role "Key Vault Secrets User" \
            --scope "$vault_id" \
            --only-show-errors \
            --output none 2>/tmp/create_error.txt
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "result=created" >> "$GITHUB_OUTPUT"
            echo "detail=least-privilege vault-scoped assignment created" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "detail=$(tr '\n' ' ' < /tmp/create_error.txt | cut -c1-900)" >> "$GITHUB_OUTPUT"
          fi

      - name: Record RBAC repair evidence
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RESULT: ${{ steps.grant.outputs.result }}
          DETAIL: ${{ steps.grant.outputs.detail }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              'Production Key Vault RBAC repair result.',
              '',
              '- vault: `crown-kv-prod`',
              '- scope: vault only',
              '- role: `Key Vault Secrets User`',
              '- principal object id: `cc57b92f-f96a-4ab3-b55c-806ff6fc8ec5`',
              `- result: \`${process.env.RESULT || 'not-run'}\``,
              `- detail: ${process.env.DETAIL || 'none'}`,
              '- no secret values were read or written by this repair step.',
              '- production remains **NO-GO / HOLD** pending rerun evidence.'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1648,
              title: 'Production Key Vault RBAC repair evidence',
              body,
              state: 'closed'
            });

      - name: Fail closed when assignment was not established
        if: >-
          always() &&
          steps.grant.outputs.result != 'created' &&
          steps.grant.outputs.result != 'already-present'
        shell: bash
        run: |
          echo "Key Vault RBAC repair did not establish the required assignment."
          exit 1

      - name: Azure logout
        if: always()
        run: az logout || true
