name: migration-lock-gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "tools/verify_migration_lock_gate.py"
      - ".github/workflows/migration-lock-gate.yml"
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "tools/verify_migration_lock_gate.py"
      - ".github/workflows/migration-lock-gate.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Migration Lock Gate
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///./ci_migration_lock.sqlite3
        run: |
          python tools/verify_migration_lock_gate.py
