name: Repository Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/verify_workflow_policy.py"
      - "tools/verify_mutation_authority.py"
      - "tools/ci/**"
      - "config/security/external_tool_integrations.json"
      - "docs/security/EXTERNAL_TOOL_INTEGRATION_SECURITY_STANDARD.md"
      - "scripts/ci/pr_hygiene_gate.py"
      - "backend/**/*.py"
      - "infra/**"
      - "**/Dockerfile*"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install policy dependencies
        run: python -m pip install pyyaml==6.0.3

      - name: Enforce competitor-name hygiene
        run: python scripts/ci/competitor_name_hygiene.py

      - name: Enforce repository identity and naming hygiene
        run: |
          python tools/tests/test_repository_identity_hygiene.py
          python scripts/ci/repository_identity_hygiene.py

      - name: Run pull-request hygiene
        if: github.event_name == 'pull_request'
        env:
          CROWN_BASE_REF: refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          CROWN_MAX_NORMAL_ADDITIONS: "1500"
          CROWN_MAX_DOC_AUDIT_ADDITIONS: "3000"
          CROWN_MAX_CHANGED_FILES: "20"
        run: |
          # Checkout above uses fetch-depth: 0. Do not shallow-fetch the base SHA:
          # it can hide the merge-base needed for the hygiene gate triple-dot diff.
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          git merge-base "refs/remotes/origin/${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}" >/dev/null
          python scripts/ci/pr_hygiene_gate.py

      - name: Enforce mutation authority policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          python tools/verify_mutation_authority.py --base-ref "$BASE_SHA"

      - name: Resolve workflow changes
        id: workflow_changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '.github/workflows/*.yml' '.github/workflows/*.yaml' > changed-workflows.txt
          if [ -s changed-workflows.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve security-sensitive configuration changes
        id: security_config_changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'infra/**' '**/Dockerfile*' '**/docker-compose*.yml' '**/docker-compose*.yaml' \
            '.github/workflows/*.yml' '.github/workflows/*.yaml' \
            > changed-security-config.txt || true
          if [ -s changed-security-config.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce infrastructure and configuration security
        if: steps.security_config_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Parse workflow YAML
        if: steps.workflow_changes.outputs.changed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          failures = []
          files = sorted(
              path for path in Path('.github/workflows').iterdir()
              if path.is_file() and path.suffix.lower() in {'.yml', '.yaml'}
          )
          for path in files:
              try:
                  with path.open('r', encoding='utf-8') as handle:
                      yaml.safe_load(handle)
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              print('FAIL: workflow YAML parsing errors detected')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)
          print(f'PASS: parsed {len(files)} workflow YAML files')
          PY

      - name: Install actionlint
        if: steps.workflow_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.1/actionlint_1.7.1_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' f53c34493657dfea83b657e4b62cc68c25fbc383dff64c8d581613b037aacaa3 "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Run actionlint
        if: steps.workflow_changes.outputs.changed == 'true'
        run: ./actionlint -color -shellcheck=

      - name: Enforce workflow policy
        run: |
          python tools/verify_workflow_policy.py
          python tools/tests/test_workflow_policy.py

      - name: Enforce CI authoring contracts
        run: |
          python tools/ci/check_no_pr_job_if.py
          python tools/ci/check_workflow_step_names.py
          python tools/ci/check_dependency_audit_loadtest.py

      - name: Enforce candidate validation before production mutation
        run: |
          python tools/verify_release_candidate_order.py
          python tools/tests/test_release_candidate_order.py

      - name: Enforce bounded artifact evidence policy
        run: |
          python tools/ci/verify_artifact_policy.py
          python -m unittest discover -s tools/ci -p 'test_verify_artifact_policy.py' -v

      - name: Verify backend dependency lock
        run: |
          python tools/ci/verify_backend_lock.py
          python -m unittest discover -s tools/ci -p 'test_verify_backend_lock.py' -v

      - name: Test CI metrics accounting
        run: python -m unittest discover -s tools/ci -p 'test_report_ci_metrics.py' -v

      - name: Verify reviewed CI tool pins
        run: |
          python tools/ci/verify_ci_tool_pins.py
          python -m unittest discover -s tools/ci -p 'test_verify_ci_tool_pins.py' -v

      - name: Validate ISO 27001 Annex A intake and claims
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/ci -p 'test_verify_iso27001_soa.py' -v
          python tools/ci/verify_iso27001_soa.py

      - name: Enforce external tool integration security
        run: python tools/ci/verify_tool_integration_security.py

      - name: Verify DevSecOps maturity evidence integrity
        run: |
          python tools/ci/verify_devsecops_maturity.py
          python -m unittest discover -s tools/ci -p 'test_verify_devsecops_maturity.py' -v

      - name: Report no workflow changes
        if: steps.workflow_changes.outputs.changed != 'true'
        run: echo "No workflow files changed; changed-file lint checks were skipped; complete workflow policy was enforced."
