name: Frozen Repository Notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    name: Repository is frozen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report frozen status
        shell: bash
        run: |
          cat <<'EOF'
          CROWN is under an owner-directed repository freeze.

          Production is NOT APPROVED / NO-GO / HOLD.
          Buyer operational turnover is NOT APPROVED.
          External payment processing remains disabled and must fail closed.

          The former P0 readiness workflow has been retired. This manual-only
          notice performs no Azure login, deployment probe, certification run,
          artifact generation, issue posting, or production authorization.
          EOF
