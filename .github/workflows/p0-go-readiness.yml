name: P0 GO Readiness Evidence

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected SHA to prove against; defaults to workflow SHA"
        required: false
        type: string
      run_azure_probe:
        description: "Run Azure P0 parity probe using configured Azure secrets"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  group: p0-go-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p0-go-readiness:
    name: P0 GO Readiness Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CROWN_ENV: production
      CROWN_ALLOW_SAMPLE_DASHBOARD_PAYLOADS: "0"
      TENANT_HEADER_REQUIRED: "0"
      VITE_SANDBOX_READY_ONLY: "true"
      VITE_HIDE_UNREADY_NAV: "true"
      VITE_SANDBOX_MODE: "1"
      DJANGO_SECRET_KEY: p0-go-readiness-ci-only
      DATABASE_URL: sqlite:///./ci.sqlite3
      DJANGO_SETTINGS_MODULE: crown_api.settings
      AZURE_CREDENTIALS_FOR_LOGIN: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Determine expected SHA
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          INPUT_SHA="${{ github.event.inputs.expected_sha || '' }}"
          if [ -n "$INPUT_SHA" ]; then
            EXPECTED_SHA="$INPUT_SHA"
          else
            EXPECTED_SHA="${{ github.sha }}"
          fi
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character lowercase hex SHA: $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install backend dependencies
        id: backend_dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install frontend dependencies
        id: frontend_dependencies
        working-directory: frontend/dashboards
        run: npm ci

      - name: Azure Login using service principal JSON
        id: azure_login_sp
        if: ${{ github.event.inputs.run_azure_probe != 'false' && env.AZURE_CREDENTIALS_FOR_LOGIN != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Login using OIDC
        id: azure_login_oidc
        if: ${{ github.event.inputs.run_azure_probe != 'false' && env.AZURE_CREDENTIALS_FOR_LOGIN == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure P0 current parity probe
        id: azure_parity
        if: ${{ github.event.inputs.run_azure_probe != 'false' }}
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/execution/997_azure_p0_current_parity_probe.ps1 -ExpectedSha "${{ steps.expected.outputs.expected_sha }}"

      - name: Run finish-right gauntlet
        id: finish_right
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.expected.outcome == 'success' && steps.backend_dependencies.outcome == 'success' && steps.frontend_dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/execution/999_finish_right_4h_gauntlet.ps1

      - name: Extract generated P0 summaries
        id: evidence_summary
        if: always()
        shell: pwsh
        run: |
          $lines = New-Object System.Collections.Generic.List[string]
          $azure = Get-ChildItem -Path audit-artifacts -Filter 00_AZURE_P0_SUMMARY.json -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($azure) {
            $summary = Get-Content $azure.FullName -Raw | ConvertFrom-Json
            $lines.Add("### Azure parity evidence")
            $lines.Add("- verdict: **$($summary.verdict)**")
            foreach ($check in @($summary.checks | Where-Object { -not $_.pass })) {
              $lines.Add("- FAIL - $($check.name): $($check.detail)")
            }
          } else {
            $lines.Add("### Azure parity evidence")
            $lines.Add("- summary artifact: **NOT GENERATED**")
          }
          $finish = Get-ChildItem -Path audit-artifacts -Filter "*SUMMARY*.json" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'finish-right-4h' } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $lines.Add("")
          $lines.Add("### Finish-right evidence")
          if ($finish) {
            $lines.Add("- summary: $($finish.FullName)")
          } else {
            $lines.Add("- summary artifact: **NOT GENERATED**")
          }
          $delimiter = "P0SUMMARY_$([guid]::NewGuid().ToString('N'))"
          "details<<$delimiter" | Add-Content $env:GITHUB_OUTPUT
          $lines | Add-Content $env:GITHUB_OUTPUT
          $delimiter | Add-Content $env:GITHUB_OUTPUT

      - name: Upload P0 GO evidence artifacts
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-go-readiness-${{ github.run_number }}-${{ steps.expected.outputs.expected_sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            audit-artifacts/azure-p0-current-parity-*/**
            audit-artifacts/finish-right-4h-*/**
            .crown-audit/**
            frontend/dashboards/test-results/**
            frontend/dashboards/playwright-report/**
            frontend/dashboards/artifacts/**

      - name: Report P0 result to dedicated ledger and Lane 6
        id: report_result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const expectedSha = '${{ steps.expected.outputs.expected_sha || github.sha }}';
            const azureFailed = '${{ steps.azure_parity.outcome }}' === 'failure';
            const finishFailed = '${{ steps.finish_right.outcome }}' === 'failure';
            const setupFailed = ['${{ steps.checkout.outcome }}','${{ steps.expected.outcome }}','${{ steps.setup_python.outcome }}','${{ steps.backend_dependencies.outcome }}','${{ steps.setup_node.outcome }}','${{ steps.frontend_dependencies.outcome }}'].includes('failure');
            const conclusion = (azureFailed || finishFailed || setupFailed) ? 'FAILURE' : 'SUCCESS';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcomes = [
              ['checkout', '${{ steps.checkout.outcome }}'],
              ['expected_sha', '${{ steps.expected.outcome }}'],
              ['setup_python', '${{ steps.setup_python.outcome }}'],
              ['backend_dependencies', '${{ steps.backend_dependencies.outcome }}'],
              ['setup_node', '${{ steps.setup_node.outcome }}'],
              ['frontend_dependencies', '${{ steps.frontend_dependencies.outcome }}'],
              ['azure_login_sp', '${{ steps.azure_login_sp.outcome }}'],
              ['azure_login_oidc', '${{ steps.azure_login_oidc.outcome }}'],
              ['azure_parity', '${{ steps.azure_parity.outcome }}'],
              ['finish_right', '${{ steps.finish_right.outcome }}'],
              ['evidence_summary', '${{ steps.evidence_summary.outcome }}'],
              ['upload_evidence', '${{ steps.upload_evidence.outcome }}']
            ];
            const outcomeLines = outcomes.map(([name, outcome]) => `- ${name}: **${(outcome || 'not_run').toUpperCase()}**`);
            const details = `${{ steps.evidence_summary.outputs.details }}`;
            const ledgerBody = [
              '## Automated P0 readiness result',
              '',
              `- Exact SHA: \`${expectedSha}\``,
              `- Workflow conclusion: **${conclusion}**`,
              `- Trigger: \`${context.eventName}\``,
              `- Run: ${runUrl}`,
              '',
              '### Step outcomes',
              ...outcomeLines,
              '',
              details,
              '',
              conclusion === 'SUCCESS'
                ? 'This run may be used as Lane 6 evidence after its uploaded artifacts and runtime SHA-parity output are reviewed.'
                : 'Production remains **NO-GO / HOLD**. Inspect the failed checks and linked artifacts before any rerun or repair.'
            ].join('\n');
            const ledgerComment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1640,
              body: ledgerBody
            });
            const laneBody = [
              '## Automated P0 ledger update',
              '',
              `- Exact SHA: \`${expectedSha}\``,
              `- Workflow conclusion: **${conclusion}**`,
              `- Evidence: ${ledgerComment.data.html_url}`,
              `- Run: ${runUrl}`,
              '',
              conclusion === 'SUCCESS'
                ? 'Review the ledger entry and artifacts before changing Lane 6 status.'
                : 'Production remains **NO-GO / HOLD**.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1630,
              body: laneBody
            });

      - name: Enforce P0 result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.azure_parity.outcome }}" = "failure" ] || [ "${{ steps.finish_right.outcome }}" = "failure" ]; then
            echo "P0 evidence contains one or more failed lanes." >&2
            exit 1
          fi
