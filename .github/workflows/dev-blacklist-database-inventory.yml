name: DEV Blacklist Database Inventory (read-only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Accepted main SHA (40 characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crown-dev-blacklist-db-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Verify accepted main identity
        env:
          SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SHA"
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'
      - name: Verify collector boundary (offline)
        run: python -m unittest discover -s scripts/ops -p test_read_dev_blacklist_state.py -v
      - name: Authenticate to existing DEV Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.3.6'
      - name: Collect DEV schema (read-only)
        env:
          SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/ops/read_dev_blacklist_state.py --expected-sha "$SHA" > dev-blacklist-state.json
      - name: Preserve redacted evidence
        if: always() && hashFiles('dev-blacklist-state.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-blacklist-schema-${{ github.run_id }}
          path: dev-blacklist-state.json
          retention-days: 7
          if-no-files-found: error
      - name: Discard local evidence
        if: always()
        run: rm -f dev-blacklist-state.json
      - name: Logout Azure
        if: always()
        run: az logout
