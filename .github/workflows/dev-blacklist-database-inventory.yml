name: DEV Blacklist Database Inventory (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dev-blacklist-database-inventory.yml'
      - 'scripts/ops/reviewed_dev_support_migrations.py'
      - 'scripts/ops/test_reviewed_dev_support_migrations.py'
      - 'scripts/ops/run_dev_inquiry_migration.py'
      - 'scripts/ops/read_dev_school_census.py'
      - 'scripts/ops/test_read_dev_school_census.py'
  # Protected-main push uses the existing OIDC-authenticated DEV read-only job.
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-blacklist-database-inventory.yml'
      - 'scripts/ops/read_dev_school_census.py'
      - 'scripts/ops/test_read_dev_school_census.py'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Accepted main SHA (40 characters)
        required: true
        type: string
      compare_rehearsal_baseline:
        description: "Compare live DEV baseline components without writing (issue #427)"
        required: false
        type: boolean
        default: false
      apply_reviewed_support:
        description: "Explicit DEV-only support 0002+0003 compatibility stage"
        required: false
        type: boolean
        default: false
      confirm_dev_support:
        description: "Type migrate-dev-support for schema changes; or crown269-reference-metadata-only for #269 READ-ONLY"
        required: false
        type: string
        default: ""
      apply_reviewed_legacy_refresh:
        description: "Separate explicit DEV-only reviewed CRM + legacy refresh stage"
        required: false
        type: boolean
        default: false
      confirm_dev_legacy_refresh:
        description: "Type migrate-dev-legacy-refresh for the DEV-only legacy stage"
        required: false
        type: string
        default: ""
      inspect_migration_plan:
        description: Inspect pending DEV migrations without applying schema changes
        required: false
        type: boolean
        default: false
      apply_reviewed_blacklist:
        description: "Explicit DEV-only SimpleJWT schema stage; does not activate runtime"
        required: false
        type: boolean
        default: false
      confirm_dev_blacklist:
        description: "Type migrate-dev-blacklist for the DEV-only schema stage"
        required: false
        type: string
        default: ""
      dev_release_forensics:
        description: "Manual read-only DEV image and Activity Log report"
        required: false
        type: boolean
        default: false
      dev_recovery_receipt:
        description: "Operator-verified current DEV backup/restore receipt URL; no secrets"
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: crown-dev-blacklist-db-readonly
  cancel-in-progress: false
jobs:
  two-fixed-reference-gets:
    # Never run as part of an existing inventory push/PR, migration stage or DEV deployment.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Arete0920/Crown-CSMS' && inputs.confirm_dev_support == 'crown269-reference-metadata-only' && inputs.dev_release_forensics != true
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject mixed or stale #269 dispatch before Azure authentication
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
          APPLY_SUPPORT: ${{ inputs.apply_reviewed_support }}
          APPLY_LEGACY_REFRESH: ${{ inputs.apply_reviewed_legacy_refresh }}
          APPLY_BLACKLIST: ${{ inputs.apply_reviewed_blacklist }}
          COMPARE_BASELINE: ${{ inputs.compare_rehearsal_baseline }}
          INSPECT_MIGRATIONS: ${{ inputs.inspect_migration_plan }}
          CONFIRM_SUPPORT: ${{ inputs.confirm_dev_support }}
          CONFIRM_LEGACY: ${{ inputs.confirm_dev_legacy_refresh }}
          CONFIRM_BLACKLIST: ${{ inputs.confirm_dev_blacklist }}
          DEV_RECOVERY_RECEIPT: ${{ inputs.dev_recovery_receipt }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = Arete0920/Crown-CSMS
          test "$GITHUB_REPOSITORY_ID" = 1339719218
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$APPLY_SUPPORT" = false
          test "$APPLY_LEGACY_REFRESH" = false
          test "$APPLY_BLACKLIST" = false
          test "$COMPARE_BASELINE" = false
          test "$INSPECT_MIGRATIONS" = false
          test "$CONFIRM_SUPPORT" = crown269-reference-metadata-only
          test -z "$CONFIRM_LEGACY"
          test -z "$CONFIRM_BLACKLIST"
          test -z "$DEV_RECOVERY_RECEIPT"
      - name: Checkout immutable expected main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify accepted main has not moved
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify metadata-only boundary contracts before Azure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyyaml==6.0.3
          python -m py_compile scripts/ops/crown269_reference_metadata_readonly.py
          python -m unittest discover -s scripts/ops -p test_crown269_reference_metadata_readonly.py -v
      - name: Authenticate using existing DEV OIDC identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read only two fixed Key Vault reference statuses
        shell: bash
        env:
          CROWN269_EXPECTED_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          CROWN269_EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/ops/crown269_reference_metadata_readonly.py \
            --receipt "$RUNNER_TEMP/crown269-dev-reference-metadata.json"
      - name: Retain redacted #269 metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crown269-dev-reference-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/crown269-dev-reference-metadata.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Discard local #269 receipt and Azure session
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/crown269-dev-reference-metadata.json"
          az logout >/dev/null 2>&1 || true
  dev-release-forensics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Arete0920/Crown-CSMS' && inputs.dev_release_forensics == true
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject mixed authority or stale main before Azure login
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected_sha }}
          APPLY_SUPPORT: ${{ inputs.apply_reviewed_support }}
          APPLY_LEGACY: ${{ inputs.apply_reviewed_legacy_refresh }}
          APPLY_BLACKLIST: ${{ inputs.apply_reviewed_blacklist }}
          COMPARE: ${{ inputs.compare_rehearsal_baseline }}
          INSPECT: ${{ inputs.inspect_migration_plan }}
          CONFIRM_SUPPORT: ${{ inputs.confirm_dev_support }}
          CONFIRM_LEGACY: ${{ inputs.confirm_dev_legacy_refresh }}
          CONFIRM_BLACKLIST: ${{ inputs.confirm_dev_blacklist }}
          RECEIPT: ${{ inputs.dev_recovery_receipt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1339719218
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED" = "$GITHUB_SHA"
          test "$APPLY_SUPPORT" = false
          test "$APPLY_LEGACY" = false
          test "$APPLY_BLACKLIST" = false
          test "$COMPARE" = false
          test "$INSPECT" = false
          test -z "$CONFIRM_SUPPORT"
          test -z "$CONFIRM_LEGACY"
          test -z "$CONFIRM_BLACKLIST"
          test -z "$RECEIPT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify accepted source is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Login with existing DEV federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Collect sanitized DEV configuration-change evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess

          def az(*args):
              p = subprocess.run(["az", *args, "--only-show-errors", "-o", "json"],
                                 capture_output=True, text=True, timeout=70)
              if p.returncode:
                  raise RuntimeError("Azure read denied or unavailable")
              return json.loads(p.stdout)

          report = {"release_certified": False, "mode": "READ_ONLY"}
          try:
              config = az("webapp", "config", "show", "-g", "crown-rg", "-n", "crown-api-dev",
                          "--query", "linuxFxVersion")
              report["image"] = config if isinstance(config, str) and re.fullmatch(
                  r"DOCKER\|crownregistry\.azurecr\.io/crown2026:(dev-[0-9a-f]{40}|dev-latest)", config
              ) else "UNVERIFIED"
          except (RuntimeError, subprocess.TimeoutExpired, ValueError):
              report["image"] = "UNAVAILABLE"
          try:
              rows = az("webapp", "config", "appsettings", "list", "-g", "crown-rg", "-n", "crown-api-dev",
                        "--query", "[?name=='BUILD_SHA'||name=='DEPLOY_RUN_ID'||name=='DEPLOY_WORKFLOW'].{name:name,value:value}")
              allowed = {"BUILD_SHA", "DEPLOY_RUN_ID", "DEPLOY_WORKFLOW"}
              identity = {row["name"]: row["value"] for row in rows if isinstance(row, dict) and row.get("name") in allowed}
              report["identity"] = {
                  "BUILD_SHA": identity.get("BUILD_SHA") if re.fullmatch(r"[0-9a-f]{40}", str(identity.get("BUILD_SHA", ""))) else "UNVERIFIED",
                  "DEPLOY_RUN_ID": identity.get("DEPLOY_RUN_ID") if re.fullmatch(r"[1-9][0-9]*", str(identity.get("DEPLOY_RUN_ID", ""))) else "UNVERIFIED",
                  "DEPLOY_WORKFLOW": identity.get("DEPLOY_WORKFLOW") if identity.get("DEPLOY_WORKFLOW") == "DEV Deploy (protected main)" else "UNVERIFIED"}
          except (RuntimeError, subprocess.TimeoutExpired, ValueError, TypeError, KeyError):
              report["identity"] = "UNAVAILABLE"
          try:
              logs = az("monitor", "activity-log", "list", "--resource-group", "crown-rg",
                        "--start-time", "2026-11-18T21:30:00Z", "--max-events", "1000")
              sub = az("account", "show", "--query", "id")
              if not isinstance(logs, list) or not isinstance(sub, str):
                  raise RuntimeError("Invalid Azure response")
              prefix = ("/subscriptions/" + sub + "/resourceGroups/crown-rg/providers/Microsoft.Web/sites/crown-api-dev").lower()
              events = []
              for entry in logs:
                  if not isinstance(entry, dict):
                      continue
                  rid = entry.get("resourceId", "")
                  if not isinstance(rid, str) or not (rid.lower() == prefix or rid.lower().startswith(prefix + "/")):
                      continue
                  name = entry.get("operationName")
                  op = name.get("value", "") if isinstance(name, dict) else ""
                  if not isinstance(op, str) or not op.lower().startswith("microsoft.web/"):
                      continue
                  status = entry.get("status")
                  caller = entry.get("caller")
                  corr = entry.get("correlationId", "")
                  events.append({"time": entry.get("eventTimestamp", "UNVERIFIED"),
                                 "operation": op[:120],
                                 "status": status.get("value", "") if isinstance(status, dict) else "UNVERIFIED",
                                 "correlation_id": corr if re.fullmatch(r"[a-fA-F0-9-]{36}", str(corr)) else "UNVERIFIED",
                                 "caller_hash": hashlib.sha256(caller.encode()).hexdigest()[:12] if isinstance(caller, str) and caller else "UNAVAILABLE"})
              report["activity"] = {"status": "PARTIAL" if len(logs) >= 1000 or len(events) > 100 else "COLLECTED",
                                    "matching_count": len(events), "events": events[:100]}
          except (RuntimeError, subprocess.TimeoutExpired, ValueError, TypeError):
              report["activity"] = {"status": "UNAVAILABLE", "events": []}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## DEV release configuration forensics (not certification)\n\n")
              out.write("~~~json\n" + json.dumps(report, indent=2, sort_keys=True) + "\n~~~\n")
          if (report["image"] in ("UNVERIFIED", "UNAVAILABLE")
                  or not isinstance(report["identity"], dict)
                  or any(value == "UNVERIFIED" for value in report["identity"].values())
                  or report["activity"]["status"] != "COLLECTED"):
              raise SystemExit("Azure evidence incomplete: do not deploy.")
          PY
      - name: End Azure session
        if: always()
        shell: bash
        run: az logout >/dev/null 2>&1 || true
  support-contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned test-only YAML parser
        run: python -m pip install pyyaml==6.0.3
      - name: Test pinned support migrations and negative authority contracts
        run: |
          python -m unittest discover -s scripts/ops -p test_reviewed_dev_support_migrations.py -v
          python -m unittest discover -s scripts/ops -p test_run_dev_inquiry_migration.py -v
          python -m unittest discover -s scripts/ops -p test_reviewed_legacy_refresh_migrations.py -v
          python -m unittest discover -s scripts/ops -p test_dev_blacklist_workflow_stage.py -v
          python -m unittest discover -s scripts/ops -p test_read_dev_school_census.py -v
          python -m unittest discover -s scripts/ops -p test_crown269_reference_metadata_readonly.py -v
  inspect:
    if: github.ref == 'refs/heads/main' && inputs.confirm_dev_support != 'crown269-reference-metadata-only' && inputs.apply_reviewed_support != true && inputs.apply_reviewed_legacy_refresh != true && inputs.apply_reviewed_blacklist != true && inputs.dev_release_forensics != true
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
      - name: Verify accepted main identity
        env:
          SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify collector boundary (offline)
        run: python -m unittest discover -s scripts/ops -p test_read_dev_blacklist_state.py -v
      - name: Install accepted migration inspection dependencies
        if: inputs.inspect_migration_plan
        run: |
          # The migration-boundary regression test imports yaml; the backend
          # requirements deliberately do not provide this test-only parser.
          python -m pip install pyyaml==6.0.3
          python -m pip install -r backend/requirements.txt
      - name: Install baseline comparison dependencies
        if: inputs.compare_rehearsal_baseline
        run: |
          python -m pip install pyyaml==6.0.3
          python -m pip install -r backend/requirements.txt
      - name: Verify baseline diagnostic boundary (offline)
        if: inputs.compare_rehearsal_baseline
        run: python -m unittest discover -s scripts/ops -p test_inspect_dev_baseline_components.py -v
      - name: Verify migration inspection boundary (offline)
        if: inputs.inspect_migration_plan
        run: |
          python -m unittest discover -s scripts/ops -p test_run_dev_inquiry_migration.py -v
          python -m unittest discover -s scripts/ops -p test_reviewed_legacy_refresh_migrations.py -v
      - name: Authenticate to existing DEV Azure
        id: azure_login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.3.6'
      - name: Verify census evidence boundary (offline)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s scripts/ops -p test_read_dev_school_census.py -v
      - name: Collect DEV school counts (read-only, protected main)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/ops/read_dev_school_census.py --expected-sha "$SHA" > dev-school-census.json
          # The collector emits only sanitized aggregate counts, school hashes
          # and fixed status fields, so the live result remains readable in CI
          # even when artifact downloads are unavailable to the operator.
          cat dev-school-census.json
      - name: Retain sanitized school count evidence
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dev-school-census.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-school-census-${{ github.run_id }}
          path: dev-school-census.json
          retention-days: 7
          if-no-files-found: error
      - name: Discard local school count evidence
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: rm -f dev-school-census.json
      - name: Collect DEV schema (read-only)
        env:
          SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/ops/read_dev_blacklist_state.py --expected-sha "$SHA" > dev-blacklist-state.json
      - name: Inspect all pending DEV migrations without applying
        if: inputs.inspect_migration_plan
        env:
          SHA: ${{ inputs.expected_sha }}
        # No schema change: this displays the full pending Django migration graph,
        # not an allowlist. Existing exact-source, TLS and identity checks apply.
        # Masking commands must stay on Actions stdout, never in stored artifacts.
        run: python scripts/ops/run_dev_inquiry_migration.py --expected-sha "$SHA" --inspect-all-migrations
      - name: Compare DEV baseline components (read-only)
        if: inputs.compare_rehearsal_baseline
        env:
          SHA: ${{ inputs.expected_sha }}
        run: |
          python scripts/ops/inspect_dev_baseline_components.py \
            --expected-sha "$SHA" \
            --columns 5b3c533fdf3de6c4b015545a2049e21335ece6aed49c430a940d3565c16fcb06 \
            --rows e80c1574f64ef9445b4bd2b1f2ce3428c14e2bd1216b95cd17bfade48342fb49 \
            --combined 6e287a66d9c47d57433e0ac68769c5a318a5a4e7f283487d8cf6191dd081c996
      - name: Preserve redacted evidence
        if: always() && hashFiles('dev-blacklist-state.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-blacklist-schema-${{ github.run_id }}
          path: dev-blacklist-state.json
          retention-days: 7
          if-no-files-found: error
      - name: Discard local evidence
        if: always()
        run: rm -f dev-blacklist-state.json
      - name: Logout Azure
        if: always() && steps.azure_login.outcome == 'success'
        run: az logout

  stage-reviewed-dev-migrations:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_dev_support != 'crown269-reference-metadata-only' && (inputs.apply_reviewed_support == true || inputs.apply_reviewed_legacy_refresh == true || inputs.apply_reviewed_blacklist == true) && inputs.dev_release_forensics != true
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require exact authority before any Azure login
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SUPPORT_MODE: ${{ inputs.apply_reviewed_support }}
          LEGACY_MODE: ${{ inputs.apply_reviewed_legacy_refresh }}
          CONFIRM_SUPPORT: ${{ inputs.confirm_dev_support }}
          CONFIRM_LEGACY: ${{ inputs.confirm_dev_legacy_refresh }}
          INSPECT_PLAN: ${{ inputs.inspect_migration_plan }}
          BLACKLIST_MODE: ${{ inputs.apply_reviewed_blacklist }}
          CONFIRM_BLACKLIST: ${{ inputs.confirm_dev_blacklist }}
          RECOVERY_RECEIPT: ${{ inputs.dev_recovery_receipt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$INSPECT_PLAN" != true
          # Fail closed before Azure login: exactly one stage and only its confirmation.
          selected=0
          for flag in "$SUPPORT_MODE" "$LEGACY_MODE" "$BLACKLIST_MODE"; do
            if [[ "$flag" == "true" ]]; then selected=$((selected + 1)); fi
          done
          test "$selected" -eq 1 || { echo 'BLOCKED: choose exactly one reviewed DEV migration stage' >&2; exit 1; }
          if [[ "$SUPPORT_MODE" == "true" ]]; then
            test "$CONFIRM_SUPPORT" = migrate-dev-support
            test -z "$CONFIRM_LEGACY"
            test -z "$CONFIRM_BLACKLIST"
            test -z "$RECOVERY_RECEIPT"
          elif [[ "$LEGACY_MODE" == "true" ]]; then
            test "$CONFIRM_LEGACY" = migrate-dev-legacy-refresh
            test -z "$CONFIRM_SUPPORT"
            test -z "$CONFIRM_BLACKLIST"
            test -z "$RECOVERY_RECEIPT"
          elif [[ "$BLACKLIST_MODE" == "true" ]]; then
            test "$CONFIRM_BLACKLIST" = migrate-dev-blacklist
            test -z "$CONFIRM_SUPPORT"
            test -z "$CONFIRM_LEGACY"
            # URI syntax is not proof of a current tested recovery point.
            [[ "$RECOVERY_RECEIPT" =~ ^https://github[.]com/Arete0920/Crown-CSMS/actions/runs/[0-9]+$ ]] || {
              echo 'BLOCKED: current DEV recovery evidence reference is required' >&2; exit 1;
            }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current accepted protected main
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify both fail-closed migration-stage contracts without Azure
        run: |
          python -m pip install pyyaml==6.0.3
          python -m unittest discover -s scripts/ops -p test_reviewed_dev_support_migrations.py -v
          python -m unittest discover -s scripts/ops -p test_reviewed_legacy_refresh_migrations.py -v
          python -m unittest discover -s scripts/ops -p test_run_dev_inquiry_migration.py -v
          python -m unittest discover -s scripts/ops -p test_dev_blacklist_workflow_stage.py -v
      - name: Install reviewed backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Authenticate existing DEV only
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Stage only the selected reviewed DEV migrations under PostgreSQL lock
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SUPPORT_MODE: ${{ inputs.apply_reviewed_support }}
          BLACKLIST_MODE: ${{ inputs.apply_reviewed_blacklist }}
        run: |
          set -euo pipefail
          if [[ "$BLACKLIST_MODE" == "true" ]]; then
            python scripts/ops/run_dev_inquiry_migration.py \
              --expected-sha "$EXPECTED_SHA" \
              --apply-reviewed-blacklist \
              --confirm-dev-blacklist migrate-dev-blacklist
          elif [[ "$SUPPORT_MODE" == "true" ]]; then
            python scripts/ops/run_dev_inquiry_migration.py \
              --expected-sha "$EXPECTED_SHA" \
              --apply-reviewed-support \
              --confirm-dev-support migrate-dev-support
          else
            python scripts/ops/run_dev_inquiry_migration.py \
              --expected-sha "$EXPECTED_SHA" \
              --apply-reviewed-legacy-refresh \
              --confirm-dev-legacy-refresh migrate-dev-legacy-refresh
          fi
      - name: Record stage boundary
        if: always()
        run: |
          {
            echo '## DEV explicitly reviewed schema stage'
            echo 'Target: crown-api-dev only, approved exact main SHA'
            echo 'Select exactly one: support 0002+0003, CRM 0002+legacy refresh 0014, OR vendor-reviewed SimpleJWT blacklist migrations'
            echo 'Blacklist mode requires typed confirmation and current DEV recovery receipt reference'
            echo 'Schema only: does not enable SimpleJWT, deploy code or authorize unrelated migrations'
            echo 'Live application image unchanged; DEV runtime NOT CERTIFIED'
            echo 'A passing job is not backup/restore or production authorization'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logout Azure
        if: always()
        run: az logout || true
