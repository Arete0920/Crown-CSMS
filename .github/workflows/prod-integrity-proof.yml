name: prod-integrity-proof

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable production deployment tag"
        required: true
        type: string
      expected_sha:
        description: "Expected deployed full 40-character commit SHA"
        required: true
        type: string
      health_url:
        description: "Production health endpoint URL"
        required: true
        default: "https://crown-api-prod.azurewebsites.net/api/health/"
        type: string

concurrency:
  group: prod-integrity-proof-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Validate explicit proof inputs
        id: target
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_HEALTH_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail

          if [[ -z "$INPUT_TAG" || "$INPUT_TAG" != prod-deploy-* ]]; then
            echo "ERROR: tag must be present and match prod-deploy-*"
            exit 1
          fi

          if [[ ! "$INPUT_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: expected_sha must be a lowercase full 40-character commit SHA"
            exit 1
          fi

          if [[ ! "$INPUT_HEALTH_URL" =~ ^https:// ]]; then
            echo "ERROR: health_url must use https://"
            exit 1
          fi

          {
            echo "tag=$INPUT_TAG"
            echo "expected_sha=$INPUT_EXPECTED_SHA"
            echo "health_url=$INPUT_HEALTH_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout expected source identity
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          fetch-depth: 0

      - name: Verify tag resolves to expected SHA
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag_sha="$(git rev-list -n 1 "$TAG")"
          checked_out_sha="$(git rev-parse HEAD)"

          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: deployment tag does not resolve to expected SHA"
            echo "tag=$TAG tag_sha=$tag_sha expected_sha=$EXPECTED_SHA"
            exit 1
          fi

          if [[ "$checked_out_sha" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: checked-out SHA does not match expected SHA"
            echo "checked_out_sha=$checked_out_sha expected_sha=$EXPECTED_SHA"
            exit 1
          fi

      - name: Fetch production health payload
        shell: bash
        env:
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
        run: |
          set -euo pipefail
          curl --max-time 30 --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/production-health.json" \
            "$HEALTH_URL"
          jq -e . "$RUNNER_TEMP/production-health.json" >/dev/null

      - name: Assert healthy status and deployed SHA parity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          TAG: ${{ steps.target.outputs.tag }}
          HEALTH_PAYLOAD_PATH: ${{ runner.temp }}/production-health.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          expected = os.environ["EXPECTED_SHA"]
          tag = os.environ["TAG"]
          payload_path = Path(os.environ["HEALTH_PAYLOAD_PATH"])
          data = json.loads(payload_path.read_text(encoding="utf-8"))

          healthy = data.get("status") == "healthy" or data.get("ok") is True
          if not healthy:
              print(f"FAIL: production health contract is not healthy for {tag}")
              print(json.dumps(data, indent=2, sort_keys=True))
              sys.exit(2)

          candidates = (
              "build_sha",
              "BUILD_SHA",
              "sha",
              "git_sha",
              "commit",
              "commit_sha",
              "build",
              "revision",
              "version",
              "release_sha",
          )

          found = None
          for key in candidates:
              value = data.get(key)
              if isinstance(value, str) and value.strip():
                  found = value.strip()
                  break

          def walk(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      key_l = str(key).lower()
                      if isinstance(value, str) and value.strip() and (
                          "sha" in key_l or key_l in {"commit", "revision", "version"}
                      ):
                          return value.strip()
                      child = walk(value)
                      if child:
                          return child
              elif isinstance(node, list):
                  for item in node:
                      child = walk(item)
                      if child:
                          return child
              return None

          if not found:
              found = walk(data)

          if not found:
              print("ERROR: health payload did not contain a recognized deployed identity")
              print(json.dumps(data, indent=2, sort_keys=True))
              sys.exit(3)

          if not re.fullmatch(r"[0-9a-f]{40}", found):
              print(f"FAIL: deployed identity is not a full lowercase SHA: {found}")
              sys.exit(4)

          if found != expected:
              print(f"FAIL: deployed SHA mismatch for {tag}")
              print(f"Expected: {expected}")
              print(f"Found:    {found}")
              sys.exit(5)

          print(f"PASS: production is healthy and deployed SHA matches {tag}: {found}")
          PY

      - name: Publish proof summary
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
        run: |
          {
            echo "## Production integrity proof"
            echo "- Tag: \`$TAG\`"
            echo "- Expected SHA: \`$EXPECTED_SHA\`"
            echo "- Health URL: \`$HEALTH_URL\`"
            echo "- Workflow conclusion: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
