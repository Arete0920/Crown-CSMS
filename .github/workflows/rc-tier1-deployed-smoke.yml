name: rc-tier1-deployed-smoke
permissions:
  contents: read


on:
  workflow_dispatch:
    inputs:
      rc_base_url:
        description: "Override RC_BASE_URL (leave blank to use secret)"
        required: false
        default: ""
  push:
    branches:
      - "rc/**"
  pull_request:
    branches:
      - "rc/**"
    paths:
      - "tools/rc_deployed_smoke.py"
      - "tools/rc_endpoint_probes.json"
      - "tools/demo_contract_t1.lock"
      - ".github/workflows/rc-tier1-deployed-smoke.yml"

concurrency:
  group: rc-tier1-deployed-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deployed-smoke:
    name: "Tier-1 Deployed Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Only run if secrets are populated €” this avoids noisy failures on forks
    # or when secrets aren't configured yet.
    # The check is: if RC_BASE_URL secret is non-empty, proceed.
    env:
      RC_BASE_URL: ${{ inputs.rc_base_url != '' && inputs.rc_base_url || secrets.RC_BASE_URL }}
      RC_SCHOOL_ID: ${{ secrets.RC_SCHOOL_ID }}
      RC_DEMO_KEY: ${{ secrets.RC_DEMO_KEY }}
      RC_TIER: "T1"
      RC_TIMEOUT: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Check secrets configured
        id: secrets-check
        run: |
          if [ -z "$RC_BASE_URL" ] || [ -z "$RC_SCHOOL_ID" ]; then
            echo "SKIP=true" >> $GITHUB_OUTPUT
            echo "::warning::RC deployed smoke skipped €” secrets not configured (RC_BASE_URL, RC_SCHOOL_ID)"
          else
            echo "SKIP=false" >> $GITHUB_OUTPUT
          fi

      - name: Login and fetch fresh RC_TOKEN
        if: steps.secrets-check.outputs.SKIP == 'false'
        id: rc-login
        env:
          CI_SMOKE_USERNAME: ${{ secrets.CI_SMOKE_USERNAME }}
          CI_SMOKE_PASSWORD: ${{ secrets.CI_SMOKE_PASSWORD }}
        run: |
          FRESH_TOKEN=$(python - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          base = os.environ["RC_BASE_URL"].rstrip("/")
          username = os.environ["CI_SMOKE_USERNAME"]
          password = os.environ["CI_SMOKE_PASSWORD"]
          payload = json.dumps({"email": username, "password": password}).encode()
          req = urllib.request.Request(
              f"{base}/api/auth/login/",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read())
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Login failed: {e.code} {body}", file=sys.stderr)
              sys.exit(1)
          access = data.get("access") or data.get("token")
          if not access:
              print(f"No access token in response: {data}", file=sys.stderr)
              sys.exit(1)
          print(access, end="")
          EOF
          )
          echo "RC_TOKEN=$FRESH_TOKEN" >> $GITHUB_ENV

      - name: Run Tier-1 deployed smoke probes
        if: steps.secrets-check.outputs.SKIP == 'false'
        run: python tools/rc_deployed_smoke.py

      - name: Smoke skipped (secrets not set)
        if: steps.secrets-check.outputs.SKIP == 'true'
        run: |
          echo "Deployed smoke skipped €” add RC_BASE_URL, RC_SCHOOL_ID as repository secrets to enable."
          echo "See: Settings ’ Secrets and variables ’ Actions"

