name: Crown System Health Gate

on:
  workflow_dispatch:

concurrency:
  group: crown-system-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DJANGO_SETTINGS_MODULE: crown_api.settings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: |
          python manage.py check

      - name: Test database migration state
        working-directory: backend
        run: |
          python manage.py makemigrations --check --dry-run --no-input
          python manage.py migrate --plan

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Build frontend dashboards
        working-directory: frontend/dashboards
        run: |
          npm ci
          npm run build

      - name: Start backend server
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django-system-health.log 2>&1 &
          echo $! > /tmp/django-system-health.pid

      - name: Check local API health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8000/api/health/" >/dev/null 2>&1 || curl -fsS "http://127.0.0.1:8000/health/" >/dev/null 2>&1; then
              echo "PASS: local API health endpoint responding"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: local API health endpoint not responding"
          cat /tmp/django-system-health.log || true
          exit 1

      - name: Check deployed API and dashboard endpoints
        shell: bash
        env:
          PROD_API_BASE: ${{ secrets.PROD_API_BASE }}
          PROD_DASH_BASE: ${{ secrets.PROD_DASH_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_API_BASE}" ]; then
            echo "Missing required secret: PROD_API_BASE"
            exit 1
          fi
          if [ -z "${PROD_DASH_BASE}" ]; then
            echo "Missing required secret: PROD_DASH_BASE"
            exit 1
          fi

          API_URL="${PROD_API_BASE%/}/health/"
          DASH_URL="${PROD_DASH_BASE%/}"

          echo "Checking deployed API: ${API_URL}"
          curl -fsS "${API_URL}" >/dev/null

          echo "Checking deployed dashboard: ${DASH_URL}"
          curl -fsS "${DASH_URL}" >/dev/null

      - name: Stop backend server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/django-system-health.pid ]; then
            kill "$(cat /tmp/django-system-health.pid)" >/dev/null 2>&1 || true
          fi
          cat /tmp/django-system-health.log || true

