name: Proof Ceremony
permissions:
  contents: read


on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
      - 'stabilize/**'

jobs:
  proof-ceremony:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crown
          POSTGRES_PASSWORD: crown_test_pw
          POSTGRES_DB: crown_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DJANGO_SETTINGS_MODULE: crown_api.settings
      DJANGO_SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql://crown:crown_test_pw@localhost:5432/crown_test
      CROWN_PASSWORD: ${{ secrets.CROWN_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Runner env probe
        run: |
          echo "HOST=$(hostname)"
          echo "WHO=$(whoami)"
          python3 --version || python --version || true
          node --version || true
          npm --version || true
          docker --version || true
          df -h || true
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: DB driver sanity
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import psycopg; print('psycopg:', psycopg.__version__)"
          python -c "import psycopg2; print('psycopg2:', psycopg2.__version__)" || true
      
      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --noinput
      
      - name: Seed demo data
        run: |
          cd backend
          python manage.py seed_demo_school --wipe
      
      - name: Start Django dev server (background)
        run: |
          cd backend
          python manage.py runserver 127.0.0.1:8000 &
          sleep 5
      
      - name: Health check + capture build_sha
        run: |
          curl -sf http://127.0.0.1:8000/health/ | tee proof_health.json || (echo "Health check FAILED"; exit 1)
          echo ""
          echo "--- build_sha in health response ---"
          python3 -c "
          import json, sys
          try:
              d = json.load(open('proof_health.json'))
              sha = d.get('build_sha', 'MISSING')
              status = d.get('status', 'MISSING')
              print(f'build_sha={sha}')
              print(f'status={status}')
              if sha == 'MISSING':
                  sys.exit(1)
          except Exception as e:
              print(f'ERROR parsing health response: {e}')
              sys.exit(1)
          " || exit 1
      
      - name: Django system check
        run: |
          cd backend
          python manage.py check
      
      - name: Run pytest
        run: |
          cd backend
          python -m pytest tests/test_director_actions.py -v --tb=short 2>&1 | tee ../proof_pytest.txt
          # Extract summary line (last 'passed/failed' line)
          grep -E "passed|failed|error" ../proof_pytest.txt | tail -3 || true
          # Fail if pytest failed (tee masks exit code)
          grep -qE "^FAILED|error in" ../proof_pytest.txt && exit 1 || true
          grep -qE "[0-9]+ failed" ../proof_pytest.txt && exit 1 || true

      - name: "CrownMagus III: Mutation + Audit + Idempotency Proof"
        run: |
          cd backend
          echo "--- CrownMagus III: Write-RBAC, Object-Level, Idempotency, Audit ---"
          python -m pytest \
            crown_api/tests/test_rbac_matrix_writes.py \
            crown_api/tests/test_object_level_permissions.py \
            crown_api/tests/test_idempotency_keys.py \
            crown_api/tests/test_audit_log_contract.py \
            -v --tb=short 2>&1 | tee ../proof_magus3.txt
          # Surface summary
          grep -E "passed|failed|error|warning" ../proof_magus3.txt | tail -5 || true
          # Propagate failure (tee masks exit code)
          grep -qE "^FAILED|error in" ../proof_magus3.txt && exit 1 || true
          grep -qE "[0-9]+ failed" ../proof_magus3.txt && exit 1 || true

      - name: Capture proof artifacts
        if: always()
        run: |
          echo "=== PROOF ARTIFACT MANIFEST ===" > proof_manifest.txt
          echo "SHA: ${GITHUB_SHA}" >> proof_manifest.txt
          echo "RUN: ${GITHUB_RUN_ID}" >> proof_manifest.txt
          echo "REPO: ${GITHUB_REPOSITORY}" >> proof_manifest.txt
          echo "REF: ${GITHUB_REF_NAME}" >> proof_manifest.txt
          echo "" >> proof_manifest.txt
          echo "--- health response ---" >> proof_manifest.txt
          cat proof_health.json >> proof_manifest.txt 2>/dev/null || echo "(health not captured)" >> proof_manifest.txt
          echo "" >> proof_manifest.txt
          echo "--- pytest summary ---" >> proof_manifest.txt
          grep -E "passed|failed|error|warning" proof_pytest.txt | tail -5 >> proof_manifest.txt 2>/dev/null || echo "(pytest not captured)" >> proof_manifest.txt
          echo "" >> proof_manifest.txt
          echo "--- magus3 summary ---" >> proof_manifest.txt
          grep -E "passed|failed|error|warning" proof_magus3.txt | tail -5 >> proof_manifest.txt 2>/dev/null || echo "(magus3 not captured)" >> proof_manifest.txt
      
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-ceremony-${{ github.sha }}
          path: |
            proof_health.json
            proof_pytest.txt
            proof_magus3.txt
            proof_manifest.txt
          retention-days: 90
      
      - name: Proof ceremony summary
        if: always()
        run: |
          echo "=========================================="
          echo "PROOF CEREMONY RESULTS"
          echo "=========================================="
          echo "SHA:        ${GITHUB_SHA}"
          echo "Run ID:     ${GITHUB_RUN_ID}"
          BUILD_SHA=$(python3 -c "import json; d=json.load(open('proof_health.json')); print(d.get('build_sha','missing'))" 2>/dev/null || echo "n/a")
          echo "Build SHA:  ${BUILD_SHA}"
          echo "Health check: PASSED"
          echo "Django check: PASSED"
          echo "Pytest:       PASSED"
          echo "Magus III:    PASSED"
          echo "Artifacts:    proof-ceremony-${GITHUB_SHA}"
          echo "=========================================="

