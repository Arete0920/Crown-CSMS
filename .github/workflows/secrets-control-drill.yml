name: Secrets Control Drill

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Non-production secrets-control scenario
        required: true
        type: choice
        options:
          - routine_rotation
          - failed_rotation
          - break_glass
      environment_name:
        description: Non-production environment identifier
        required: true
        default: staging
        type: string
      actor_identity:
        description: Named actor or workload identity; never enter credentials
        required: true
        type: string
      approver_identity:
        description: Named approver or witness identity; never enter credentials
        required: true
        type: string
      audit_event_available:
        description: Sanitized audit evidence contains identity, decision, path, timestamp, and correlation identifier
        required: true
        default: true
        type: boolean
      old_access_revoked:
        description: Prior or emergency access is confirmed revoked
        required: true
        default: true
        type: boolean
      validation_passed:
        description: Health, authentication, tenant isolation, and critical validation passed
        required: true
        default: true
        type: boolean
      prior_secret_suspected_compromised:
        description: Failed-rotation scenario only; prior secret may not be restored when compromised
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: secrets-control-drill-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  exercise-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCENARIO: ${{ inputs.scenario }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      ACTOR_IDENTITY: ${{ inputs.actor_identity }}
      APPROVER_IDENTITY: ${{ inputs.approver_identity }}
      AUDIT_EVENT_AVAILABLE: ${{ inputs.audit_event_available }}
      OLD_ACCESS_REVOKED: ${{ inputs.old_access_revoked }}
      VALIDATION_PASSED: ${{ inputs.validation_passed }}
      PRIOR_SECRET_SUSPECTED_COMPROMISED: ${{ inputs.prior_secret_suspected_compromised }}
    steps:
      - name: Validate non-production inputs
        shell: bash
        run: |
          set -euo pipefail
          normalized_environment="$(printf '%s' "$ENVIRONMENT_NAME" | tr '[:upper:]' '[:lower:]')"
          case "$normalized_environment" in
            production|prod|live)
              echo "ERROR: this drill is non-production only."
              exit 1
              ;;
          esac
          case "$SCENARIO" in
            routine_rotation|failed_rotation|break_glass) ;;
            *)
              echo "ERROR: unsupported scenario."
              exit 1
              ;;
          esac
          for identity in "$ACTOR_IDENTITY" "$APPROVER_IDENTITY"; do
            if [[ -z "${identity// }" ]]; then
              echo "ERROR: named actor and approver identities are required."
              exit 1
            fi
            if [[ "$identity" == *"="* || "$identity" == *"BEGIN "* ]]; then
              echo "ERROR: identity fields must not contain credential-like material."
              exit 1
            fi
          done

      - name: Evaluate scenario controls
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          result="PASS"
          decision=""
          required_follow_up="none"

          if [[ "$AUDIT_EVENT_AVAILABLE" != "true" ]]; then
            result="FAIL"
            required_follow_up="capture_sanitized_audit_evidence"
          elif [[ "$OLD_ACCESS_REVOKED" != "true" ]]; then
            result="FAIL"
            required_follow_up="revoke_prior_or_emergency_access"
          elif [[ "$VALIDATION_PASSED" != "true" ]]; then
            result="FAIL"
            required_follow_up="restore_service_health_and_repeat_validation"
          fi

          case "$SCENARIO" in
            routine_rotation)
              decision="activate_replacement_then_revoke_prior_access"
              ;;
            failed_rotation)
              if [[ "$PRIOR_SECRET_SUSPECTED_COMPROMISED" == "true" ]]; then
                decision="do_not_restore_prior_secret;_enter_incident_and_recovery_control"
              else
                decision="restore_prior_valid_version_and_investigate_failure"
              fi
              ;;
            break_glass)
              decision="use_time_bounded_emergency_identity_then_revoke_and_rotate_exposed_material"
              ;;
          esac

          {
            echo "result=$result"
            echo "decision=$decision"
            echo "required_follow_up=$required_follow_up"
          } >> "$GITHUB_OUTPUT"

      - name: Write sanitized exercise evidence
        shell: bash
        env:
          RESULT: ${{ steps.decision.outputs.result }}
          DECISION: ${{ steps.decision.outputs.decision }}
          REQUIRED_FOLLOW_UP: ${{ steps.decision.outputs.required_follow_up }}
        run: |
          set -euo pipefail
          mkdir -p secrets-control-drill-evidence
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > secrets-control-drill-evidence/result.json <<JSON
          {
            "timestamp_utc": "$timestamp",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_sha": "${GITHUB_SHA}",
            "environment": "$ENVIRONMENT_NAME",
            "scenario": "$SCENARIO",
            "actor_identity": "$ACTOR_IDENTITY",
            "approver_identity": "$APPROVER_IDENTITY",
            "audit_event_available": $AUDIT_EVENT_AVAILABLE,
            "old_access_revoked": $OLD_ACCESS_REVOKED,
            "validation_passed": $VALIDATION_PASSED,
            "prior_secret_suspected_compromised": $PRIOR_SECRET_SUSPECTED_COMPROMISED,
            "decision": "$DECISION",
            "result": "$RESULT",
            "required_follow_up": "$REQUIRED_FOLLOW_UP",
            "secret_value_recorded": false,
            "production_mutation_performed": false
          }
          JSON
          cat > secrets-control-drill-evidence/summary.md <<MARKDOWN
          # Secrets Control Drill Evidence

          - Timestamp (UTC): $timestamp
          - Workflow SHA: ${GITHUB_SHA}
          - Environment: $ENVIRONMENT_NAME
          - Scenario: $SCENARIO
          - Actor identity: $ACTOR_IDENTITY
          - Approver identity: $APPROVER_IDENTITY
          - Decision: $DECISION
          - Result: $RESULT
          - Required follow-up: $REQUIRED_FOLLOW_UP
          - Secret value recorded: false
          - Production mutation performed: false

          This exercise validates decision, audit, revocation, and validation controls only. It does not prove a live production secret-store rotation or production approval.
          MARKDOWN
          cat secrets-control-drill-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized exercise evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-control-drill-evidence-${{ github.run_id }}
          path: secrets-control-drill-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exercise result
        if: ${{ steps.decision.outputs.result == 'FAIL' }}
        shell: bash
        run: |
          echo "Secrets control exercise failed closed."
          exit 1
