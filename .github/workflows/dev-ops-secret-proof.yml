name: DEV operations secret synchronization proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full reviewed SHA currently deployed in Azure DEV"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dev-ops-secret-proof
  cancel-in-progress: false

jobs:
  schoolless-secret-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEV_OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Verify GitHub secret against pinned DEV handler (no school or reset)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          sha = os.environ.get("EXPECTED_SHA", "")
          secret = os.environ.get("DEV_OPS_SECRET", "")
          if not re.fullmatch(r"[a-f0-9]{40}", sha) or not secret:
              sys.exit("BLOCKED: full expected SHA and configured Actions secret required")

          base = "https://crown-api-dev.azurewebsites.net"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          client = urllib.request.build_opener(NoRedirect())

          def request(path, *, credential=None):
              headers = {"Accept": "application/json"}
              if credential is not None:
                  headers["X-Admin-Ops-Secret"] = credential
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  base + path, data=b"{}" if credential is not None else None,
                  method="POST" if credential is not None else "GET", headers=headers
              )
              try:
                  res = client.open(req, timeout=15)
              except urllib.error.HTTPError as exc:
                  res = exc
              except Exception:
                  return None, None
              try:
                  if res.status not in (200, 400):
                      return res.status, None
                  body = res.read(4097)
                  if len(body) > 4096:
                      return res.status, None
                  return res.status, json.loads(body)
              except Exception:
                  return res.status, None
              finally:
                  res.close()

          def health_ok():
              status, data = request("/api/health/")
              return (status == 200 and isinstance(data, dict) and data.get("ok") is True
                      and data.get("db") == "ok" and data.get("env") == "dev"
                      and data.get("build_sha") == sha and data.get("artifact_build_sha") == sha)

          if not health_ok():
              sys.exit("BLOCKED: initial DEV health or exact SHA identity mismatch")
          status, body = request("/api/v1/system/demo-reset/", credential=secret)
          if not health_ok():
              sys.exit("BLOCKED: final DEV health or exact SHA identity mismatch")
          if status != 400 or body != {"detail": "Missing school_id (send X-School-Id or ?school_id=...)"}:
              sys.exit("BLOCKED: GitHub Actions credential did not reach missing-school handler validation")
          print("PASS: GitHub Actions DEV_OPS_SECRET accepted by pinned DEV handler; HTTP 400 missing school.")
          print("No school selector supplied; no reset executed; no secret values or hashes emitted.")
          PY
