name: Lockdown Golden Path Gate

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lockdown-gate:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      ENVIRONMENT: dev
      CROWN_DEMO_MODE: "true"
      BUILD_SHA: ${{ github.sha }}
      DEV_OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
      CROWN_GATE_SCHOOL_ID: ""
      CROWN_GATE_YEAR_ID: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight artifact alignment
        shell: pwsh
        run: |
          $required = @(
            "backend/core/management/commands/seed_lockdown_minimal.py",
            "backend/admissions/management/commands/seed_admissions_demo.py",
            "tools/dev_scripts/golden_path_gate.ps1",
            "tools/dev_scripts/demo_one_click.ps1",
            "tools/dev_scripts/demo_snapshot.ps1"
          )

          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Host "MISSING_REQUIRED_ARTIFACT=$f"
              $missing += $f
            }
          }

          if ($missing.Count -gt 0) {
            echo "Lockdown gate artifacts must exist in main repo paths before CI can run."
            echo "Sync from DEMO_TAG to main and rerun."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend deps (dashboards)
        run: |
          Set-Location frontend/dashboards
          npm ci

      - name: Migrate + seed lockdown minimal
        id: seed
        shell: pwsh
        run: |
          Set-Location backend
          python manage.py migrate --noinput

          $out = python manage.py seed_lockdown_minimal --count 10
          $out | ForEach-Object { Write-Host $_ }

          $schoolLine = $out | Where-Object { $_ -like 'SCHOOL_ID=*' } | Select-Object -First 1
          $yearLine = $out | Where-Object { $_ -like 'ACADEMIC_YEAR_ID=*' } | Select-Object -First 1

          if (-not $schoolLine) {
            Write-Host "Missing SCHOOL_ID from seed output"
            exit 1
          }

          if (-not $yearLine) {
            Write-Host "Missing ACADEMIC_YEAR_ID from seed output"
            exit 1
          }

          $schoolId = $schoolLine.Substring('SCHOOL_ID='.Length)
          $yearId = $yearLine.Substring('ACADEMIC_YEAR_ID='.Length)

          Add-Content -Path $env:GITHUB_ENV -Value "CROWN_GATE_SCHOOL_ID=$schoolId"
          Add-Content -Path $env:GITHUB_ENV -Value "CROWN_GATE_YEAR_ID=$yearId"

      - name: Start backend (8000)
        shell: pwsh
        run: |
          Set-Location backend
          $log = Join-Path $env:RUNNER_TEMP 'backend.log'
          $proc = Start-Process python -ArgumentList @('manage.py','runserver','127.0.0.1:8000','--noreload') -RedirectStandardOutput $log -RedirectStandardError $log -PassThru
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'backend.pid') -Value $proc.Id

      - name: Start frontend (3000)
        shell: pwsh
        run: |
          Set-Location frontend/dashboards
          $log = Join-Path $env:RUNNER_TEMP 'frontend.log'
          $proc = Start-Process npm -ArgumentList @('run','dev','--','--host','127.0.0.1','--port','3000') -RedirectStandardOutput $log -RedirectStandardError $log -PassThru
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'frontend.pid') -Value $proc.Id

      - name: Wait for backend and frontend
        shell: pwsh
        run: |
          $backendOk = $false
          for ($i=0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:8000/health/' | Out-Null
              $backendOk = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $backendOk) { throw 'Backend did not become healthy on :8000' }

          $frontendOk = $false
          for ($i=0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:3000/' | Out-Null
              $frontendOk = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $frontendOk) { throw 'Frontend did not become healthy on :3000' }

      - name: Run Golden Path gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gate = Join-Path $env:GITHUB_WORKSPACE 'tools/dev_scripts/golden_path_gate.ps1'
          if (-not (Test-Path $gate)) { throw "Missing gate script at $gate" }

          Write-Host "CROWN_GATE_SCHOOL_ID=$env:CROWN_GATE_SCHOOL_ID"
          Write-Host "CROWN_GATE_YEAR_ID=$env:CROWN_GATE_YEAR_ID"

          powershell -ExecutionPolicy Bypass -File $gate -SchoolId $env:CROWN_GATE_SCHOOL_ID -AcademicYearId $env:CROWN_GATE_YEAR_ID

      - name: Dump logs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "===== backend.log ====="
          $backendLog = Join-Path $env:RUNNER_TEMP 'backend.log'
          if (Test-Path $backendLog) { Get-Content $backendLog -Tail 400 }

          Write-Host "===== frontend.log ====="
          $frontendLog = Join-Path $env:RUNNER_TEMP 'frontend.log'
          if (Test-Path $frontendLog) { Get-Content $frontendLog -Tail 400 }

      - name: Stop servers
        if: always()
        shell: pwsh
        run: |
          $backendPidFile = Join-Path $env:RUNNER_TEMP 'backend.pid'
          $frontendPidFile = Join-Path $env:RUNNER_TEMP 'frontend.pid'

          if (Test-Path $backendPidFile) {
            $pid = Get-Content $backendPidFile | Select-Object -First 1
            if ($pid) { Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue }
          }

          if (Test-Path $frontendPidFile) {
            $pid = Get-Content $frontendPidFile | Select-Object -First 1
            if ($pid) { Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue }
          }
