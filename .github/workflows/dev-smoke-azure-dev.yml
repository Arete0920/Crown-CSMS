name: Azure DEV Smoke (Deterministic)

env:
  SMOKE_SCHOOL_ID: "19801b59-8c05-4c84-9312-5d792e4e839d"

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set base URL
        run: echo "BASE=https://crown-api-dev.azurewebsites.net" >> $GITHUB_ENV

      - name: Check 1 - /api/health/ returns build_sha
        run: |
          set -e
          body=$(curl -sS "$BASE/api/health/")
          echo "$body" | jq -e '.build_sha' > /dev/null
          echo "OK build_sha:" $(echo "$body" | jq -r '.build_sha')

      - name: Check 2 - Unauth invoices returns 403 or 404
        run: |
          set -e
          # 403 = billing deployed, tenant header present, no auth → correct rejection
          # 404 = billing app not yet deployed on this Azure DEV instance → acceptable
          # 400 = missing tenant header (regression) → fail
          # 500 = server error → fail
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "X-School-Id: $SMOKE_SCHOOL_ID" \
            "$BASE/api/billing/invoices/")
          if [ "$code" != "403" ] && [ "$code" != "404" ]; then
            echo "ERROR Expected 403 or 404, got $code (400=missing tenant header, 500=server error)"
            exit 1
          fi
          echo "OK Unauth invoices returned $code (403=auth enforced, 404=not yet deployed)"

      - name: Ensure CI user and get JWT
        env:
          OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
        run: |
          set -e
          resp=$(curl -sS -X POST "$BASE/api/v1/system/ensure-ci-user/" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Ops-Secret: $OPS_SECRET")
          
          token=$(echo "$resp" | jq -r '.access')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "ERROR ensure-ci-user failed (needs Azure settings: CI_SMOKE_USERNAME, CI_SMOKE_PASSWORD, CI_SMOKE_SCHOOL_ID)"
            echo "$resp"
            exit 1
          fi
          
          echo "TOKEN=$token" >> $GITHUB_ENV
          echo "OK CI user ensured + JWT acquired"

      - name: Check 3 - Auth invoices returns 200
        run: |
          set -e
          # 200 = billing deployed and auth works correctly
          # 404 = billing app not yet deployed on this Azure DEV instance → acceptable
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-School-Id: $SMOKE_SCHOOL_ID" \
            "$BASE/api/billing/invoices/")
          if [ "$code" != "200" ] && [ "$code" != "404" ]; then
            echo "ERROR Expected 200 or 404, got $code"
            exit 1
          fi
          echo "OK Auth invoices returned $code (200=billing live, 404=not yet deployed)"
