name: Heritage Windows Demo Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/demo/**'
      - 'Install-and-Start-Heritage.py'
      - 'Start-Heritage.cmd'
      - 'HERITAGE-LOCAL-DEMO-README.txt'
      - 'backend/tests/test_heritage_sales_package.py'
      - 'docs/LOCAL_QUICKSTART.md'
      - 'backend/sandbox_demo/**'
      - 'backend/requirements.txt'
      - 'frontend/dashboards/**'
      - '.github/workflows/heritage-windows-rehearsal.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/demo/**'
      - 'Install-and-Start-Heritage.py'
      - 'Start-Heritage.cmd'
      - 'HERITAGE-LOCAL-DEMO-README.txt'
      - 'backend/tests/test_heritage_sales_package.py'
      - 'backend/sandbox_demo/**'
      - 'frontend/dashboards/**'
      - '.github/workflows/heritage-windows-rehearsal.yml'
  workflow_dispatch:

concurrency:
  group: heritage-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Supply a reproducible, source-audited QA starter even when the full
  # five-module data/browser gate remains red. This is NOT a release artifact.
  source-audited-candidate:
    name: Source-audited Windows starter candidate (NOT five-module certified)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Assemble starter and check independent source identity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/demo/package_heritage_sales.py
          PIN_SHA="$(PYTHONPATH=scripts/demo python -c 'from package_heritage_sales import pinned_revision; print(pinned_revision())')"
          git fetch --no-tags --depth=1 origin "$PIN_SHA"
          python scripts/demo/verify_heritage_sales_package.py --download
      - name: Upload explicitly uncertified QA candidate
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-source-audited-UNCERTIFIED-candidate
          path: |
            .local-backups/heritage-sales/CROWN-Heritage-Sales-Demo-*.zip
            .local-backups/heritage-sales/heritage-starter-audit.json
          if-no-files-found: error
          retention-days: 7

  windows-local-demo:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reject incomplete module source before installs, migrations or build
        shell: pwsh
        run: |
          # This uses only Python's standard library. A pre-integration PR
          # must fail here, NOT after preparing a disposable database.
          $evidence = Join-Path $env:GITHUB_WORKSPACE ".local-backups/heritage-demo"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $log = Join-Path $evidence "five-module-source-preflight.log"
          $PSNativeCommandUseErrorActionPreference = $false
          & python -c "from scripts.demo.start_heritage_local import require_five_module_sources; from scripts.demo.verify_heritage_runtime import require_five_module_browser_sources; require_five_module_sources(); require_five_module_browser_sources()" *> $log
          $exitCode = $LASTEXITCODE
          Get-Content -Path $log | ForEach-Object { Write-Host $_ }
          $result = [ordered]@{
            schema_version = 1
            evidence_scope = "before_install_migrate_build"
            checkout_sha = $env:GITHUB_SHA
            source_dependencies_passed = ($exitCode -eq 0)
            browser_acceptance_performed = $false
            release_certified = $false
          }
          $result | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 (Join-Path $evidence "five-module-source-preflight.json")
          if ($exitCode -ne 0) {
            throw "Five-module source prerequisites are missing; integrate governed module PRs before Windows preparation."
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare isolated fictional Heritage data and frontend
        shell: pwsh
        run: |
          python --version
          node --version
          npm --version
          python scripts/demo/start_heritage_local.py --prepare-only
      - name: Run strict fictional five-module source and data preflight
        shell: pwsh
        run: |
          # Preserve the true result on failure; never mark a browser run certified.
          $evidence = Join-Path $env:GITHUB_WORKSPACE ".local-backups/heritage-demo"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $log = Join-Path $evidence "five-module-preflight.log"
          # GitHub's pwsh error preference must not skip our failure evidence.
          $PSNativeCommandUseErrorActionPreference = $false
          & python scripts/demo/start_heritage_local.py --prepare-only --five-module-preflight *> $log
          $exitCode = $LASTEXITCODE
          Get-Content -Path $log | ForEach-Object { Write-Host $_ }
          $result = [ordered]@{
            schema_version = 1
            evidence_scope = "five_module_source_and_data_preflight_only"
            checkout_sha = $env:GITHUB_SHA
            preflight_exit_code = $exitCode
            preflight_passed = ($exitCode -eq 0)
            browser_acceptance_performed = $false
            release_certified = $false
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $evidence "five-module-preflight.json")
          if ($exitCode -ne 0) {
            throw "Strict five-module preflight failed ($exitCode); see uploaded non-certification evidence."
          }
      - name: Build and audit deliverable Heritage starter
        shell: pwsh
        run: |
          # GitHub checkout uses a shallow PR merge checkout. Retrieve the
          # immutable main source commit explicitly for independent blob proof.
          git fetch --no-tags --depth=1 origin a1bf22fc1e520eba149ce943edcd747dbf75c1e5
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch pinned source revision' }
          python scripts/demo/package_heritage_sales.py
          if ($LASTEXITCODE -ne 0) { throw 'Starter package build failed' }
          python scripts/demo/verify_heritage_sales_package.py --download
          if ($LASTEXITCODE -ne 0) { throw 'Starter source identity audit failed' }
      - name: Verify guarded Heritage listener boundary
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q backend/crown_api/tests/test_heritage_runserver.py
      - name: Verify immutable sales-starter ZIP contract
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q backend/tests/test_heritage_sales_package.py
      - name: Verify synthetic Heritage fixture and launcher integrity
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q backend/sandbox_demo/test_seed_realism.py
      - name: Verify Heritage Board cross-tenant bearer regressions
        shell: pwsh
        run: >
          .\.venv\Scripts\python.exe -m pytest -q
          backend/academics/tests/test_classroom_experience.py
          -k "heritage_board_bearer_renewal or board_bearer_cannot_read_foreign_household"
      - name: Install Playwright Chromium for full buyer browser certification
        shell: pwsh
        working-directory: frontend/dashboards
        run: npx playwright install --with-deps chromium
      - name: Launch servers and verify local role-based demo
        shell: pwsh
        run: |
          python scripts/demo/verify_heritage_runtime.py --browser --five-module
      - name: Upload audited Windows Heritage starter ZIP
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-windows-buyer-rehearsed-candidate
          path: |
            .local-backups/heritage-sales/CROWN-Heritage-Sales-Demo-*.zip
            .local-backups/heritage-sales/heritage-starter-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload local rehearsal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-windows-rehearsal
          path: |
            .local-backups/heritage-demo/*.log
            .local-backups/heritage-demo/five-module-source-preflight.json
            .local-backups/heritage-demo/five-module-preflight.json
            .local-backups/heritage-demo/rehearsal-result.json
            .local-backups/heritage-demo/buyer-browser-authority.json
          if-no-files-found: error
          retention-days: 7
