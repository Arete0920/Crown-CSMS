name: Heritage Windows Demo Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/demo/**'
      - 'Install-and-Start-Heritage.py'
      - 'Start-Heritage.cmd'
      - 'HERITAGE-LOCAL-DEMO-README.txt'
      - 'backend/tests/test_heritage_sales_package.py'
      - 'docs/LOCAL_QUICKSTART.md'
      - 'backend/sandbox_demo/**'
      - 'backend/requirements.txt'
      - 'frontend/dashboards/**'
      - '.github/workflows/heritage-windows-rehearsal.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/demo/**'
      - 'Install-and-Start-Heritage.py'
      - 'Start-Heritage.cmd'
      - 'HERITAGE-LOCAL-DEMO-README.txt'
      - 'backend/tests/test_heritage_sales_package.py'
      - 'backend/sandbox_demo/**'
      - 'frontend/dashboards/**'
      - '.github/workflows/heritage-windows-rehearsal.yml'
  workflow_dispatch:

concurrency:
  group: heritage-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-local-demo:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare isolated fictional Heritage data and frontend
        shell: pwsh
        run: |
          python --version
          node --version
          npm --version
          python scripts/demo/start_heritage_local.py --prepare-only
      - name: Verify immutable sales-starter ZIP contract
        shell: pwsh
        run: .\\.venv\\Scripts\\python.exe -m pytest -q backend/tests/test_heritage_sales_package.py
      - name: Verify Heritage Board cross-tenant bearer regressions
        shell: pwsh
        run: >
          .\\.venv\\Scripts\\python.exe -m pytest -q
          backend/academics/tests/test_classroom_experience.py
          -k "heritage_board_bearer_renewal or board_bearer_cannot_read_foreign_household"
      - name: Install Playwright Chromium for full buyer browser certification
        shell: pwsh
        working-directory: frontend/dashboards
        run: npx playwright install --with-deps chromium
      - name: Launch servers and verify local role-based demo
        shell: pwsh
        run: |
          python scripts/demo/verify_heritage_runtime.py --browser
      - name: Upload local rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heritage-windows-rehearsal
          path: |
            .local-backups/heritage-demo/*.log
            .local-backups/heritage-demo/rehearsal-result.json
            .local-backups/heritage-demo/buyer-browser-authority.json
          if-no-files-found: error
          retention-days: 7
