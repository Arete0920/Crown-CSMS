name: DEV ops secret schoolless acceptance (read-only)
on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: "Previously verified full DEV backend build SHA (not assumed to equal current main)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crown-dev-ops-schoolless-proof
  cancel-in-progress: false
jobs:
  schoolless-credential-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    steps:
      - name: Checkout approved protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove full deployed SHA is an accepted ancestor of current main
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCKED: invalid expected SHA"; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "BLOCKED: main moved"; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD || { echo "BLOCKED: deployed SHA not accepted ancestor"; exit 1; }
      - name: Check GitHub Actions secret against exact deployed DEV reset handler, without selecting a school
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          DEV_OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts" / "ops"))
          from verify_dev_ops_credential_retirement import _request, _healthy_runtime, NoRedirect
          import urllib.request

          credential = os.getenv("DEV_OPS_SECRET", "")
          expected = os.getenv("EXPECTED_SHA", "")
          # Never print any secret or unexpected HTTP body.
          if len(credential) < 32 or len(expected) != 40:
              print("BLOCKED: required credential or deployed identity unavailable")
              raise SystemExit(1)
          opener = urllib.request.build_opener(NoRedirect())
          initial, initial_data = _request(opener)
          if not _healthy_runtime(initial, initial_data, expected):
              print("BLOCKED: DEV health/artifact identity not proven; no credential sent")
              raise SystemExit(1)
          status, data = _request(opener, credential=credential)
          accepted = status == 400 and data == {"detail": "Missing school_id (send X-School-Id or ?school_id=...)"}
          final, final_data = _request(opener)
          healthy = _healthy_runtime(final, final_data, expected)
          if not (accepted and healthy):
              print("BLOCKED: schoolless credential acceptance or final identity failed")
              raise SystemExit(1)
          print("PASS: GitHub Actions DEV_OPS_SECRET accepted by exact-SHA DEV reset handler without a school")
          print("NOT VERIFIED: other credential consumers, diagnostics, historical denial or secret-store byte equality")
          PY
