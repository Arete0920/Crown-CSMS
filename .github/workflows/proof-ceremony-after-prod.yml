name: proof-ceremony-after-prod
permissions:
  contents: read

# Phase 7C— Auto Proof Ceremony
#
# Runs automatically after either prod deploy workflow succeeds.
# Resolves the deployed tag from head_branch (tag-triggered deploys) or from
# git tag --points-at head_sha (dispatch-triggered deploys where head_branch
# is the source branch rather than the tag). Fails the run if no prod-deploy-*
# tag can be resolved — this surfaces stale or tagless deploys immediately.
#
# Secrets required:
#   PROD_API_BASE  — e.g. https://crown-api-prod.azurewebsites.net
#   PROD_DASH_BASE — e.g. https://crown-dash.azurewebsites.net  (optional; skip UI check if absent)

on:
  workflow_run:
    workflows:
      - "Production Deploy"
      - "Production Deploy (Dispatch v2)"
    types: [completed]

concurrency:
  group: proof-ceremony-after-prod-${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  proof:
    name: "Auto proof — ${{ github.event.workflow_run.head_branch }}"
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.conclusion == 'failure' && contains(github.event.workflow_run.name, 'Production Deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Guard trusted upstream context
        shell: bash
        run: |
          set -euo pipefail
          SRC_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
          THIS_REPO="${{ github.repository }}"
          SRC_EVENT="${{ github.event.workflow_run.event }}"
          if [[ "$SRC_REPO" != "$THIS_REPO" ]]; then
            echo "ERROR: upstream workflow_run repository mismatch ($SRC_REPO != $THIS_REPO)"
            exit 1
          fi
          case "$SRC_EVENT" in
            push|workflow_dispatch|repository_dispatch) ;;
            *)
              echo "ERROR: unsupported upstream event type: $SRC_EVENT"
              exit 1
              ;;
          esac

      - name: Verify runtime health before proof ceremony
        shell: bash
        run: |
          set -euo pipefail
          PROD_API_BASE="${{ secrets.PROD_API_BASE }}"
          MAX_ATTEMPTS=3
          ATTEMPT=1
          echo "Pre-ceremony health validation (max $MAX_ATTEMPTS attempts, 10s timeout each)..."
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl --max-time 10 -s -o /tmp/pre_ceremony_health.json -w "%{http_code}" "${PROD_API_BASE}/api/health/" || echo "timeout")
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✓ Pre-ceremony health check PASSED (HTTP 200)"
              exit 0
            fi
            echo "Pre-ceremony attempt $ATTEMPT/$MAX_ATTEMPTS: HTTP $HTTP_CODE"
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "❌ Pre-ceremony health check failed. Proof ceremonies cannot safely run on unhealthy runtime."
          exit 1

      - name: Resolve deploy tag from head branch or SHA
        shell: bash
        run: |
          set -euo pipefail
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "head_branch: $HEAD_BRANCH"
          echo "head_sha:    $HEAD_SHA"

          # For tag-triggered deploys head_branch IS the tag name (prod-deploy-*)
          if [[ "$HEAD_BRANCH" == prod-deploy-* ]]; then
            DEPLOY_TAG="$HEAD_BRANCH"
            echo "Resolved from head_branch: $DEPLOY_TAG"
          else
            # Dispatch deploys: head_branch is the source branch — resolve via SHA
            git fetch --tags --quiet
            DEPLOY_TAG="$(git tag --points-at "$HEAD_SHA" | grep '^prod-deploy-' | head -1 || true)"
            if [[ -z "$DEPLOY_TAG" ]]; then
              echo "ERROR: head_branch='$HEAD_BRANCH' is not a prod-deploy-* tag"
              echo "       and no prod-deploy-* tag points at sha=$HEAD_SHA"
              echo "       Prod deploys must be tagged with prod-deploy-* before running."
              exit 1
            fi
            echo "Resolved from SHA ($HEAD_SHA): $DEPLOY_TAG"
          fi

          echo "DEPLOY_TAG=$DEPLOY_TAG" >> "$GITHUB_ENV"

      - name: Guard PROD_API_BASE secret
        shell: bash
        run: |
          if [ -z "${{ secrets.PROD_API_BASE }}" ]; then
            echo "RESULT=FAIL"
            echo "FAIL: Missing repo secret PROD_API_BASE."
            echo "      Set it to the backend prod URL, e.g. https://crown-api-prod.azurewebsites.net"
            exit 1
          fi

      - name: Run proof ceremony
        shell: pwsh
        env:
          API_BASE:  ${{ secrets.PROD_API_BASE }}
          DASH_BASE: ${{ secrets.PROD_DASH_BASE }}
        run: |
          $dashArg = if ($env:DASH_BASE) { @("-DashBase", $env:DASH_BASE) } else { @() }
          ./tools/proof_ceremony.ps1 `
            -Tag     "$env:DEPLOY_TAG" `
            -ApiBase "$env:API_BASE" `
            @dashArg

