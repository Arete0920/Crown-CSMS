name: Repository Freshness

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - scripts/release/verify_repository_freshness.py
      - .github/workflows/repository-freshness.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-freshness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-authority:
    name: Current release authority
    if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reject stale or contradictory current-facing release claims
        run: python scripts/release/verify_repository_freshness.py

  live-frontend:
    name: Live dashboards source matches certified successor release
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || github.event.schedule == '17 6 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_FRONTEND_URL: ${{ vars.CROWN_LIVE_FRONTEND_URL || 'https://yellow-forest-0eecc8b0f.7.azurestaticapps.net' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve whether successor production identity exists
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("docs/CURRENT_RELEASE_STATUS.md").read_text(encoding="utf-8")
          match = re.search(
              r"\*\*Certified release source:\*\* `([0-9a-fA-F]{40})`",
              text,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if match:
                  output.write("certified=true\n")
                  output.write(f"sha={match.group(1).lower()}\n")
                  print(f"Certified successor production source: {match.group(1).lower()}")
              else:
                  output.write("certified=false\n")
                  output.write("sha=\n")
                  print(
                      "No certified successor production source is recorded. "
                      "Live/current-main source equivalence is not an applicable freshness assertion."
                  )
          PY
      - name: Read deployed build identity
        if: steps.authority.outputs.certified == 'true'
        id: live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 60 --retry 4 --retry-all-errors \
            "${LIVE_FRONTEND_URL%/}/build.json" -o /tmp/crown-live-build.json
          if ! live_sha="$(python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              payload = json.loads(Path("/tmp/crown-live-build.json").read_text(encoding="utf-8"))
              value = payload.get("build_sha") if isinstance(payload, dict) else None
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)
          if not isinstance(value, str):
              raise SystemExit(1)
          print(value)
          PY
          )"; then
            echo "::error::Live build.json is invalid JSON or does not contain build_sha"
            exit 1
          fi
          if [[ ! "${live_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Live build.json did not provide a full 40-character build_sha"
            exit 1
          fi
          echo "sha=${live_sha}" >> "${GITHUB_OUTPUT}"
          echo "Live frontend build SHA: ${live_sha}"
      - name: Compare deployed frontend with certified successor source
        if: steps.authority.outputs.certified == 'true'
        shell: bash
        env:
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          CERTIFIED_SHA: ${{ steps.authority.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${LIVE_SHA}"
          fi
          if ! git cat-file -e "${CERTIFIED_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${CERTIFIED_SHA}"
          fi
          if git diff --quiet "${LIVE_SHA}" "${CERTIFIED_SHA}" -- frontend/dashboards; then
            echo "Live frontend is source-equivalent to the certified successor release."
            exit 0
          fi
          echo "::error::Live frontend/dashboards source differs from the certified successor release."
          echo "Deployed SHA:  ${LIVE_SHA}"
          echo "Certified SHA: ${CERTIFIED_SHA}"
          echo "Frontend paths that differ:"
          git diff --name-only "${LIVE_SHA}" "${CERTIFIED_SHA}" -- frontend/dashboards
          exit 1

  dev-runtime-drift:
    # Post-merge and daily public precheck only. This is deliberately not a PR
    # merge gate: DEV may not be redeployed until Redis and schema prerequisites
    # are independently accepted. A failing result makes the drift visible.
    name: DEV public runtime parity (not certification)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout accepted source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public DEV build identities and safe prerequisite responses
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          report="$RUNNER_TEMP/dev-runtime-drift.json"
          set +e
          python3 scripts/ops/verify_dev_owner_runtime.py --expected-sha "$expected_sha" > "$report"
          probe_exit=$?
          set -e
          python3 - "$report" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          lines = [
              "## DEV public runtime parity — not certification",
              f"Compared with source SHA: \`{result['expected_main_sha']}\`",
              f"Read-only precheck: **{result['precheck']}**",
          ]
          lines.extend(
              f"- {name}: \`{state}\`"
              for name, state in sorted(result["checks"].items())
          )
          lines.append(
              "An exact-SHA public PASS is not authenticated owner, schema, "
              "Redis, provisioning, recovery or production acceptance."
          )
          lines.append(
              "Follow up: https://github.com/Arete0920/Crown-CSMS/issues/427"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          if result["precheck"] != "PASS":
              print(
                  "::error::DEV public provenance/preconditions are BLOCKED; "
                  "review the step summary and issue #427. "
                  "Do not bypass Redis or schema gates to make this green."
              )
          PY
          exit "$probe_exit"

  report-stale-branches:
    name: Report stale branches (no push in 60 days)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch --prune origin

      - name: Build protected branch inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --max-time 30 -f -sSfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches?protected=true&per_page=100" \
            > protected-branches.json
          jq -r '.[].name' protected-branches.json | sort -u > protected-branches.txt
          echo "Protected branches from API:"
          cat protected-branches.txt || true

      - name: Report branches with no activity in 60+ days
        run: |
          set -euo pipefail
          CUTOFF=$(date -d "60 days ago" +%s)

          PROTECTED_EXACT="main develop"
          PROTECTED_PREFIXES="rc/ release/ stabilize/ hotfix/"

          echo "=== STALE BRANCH REPORT (>60 days inactive) ==="
          echo "Cutoff date: $(date -d @$CUTOFF '+%Y-%m-%d')"
          echo ""

          STALE_COUNT=0
          echo "[]" > stale-branches.json
          TMP_JSON="$(mktemp)"
          echo "[" > "$TMP_JSON"
          FIRST=1
          while IFS= read -r branch; do
            short="${branch#origin/}"
            [ "$short" = "HEAD" ] && continue

            if [ -f protected-branches.txt ] && grep -Fxq "$short" protected-branches.txt; then
              continue
            fi

            protected=false
            for exact in $PROTECTED_EXACT; do
              if [ "$short" = "$exact" ]; then
                protected=true
                break
              fi
            done
            $protected && continue

            for prefix in $PROTECTED_PREFIXES; do
              if [[ "$short" == "$prefix"* ]]; then
                protected=true
                break
              fi
            done
            $protected && continue

            last_commit=$(git log -1 --format="%ct" "origin/$short" 2>/dev/null || echo "0")
            if [ "$last_commit" -lt "$CUTOFF" ]; then
              last_date=$(date -d @$last_commit '+%Y-%m-%d')
              echo "  STALE: $short (last push: $last_date)"
              STALE_COUNT=$((STALE_COUNT + 1))
              if [ "$FIRST" -eq 1 ]; then
                FIRST=0
              else
                echo "," >> "$TMP_JSON"
              fi
              printf '  {"branch":"%s","last_push":"%s"}' "$short" "$last_date" >> "$TMP_JSON"
            fi
          done < <(git branch -r | sed 's/^ *//')

          echo "" >> "$TMP_JSON"
          echo "]" >> "$TMP_JSON"
          mv "$TMP_JSON" stale-branches.json

          echo ""
          echo "Total stale branches: $STALE_COUNT"
          if [ "$STALE_COUNT" -gt 0 ]; then
            echo ""
            echo "ACTION REQUIRED: Delete stale branches via:"
            echo "  git push origin --delete <branch-name>"
          else
            echo "No stale branches found."
          fi

      - name: Upload stale branch report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stale-branch-report-${{ github.run_id }}
          path: |
            stale-branches.json
            protected-branches.json
            protected-branches.txt
          if-no-files-found: ignore
          retention-days: 14
