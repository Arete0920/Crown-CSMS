name: Repository Freshness

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - scripts/release/verify_repository_freshness.py
      - .github/workflows/repository-freshness.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-freshness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-authority:
    name: Current release authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Reject stale or contradictory current-facing release claims
        run: python scripts/release/verify_repository_freshness.py

  live-frontend:
    name: Live dashboards source matches certified successor release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_FRONTEND_URL: ${{ vars.CROWN_LIVE_FRONTEND_URL || 'https://yellow-forest-0eecc8b0f.7.azurestaticapps.net' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve whether successor production identity exists
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("docs/CURRENT_RELEASE_STATUS.md").read_text(encoding="utf-8")
          match = re.search(
              r"\*\*Certified release source:\*\* `([0-9a-fA-F]{40})`",
              text,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if match:
                  output.write("certified=true\n")
                  output.write(f"sha={match.group(1).lower()}\n")
                  print(f"Certified successor production source: {match.group(1).lower()}")
              else:
                  output.write("certified=false\n")
                  output.write("sha=\n")
                  print(
                      "No certified successor production source is recorded. "
                      "Live/current-main source equivalence is not an applicable freshness assertion."
                  )
          PY
      - name: Read deployed build identity
        if: steps.authority.outputs.certified == 'true'
        id: live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 60 --retry 4 --retry-all-errors \
            "${LIVE_FRONTEND_URL%/}/build.json" -o /tmp/crown-live-build.json
          if ! live_sha="$(python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              payload = json.loads(Path("/tmp/crown-live-build.json").read_text(encoding="utf-8"))
              value = payload.get("build_sha") if isinstance(payload, dict) else None
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)
          if not isinstance(value, str):
              raise SystemExit(1)
          print(value)
          PY
          )"; then
            echo "::error::Live build.json is invalid JSON or does not contain build_sha"
            exit 1
          fi
          if [[ ! "${live_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Live build.json did not provide a full 40-character build_sha"
            exit 1
          fi
          echo "sha=${live_sha}" >> "${GITHUB_OUTPUT}"
          echo "Live frontend build SHA: ${live_sha}"
      - name: Compare deployed frontend with certified successor source
        if: steps.authority.outputs.certified == 'true'
        shell: bash
        env:
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          CERTIFIED_SHA: ${{ steps.authority.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${LIVE_SHA}"
          fi
          if ! git cat-file -e "${CERTIFIED_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${CERTIFIED_SHA}"
          fi
          if git diff --quiet "${LIVE_SHA}" "${CERTIFIED_SHA}" -- frontend/dashboards; then
            echo "Live frontend is source-equivalent to the certified successor release."
            exit 0
          fi
          echo "::error::Live frontend/dashboards source differs from the certified successor release."
          echo "Deployed SHA:  ${LIVE_SHA}"
          echo "Certified SHA: ${CERTIFIED_SHA}"
          echo "Frontend paths that differ:"
          git diff --name-only "${LIVE_SHA}" "${CERTIFIED_SHA}" -- frontend/dashboards
          exit 1
