name: One-Time Owner Handoff Certification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-owner-handoff-certification.yml"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: one-time-owner-handoff-certification
  cancel-in-progress: false

jobs:
  certify-corrected-owner-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_FRONTEND_SHA: 29727d98528a588e1187b86a51c26bded85eb59e
      BACKEND_DEPLOY_TAG: prod-deploy-20260808-ce12c95
      BACKEND_SHA: ce12c9536ec85346b2446018fa8bfe27edb3ffa0
      REQUIRED_REMEDIATION_SHA: 502ff20e10277816c60067fcd399d3b8232803ba
      CONTROLLING_ISSUE: "1619"
    steps:
      - name: Recover or reuse exact deployment and publish terminal proof
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CONTROLLER_SHA: ${{ github.sha }}
          OBSERVER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import io
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          controller_sha = os.environ["CONTROLLER_SHA"]
          observer_run_url = os.environ["OBSERVER_RUN_URL"]
          target_sha = os.environ["TARGET_FRONTEND_SHA"]
          backend_tag = os.environ["BACKEND_DEPLOY_TAG"]
          backend_sha = os.environ["BACKEND_SHA"]
          remediation_sha = os.environ["REQUIRED_REMEDIATION_SHA"]
          issue_number = os.environ["CONTROLLING_ISSUE"]
          workflow = "deploy-dashboard.yml"
          temp_branch = f"owner-handoff-cert-{target_sha[:12]}"
          temp_branch_removed = False
          api_root = f"https://api.github.com/repos/{repository}"
          target_created_at = None

          def request(method, path_or_url, payload=None, raw=False):
              url = path_or_url if path_or_url.startswith("https://") else f"{api_root}/{path_or_url.lstrip('/')}"
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              last_error = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers, method=method)
                      with urllib.request.urlopen(req, timeout=60) as response:
                          body = response.read()
                      if raw:
                          return body
                      return json.loads(body.decode("utf-8")) if body else {}
                  except urllib.error.HTTPError as exc:
                      last_error = exc
                      if exc.code < 500 and exc.code != 429:
                          raise
                  except urllib.error.URLError as exc:
                      last_error = exc
                  if attempt < 3:
                      time.sleep(2 ** attempt)
              raise last_error

          def resolve_tag_commit():
              obj = request("GET", f"git/ref/tags/{backend_tag}").get("object", {})
              while obj.get("type") == "tag":
                  obj = request("GET", f"git/tags/{obj['sha']}").get("object", {})
              if obj.get("type") != "commit":
                  raise RuntimeError(f"Backend tag does not resolve to a commit: type={obj.get('type')}")
              return obj.get("sha")

          def verify_authorities():
              global target_created_at
              compare = request("GET", f"compare/{remediation_sha}...{target_sha}")
              if compare.get("status") not in {"ahead", "identical"}:
                  raise RuntimeError(
                      f"Remediation ancestry mismatch: status={compare.get('status')} "
                      f"remediation={remediation_sha} target={target_sha}"
                  )
              target_commit = request("GET", f"commits/{target_sha}")
              if target_commit.get("sha") != target_sha:
                  raise RuntimeError(
                      f"Target frontend commit mismatch: expected={target_sha} "
                      f"actual={target_commit.get('sha')}"
                  )
              target_created_at = target_commit.get("commit", {}).get("committer", {}).get("date")
              if not target_created_at:
                  raise RuntimeError("Target frontend commit lacks a committer timestamp")
              actual_backend = resolve_tag_commit()
              if actual_backend != backend_sha:
                  raise RuntimeError(
                      f"Immutable backend tag mismatch: expected={backend_sha} actual={actual_backend}"
                  )

          def list_relevant_workflow_runs():
              if not target_created_at:
                  raise RuntimeError("Target commit timestamp was not initialized")
              runs = []
              for page in range(1, 21):
                  query = urllib.parse.urlencode({"per_page": 100, "page": page})
                  batch = request(
                      "GET", f"actions/workflows/{workflow}/runs?{query}"
                  ).get("workflow_runs", [])
                  runs.extend(batch)
                  if not batch or len(batch) < 100:
                      break
                  oldest_created_at = min(
                      run.get("created_at", "9999-12-31T23:59:59Z") for run in batch
                  )
                  if oldest_created_at < target_created_at:
                      break
              else:
                  raise RuntimeError("Workflow-run pagination exceeded the bounded 2000-run search")
              return runs

          def matching_dashboard_runs():
              return [
                  run for run in list_relevant_workflow_runs()
                  if run.get("head_sha") == target_sha
              ]

          def wait_for_matching_run(timeout_seconds=900):
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  matches = matching_dashboard_runs()
                  if len(matches) == 1:
                      return matches[0]
                  if len(matches) > 1:
                      raise RuntimeError("Multiple dashboard runs resolve to the exact target frontend SHA")
                  time.sleep(10)
              raise RuntimeError("Timed out locating the dashboard run for the exact target frontend SHA")

          def create_temp_branch():
              try:
                  request(
                      "POST",
                      "git/refs",
                      {"ref": f"refs/heads/{temp_branch}", "sha": target_sha},
                  )
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise
                  existing = request("GET", f"git/ref/heads/{temp_branch}")
                  if existing.get("object", {}).get("sha") != target_sha:
                      raise RuntimeError("Existing temporary dispatch branch has the wrong SHA") from exc

          def delete_temp_branch():
              try:
                  request("DELETE", f"git/refs/heads/{temp_branch}")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

          def wait_for_completion(run_id, timeout_seconds=5400):
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  run = request("GET", f"actions/runs/{run_id}")
                  if run.get("status") == "completed":
                      return run
                  time.sleep(30)
              raise RuntimeError(f"Timed out waiting for dashboard run {run_id}")

          def post_issue_comment(body):
              request("POST", f"issues/{issue_number}/comments", {"body": body})

          def logs_contain_markers(run_id, markers):
              archive = request("GET", f"actions/runs/{run_id}/logs", raw=True)
              remaining = set(markers)
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  for name in bundle.namelist():
                      if name.endswith("/"):
                          continue
                      text = bundle.read(name).decode("utf-8", "replace")
                      remaining = {marker for marker in remaining if marker not in text}
                      if not remaining:
                          return True
              raise RuntimeError("Dashboard logs lack required identity markers: " + ", ".join(sorted(remaining)))

          try:
              verify_authorities()
              matches = matching_dashboard_runs()
              if len(matches) > 1:
                  raise RuntimeError("Multiple dashboard runs resolve to the exact target frontend SHA")
              if matches:
                  dashboard_run = matches[0]
                  print(f"Reusing exact-SHA dashboard run {dashboard_run['id']}")
              else:
                  create_temp_branch()
                  request(
                      "POST",
                      f"actions/workflows/{workflow}/dispatches",
                      {
                          "ref": temp_branch,
                          "inputs": {
                              "deploy_label": f"owner-handoff-{remediation_sha[:7]}",
                              "backend_deploy_tag": backend_tag,
                          },
                      },
                  )
                  dashboard_run = wait_for_matching_run()

              if dashboard_run.get("head_sha") != target_sha:
                  raise RuntimeError(
                      f"Dashboard run source mismatch: expected={target_sha} "
                      f"actual={dashboard_run.get('head_sha')}"
                  )

              dashboard_run = wait_for_completion(dashboard_run["id"])
              if dashboard_run.get("conclusion") != "success":
                  raise RuntimeError(
                      f"Dashboard deployment/certification failed: "
                      f"conclusion={dashboard_run.get('conclusion')} "
                      f"url={dashboard_run.get('html_url')}"
                  )

              logs_contain_markers(
                  dashboard_run["id"],
                  {
                      f"Manual backend authority resolved: {backend_tag} -> {backend_sha[:7]}",
                      target_sha,
                  },
              )

              jobs = request("GET", f"actions/runs/{dashboard_run['id']}/jobs?per_page=100").get("jobs", [])
              required_steps = {
                  "Validate exact backend identity before deploy",
                  "Wait for exact frontend and backend deployment",
                  "Validate passwordless Heritage demo session",
                  "Run production certification crawler against deployed runtime",
              }
              observed_steps = {
                  step.get("name"): step.get("conclusion")
                  for job in jobs
                  for step in job.get("steps", [])
                  if step.get("name") in required_steps
              }
              missing_or_failed = sorted(
                  name for name in required_steps if observed_steps.get(name) != "success"
              )
              if missing_or_failed:
                  raise RuntimeError(
                      "Required deployment/certification steps are not successful: "
                      + ", ".join(missing_or_failed)
                  )

              artifacts = request(
                  "GET", f"actions/runs/{dashboard_run['id']}/artifacts?per_page=100"
              ).get("artifacts", [])
              cert_artifacts = [
                  artifact
                  for artifact in artifacts
                  if artifact.get("name", "").startswith("production-certification-evidence-")
                  and not artifact.get("expired", False)
              ]
              if not cert_artifacts:
                  raise RuntimeError("Dashboard run produced no production certification evidence artifact")
              cert_artifact = sorted(cert_artifacts, key=lambda item: item["created_at"])[-1]
              archive = request("GET", cert_artifact["archive_download_url"], raw=True)
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  matrix_names = [
                      name for name in bundle.namelist()
                      if name.endswith("certification-matrix.json")
                  ]
                  if len(matrix_names) != 1:
                      raise RuntimeError(
                          f"Certification artifact must contain one matrix; found={len(matrix_names)}"
                      )
                  matrix = json.loads(bundle.read(matrix_names[0]).decode("utf-8"))

              total = len(matrix)
              passed = sum(1 for row in matrix if row.get("status") == "PASS")
              failed = sum(1 for row in matrix if row.get("status") == "FAIL")
              rows_with_errors = [
                  row.get("id") or row.get("route") or "unknown"
                  for row in matrix
                  if row.get("errors")
              ]
              if (total, passed, failed) != (18, 18, 0) or rows_with_errors:
                  raise RuntimeError(
                      f"Live certification mismatch: total={total} passed={passed} "
                      f"failed={failed} rows_with_errors={rows_with_errors}"
                  )

              delete_temp_branch()
              temp_branch_removed = True

              proof = f"""## Owner-handoff remediation deployment proof — PASS

              - Remediation merge: {remediation_sha}
              - Exact deployed frontend source: {target_sha}
              - Immutable backend tag: {backend_tag}
              - Exact backend SHA: {backend_sha}
              - Dashboard deployment and embedded production certification: [run {dashboard_run['id']}]({dashboard_run['html_url']}) — success
              - Certification artifact: {cert_artifact['name']}
              - Required deployment/identity/session/crawler steps: all successful
              - Strengthened live certification: {passed}/{total} PASS, {failed} FAIL, zero rows with recorded errors
              - Temporary exact-SHA dispatch branch: removed
              - Recovery controller source: {controller_sha}
              - Connector-readable observer: {observer_run_url}

              The recovery reused any existing exact-SHA dashboard run and dispatched only when none existed. It performed no backend deployment and no production-tag mutation. Issue #1619 remains open for independent evidence verification, observer cleanup, final URL review, identity reconciliation, and explicit reclosure."""
              post_issue_comment("\n".join(line.strip() for line in proof.strip().splitlines()))
              print("Owner-handoff remediation deployment proof published to issue #1619")
          except Exception as exc:
              failure = f"""## Owner-handoff remediation deployment proof — FAIL

              - Remediation merge: {remediation_sha}
              - Target frontend source: {target_sha}
              - Recovery controller source: {controller_sha}
              - Immutable backend tag: {backend_tag}
              - Expected backend SHA: {backend_sha}
              - Observer: {observer_run_url}
              - Failure: {str(exc)}

              Issue #1619 remains open. No handoff-ready or closure claim is made."""
              post_issue_comment("\n".join(line.strip() for line in failure.strip().splitlines()))
              raise
          finally:
              if not temp_branch_removed:
                  try:
                      delete_temp_branch()
                  except Exception as cleanup_exc:
                      print(f"WARNING: temporary branch cleanup failed: {cleanup_exc}")
