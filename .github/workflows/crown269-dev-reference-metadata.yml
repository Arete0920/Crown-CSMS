name: CROWN 269 DEV Key Vault reference metadata (read-only)

# Single-purpose, manual-only evidence collection. No secret value reads, refresh,
# App Service configuration writes, database connections, HTTP probes or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crown269-dev-keyvault-reference-metadata
  cancel-in-progress: false

jobs:
  two-fixed-reference-gets:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Arete0920/Crown-CSMS'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify exact owner, repository identity, and immutable main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Arete0920/Crown-CSMS'
          test "$GITHUB_REPOSITORY_ID" = '1339719218'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          printf 'Repository main identity gate: PASS\n'
      - name: Checkout immutable dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify checker source compiles (offline)
        run: python -m py_compile scripts/ops/crown269_reference_metadata_readonly.py
      - name: Authenticate using existing DEV OIDC identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read only two fixed app-setting Key Vault reference statuses
        shell: bash
        env:
          CROWN269_EXPECTED_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          CROWN269_EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          python scripts/ops/crown269_reference_metadata_readonly.py \
            --receipt "$RUNNER_TEMP/crown269-dev-reference-metadata.json"
      - name: Retain sanitized evidence even if a read is denied
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crown269-dev-reference-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/crown269-dev-reference-metadata.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Discard local evidence and Azure CLI session
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/crown269-dev-reference-metadata.json"
          az logout >/dev/null 2>&1 || true
