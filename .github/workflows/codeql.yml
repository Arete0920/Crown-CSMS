name: CodeQL Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    needs: [remediation-contract, archive-contract-windows]
    if: always()
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript-typescript' ]

    steps:
      - name: Require successful history-remediation contract
        env:
          CONTRACT_RESULT: ${{ needs.remediation-contract.result }}
          WINDOWS_CONTRACT_RESULT: ${{ needs.archive-contract-windows.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$WINDOWS_CONTRACT_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Repo-level default setup is enabled; avoid duplicate SARIF upload conflict from advanced workflow runs.
          upload: false

  archive-contract-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact archive source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Git Bash for native archive verification
        shell: pwsh
        run: '"C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Verify real Git archive contracts on Windows
        run: python -m unittest discover -s tools/tests -p test_remediated_history_verifier.py -v
      - name: Verify the PowerShell archive entry point fails closed
        shell: pwsh
        run: ./tools/tests/test_archive_guard_windows.ps1

  remediation-contract:
    permissions:
      contents: read
    # Synthetic fixtures only: success is not issue #104 retirement or all-ref evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate shell syntax
        run: bash -n tools/verify_remediated_git_bundle.sh
      - name: Reject incomplete or masked history
        run: python -m unittest discover -s tools/tests -p test_remediated_history_verifier.py -v
      - name: Verify security-held audit bundle cannot be reactivated
        run: python -m unittest discover -s tools/tests -p test_solomon_bundle_revocation.py -v
      - name: Prove forbidden history is rejected and clean history is accepted
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/verify_remediated_git_bundle.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git init "$tmp/source" >/dev/null
          git -C "$tmp/source" config user.email "ci@example.invalid"
          git -C "$tmp/source" config user.name "CI Contract"
          mkdir -p "$tmp/source/secret"
          printf '%s\n' 'private material fixture' > "$tmp/source/secret/key.pem"
          git -C "$tmp/source" add secret/key.pem
          git -C "$tmp/source" commit -m "fixture: add forbidden path" >/dev/null
          git -C "$tmp/source" branch -M main

          git clone --mirror "$tmp/source" "$tmp/dirty.git" >/dev/null 2>&1
          if tools/verify_remediated_git_bundle.sh --repo "$tmp/dirty.git" --forbidden-path secret/key.pem; then
            echo "Dirty history unexpectedly passed" >&2
            exit 1
          fi

          git -C "$tmp/source" rm secret/key.pem >/dev/null
          git -C "$tmp/source" commit -m "fixture: remove current-tree file" >/dev/null
          git clone --mirror "$tmp/source" "$tmp/still-dirty.git" >/dev/null 2>&1
          if tools/verify_remediated_git_bundle.sh --repo "$tmp/still-dirty.git" --forbidden-path secret/key.pem; then
            echo "Current-tree deletion unexpectedly erased historical exposure" >&2
            exit 1
          fi

          git init "$tmp/clean" >/dev/null
          git -C "$tmp/clean" config user.email "ci@example.invalid"
          git -C "$tmp/clean" config user.name "CI Contract"
          printf '%s\n' 'clean fixture' > "$tmp/clean/README.md"
          git -C "$tmp/clean" add README.md
          git -C "$tmp/clean" commit -m "fixture: clean repository" >/dev/null
          git -C "$tmp/clean" branch -M main
          git clone --mirror "$tmp/clean" "$tmp/clean.git" >/dev/null 2>&1
          tools/verify_remediated_git_bundle.sh --repo "$tmp/clean.git" --forbidden-path secret/key.pem > "$tmp/clean-repo-result.txt"
          grep -Fxq 'verification=success' "$tmp/clean-repo-result.txt"
          grep -Fxq 'boundary=This verifier does not prove key revocation, replacement, downstream trust updates, or all-ref secret scanning.' "$tmp/clean-repo-result.txt"

          git -C "$tmp/clean" bundle create "$tmp/clean.bundle" --all
          tools/verify_remediated_git_bundle.sh --bundle "$tmp/clean.bundle" --forbidden-path secret/key.pem > "$tmp/clean-bundle-result.txt"
          grep -Fxq 'verification=success' "$tmp/clean-bundle-result.txt"
          grep -Fxq 'boundary=This verifier does not prove key revocation, replacement, downstream trust updates, or all-ref secret scanning.' "$tmp/clean-bundle-result.txt"
      - name: Enforce non-authority boundary
        run: |
          grep -Fq 'does not revoke, rotate, generate, register, or distribute' docs/security/ed25519-history-remediation-runbook.md
          grep -Fq 'must not close based only on this runbook' docs/security/ed25519-history-remediation-runbook.md
