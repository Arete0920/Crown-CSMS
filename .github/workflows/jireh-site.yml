name: Jireh site verification
on:
  pull_request:
    paths:
      - 'sites/jireh/**'
      - 'sites/shared/**'
      - '.github/workflows/jireh-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/jireh/**'
      - 'sites/shared/**'
      - '.github/workflows/jireh-site.yml'
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate hero, responsive design, content claims, security and staging output
        run: node --test sites/jireh/tests/site.test.mjs
