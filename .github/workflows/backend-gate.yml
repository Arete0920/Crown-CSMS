name: backend-gate

on:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "tools/verify_backend_gate.py"
      - ".github/workflows/backend-gate.yml"

jobs:
  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Backend Gate
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///./ci.sqlite3
        run: |
          python tools/verify_backend_gate.py

      - name: "Tenant tripwires (structural AST checks)"
        run: |
          # Checks 4+5 from verify_backend_gate.py — multi-line-safe AST analysis.
          # Replaces grep-based tripwires that could false-positive on multi-line calls.
          python tools/verify_backend_gate.py --tenant-checks-only

