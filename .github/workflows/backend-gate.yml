name: backend-gate
permissions:
  contents: read


on:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "tools/verify_backend_gate.py"
      - ".github/workflows/backend-gate.yml"

concurrency:
  group: backend-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Inventory existing style debt without treating it as a release verdict.
      - name: Inventory Python maintainability (nonblocking debt)
        run: python scripts/quality/python_maintainability_audit.py . --limit 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Backend Gate
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///./ci.sqlite3
        run: |
          # The full gate already fails on tenant AST tripwires (checks 4-6).
          python tools/verify_backend_gate.py

