name: backend-gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "tools/verify_backend_gate.py"
      - ".github/workflows/backend-gate.yml"
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "tools/verify_backend_gate.py"
      - ".github/workflows/backend-gate.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Backend Gate
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///./ci.sqlite3
        run: |
          python tools/verify_backend_gate.py

      - name: "Tenant tripwire: no unscoped Section fetch"
        run: |
          # Fail if any get_object_or_404(Section, id=...) line is missing a school_id= arg.
          # This catches the CRITICAL #1 pattern before it can reach main.
          HITS=$(grep -rn "get_object_or_404(Section, id=" backend/ | grep -v "school_id=" || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: Unscoped Section fetch found — must include school_id="
            echo "$HITS"
            exit 1
          fi
          echo "PASS: All Section fetches by id are school-scoped"

      - name: "Tenant tripwire: no required=False in write-handler call sites"
        run: |
          # Fail if any call-site passes required=False to get_request_school_id inside a
          # write handler. Legitimate required=False uses are:
          #   - households/scoping.py  (function definition default)
          #   - crown_api/tenant_guards.py  (read-only validation mixin)
          HITS=$(grep -rn "get_request_school_id(request, required=False)" backend/ \
                 | grep -v "households/scoping.py" \
                 | grep -v "tenant_guards.py" || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: get_request_school_id(request, required=False) found in write handler"
            echo "$HITS"
            exit 1
          fi
          echo "PASS: No required=False call-sites in write handlers"
