name: Apply Ed25519 History Rewrite

# Fail-closed safety interlock. The authoritative rewrite is blocked until an
# owner-approved protected-ref maintenance or bypass procedure is available.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ed25519-history-rewrite.yml"

permissions:
  contents: read

concurrency:
  group: apply-ed25519-history-rewrite
  cancel-in-progress: false

jobs:
  protected-ref-interlock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unsafe partial history mutation
        run: |
          set -euo pipefail
          echo 'BLOCKED: authoritative history rewrite requires updates to protected tags.'
          echo 'Verified protected changed refs include:'
          echo '  refs/tags/freeze-2026-02-03-proof-green-baseline'
          echo '  refs/tags/freeze-2026-02-03-proof-green-ci-canon'
          echo 'Do not mutate any additional refs until an owner-approved ruleset maintenance or bypass procedure can update every changed protected ref atomically enough for fresh remote verification.'
          exit 1
