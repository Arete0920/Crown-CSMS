name: dashboards-build-gate
# No-op change to trigger required check context on backend-only PRs.

on:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/dashboards/**"
      - ".github/workflows/dashboards-build-gate.yml"

jobs:
  dashboards-build-gate:
    name: dashboards-build-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install
        run: npm ci

      - name: Stage 1 regression guard – no silent catch handlers
        working-directory: .
        run: |
          FOUND=0
          OPTS="--include=*.jsx --include=*.js --include=*.ts --include=*.tsx"

          # Family 1: empty body — .catch(() => {}) or .catch(() =>)
          if grep -rn $OPTS -P '\.catch\s*\(\s*\(\s*\)\s*=>\s*\{?\s*\}?\s*\)' frontend/dashboards/src/; then
            echo "ERROR: Family 1 – empty catch body detected."
            FOUND=1
          fi

          # Family 2: null-setter — .catch(() => setSomething(null))
          if grep -rn $OPTS -P '\.catch\s*\(\s*\(\s*\)\s*=>\s*set\w+\s*\(\s*null\s*\)\s*\)' frontend/dashboards/src/; then
            echo "ERROR: Family 2 – null-setting catch handler detected."
            FOUND=1
          fi

          # Family 3: explicit undefined — .catch(() => undefined)
          if grep -rn $OPTS -P '\.catch\s*\(\s*\(\s*\)\s*=>\s*undefined\s*\)' frontend/dashboards/src/; then
            echo "ERROR: Family 3 – undefined-returning catch handler detected."
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "Stage 1 guard FAILED: silent catch handler(s) detected."
            exit 1
          fi
          echo "Stage 1 guard OK: all 3 silent-catch families clean."

      - name: Write build.json
        run: |
          mkdir -p public
          printf '{"build_sha":"%s","deploy_tag":"%s"}' "${{ github.sha }}" "${{ github.ref_name }}" > public/build.json

      - name: Build
        env:
          VITE_API_BASE_URL: "http://localhost:8000"
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_DEPLOY_TAG: ${{ github.ref_name }}
        run: npm run build
