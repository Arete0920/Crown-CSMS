name: dashboards-build-gate

on:
  pull_request:
    paths:
      - "frontend/dashboards/**"
      - ".github/workflows/dashboards-build-gate.yml"
  push:
    branches: [ "main" ]
    paths:
      - "frontend/dashboards/**"
      - ".github/workflows/dashboards-build-gate.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboards
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install
        run: npm ci

      - name: Stage 1 regression guard – no silent catch handlers
        working-directory: .
        run: |
          if grep -rn --include="*.jsx" --include="*.js" -P '\.catch\s*\(\s*\(\s*\)\s*=>\s*\{?\s*\}?\s*\)' frontend/dashboards/src/; then
            echo "ERROR: Silent empty catch handler(s) detected. Stage 1 invariant violated."
            exit 1
          fi
          echo "Stage 1 guard OK: no silent empty catch handlers found."

      - name: Write build.json
        run: |
          mkdir -p public
          printf '{"build_sha":"%s","deploy_tag":"%s"}' "${{ github.sha }}" "${{ github.ref_name }}" > public/build.json

      - name: Build
        env:
          VITE_API_BASE_URL: "http://localhost:8000"
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_DEPLOY_TAG: ${{ github.ref_name }}
        run: npm run build
