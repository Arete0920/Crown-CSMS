name: Manual Legacy Demo Proof Pack
permissions:
  contents: read

on:
  workflow_dispatch: {}

concurrency:
  group: legacy-demo-proof-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  demo-proof-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static demo-surface proof gate
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/verify_phase3_demo_proof.ps1 -Mode static
