name: Dependency Scan
permissions:
  contents: read


on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC regardless of pushes
    - cron: "0 6 * * 1"

jobs:
  python-safety:
    name: Python â€” safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run safety check
        working-directory: backend
        run: safety check --full-report
        # Continue on error so we get a report even if vulns found;
        # treat as informational for now (escalate to blocking when baseline is clean).
        continue-on-error: true

  python-pip-audit:
    name: Python â€” pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt -f json -o pip-audit-results.json || true
            if [ -f pip-audit-results.json ]; then
              cat pip-audit-results.json
            else
              echo "[]"
            fi
          else
            echo "No requirements.txt found â€” skipping pip-audit"
          fi

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: backend/pip-audit-results.json
          if-no-files-found: ignore

  node-audit:
    name: Node â€” npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (dashboards)
        working-directory: frontend/dashboards
        run: |
          npm ci --prefer-offline 2>/dev/null || npm install
          npm audit --audit-level=high || true

