name: Workflow Permissions Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workflow-permissions-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate permissions audit report
        run: python tools/audit_workflow_permissions.py

      - name: Test CI metrics accounting
        run: python -m unittest discover -s tools/ci -p 'test_report_ci_metrics.py' -v

      - name: Generate bounded CI metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ci/report_ci_metrics.py

      - name: Upload permissions audit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-permissions-audit-${{ github.run_id }}
          path: |
            workflow-permissions-audit.json
            ci-metrics.json
          retention-days: 14
          if-no-files-found: error
