name: Workflow Permissions Audit

on:
  schedule:
    - cron: "0 6 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-permissions-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"

      - name: Generate permissions audit report
        run: python tools/audit_workflow_permissions.py

      - name: Upload permissions audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-permissions-audit-${{ github.run_id }}
          path: workflow-permissions-audit.json
