name: Jireh SGO fictional intake acceptance
permissions:
  contents: read

on:
  push:
    branches:
      - test/jireh-sgo-fictional-acceptance-clean-20261102
  pull_request:
    branches:
      - feature/jireh-sgo-fictional-intake-20261102
  workflow_dispatch:

concurrency:
  group: jireh-sgo-fictional-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  fictional-sgo-sqlite:
    name: fictional-sgo-sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: crown_api.settings
      DJANGO_SECRET_KEY: ci-only-not-production
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: sqlite:///./sgo-ci.sqlite3
      DEBUG: "1"
      CROWN_ENV: local
      DJANGO_ENV: local
      CROWN_DEMO_MODE: "false"
      CROWN_SGO_FICTIONAL_INTAKE_ENABLED: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install existing backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-dev.txt

      - name: Require synthetic local SQLite test environment
        run: |
          python - <<'PY'
          import django
          from django.conf import settings
          django.setup()
          from django.db import connection
          assert connection.vendor == "sqlite", "SGO fictional acceptance must not access a hosted database"
          assert settings.DEBUG is True
          assert settings.CROWN_SGO_FICTIONAL_INTAKE_ENABLED is True
          assert settings.CROWN_ENV == settings.DJANGO_ENV == "local"
          print("Explicit local SQLite test contract confirmed")
          PY

      - name: Execute real JWT family and processor acceptance tests
        run: |
          python -m pytest -q             backend/jireh_sgo/tests/test_fictional_intake_api.py             backend/jireh_sgo/tests/test_fictional_intake_seed.py             --junitxml=sgo-fictional-acceptance.xml

      - name: Preserve exact-head acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sgo-fictional-acceptance-${{ github.sha }}
          path: sgo-fictional-acceptance.xml
          if-no-files-found: warn
          retention-days: 14
