name: Production Surface Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/release/production_surface_inventory.py"
      - "scripts/release/production_surface_inventory_runner.py"
      - "backend/tests/test_production_surface_inventory.py"
      - "backend/tests/test_production_surface_inventory_runner.py"
      - "frontend/dashboards/src/routes/paths.js"
      - "frontend/dashboards/src/routes/wizard-manifest.js"
      - "frontend/dashboards/src/config/dashboardRegistry.js"
      - "frontend/dashboards/src/pages/**"
      - "backend/**/apps.py"
      - "backend/**/tasks.py"
      - "backend/**/urls.py"
      - "backend/**/management/commands/*.py"
      - "backend/crown_api/wizard_registry.py"
      - "docs/engineering/PRODUCTION_SURFACE_INVENTORY.md"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/release/production_surface_inventory.py"
      - "scripts/release/production_surface_inventory_runner.py"
      - "backend/tests/test_production_surface_inventory.py"
      - "backend/tests/test_production_surface_inventory_runner.py"
      - "frontend/dashboards/src/routes/paths.js"
      - "frontend/dashboards/src/routes/wizard-manifest.js"
      - "frontend/dashboards/src/config/dashboardRegistry.js"
      - "frontend/dashboards/src/pages/**"
      - "backend/**/apps.py"
      - "backend/**/tasks.py"
      - "backend/**/urls.py"
      - "backend/**/management/commands/*.py"
      - "backend/crown_api/wizard_registry.py"
      - "docs/engineering/PRODUCTION_SURFACE_INVENTORY.md"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-surface-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: crown_api.settings
      DJANGO_SECRET_KEY: inventory-ci-not-a-secret
      DATABASE_URL: sqlite:////tmp/crown-production-surface-inventory.sqlite3
      INVENTORY_REPOSITORY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT_DIR: audit-artifacts/production-surface/current

    steps:
      - name: Checkout exact repository identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.INVENTORY_REPOSITORY_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run focused inventory tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            backend/tests/test_production_surface_inventory.py \
            backend/tests/test_production_surface_inventory_runner.py
          python -m py_compile \
            scripts/release/production_surface_inventory.py \
            scripts/release/production_surface_inventory_runner.py

      - name: Generate diagnostic inventory
        id: generate
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p "${OUTPUT_DIR}"
          python scripts/release/production_surface_inventory_runner.py \
            --root . \
            --output-dir "${OUTPUT_DIR}" \
            --fail-on-unmapped \
            > "${OUTPUT_DIR}/generation.log" 2>&1
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          cat "${OUTPUT_DIR}/generation.log"
          exit 0

      - name: Validate evidence packet
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python - <<'PY' > "${OUTPUT_DIR}/validation.log" 2>&1
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["OUTPUT_DIR"]) / "production-surface-inventory.json"
          packet = json.loads(path.read_text())
          required_domains = {
              "frontend_route", "dashboard", "module", "wizard",
              "wizard_step", "api", "task", "integration",
              "command", "workflow",
          }
          assert packet["repository_sha"] == os.environ["INVENTORY_REPOSITORY_SHA"]
          assert packet["validation_errors"] == []
          assert packet["counts"]["by_classification"].get("UNMAPPED", 0) == 0
          assert required_domains.issubset(packet["counts"]["by_domain"])
          assert packet["surface_count"] == len(packet["surfaces"])
          assert len(packet["inventory_digest"]) == 64
          PY
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          cat "${OUTPUT_DIR}/validation.log"
          exit 0

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-surface-inventory-${{ env.INVENTORY_REPOSITORY_SHA }}
          path: audit-artifacts/production-surface/current/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce inventory result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.generate.outputs.exit_code }}" = "0"
          test "${{ steps.validate.outputs.exit_code }}" = "0"
