name: Merged Branch Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  delete-merged-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged branch when no open PR depends on it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            echo "Fork branch is outside this repository; nothing to delete."
            exit 0
          fi

          if [ -z "$HEAD_BRANCH" ] || [ "$HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Default or empty branch is never deleted."
            exit 0
          fi

          encoded_branch="$(python - "$HEAD_BRANCH" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=""))
PY
)"
          branch_json="$(gh api "repos/$REPOSITORY/branches/$encoded_branch")"
          if [ "$(printf '%s' "$branch_json" | jq -r '.protected')" = "true" ]; then
            echo "Branch is protected; retaining $HEAD_BRANCH."
            exit 0
          fi

          dependent_count="$(
            gh api --method GET "repos/$REPOSITORY/pulls"               -f state=open -f base="$HEAD_BRANCH" -f per_page=100               --jq 'length'
          )"

          if [ "$dependent_count" -gt 0 ]; then
            echo "Retaining $HEAD_BRANCH because $dependent_count open PR(s) still use it as a base."
            exit 0
          fi

          encoded_ref="$(python - "$HEAD_BRANCH" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote("heads/" + sys.argv[1], safe="/"))
PY
)"
          gh api --method DELETE "repos/$REPOSITORY/git/refs/$encoded_ref"
          echo "Deleted merged branch: $HEAD_BRANCH"

  sweep-existing-merged-branches:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete only provably merged inactive branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          deleted=0
          retained=0

          mapfile -t branches < <(
            gh api --paginate "repos/$REPOSITORY/branches?per_page=100" --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            if [ "$branch" = "$DEFAULT_BRANCH" ]; then
              continue
            fi

            encoded_branch="$(python - "$branch" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=""))
PY
)"
            branch_json="$(gh api "repos/$REPOSITORY/branches/$encoded_branch")"
            protected="$(printf '%s' "$branch_json" | jq -r '.protected')"
            branch_sha="$(printf '%s' "$branch_json" | jq -r '.commit.sha')"

            if [ "$protected" = "true" ]; then
              echo "KEEP protected: $branch"
              retained=$((retained + 1))
              continue
            fi

            open_head_count="$(
              gh api --method GET "repos/$REPOSITORY/pulls"                 -f state=open -f head="$owner:$branch" -f per_page=100                 --jq 'length'
            )"
            if [ "$open_head_count" -gt 0 ]; then
              echo "KEEP open-head: $branch"
              retained=$((retained + 1))
              continue
            fi

            open_base_count="$(
              gh api --method GET "repos/$REPOSITORY/pulls"                 -f state=open -f base="$branch" -f per_page=100                 --jq 'length'
            )"
            if [ "$open_base_count" -gt 0 ]; then
              echo "KEEP open-base: $branch"
              retained=$((retained + 1))
              continue
            fi

            merged_same_head="$(
              gh api --method GET "repos/$REPOSITORY/pulls"                 -f state=closed -f head="$owner:$branch" -f per_page=100                 --jq "[.[] | select(.merged_at != null and .head.sha == \"$branch_sha\")] | length"
            )"

            if [ "$merged_same_head" -eq 0 ]; then
              echo "KEEP not-proven-merged-at-current-head: $branch"
              retained=$((retained + 1))
              continue
            fi

            encoded_ref="$(python - "$branch" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote("heads/" + sys.argv[1], safe="/"))
PY
)"
            gh api --method DELETE "repos/$REPOSITORY/git/refs/$encoded_ref"
            echo "DELETE merged current-head branch: $branch"
            deleted=$((deleted + 1))
          done

          echo "Deleted branches: $deleted"
          echo "Retained branches: $retained"
