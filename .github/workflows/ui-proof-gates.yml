name: UI Proof — Dashboard Gates (Student · Parent · Executive)

on:
  workflow_dispatch:

  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ui-proof-gates.yml"
      - "frontend/dashboards/tests/ui/student-dashboard-v2.spec.ts"
      - "frontend/dashboards/tests/ui/parent-dashboard-v1.spec.ts"
      - "frontend/dashboards/tests/ui/executive-dashboard-v1.spec.ts"
      - "frontend/dashboards/src/pages/StudentDashboard.jsx"
      - "frontend/dashboards/src/pages/ParentDashboard.jsx"
      - "frontend/dashboards/src/pages/AdminDashboard.jsx"
      - "backend/student360/**"
      - "backend/parent360/**"
      - "backend/executive360/**"

concurrency:
  group: ui-proof-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-ui-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend/dashboards

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboards/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      # NOTE: Vite is intentionally NOT pre-started here.
      # playwright.config.ts webServer config owns the server lifecycle (port 4173).
      # Pre-starting Vite separately caused a port collision (port 3000 already in use)
      # because Playwright also tried to start the server when reuseExistingServer=false.

      - name: Run UI proof gates
        # IMPORTANT: specs are listed explicitly — do NOT replace with `tests/ui`.
        # The folder contains matrix specs (role-dashboard-matrix*.spec.ts) that
        # assert sidebar nav links which don't exist in CI, causing false failures.
        # Add new dashboard specs here individually when they are ready to gate.
        env:
          VITE_DEV_BASE_URL: http://127.0.0.1:4173
          CROWN_DEMO_TOKEN: playwright-demo-token
          CROWN_DEMO_SCHOOL_ID: 19801b59-8c05-4c84-9312-5d792e4e839d
        run: |
          npx playwright test \
            tests/ui/student-dashboard-v2.spec.ts \
            tests/ui/parent-dashboard-v1.spec.ts \
            tests/ui/executive-dashboard-v1.spec.ts \
            --reporter=line

      - name: Dump Playwright webServer log on failure
        if: failure()
        run: |
          # Playwright writes its webServer stderr to the job log directly.
          # This step is a placeholder for any additional debug artifacts.
          echo "(Playwright webServer stderr is captured inline above)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-dashboard-report
          path: frontend/dashboards/playwright-report/
          retention-days: 7
