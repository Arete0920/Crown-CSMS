name: CI - Tests and Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-immutable-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to verify tags
          fetch-tags: true
      
      - name: Verify release tags are immutable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          echo "Verifying immutable release tags..."
          
          # Validate registry format: all SHAs must be full 40-char hex
          echo "Validating registry format..."
          while IFS= read -r sha; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "❌ CRITICAL: Invalid SHA format in registry: $sha"
              echo "   Registry must contain full 40-character commit SHAs only"
              exit 1
            fi
          done < <(jq -r '.[]' docs/RELEASE_TAGS.json)
          echo "✅ Registry format valid (all full SHAs)"
          echo ""
          
          # Read all expected tags from RELEASE_TAGS.json
          tags=$(jq -r 'keys[]' docs/RELEASE_TAGS.json)
          
          failed=0
          for tag in $tags; do
            expected_sha=$(jq -r ".[\"$tag\"]" docs/RELEASE_TAGS.json)
            # Explicitly resolve to commit (not tag object)
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "❌ CRITICAL: Tag $tag not found in repository"
              failed=1
              continue
            fi

            actual_sha=$(git rev-parse "${tag}^{commit}")
            
            echo "Checking $tag:"
            echo "  Expected: $expected_sha"
            echo "  Actual:   $actual_sha"
            
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "  ❌ CRITICAL: Tag $tag has been moved!"
              echo "     Expected commit: $expected_sha"
              echo "     Current commit:  $actual_sha"
              echo ""
              failed=1
            else
              echo "  ✅ Verified"
            fi
            echo ""
          done
          
          if [[ $failed -eq 1 ]]; then
            echo "❌ Tag immutability violated. Create new tags instead of moving existing ones."
            exit 1
          fi
          
          echo "✅ All release tags verified immutable"

  test:
    runs-on: ubuntu-latest
    needs: verify-immutable-tags
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: |
          source venv/bin/activate
          python manage.py makemigrations --check --dry-run --no-input
        continue-on-error: false

      - name: Run Django test suite
        run: |
          source venv/bin/activate
          python manage.py test \
            crown_api.tests.test_households_api \
            crown_api.tests.test_students_api \
            crown_api.tests.test_director_router \
            crown_api.tests.test_director_actions_auth_required \
            crown_api.tests.test_admissions_links_api \
            crown_api.tests.test_academics_api \
            crown_api.tests.test_billing_summary_api \
            crown_api.tests.test_comms_api \
            crown_api.tests.test_scheduling_api \
            -v 2
        continue-on-error: false

      - name: Test health endpoint locally
        run: |
          source venv/bin/activate
          python manage.py runserver 8000 &
          SERVER_PID=$!
          sleep 5
          
          # Test health endpoint
          response=$(curl -f http://localhost:8000/api/health/ || echo "FAILED")
          
          # Kill server
          kill $SERVER_PID || true
          
          # Check response
          if [[ "$response" == "FAILED" ]]; then
            echo "❌ Health endpoint failed"
            exit 1
          fi
          
          echo "✅ Health endpoint responding: $response"
        continue-on-error: false

      - name: Fail fast summary
        if: failure()
        run: |
          echo "❌ CI failed - check logs above"
          echo "Possible causes:"
          echo "  - Missing migrations (run: python manage.py makemigrations)"
          echo "  - Test failures (run: python manage.py test)"
          echo "  - Health endpoint broken (check crown_api/health_views.py)"
          exit 1

  golden-path-dev:
    name: Golden Path Smoke (DEV)
    runs-on: ubuntu-latest
    needs: [ test ]
    # Only run on main branch pushes (not PRs), unless manual dispatch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Assert GP_API_BASE is set
        shell: pwsh
        env:
          GP_API_BASE: https://crown-api-dev.azurewebsites.net
        run: |
          if (-not $env:GP_API_BASE) { throw "GP_API_BASE is empty" }
          Write-Host "GP_API_BASE=$env:GP_API_BASE"

      - name: Debug GP endpoints (non-blocking)
        shell: pwsh
        continue-on-error: true
        env:
          GP_API_BASE: https://crown-api-dev.azurewebsites.net
        run: |
          Write-Host "GP_API_BASE=$env:GP_API_BASE"
          Write-Host "HEALTH=$($env:GP_API_BASE)/api/health/"
          Write-Host "TOKEN=$($env:GP_API_BASE)/api/v1/auth/token/"

          $healthUrl = "$env:GP_API_BASE/api/health/"
          for ($i=1; $i -le 10; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri $healthUrl -TimeoutSec 30
              Write-Host "Health OK on attempt $i: $($resp | ConvertTo-Json -Compress)"
              break
            } catch {
              Write-Host "Health attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }

      - name: Wait for DEV to be healthy (blocking)
        shell: pwsh
        env:
          GP_API_BASE: https://crown-api-dev.azurewebsites.net
        run: |
          $healthUrl = "$env:GP_API_BASE/api/health/"
          for ($i=1; $i -le 24; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri $healthUrl -TimeoutSec 30
              if ($resp.ok -eq $true) {
                Write-Host "DEV healthy: $($resp | ConvertTo-Json -Compress)"
                exit 0
              }
              Write-Host "DEV responded but not ok: $($resp | ConvertTo-Json -Compress)"
            } catch {
              Write-Host "Attempt $i/24 failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          throw "DEV did not become healthy in time: $healthUrl"

      - name: Ensure CI user exists in DEV (ops)
        shell: pwsh
        env:
          GP_API_BASE: https://crown-api-dev.azurewebsites.net
          GP_USERNAME: ${{ secrets.GP_USERNAME }}
          GP_PASSWORD: ${{ secrets.GP_PASSWORD }}
          DEV_OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
        run: |
          $uri = "$env:GP_API_BASE/api/v1/ops/ensure-ci-user/"
          Write-Host "OPS_URI=$uri"

          # Sanity checks (safe)
          if (-not $env:DEV_OPS_SECRET) { throw "DEV_OPS_SECRET missing" }
          if (-not $env:GP_USERNAME)    { throw "GP_USERNAME missing" }
          if (-not $env:GP_PASSWORD)    { throw "GP_PASSWORD missing" }
          Write-Host ("DEV_OPS_SECRET_LEN=" + $env:DEV_OPS_SECRET.Length)
          Write-Host ("GP_USERNAME_SET=" + [bool]$env:GP_USERNAME)
          Write-Host ("GP_PASSWORD_LEN=" + $env:GP_PASSWORD.Length)

          $headers = @{
            "X-Dev-Ops-Secret" = $env:DEV_OPS_SECRET
            "Accept" = "application/json"
          }

          $payloadObj = @{ username = $env:GP_USERNAME; password = $env:GP_PASSWORD }
          $payload = $payloadObj | ConvertTo-Json -Compress

          try {
            $resp = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType "application/json" -Body $payload -TimeoutSec 30
            Write-Host ("OPS_OK=" + $resp.ok)
            Write-Host ("OPS_CREATED=" + $resp.created)
          } catch {
            $status = $null
            $body   = $null

            if ($_.Exception.Response) {
              try { $status = [int]$_.Exception.Response.StatusCode } catch {}
              try {
                $sr = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                $body = $sr.ReadToEnd()
              } catch {}
            }

            Write-Host ("OPS_STATUS=" + $status)
            if ($body) {
              Write-Host ("OPS_BODY=" + $body)
            }
            throw
          }

      - name: Run Golden Path against deployed DEV
        shell: pwsh
        env:
          GP_API_BASE: https://crown-api-dev.azurewebsites.net
          GP_USERNAME: ${{ secrets.GP_USERNAME }}
          GP_PASSWORD: ${{ secrets.GP_PASSWORD }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/dev_scripts/golden_path.ps1 -ApiBase "$env:GP_API_BASE" -SkipSeed
