name: CI - Tests and Checks
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-immutable-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0  # Need full history to verify tags
          fetch-tags: true
      
      - name: Verify release tags are immutable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin
          echo "Verifying immutable release tags..."
          
          # Validate registry format: all SHAs must be full 40-char hex
          echo "Validating registry format..."
          while IFS= read -r sha; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo " CRITICAL: Invalid SHA format in registry: $sha"
              echo "   Registry must contain full 40-character commit SHAs only"
              exit 1
            fi
          done < <(jq -r '.[]' docs/RELEASE_TAGS.json)
          echo " Registry format valid (all full SHAs)"
          echo ""
          
          # Read all expected tags from RELEASE_TAGS.json
          tags=$(jq -r 'keys[]' docs/RELEASE_TAGS.json)
          
          failed=0
          for tag in $tags; do
            expected_sha=$(jq -r ".[\"$tag\"]" docs/RELEASE_TAGS.json)
            # Explicitly resolve to commit (not tag object)
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo " CRITICAL: Tag $tag not found in repository"
              failed=1
              continue
            fi

            actual_sha=$(git rev-parse "${tag}^{commit}")
            
            echo "Checking $tag:"
            echo "  Expected: $expected_sha"
            echo "  Actual:   $actual_sha"
            
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "   CRITICAL: Tag $tag has been moved!"
              echo "     Expected commit: $expected_sha"
              echo "     Current commit:  $actual_sha"
              echo ""
              failed=1
            else
              echo "   Verified"
            fi
            echo ""
          done
          
          if [[ $failed -eq 1 ]]; then
            echo " Tag immutability violated. Create new tags instead of moving existing ones."
            exit 1
          fi
          
          echo " All release tags verified immutable"

  test:
    runs-on: ubuntu-latest
    needs: verify-immutable-tags
    
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Guard against forbidden frontend imports
        run: |
          set -e
          echo "Scanning for forbidden frontend imports..."
          FORBIDDEN=(
            "@mui/icons-material"
            "@material-ui/icons"
          )
          failed=0
          for pattern in "${FORBIDDEN[@]}"; do
            matches=$(grep -rn "$pattern" frontend/ --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" || true)
            if [ -n "$matches" ]; then
              echo " Forbidden import found: $pattern"
              echo "$matches"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo ""
            echo " Forbidden imports detected. These packages are not in dependencies."
            echo "   Use Unicode characters or inline SVG instead."
            exit 1
          fi
          echo " No forbidden imports found"

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: |
          source venv/bin/activate
          python manage.py makemigrations --check --dry-run --no-input
        continue-on-error: false

      - name: Run Django test suite
        run: |
          source venv/bin/activate
          python manage.py test \
            crown_api.tests.test_households_api \
            crown_api.tests.test_students_api \
            crown_api.tests.test_director_router \
            crown_api.tests.test_director_actions_auth_required \
            crown_api.tests.test_admissions_links_api \
            crown_api.tests.test_academics_api \
            crown_api.tests.test_billing_summary_api \
            crown_api.tests.test_comms_api \
            crown_api.tests.test_scheduling_api \
            -v 2
        continue-on-error: false

      - name: Test health endpoint locally
        run: |
          source venv/bin/activate
          python manage.py runserver 8000 &
          SERVER_PID=$!
          sleep 5
          
          # Test health endpoint
          response=$(curl -f http://localhost:8000/api/health/ || echo "FAILED")
          
          # Kill server
          kill $SERVER_PID || true
          
          # Check response
          if [[ "$response" == "FAILED" ]]; then
            echo " Health endpoint failed"
            exit 1
          fi
          
          echo " Health endpoint responding: $response"
        continue-on-error: false

      - name: Fail fast summary
        if: failure()
        run: |
          echo " CI failed - check logs above"
          echo "Possible causes:"
          echo "  - Missing migrations (run: python manage.py makemigrations)"
          echo "  - Test failures (run: python manage.py test)"
          echo "  - Health endpoint broken (check crown_api/health_views.py)"
          exit 1

