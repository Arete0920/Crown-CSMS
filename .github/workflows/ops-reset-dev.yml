name: OPS - Reset DEV Demo (migrate + reseed + smoke)

on:
  workflow_dispatch:
    inputs:
      school_id:
        description: School UUID to reseed
        required: true
        type: string
      confirm_school_id:
        description: "Re-enter the same synthetic school UUID to explicitly confirm this destructive operation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ops-reset-dev
  cancel-in-progress: false

jobs:
  reset_dev:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: dev
    concurrency:
      group: crown-api-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify current source, runtime and synthetic-school authority
        shell: bash
        env:
          SCHOOL_ID: ${{ inputs.school_id }}
          CONFIRM_SCHOOL_ID: ${{ inputs.confirm_school_id }}
          DEV_RESET_ALLOWED_SCHOOL_IDS: ${{ vars.DEV_RESET_ALLOWED_SCHOOL_IDS }}
        run: |
          set -euo pipefail
          python3 scripts/ops/verify_dev_reset_authority.py
      - name: Call DEV demo reset endpoint
        env:
          API_BASE: https://crown-api-dev.azurewebsites.net
          OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
          SCHOOL_ID: ${{ inputs.school_id }}
          CONFIRM_SCHOOL_ID: ${{ inputs.confirm_school_id }}
          DEV_RESET_ALLOWED_SCHOOL_IDS: ${{ vars.DEV_RESET_ALLOWED_SCHOOL_IDS }}
        run: |
          set -euo pipefail
          python3 scripts/ops/verify_dev_reset_authority.py
          # The endpoint can include migration and seed command-output tails.
          # Never echo or upload the unredacted response on a public Actions run.
          response="$(curl --max-time 30 -f -sS -X POST "${API_BASE}/api/v1/system/demo-reset/?verbosity=1" \
            -H "X-Admin-Ops-Secret: ${OPS_SECRET}" \
            -H "X-School-Id: ${SCHOOL_ID}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          if ! printf '%s' "${response}" | python3 -c 'import json, sys; data = json.load(sys.stdin); sys.exit(0 if isinstance(data, dict) and data.get("ok") is True else 1)'; then
            echo "DEV demo reset did not return a successful acknowledgement." >&2
            exit 1
          fi
          echo "DEV demo reset acknowledged; response details withheld from Actions logs."
