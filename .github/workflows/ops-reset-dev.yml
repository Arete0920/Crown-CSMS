name: OPS - Reset DEV Demo (migrate + reseed + smoke)

on:
  workflow_dispatch:
    inputs:
      school_id:
        description: "Target School UUID (X-School-Id) to reseed"
        required: true
        type: string

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "DJANGO_SETTINGS_MODULE=crown_api.settings" >> $GITHUB_ENV
          echo "ENV_NAME=dev" >> $GITHUB_ENV
          echo "BUILD_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DEV_DATABASE_URL }}" >> $GITHUB_ENV

      - name: Migrate (DEV)
        working-directory: backend
        run: |
          python manage.py migrate --noinput

      - name: Force reseed (DEV)
        working-directory: backend
        run: |
          python manage.py golden_path_bootstrap --force --school-id "${{ inputs.school_id }}" --verbosity 2

      - name: Smoke check - Admissions stage diversity
        env:
          API_BASE: https://crown-api-dev.azurewebsites.net
          DEMO_USERNAME: head@crown-demo.local
          DEMO_PASSWORD: ${{ secrets.DEV_DEMO_PASSWORD }}
          SCHOOL_ID: ${{ inputs.school_id }}
        run: |
          set -euo pipefail

          TOKEN=$(curl -s -X POST "$API_BASE/api/v1/auth/token/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$DEMO_USERNAME\",\"password\":\"$DEMO_PASSWORD\"}" | python -c "import sys,json; print(json.load(sys.stdin)['access'])")

          OUT=$(curl -s "$API_BASE/api/v1/admissions/summary/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-School-Id: $SCHOOL_ID")

          echo "$OUT" | python - << 'PY'
import sys, json
d=json.load(sys.stdin)
by=d["pipeline"]["by_stage"]
nonzero=[k for k,v in by.items() if isinstance(v,int) and v>0]
print("nonzero_stages:", nonzero)
if len(nonzero) < 3:
    raise SystemExit("FAIL: Admissions demo not diversified (need >=3 non-zero stages)")
print("PASS: admissions distribution OK")
PY
