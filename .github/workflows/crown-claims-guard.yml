name: CROWN Claims Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.csv'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.py'
      - '**/*.ps1'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - 'scripts/execution/123_crown_forbidden_claims_guard.ps1'

permissions:
  contents: read

concurrency:
  group: crown-claims-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-claims:
    name: Forbidden claims guard
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run guard
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          ./scripts/execution/123_crown_forbidden_claims_guard.ps1 -Base origin/main -Head HEAD
