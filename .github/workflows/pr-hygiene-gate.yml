name: PR Hygiene Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-hygiene-gate:
    name: pr-hygiene-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch immutable base commit
        run: git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1

      - name: Run CROWN PR hygiene gate
        env:
          CROWN_BASE_REF: ${{ github.event.pull_request.base.sha }}
          CROWN_MAX_NORMAL_ADDITIONS: "1500"
          CROWN_MAX_DOC_AUDIT_ADDITIONS: "3000"
          CROWN_MAX_CHANGED_FILES: "20"
        run: python scripts/ci/pr_hygiene_gate.py
