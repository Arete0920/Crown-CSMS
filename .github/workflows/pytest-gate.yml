name: pytest-gate
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "tools/verify_pytest_gate.py"
      - ".github/workflows/pytest-gate.yml"

concurrency:
  group: pytest-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-gate:
    name: pytest-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Pytest Gate
        env:
          DJANGO_SETTINGS_MODULE: crown_api.settings
          SECRET_KEY: ci-not-secret
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///./ci.sqlite3
        run: |
          set -o pipefail
          python tools/verify_pytest_gate.py 2>&1 | tee pytest-gate.log

      - name: Upload complete pytest gate log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-gate-log
          path: pytest-gate.log
          if-no-files-found: error
          retention-days: 14
