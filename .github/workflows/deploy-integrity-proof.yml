name: deploy-integrity-proof
permissions:
  contents: read


on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to verify (dev|prod)"
        required: true
        default: "prod"
      expected_tag:
        description: "Git tag that should match deployed build SHA"
        required: true
      health_url:
        description: "Health endpoint URL (e.g., https://.../health)"
        required: true
      expected_sha:
        description: "Optional explicit SHA (leave blank usually)"
        required: false
        default: ""

concurrency:
  group: deploy-integrity-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify deploy integrity
        shell: pwsh
        run: |
          ./tools/verify_deploy_integrity.ps1 `
            -Env "${{ inputs.env }}" `
            -HealthUrl "${{ inputs.health_url }}" `
            -ExpectedTag "${{ inputs.expected_tag }}" `
            -ExpectedSha "${{ inputs.expected_sha }}"

