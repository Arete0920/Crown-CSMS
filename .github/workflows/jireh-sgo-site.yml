name: Jireh SGO site verification
on:
  pull_request:
    paths:
      - 'sites/jireh-sgo/**'
      - '.github/workflows/jireh-sgo-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/jireh-sgo/**'
      - '.github/workflows/jireh-sgo-site.yml'
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, claims, and staging security
        run: node --test sites/jireh-sgo/tests/site.test.mjs
