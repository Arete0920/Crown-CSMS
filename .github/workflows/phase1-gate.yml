name: Manual Legacy Phase 1 Contract
permissions:
  contents: read

on:
  workflow_dispatch: {}

concurrency:
  group: legacy-phase1-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  phase1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Legacy Phase 1 contract check
        shell: pwsh
        run: pwsh -File scripts/phase1/phase1_contract.ps1
