name: DEV Smoke - Golden Path

on:
  workflow_dispatch:
    inputs:
      skip_seed:
        description: "Skip seeding (recommended for normal smoke)"
        required: true
        default: "true"
      max_attempts:
        description: "Health check attempts"
        required: true
        default: "24"
      sleep_seconds:
        description: "Seconds between attempts"
        required: true
        default: "25"
  # schedule:
  #   # optional: runs every hour (UTC). Comment out if you don't want scheduled smoke.
  #   - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: dev-smoke
  cancel-in-progress: true

jobs:
  dev-smoke:
    name: Golden Path Smoke (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set defaults
        shell: pwsh
        run: |
          $skip = "${{ github.event.inputs.skip_seed }}"
          if ([string]::IsNullOrWhiteSpace($skip)) { $skip = "true" }
          "SKIP_SEED=$skip" | Out-File -FilePath $env:GITHUB_ENV -Append

          $max = "${{ github.event.inputs.max_attempts }}"
          if ([string]::IsNullOrWhiteSpace($max)) { $max = "24" }
          "MAX_ATTEMPTS=$max" | Out-File -FilePath $env:GITHUB_ENV -Append

          $sleep = "${{ github.event.inputs.sleep_seconds }}"
          if ([string]::IsNullOrWhiteSpace($sleep)) { $sleep = "25" }
          "SLEEP_SECONDS=$sleep" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify BUILD_SHA (Deploy Determinism Gate)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://crown-api-dev.azurewebsites.net/health/"
          echo "P0.3 Gate: Verifying BUILD_SHA at $URL"
          
          BODY="$(curl -fsS "$URL")"
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('build_sha:', d.get('build_sha','MISSING')); print('env:', d.get('env','MISSING')); print('db:', d.get('db','MISSING'))"
          
          SHA="$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('build_sha',''))")"
          
          if [ -z "$SHA" ] || [ "$SHA" = "MISSING" ]; then
            echo "❌ FAILED: build_sha missing from /health/"
            exit 1
          fi
          
          if [ ${#SHA} -ne 40 ]; then
            echo "❌ FAILED: build_sha must be 40 chars (got ${#SHA})"
            exit 1
          fi
          
          echo "✅ P0.3 Gate: BUILD_SHA verified ($SHA)"

      - name: Health check DEV (bounded)
        shell: pwsh
        env:
          GP_API_BASE: https://crown-api-dev.azurewebsites.net
        run: |
          $ErrorActionPreference = "Stop"

          $health = "$env:GP_API_BASE/api/health/"
          Write-Host "Health URL: $health"

          $max = [int]$env:MAX_ATTEMPTS
          $sleep = [int]$env:SLEEP_SECONDS

          $ok = $false
          for ($i=1; $i -le $max; $i++) {
            try {
              $code = (curl -s -o /dev/null -w "%{http_code}" $health)
              Write-Host ("Attempt {0}/{1}: HTTP {2}" -f $i, $max, $code)
              if ($code -eq "200") { $ok = $true; break }
            } catch {
              Write-Host ("Attempt {0}/{1}: error: {2}" -f $i, $max, $_.Exception.Message)
            }
            Start-Sleep -Seconds $sleep
          }

          if (-not $ok) {
            throw "DEV health check failed after $max attempts."
          }

      - name: Debug DEV_OPS_SECRET fingerprint
        shell: pwsh
        env:
          DEV_OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
        run: |
          $s = $env:DEV_OPS_SECRET
          if ([string]::IsNullOrWhiteSpace($s)) { throw "DEV_OPS_SECRET missing in runner" }
          $bytes = [Text.Encoding]::UTF8.GetBytes($s)
          $sha = [Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
          $fp = ($sha | ForEach-Object { $_.ToString("x2") }) -join ""
          Write-Host "DEV_OPS_SECRET_SHA256=$fp"
      - name: Run Golden Path smoke (DEV)
        shell: pwsh
        env:
          GP_API_BASE: https://crown-api-dev.azurewebsites.net
          DEV_OPS_SECRET: ${{ secrets.DEV_OPS_SECRET }}
          SKIP_SEED: true
          MAX_ATTEMPTS: 24
          SLEEP_SECONDS: 25
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./tools/dev_scripts/golden_path.ps1" -ApiBase "$env:GP_API_BASE" -SkipSeed

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "DEV smoke completed. (Success/failure shown above.)"
