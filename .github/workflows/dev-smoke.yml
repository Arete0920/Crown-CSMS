name: DEV Smoke - Read-only Source Precheck

# This workflow intentionally makes no authenticated or state-changing requests.
# Financial, enrollment and synthetic write acceptance require separately
# approved, isolated workflows and evidence after current-source DEV alignment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-smoke
  cancel-in-progress: true

jobs:
  dev-smoke:
    name: Read-only DEV runtime source and access precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Require protected main dispatch
        shell: bash
        env:
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_REF" != "refs/heads/main" ]]; then
            echo "::error::DEV precheck may run only on the protected main ref."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source must be an exact 40-character commit SHA."
            exit 1
          fi

      - name: Verify exact DEV source, health and anonymous access without writes
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ops/verify_dev_owner_runtime.py --expected-sha "$EXPECTED_SHA"

      - name: Explain acceptance boundary
        if: always()
        shell: bash
        run: |
          echo "This workflow checks public DEV metadata and access denial only."
          echo "It does not authenticate users, seed tenants, issue payments, or certify a release."
