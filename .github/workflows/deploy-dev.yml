name: DEV Deploy (protected main)

# Manual-only: an old rc/** push workflow may be re-run later against DEV.
# The GitHub dev environment MUST additionally restrict deployment branches
# to protected main; source changes cannot retroactively secure old reruns.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character protected-main commit SHA (required)"
        required: true
        type: string

concurrency:
  group: crown-api-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  REGISTRY: crownregistry.azurecr.io
  IMAGE_NAME: crown2026
  RESOURCE_GROUP: crown-rg
  WEBAPP_NAME: crown-api-dev

jobs:
  build-and-deploy:
    name: "Build & Deploy  crown-api-dev"
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Guard exact protected-main dispatch
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::DEV deployment requires manual dispatch on protected main" >&2
            exit 1
          fi
          if [[ ! "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEV deployment requires an exact 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$INPUT_REF" != "$DISPATCH_SHA" ]]; then
            echo "::error::DEV deployment requested SHA does not match workflow-dispatch SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify accepted DEV source
        id: vars
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::DEV deployment requires protected-main manual dispatch" >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$SOURCE_SHA" != "$REQUESTED_REF" ]]; then
            echo "::error::Checked-out source does not match approved exact SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$SOURCE_SHA" != "$WORKFLOW_SHA" || "$SOURCE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo "::error::BLOCKED: DEV deploy requires current protected main and workflow identity, never an ancestor" >&2
            exit 1
          fi
          echo "deploy_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "deploy_sha_short=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "DEPLOY_SHA_SHORT=${SOURCE_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up existing runner for DEV schema verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install accepted backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify DEV migration boundary without database execution
        run: python -m unittest discover -s scripts/ops -p test_run_dev_inquiry_migration.py -v

      - name: Verify SimpleJWT migration allowlist without database access
        run: python -m unittest discover -s scripts/ops -p test_reviewed_blacklist_migrations.py -v

      - name: Reverify protected main before DEV migration
        shell: bash
        env:
          EXPECTED_DEV_SHA: ${{ steps.vars.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_SHA" != "$EXPECTED_DEV_SHA" || "$(git rev-parse HEAD)" != "$EXPECTED_DEV_SHA" || "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_DEV_SHA" ]]; then
            echo "::error::Protected main moved: refusing DEV migration" >&2
            exit 1
          fi

      - name: Apply only reviewed DEV inquiry migration before deployment
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.vars.outputs.deploy_sha }}
        run: python scripts/ops/run_dev_inquiry_migration.py --expected-sha "$EXPECTED_SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Azure Container Registry
        run: az acr login --name crownregistry --only-show-errors

      - name: Build allowed appsettings JSON
        shell: pwsh
        run: |
          $settings = @{
            "BUILD_SHA"       = "${{ env.DEPLOY_SHA }}"
            "DEPLOY_RUN_ID"   = "${{ github.run_id }}"
            "DEPLOY_WORKFLOW" = "${{ github.workflow }}"
            "WEBSITES_PORT"   = "8000"
            "CROWN_ENV"      = "dev"
            "DJANGO_ENV"     = "development"
            "ENVIRONMENT"    = "dev"
          }
          $settings | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 appsettings.dev.json
          Get-Content appsettings.dev.json

      - name: Appsettings allowlist gate
        shell: pwsh
        run: |
          ./tools/appsettings_allowlist_gate.ps1 `
            -AppSettingsJsonPath "appsettings.dev.json" `
            -AllowedKeysFile "tools/appsettings_allowlist.keys.json" `
            -AllowedKeySet "dev"

      - name: Reverify protected main before DEV appsettings
        shell: bash
        env:
          EXPECTED_DEV_SHA: ${{ steps.vars.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_SHA" != "$EXPECTED_DEV_SHA" || "$(git rev-parse HEAD)" != "$EXPECTED_DEV_SHA" || "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_DEV_SHA" ]]; then
            echo "::error::Protected main moved: refusing DEV appsettings" >&2
            exit 1
          fi

      - name: Apply appsettings (allowlisted only)
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group ${{ env.RESOURCE_GROUP }} `
            --name ${{ env.WEBAPP_NAME }} `
            --settings '@appsettings.dev.json' `
            --output none `
            --only-show-errors
          echo " BUILD_SHA=${{ env.DEPLOY_SHA }} set (before image deploy)"

      - name: Bake BUILD_SHA into artifact
        run: |
          echo "BUILD_SHA = \"${{ env.DEPLOY_SHA }}\"" > backend/crown_api/build_info.py
          echo " build_info.py written with SHA: ${{ env.DEPLOY_SHA }}"

      - name: Reverify protected main before DEV image push
        shell: bash
        env:
          EXPECTED_DEV_SHA: ${{ steps.vars.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_SHA" != "$EXPECTED_DEV_SHA" || "$(git rev-parse HEAD)" != "$EXPECTED_DEV_SHA" || "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_DEV_SHA" ]]; then
            echo "::error::Protected main changed: refusing DEV image push" >&2
            exit 1
          fi
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          # Explicitly target linux/amd64  multi-platform OCI index manifests
          # (produced without this setting) cause ContainerCreateFailure on
          # Azure App Service because it cannot resolve the platform from an
          # OCI index containing unknown/unknown cache entries.
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ env.DEPLOY_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reverify protected main before DEV container deployment
        shell: bash
        env:
          EXPECTED_DEV_SHA: ${{ steps.vars.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_SHA" != "$EXPECTED_DEV_SHA" || "$(git rev-parse HEAD)" != "$EXPECTED_DEV_SHA" || "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_DEV_SHA" ]]; then
            echo "::error::Protected main moved: refusing DEV container deployment" >&2
            exit 1
          fi

      - name: Deploy to Azure Web App (managed identity pull)
        run: |
          # ACR admin is disabled. The App Service system-assigned managed identity
          # holds AcrPull on crownregistry  no credentials needed here.
          az webapp config container set \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --docker-registry-server-url https://${{ env.REGISTRY }} \
            --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ env.DEPLOY_SHA }} \
            --output none \
            --only-show-errors
          echo " Container image set: dev-${{ env.DEPLOY_SHA_SHORT }} (managed identity pull)"

          # A stopped App Service returns HTTP 403 and `az webapp restart` cannot
          # transition it to Running. For an explicitly requested DEV release,
          # start an existing stopped app; never provision or resize resources.
          APP_STATE="$(az webapp show \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query state --output tsv --only-show-errors)"
          case "$APP_STATE" in
            Stopped)
              az webapp start \
                --name ${{ env.WEBAPP_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --only-show-errors
              echo "Existing DEV App Service started for deployment"
              ;;
            Running)
              az webapp restart \
                --name ${{ env.WEBAPP_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --only-show-errors
              echo "Running DEV App Service restarted for deployment"
              ;;
            *)
              echo "ERROR: unexpected DEV App Service state '$APP_STATE'; refusing mutation" >&2
              exit 1
              ;;
          esac

      - name: Health check after verified schema and application startup
        run: |
          set -euo pipefail
          echo "Waiting for app to come up (up to 6 minutes)..."
          for i in $(seq 1 36); do
            STATUS=$(curl --max-time 30 -s -o /dev/null -w "%{http_code}" https://${{ env.WEBAPP_NAME }}.azurewebsites.net/api/health/ || true)
            if [ "$STATUS" = "200" ]; then
              echo " Health check passed (attempt $i)"
              break
            fi
            echo "  attempt $i: HTTP $STATUS  waiting 10s..."
            sleep 10
            if [ "$i" = "36" ]; then
              echo " Health check timed out after 360s"
              exit 1
            fi
          done

      - name: Verify BUILD_SHA matches deployed commit (with retry)
        run: |
          set -euo pipefail
          WANT="${{ env.DEPLOY_SHA }}"
          echo "Verifying deployed SHA matches $WANT ..."
          for i in $(seq 1 12); do
            BODY=$(curl --max-time 30 -fsS https://${{ env.WEBAPP_NAME }}.azurewebsites.net/api/health/ 2>/dev/null || true)
            GOT=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); sha=d.get('build_sha',''); artifact=d.get('artifact_build_sha',''); print(sha if sha == artifact else '<artifact-mismatch>')" 2>/dev/null || true)
            if [ -z "$GOT" ] || [ "$GOT" = "local-dev" ] || [ "$GOT" = "unknown" ]; then
              echo "  attempt $i: SHA not ready yet (got: ${GOT:-empty})  waiting 15s..."
              sleep 15
              continue
            fi
            if [[ "$GOT" =~ ^[0-9a-f]{40}$ ]] && [[ "$GOT" == "$WANT" ]]; then
              echo " build_sha verified: $GOT"
              exit 0
            fi
            echo "  attempt $i: mismatch  deployed=$GOT expected=$WANT  waiting 15s..."
            sleep 15
          done
          echo " build_sha did not converge to expected SHA after retries"
          echo "   deployed=$GOT  expected=$WANT"
          exit 1

      - name: Summary
        run: |
          echo " crown-api-dev deployed successfully"
          echo "   SHA: ${{ env.DEPLOY_SHA }}"
          echo "   URL: https://${{ env.WEBAPP_NAME }}.azurewebsites.net"

