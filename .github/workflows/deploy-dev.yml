name: Dev Deploy (rc/**)

on:
  # Automatically deploy whenever rc/** is pushed  keeps dev in sync with RC
  push:
    branches:
      - "rc/**"
  # Also allow a manual trigger (e.g. to redeploy after secrets change)
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch/SHA/tag). Leave blank for default branch."
        required: false
        default: ""

concurrency:
  group: crown-api-dev-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  id-token: write

env:
  REGISTRY: crownregistry.azurecr.io
  IMAGE_NAME: crown2026
  RESOURCE_GROUP: crown-rg
  WEBAPP_NAME: crown-api-dev

jobs:
  build-and-deploy:
    name: "Build & Deploy  crown-api-dev"
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine deploy SHA
        id: vars
        run: |
          echo "deploy_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "deploy_sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "DEPLOY_SHA_SHORT=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: az acr login --name crownregistry --only-show-errors

      - name: Build allowed appsettings JSON
        shell: pwsh
        run: |
          $settings = @{
            "BUILD_SHA"       = "${{ env.DEPLOY_SHA }}"
            "DEPLOY_RUN_ID"   = "${{ github.run_id }}"
            "DEPLOY_WORKFLOW" = "${{ github.workflow }}"
          }
          $settings | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 appsettings.dev.json
          Get-Content appsettings.dev.json

      - name: Appsettings allowlist gate
        shell: pwsh
        run: |
          $allowed = @(
            "BUILD_SHA",
            "DEPLOY_RUN_ID",
            "DEPLOY_WORKFLOW"
          )
          ./tools/appsettings_allowlist_gate.ps1 -AppSettingsJsonPath "appsettings.dev.json" -AllowedKeys $allowed

      - name: Apply appsettings (allowlisted only)
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group ${{ env.RESOURCE_GROUP }} `
            --name ${{ env.WEBAPP_NAME }} `
            --settings '@appsettings.dev.json' `
            --output none `
            --only-show-errors
          echo " BUILD_SHA=${{ env.DEPLOY_SHA }} set (before image deploy)"

      - name: Bake BUILD_SHA into artifact
        run: |
          echo "BUILD_SHA = \"${{ env.DEPLOY_SHA }}\"" > backend/crown_api/build_info.py
          echo " build_info.py written with SHA: ${{ env.DEPLOY_SHA }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Explicitly target linux/amd64  multi-platform OCI index manifests
          # (produced without this setting) cause ContainerCreateFailure on
          # Azure App Service because it cannot resolve the platform from an
          # OCI index containing unknown/unknown cache entries.
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ env.DEPLOY_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Web App (managed identity pull)
        run: |
          # ACR admin is disabled. The App Service system-assigned managed identity
          # holds AcrPull on crownregistry  no credentials needed here.
          az webapp config container set \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --docker-registry-server-url https://${{ env.REGISTRY }} \
            --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ env.DEPLOY_SHA }} \
            --output none \
            --only-show-errors
          echo " Container image set: dev-${{ env.DEPLOY_SHA_SHORT }} (managed identity pull)"

          # Restart the app so it picks up the new image immediately
          az webapp restart \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --only-show-errors
          echo " App restarted"

      - name: Health check (waits for startup + migrations + ensure_ci_user)
        run: |
          set -euo pipefail
          echo "Waiting for app to come up (up to 6 minutes)..."
          for i in $(seq 1 36); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.WEBAPP_NAME }}.azurewebsites.net/api/health/ || true)
            if [ "$STATUS" = "200" ]; then
              echo " Health check passed (attempt $i)"
              break
            fi
            echo "  attempt $i: HTTP $STATUS  waiting 10s..."
            sleep 10
            if [ "$i" = "36" ]; then
              echo " Health check timed out after 360s"
              exit 1
            fi
          done

      - name: Verify BUILD_SHA matches deployed commit (with retry)
        run: |
          set -euo pipefail
          WANT="${{ env.DEPLOY_SHA }}"
          echo "Verifying deployed SHA matches $WANT ..."
          for i in $(seq 1 12); do
            BODY=$(curl -fsS https://${{ env.WEBAPP_NAME }}.azurewebsites.net/api/health/ 2>/dev/null || true)
            GOT=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('build_sha',''))" 2>/dev/null || true)
            if [ -z "$GOT" ] || [ "$GOT" = "local-dev" ] || [ "$GOT" = "unknown" ]; then
              echo "  attempt $i: SHA not ready yet (got: ${GOT:-empty})  waiting 15s..."
              sleep 15
              continue
            fi
            if [[ "$GOT" == "$WANT"* ]] || [[ "$WANT" == "$GOT"* ]]; then
              echo " build_sha verified: $GOT"
              exit 0
            fi
            echo "  attempt $i: mismatch  deployed=$GOT expected=$WANT  waiting 15s..."
            sleep 15
          done
          echo " build_sha did not converge to expected SHA after retries"
          echo "   deployed=$GOT  expected=$WANT"
          exit 1

      - name: Summary
        run: |
          echo " crown-api-dev deployed successfully"
          echo "   SHA: ${{ env.DEPLOY_SHA }}"
          echo "   URL: https://${{ env.WEBAPP_NAME }}.azurewebsites.net"

