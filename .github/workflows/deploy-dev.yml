name: Scoped DEV queue recovery 40587751947
'on':
  push:
    branches:
    - maintenance/cancel-obsolete-dev-40587751947
    paths:
    - .github/workflows/deploy-dev.yml
permissions:
  actions: read
jobs:
  verify-target:
    if: ${{ github.event.created == true && github.repository == 'Arete0920/Crown-CSMS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      perform: ${{ steps.verify.outputs.perform }}
    steps:
    - name: Verify exact obsolete run and exclusive DEV scope
      id: verify
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        ACTIVE = {"queued", "in_progress", "pending", "waiting", "requested"}
        EXPECTED_ID = 40587751947
        EXPECTED_SHA = "e834dff25527002aab19aa10b8bc2842a8d974d0"
        EXPECTED_WORKFLOW = 338145753

        def validate_target(target, active, own_id):
            if (
                target.get("id") != EXPECTED_ID
                or target.get("head_sha") != EXPECTED_SHA
                or target.get("workflow_id") != EXPECTED_WORKFLOW
                or target.get("name") != "Dev Deploy (rc/**)"
                or target.get("event") != "workflow_dispatch"
                or target.get("repository", {}).get("full_name") != "Arete0920/Crown-CSMS"
            ):
                raise ValueError("Target identity mismatch")
            if target.get("status") == "completed":
                if target.get("conclusion") == "cancelled":
                    return False
                raise ValueError("Target already terminal without cancellation")
            if target.get("status") not in ACTIVE or target.get("conclusion") is not None:
                raise ValueError("Target is not the verified active run")
            others = [run for run in active if run.get("id") != own_id]
            if len(others) != 1 or others[0].get("id") != EXPECTED_ID:
                raise ValueError("Another DEV run or inconsistent inventory blocks recovery")
            return True

        import json
        import os
        import urllib.request

        try:
            own_id = int(os.environ["GITHUB_RUN_ID"])
            if (
                os.environ["GITHUB_REPOSITORY"] != "Arete0920/Crown-CSMS"
                or os.environ["GITHUB_REF"] != "refs/heads/maintenance/cancel-obsolete-dev-40587751947"
                or os.environ["GITHUB_EVENT_NAME"] != "push"
            ):
                raise ValueError("Unexpected execution context")
            token = os.environ["GH_TOKEN"]
            def read(path):
                request = urllib.request.Request(
                    "https://api.github.com/repos/Arete0920/Crown-CSMS/" + path,
                    headers={
                        "Authorization": "Bearer " + token,
                        "Accept": "application/vnd.github+json",
                        "X-GitHub-Api-Version": "2022-11-28",
                        "User-Agent": "CROWN-scoped-DEV-queue-recovery",
                    },
                    method="GET",
                )
                with urllib.request.urlopen(request, timeout=20) as response:
                    return json.load(response)
            target = read("actions/runs/40587751947")
            active = []
            for status in sorted(ACTIVE):
                for page in range(1, 21):
                    listing = read(
                        "actions/workflows/338145753/runs?status="
                        + status + "&per_page=100&page=" + str(page)
                    )
                    rows = listing["workflow_runs"]
                    if any(row.get("workflow_id") != EXPECTED_WORKFLOW for row in rows):
                        raise ValueError("Unexpected workflow in inventory")
                    active.extend(rows)
                    if len(rows) < 100:
                        break
                else:
                    raise ValueError("Inventory is incomplete")
            perform = validate_target(target, active, own_id)
            print(json.dumps({
                "preflight": "PASS",
                "target": EXPECTED_ID,
                "source_sha": EXPECTED_SHA,
                "status": target["status"],
                "conclusion": target["conclusion"],
                "other_active_dev_runs": 0,
                "acquire_scoped_group": perform,
            }))
            with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                output.write("perform=" + ("true" if perform else "false") + "\n")
        except Exception:
            print("PRECHECK=BLOCKED; concurrency group was not acquired")
            raise SystemExit(1)
        PY
  acquire-dev-group:
    needs: verify-target
    if: ${{ needs.verify-target.outputs.perform == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    concurrency:
      group: crown-api-dev-deploy
      cancel-in-progress: true
    steps:
    - name: Acquire only the obsolete DEV deployment concurrency group
      run: echo 'Scoped group acquired. No Azure action was performed; read target run status separately before claiming cancellation.'
