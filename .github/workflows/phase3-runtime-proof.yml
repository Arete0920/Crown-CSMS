name: Phase3 Runtime Proof Ceremony

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  phase3-runtime-proof:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crown
          POSTGRES_PASSWORD: crown_test_pw
          POSTGRES_DB: crown_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: crown_api.settings
      DATABASE_URL: postgresql://crown:crown_test_pw@localhost:5432/crown_test
      CROWN_DEMO_MODE: "true"
      CROWN_DEMO_SCHOOL_ID: "19801b59-8c05-4c84-9312-5d792e4e839d"
      # CROWN_DEMO_KEY is intentionally absent — Django settings provides the
      # correct default when CROWN_DEMO_MODE=true. Never hardcode it here.
      CROWN_PASSWORD: ${{ secrets.CROWN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Seed demo school
        run: |
          cd backend
          python manage.py seed_demo_school --wipe

      - name: Start Django server (background)
        run: |
          cd backend
          python manage.py runserver 127.0.0.1:8000 &
          sleep 5

      - name: Health check
        run: |
          curl -f http://127.0.0.1:8000/health/ || exit 1

      - name: Run Phase 3 runtime proof ceremony
        run: |
          cd backend
          python manage.py proof_phase3_runtime --verbose

      - name: Dump server log on failure
        if: failure()
        run: |
          echo "==== Django server output ===="
          jobs -l || true
