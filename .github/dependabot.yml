version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend/dashboards"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      frontend-runtime-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      frontend-tooling-minor-patch:
        dependency-type: "development"
        exclude-patterns:
          - "@playwright/*"
          - "@axe-core/*"
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
          - "vite"
          - "@vitejs/*"
          - "esbuild"
        update-types:
          - "minor"
          - "patch"
      frontend-testing-minor-patch:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/services/wallet/apple-pass-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
    open-pull-requests-limit: 3
    groups:
      wallet-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
