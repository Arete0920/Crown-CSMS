<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title }} — Crown2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #F4F6F8;
      color: #1F2933;
    }
    /* ── Header ── */
    .site-header {
      background: #0F2C4C;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-header h1 { margin: 0; font-size: 22px; font-weight: 600; }
    .site-header .meta { font-size: 12px; opacity: .8; margin-top: 4px; }
    .site-header .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
    /* ── Page layout ── */
    .page { padding: 24px; display: grid; gap: 24px; max-width: 1400px; margin: 0 auto; }
    /* ── Cards ── */
    .card {
      background: #fff;
      border: 1px solid #E1E5EA;
      border-radius: 8px;
      padding: 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; color: #1F2933; }
    /* ── Buttons ── */
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #E1E5EA;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      color: #1F2933;
    }
    .btn.primary { background: #1C4E80; color: #fff; border-color: #1C4E80; }
    .btn.primary:hover { background: #163b60; border-color: #163b60; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 8px 10px;
      font-size: 12px;
      color: #52606D;
      font-weight: 700;
      background: #F4F6F8;
      border-bottom: 1px solid #E1E5EA;
    }
    td { text-align: left; padding: 10px; border-bottom: 1px solid #E1E5EA; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    /* ── Status pills ── */
    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #E1E5EA;
      background: #F4F6F8;
      color: #1F2933;
    }
    .pill.high  { background: #FEF3C7; border-color: #F59E0B; color: #92400E; }
    .pill.medium{ background: #DBEAFE; border-color: #93C5FD; color: #1E40AF; }
    .pill.low   { background: #F0FDF4; border-color: #86EFAC; color: #166534; }
    /* ── Metrics grid ── */
    .section-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: #1F2933; }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .kpi-card {
      background: #fff;
      border: 1px solid #E1E5EA;
      border-radius: 8px;
      padding: 16px;
    }
    .kpi-card.accent { border-left: 4px solid #C6A54A; }
    .kpi-label { font-size: 11px; color: #52606D; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .kpi-value { font-size: 26px; font-weight: 600; color: #0F2C4C; margin: 8px 0 4px; }
    .kpi-sub   { font-size: 12px; color: #52606D; }
    /* ── Timeline ── */
    .timeline-list { list-style: none; margin: 0; padding: 0; }
    .timeline-item { padding: 10px 0; border-bottom: 1px solid #E1E5EA; }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-meta { font-size: 11px; color: #52606D; margin-bottom: 2px; }
    /* ── Utility ── */
    .muted { color: #52606D; font-size: 12px; }
    .priority-hint { font-size: 12px; color: #52606D; margin: 0 0 12px; }
    /* ── Responsive ── */
    @media (max-width: 768px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div>
    <h1>{{ page_title }}</h1>
    <div class="meta" id="metaLine">Loading&hellip;</div>
  </div>
  <div class="header-actions">
    <button class="btn primary" id="btnRefresh">Refresh</button>
  </div>
</header>

<main class="page">

  <!-- ① Priority Queue (HERO) ─────────────────────────────────────────── -->
  <section class="card">
    <h2>Priority Queue</h2>
    <p class="priority-hint" id="priorityHint">Loading&hellip;</p>
    <table>
      <thead>
        <tr>
          <th>Application / Item</th>
          <th>Submitted / Created</th>
          <th>Waiting (days)</th>
          <th>Status</th>
          <th>Reason</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="worklistBody"></tbody>
    </table>
  </section>

  <!-- ② Metrics ────────────────────────────────────────────────────────── -->
  <section>
    <h2 class="section-title">Metrics</h2>
    <div class="metrics-grid" id="metricsGrid">
      <!-- KPI cards injected by JS -->
    </div>
  </section>

  <!-- ③ Timeline ──────────────────────────────────────────────────────── -->
  <section class="card">
    <h2>Recent Activity</h2>
    <p class="muted" id="timelineHint">Loading&hellip;</p>
    <ul class="timeline-list" id="timelineBody"></ul>
  </section>

</main>

<script>
  // ── Server-injected CONFIG ─────────────────────────────────────────────
  const CONFIG = {
    school_id: "{{ school_id }}",
    year_id:   "{{ year_id }}",
  };

  // ── URL helpers ────────────────────────────────────────────────────────
  function buildUrl(base, extra) {
    const p = new URLSearchParams({
      school_id: CONFIG.school_id,
      year_id:   CONFIG.year_id,
    });
    if (extra) Object.entries(extra).forEach(([k, v]) => p.set(k, v));
    return base + "?" + p.toString();
  }

  const ENDPOINTS = {
    dashboard: () => buildUrl("/api/director/dashboard/"),
    priority:  () => buildUrl("/api/director/priority/"),
    timeline:  () => buildUrl("/api/director/timeline/", { limit: 20 }),
    actions:   "/api/director/actions/",
  };

  const el = id => document.getElementById(id);

  // ── Formatting helpers ─────────────────────────────────────────────────
  function money(cents) {
    if (cents == null) return "—";
    return (Number(cents) / 100).toLocaleString("en-US", { style: "currency", currency: "USD" });
  }

  function safeDate(x) {
    if (!x) return "—";
    const d = new Date(x);
    return isNaN(d) ? String(x) : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  function daysWaiting(submittedAt) {
    if (!submittedAt) return "—";
    const days = Math.floor((Date.now() - new Date(submittedAt)) / 86400000);
    return days >= 0 ? String(days) : "—";
  }

  function statusLabel(type) {
    const MAP = {
      AID_APPLICATION_NEEDS_INFO:      "Needs Info",
      AID_APPLICATION_UNDER_REVIEW:    "Under Review",
      AID_AWARD_ACCEPTED_NOT_POSTED:   "Accepted — Not Posted",
      ADMISSIONS_APPLICATION_NEEDS_INFO:   "Needs Info",
      ADMISSIONS_APPLICATION_UNDER_REVIEW: "Under Review",
      FINANCE_BALANCE_DUE: "Balance Due",
    };
    return MAP[type] || (type || "—").replace(/_/g, " ");
  }

  function pillCls(type) {
    if (!type) return "pill";
    if (type.includes("NEEDS_INFO"))  return "pill high";
    if (type.includes("UNDER_REVIEW") || type.includes("ACCEPTED")) return "pill medium";
    return "pill";
  }

  function actionLabel(item) {
    if (item.summary)         return item.summary;
    if (item.priority_reason) return item.priority_reason;
    return "—";
  }

  function buildActionBtn(item) {
    if (item.type === "AID_AWARD_ACCEPTED_NOT_POSTED") {
      return `<button class="btn" onclick='runAction("AID_POST_ACCEPTED_AWARDS",["${item.id}"])'>Post Award</button>`;
    }
    if (item.type === "AID_APPLICATION_NEEDS_INFO") {
      return `<button class="btn" onclick='runAction("AID_GENERATE_NEEDS_INFO_EMAILS",["${item.id}"])'>Draft Email</button>`;
    }
    if (item.next_action_label && item.next_action_url) {
      return `<a class="btn" href="${item.next_action_url}">${item.next_action_label}</a>`;
    }
    return `<span class="muted">—</span>`;
  }

  // ── Renderers ─────────────────────────────────────────────────────────
  function renderPriorityQueue(p) {
    const worklist = p.worklist_top_10 || [];
    el("priorityHint").textContent =
      worklist.length
        ? `${worklist.length} item${worklist.length !== 1 ? "s" : ""} — sorted by urgency`
        : "No priority items at this time.";

    el("worklistBody").innerHTML = worklist.length
      ? worklist.map(item => {
          const submitted = item.submitted_date || item.submitted_at;
          return `
            <tr>
              <td>${item.label || item.family || "—"}</td>
              <td>${safeDate(submitted)}</td>
              <td>${daysWaiting(submitted)}</td>
              <td><span class="${pillCls(item.type)}">${statusLabel(item.type)}</span></td>
              <td>${actionLabel(item)}</td>
              <td>${buildActionBtn(item)}</td>
            </tr>`;
        }).join("")
      : `<tr><td colspan="6" class="muted" style="text-align:center;padding:24px;">
           No priority items at this time.
         </td></tr>`;
  }

  function renderMetrics(d) {
    const aid = d.sections?.aid || d.aid || {};
    const fin = d.sections?.finance || d.finance || {};
    const reg = d.sections?.registrar || d.registrar || {};

    const kpis = [
      {
        label: "Aid Applications",
        value: aid.applications?.total ?? aid.applications_count ?? "—",
        sub:   `Needs Info: ${aid.applications?.needs_info ?? aid.needs_info_count ?? 0}`,
        accent: true,
      },
      {
        label: "Awards Posted",
        value: aid.awards?.posted_to_ledger ?? "—",
        sub:   `Accepted not posted: ${aid.awards?.accepted_not_posted ?? 0}`,
      },
      {
        label: "Aid Awarded",
        value: money(aid.awards?.total_awarded_cents ?? 0),
        sub:   `Total awards: ${aid.awards?.total_awards ?? 0}`,
        accent: true,
      },
      {
        label: "Tuition Gross",
        value: money(fin.tuition?.gross_tuition_cents ?? fin.tuition_gross_cents ?? fin.total_billed_cents ?? 0),
        sub:   "Billed",
      },
      {
        label: "Net Receivable",
        value: money(fin.ledger?.net_receivables_cents ?? fin.net_receivables_cents ?? 0),
        sub:   "After aid credits",
      },
      {
        label: "Enrollment",
        value: reg.enrollment?.total ?? reg.total ?? reg.total_enrollments ?? "—",
        sub:   "Active students",
      },
    ];

    el("metricsGrid").innerHTML = kpis.map(k => `
      <div class="kpi-card${k.accent ? " accent" : ""}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>`).join("");
  }

  function renderTimeline(t) {
    const events = t.timeline || t.events || [];
    el("timelineHint").textContent =
      `${events.length} recent event${events.length !== 1 ? "s" : ""}`;

    el("timelineBody").innerHTML = events.length
      ? events.map(x => `
          <li class="timeline-item">
            <div class="timeline-meta">
              ${safeDate(x.ts || x.timestamp)}
              &middot;
              <span class="pill">${x.type || x.event_type || ""}</span>
            </div>
            <div>${x.summary || x.title || x.detail || "—"}</div>
          </li>`).join("")
      : `<li class="timeline-item muted">No recent events.</li>`;
  }

  // ── Actions ───────────────────────────────────────────────────────────
  async function getJSON(url) {
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res.json();
  }

  async function postJSON(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(`${res.status}: ${JSON.stringify(data)}`);
    return data;
  }

  async function runAction(action, ids, extra = {}) {
    try {
      const payload = { action, school_id: CONFIG.school_id, year_id: CONFIG.year_id, ids, ...extra };
      await postJSON(ENDPOINTS.actions, payload);
      await loadAll();
      alert(`Action complete: ${action}`);
    } catch (e) {
      alert(`Action failed:\n${e.message}`);
    }
  }

  async function loadAll() {
    el("metaLine").textContent = `School: ${CONFIG.school_id.slice(0, 8)}\u2026  Year: ${CONFIG.year_id.slice(0, 8)}\u2026`;
    try {
      const [dash, prio, time] = await Promise.all([
        getJSON(ENDPOINTS.dashboard()),
        getJSON(ENDPOINTS.priority()),
        getJSON(ENDPOINTS.timeline()),
      ]);
      renderPriorityQueue(prio);
      renderMetrics(dash);
      renderTimeline(time);
    } catch (e) {
      el("priorityHint").textContent = "Error loading data — " + e.message;
      el("timelineHint").textContent = "Error.";
      el("metricsGrid").innerHTML = `<p class="muted">Failed to load metrics: ${e.message}</p>`;
    }
  }

  el("btnRefresh").addEventListener("click", loadAll);
  loadAll();
</script>
</body>
</html>
