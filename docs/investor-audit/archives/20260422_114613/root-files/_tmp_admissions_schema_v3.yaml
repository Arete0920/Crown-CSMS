      enum:
      - call
      - email
      - meeting
      - tour
      - event
      - proposal
      - thank_you
      - other
      type: string
      description: |-
        * `call` - Call
        * `email` - Email
        * `meeting` - Meeting
        * `tour` - Tour
        * `event` - Event Invite
        * `proposal` - Proposal
        * `thank_you` - Thank You
        * `other` - Other
