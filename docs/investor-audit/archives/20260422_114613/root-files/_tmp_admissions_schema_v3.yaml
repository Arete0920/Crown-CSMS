      type: object
      properties:
        id:
          type: integer
          readOnly: true
        applicant_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AdmissionsApplicationLinkReadStatusEnum'
        household_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        household_name:
          type: string
          readOnly: true
          nullable: true
        student_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
