openapi: 3.0.3
info:
  title: Crown API
  version: 1.0.0-rc1
  description: Investor review and partner integration surface for Crown. Purpose-built
    for Christian and faith-based private schools.
paths:
  /api/classroom/classrooms/:
    get:
      operationId: classroom_classrooms_list
      description: |-
        Read-only Classroom endpoints for demo + operator dashboards.
        Scoping: requires X-School-Id, filters by school.
      tags:
      - classroom
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassroomList'
          description: ''
  /api/classroom/classrooms/{id}/:
    get:
      operationId: classroom_classrooms_retrieve
      description: |-
        Read-only Classroom endpoints for demo + operator dashboards.
        Scoping: requires X-School-Id, filters by school.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - classroom
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomDetail'
          description: ''
  /api/classroom/classrooms/{id}/snapshot/:
    get:
      operationId: classroom_classrooms_snapshot_retrieve
      description: |-
        Read-only Classroom endpoints for demo + operator dashboards.
        Scoping: requires X-School-Id, filters by school.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - classroom
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomList'
          description: ''
  /api/curriculum/courses/:
    get:
      operationId: curriculum_courses_list
      description: Read-only for demo safety.
      tags:
      - curriculum
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurriculumCourse'
          description: ''
  /api/curriculum/courses/{id}/:
    get:
      operationId: curriculum_courses_retrieve
      description: Read-only for demo safety.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - curriculum
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumCourse'
          description: ''
  /api/curriculum/courses/{id}/pacing/:
    get:
      operationId: curriculum_courses_pacing_retrieve
      description: |-
        GET /api/curriculum/courses/{id}/pacing/
        School-scoped via X-School-Id.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - curriculum
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumCourse'
          description: ''
  /api/curriculum/courses/pacing-summary/:
    get:
      operationId: curriculum_courses_pacing_summary_retrieve
      description: |-
        GET /api/curriculum/courses/pacing-summary/
        Returns lightweight pacing for all active courses.
      tags:
      - curriculum
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumCourse'
          description: ''
  /api/executive360/me/overview/:
    get:
      operationId: executive360_me_overview_retrieve
      description: |-
        GET /api/executive360/me/overview/

        School-wide financial, academic-risk, and workload snapshot for administrators.
        All data blocks are guarded — never raises; returns available=false when school
        cannot be resolved or any model is absent.
      tags:
      - executive360
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/donations/:
    get:
      operationId: finance_donations_retrieve
      description: 'GET — Admin: list donations for school.'
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/donations/create/:
    post:
      operationId: finance_donations_create_create
      description: |-
        POST — Any authenticated user: record a donation intent.
        Body: amount_cents, fund_code, memo, is_recurring, recurring_rule, next_run_at
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/invoices/:
    get:
      operationId: finance_invoices_retrieve
      description: 'GET — Admin: list invoices for school.'
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/invoices/create-from-obligations/:
    post:
      operationId: finance_invoices_create_from_obligations_create
      description: |-
        POST — Create an invoice by grouping existing obligations.

        Body:
          payer_user_id   int  (required)
          period_start    date string (required)
          period_end      date string (required)
          due_date        date string (required)
          obligation_ids  list[int]   (required)
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/obligations/:
    get:
      operationId: finance_obligations_retrieve
      description: |-
        GET  — Admin: list all obligations for school.
        POST — Admin: create a single obligation.
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: finance_obligations_create
      description: |-
        GET  — Admin: list all obligations for school.
        POST — Admin: create a single obligation.
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/parent/balance/:
    get:
      operationId: finance_parent_balance_retrieve
      description: |-
        GET — Return balance summary for the authenticated payer.
        total_due_cents:  sum of all non-void obligation amounts
        paid_cents:       sum of allocations applied to those obligations
        balance_cents:    max(total_due - paid, 0)
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/payments/{payment_id}/refund/:
    post:
      operationId: finance_payments_refund_create
      description: |-
        POST — Admin: initiate a refund against a settled payment.
        Body: amount_cents, idempotency_key (optional)
        Raises 409 if refund would exceed original payment amount.
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/payments/{payment_id}/settle/:
    post:
      operationId: finance_payments_settle_create
      description: |-
        POST — Admin: settle a payment and allocate to obligations.
        Body: allocations = [{"obligation_id": int, "amount_cents": int}, ...]
        Idempotent: already-settled payments return 200.
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/payments/intent/:
    post:
      operationId: finance_payments_intent_create
      description: |-
        POST — Create a pending FinancePayment record (intent before processor settlement).
        Body: amount_cents, processor (optional), idempotency_key (optional)

        Requires an explicit X-School-ID header. Falls back to user.school_id are
        intentionally NOT accepted here to prevent payment creation without an
        explicit tenant context assertion.
      tags:
      - finance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/iam/health-auth/:
    get:
      operationId: iam_health_auth_retrieve
      description: |-
        GET /api/iam/health-auth/

        Smoke-test endpoint for the AAD Bearer auth chain.
        Returns 200 only when the Bearer token is valid and the user resolves.
        Used by verify_m365_sso_and_outbox.ps1.
      tags:
      - iam
      responses:
        '200':
          description: No response body
  /api/iam/me/:
    get:
      operationId: iam_me_retrieve
      description: |-
        GET /api/iam/me/

        Returns the AAD-authenticated identity for the Bearer token in the request.
        Mirrors the claims that were validated in the JWKS check.
      tags:
      - iam
      responses:
        '200':
          description: No response body
  /api/integrations/oneroster/export/:
    get:
      operationId: integrations_oneroster_export_retrieve
      description: |-
        Export a minimal OneRoster 1.2 CSV bundle for the requesting school.
        Returns a multipart/mixed response containing each CSV file.

        Only school staff/admins may export roster data.
      tags:
      - integrations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/parent360/me/overview/:
    get:
      operationId: parent360_me_overview_retrieve
      tags:
      - parent360
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/platform/provisioning/{job_id}:
    get:
      operationId: platform_provisioning_retrieve
      description: |-
        Return the current status of a provisioning job.

        Path param: job_id (UUID)
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/platform/schools:
    post:
      operationId: platform_schools_create
      description: |-
        Create a new school tenant and queue its provisioning job.

        Required body fields:
          name            str — display name for the school
          slug            str — URL-safe identifier (must be globally unique)
          idempotency_key str — caller-generated idempotency key (UUID recommended)

        Optional body fields:
          domain          str  — custom domain (default "")
          plan_code       str  — starter | growth | enterprise (default "starter")
          timezone        str  — IANA timezone string (default "America/New_York")
          payment_provider str — stripe | manual | none (default "none")

        Returns:
          201 on first creation, 200 on idempotent repeat.
          {"job_id": "...", "school_id": "...", "state": "queued", "idempotent": bool}
      tags:
      - platform
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/platform/schools/list:
    get:
      operationId: platform_schools_list_retrieve
      description: |-
        Return a paginated list of all school tenants with TenantProfile data.

        Query params:
          page     int — 1-based page number (default 1)
          per_page int — results per page (default 50, max 200)
          status   str — filter by TenantProfile.status (optional)
      tags:
      - platform
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/student360/me/overview/:
    get:
      operationId: student360_me_overview_retrieve
      description: Resolve the calling user to their student record, then delegate
        to StudentOverview.
      tags:
      - student360
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/student360/students/{student_id}/overview/:
    get:
      operationId: student360_students_overview_retrieve
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - student360
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/system/whoami/:
    get:
      operationId: system_whoami_retrieve
      description: |-
        Gate 1C: Canonical proof endpoint for session state.

        Returns:
        - user info (id, email, is_staff, role)
        - resolved tenant (school_id from middleware)
        - staff override info (if header present)
        - build_sha (deployment proof)

        MUST be authenticated (default-deny auth).
      tags:
      - system
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/360/me/overview/:
    get:
      operationId: v1_360_me_overview_retrieve
      description: Resolve the calling user to their student record, then delegate
        to StudentOverview.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/360/students/{student_id}/overview/:
    get:
      operationId: v1_360_students_overview_retrieve
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/academic-year-wizard/sessions/:
    post:
      operationId: v1_academic_year_wizard_sessions_create
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/academic-year-wizard/sessions/{session_id}/commit/:
    post:
      operationId: v1_academic_year_wizard_sessions_commit_create
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/academic-year-wizard/sessions/{session_id}/configure/:
    post:
      operationId: v1_academic_year_wizard_sessions_configure_create
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/academic-year-wizard/sessions/{session_id}/terms/:
    post:
      operationId: v1_academic_year_wizard_sessions_terms_create
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/academic-year-wizard/sessions/{session_id}/verify/:
    get:
      operationId: v1_academic_year_wizard_sessions_verify_retrieve
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/academics-ro/sections/:
    get:
      operationId: v1_academics_ro_sections_retrieve
      description: |-
        Read-only sections list endpoint.

        Auth: bypasses DRF global auth to use manual header-based gate.
        This is a controlled demo gate, not an open endpoint.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/academics/assignments/{assignment_id}/:
    patch:
      operationId: v1_academics_assignments_partial_update
      description: |-
        PATCH: Update an assignment
        DELETE: Delete an assignment (requires write permissions)
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_academics_assignments_destroy
      description: |-
        PATCH: Update an assignment
        DELETE: Delete an assignment (requires write permissions)
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/academics/categories/{category_id}/:
    patch:
      operationId: v1_academics_categories_partial_update
      description: |-
        PATCH: Update a category
        DELETE: Delete a category (requires write permissions)
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_academics_categories_destroy
      description: |-
        PATCH: Update a category
        DELETE: Delete a category (requires write permissions)
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/academics/courses/:
    get:
      operationId: v1_academics_courses_list
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
  /api/v1/academics/courses/{id}/:
    get:
      operationId: v1_academics_courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/v1/academics/curriculum-sources/:
    get:
      operationId: v1_academics_curriculum_sources_list
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurriculumSource'
          description: ''
  /api/v1/academics/curriculum-sources/{id}/:
    get:
      operationId: v1_academics_curriculum_sources_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this curriculum source.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumSource'
          description: ''
  /api/v1/academics/grades/:
    get:
      operationId: v1_academics_grades_list
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
          description: ''
  /api/v1/academics/grades/{id}/:
    get:
      operationId: v1_academics_grades_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this grade.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
          description: ''
  /api/v1/academics/grades/grade/:
    post:
      operationId: v1_academics_grades_grade_create
      description: |-
        Grade a submission.
        POST /api/academics/grades/grade/
        Body: {submission_id, numeric_score, teacher_feedback}
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GradeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GradeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
          description: ''
  /api/v1/academics/lesson-plans/{plan_id}/:
    get:
      operationId: v1_academics_lesson_plans_retrieve
      description: |-
        GET   – retrieve a single lesson plan
        PATCH/PUT – update fields
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: v1_academics_lesson_plans_update
      description: |-
        GET   – retrieve a single lesson plan
        PATCH/PUT – update fields
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_academics_lesson_plans_partial_update
      description: |-
        GET   – retrieve a single lesson plan
        PATCH/PUT – update fields
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/academics/lesson-resources/{resource_id}/:
    get:
      operationId: v1_academics_lesson_resources_retrieve
      description: |-
        GET    – retrieve a single resource
        PATCH  – update title/kind/url/file_ref
        DELETE – remove resource (staff only)
      parameters:
      - in: path
        name: resource_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_academics_lesson_resources_partial_update
      description: |-
        GET    – retrieve a single resource
        PATCH  – update title/kind/url/file_ref
        DELETE – remove resource (staff only)
      parameters:
      - in: path
        name: resource_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
