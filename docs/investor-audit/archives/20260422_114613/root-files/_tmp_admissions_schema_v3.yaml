  /api/v1/reenrollment/sessions/{session_id}/commit/:
    post:
      operationId: v1_reenrollment_sessions_commit_create
      description: |-
        POST /api/v1/reenrollment/sessions/<id>/commit/
        Body: { "confirm": true }
        Creates BillingRun + Invoice (per household) + InvoiceLine (per student).
        Idempotent: second call on status=committed returns existing result.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
