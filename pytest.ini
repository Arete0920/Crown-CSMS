[pytest]
DJANGO_SETTINGS_MODULE = crown_api.settings
pythonpath = backend
testpaths =
    backend/tests
    backend/crown_api/tests
    backend/crown_api/exports/tests
    backend/households/tests
    backend/applications/tests
    backend/ledger/tests
    backend/financial_aid/tests
    backend/aid/tests
    backend/academics/tests
    backend/billing/tests
    backend/gradebook/tests
    backend/core/tests
addopts = -ra --ignore=backend/test_batch_endpoint_sanity.py
