[pytest]
DJANGO_SETTINGS_MODULE = crown_api.settings
pythonpath = backend
# Auto-discovers all test_*.py under backend/ — no per-wizard edits needed.
testpaths = backend
norecursedirs = .* build dist node_modules venv .venv __pycache__ migrations
addopts = -ra --ignore=backend/test_batch_endpoint_sanity.py
